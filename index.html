            <div id="resultBoxArea"></div>
          </div>
        </div>
      </div>
    `;

    const renderFormFor = (formId) => {
      const form = DB.getFormForEval({ formId, kpiGroup: evKpiGroup });
      if (!form) return;
      this.state = {
        values: {},
        penalties: {},
        penaltyNotes: {},
        coachingChecks: [],
        coachingDetail: '',
        overall: '',
        formId: form.id,
        kpiGroup: evKpiGroup,
        employeeId: opts.employeeId,
        period: lockedPeriod,
        assignmentId: opts.assignmentId || null,
      };
      this.state.attachments = [];
      this.state.signedDocs = [];
      this.state.savedId = null;   // ยังไม่บันทึก — ล็อกขั้นตอน PDF/แนบเซ็น/ส่ง HR ไว้ก่อน
      // ข้อมูลส่วนที่ 1 + หมายเหตุแนวทางดำเนินการ
      const _emp = DB.getUserById(opts.employeeId) || {};
      this.state.hireDate = _emp.hireDate || '';
      this.state.evalDate = new Date().toISOString().slice(0, 10);
      this.state.prevActionStatus = '';
      this.state.actionNote = '';   // หมายเหตุ — จะดำเนินการอย่างไร (แทนตาราง Action Plan เดิม)
      this.state.empResponse = '';   // 'acknowledge' | 'dispute'
      this.state.empComment = '';
      this.state.editMode = !!opts.editMode;
      // ถ้าเปิดจาก record ที่เคยประเมินไว้ (evaluated) — โหลดไฟล์เดิมกลับมา
      const ex = opts.assignmentId ? DB.getEvaluations().find(x => x.id === opts.assignmentId) : null;
      if (ex) { this.state.attachments = [...(ex.attachments || [])]; this.state.signedDocs = [...(ex.signedDocs || [])]; }
      // ผู้ประเมิน — เฉพาะ HR แก้จากในฟอร์มได้ (สิทธิ์อื่น state นี้เป็น undefined = พฤติกรรมเดิมทุกอย่าง)
      const _meNow = Auth.currentUser();
      if (_meNow && _meNow.role === 'admin' && opts.assignmentId) this.state.supervisorId = (ex && ex.supervisorId) || '';
      // โหลดข้อมูลประเมินเดิมทั้งหมด (กรณีแก้ไข / ประเมินซ้ำ record ที่มีข้อมูลแล้ว)
      this._loadRec = (ex && ex.answers && ex.answers.length) ? ex : null;
      // นโยบาย "ลำดับถัดไปเริ่มฟอร์มว่าง" (stepVisibility.carryScores = false): ผู้ประเมินลำดับ 2+ ที่ยังไม่เคยส่งในรอบนี้
      //   จะไม่เห็น/ไม่ได้รับคะแนนของลำดับก่อนหน้ามาเป็นค่าตั้งต้น (ค่าที่ HR นำเข้า: เป้า KPI / สถิติวินัย ยังคงมี)
      const _vis = stepVisibility();
      const _stepNow = ex ? evalStepOf(ex) : 0;
      this.state.blankStart = !!(this._loadRec && !opts.editMode && _meNow && _meNow.role !== 'admin' && !_vis.carryScores && _stepNow > 0
        && !evalChainCurrent(ex).some(x => x.step === _stepNow && x.evaluatorId === _meNow.id));
      if (this._loadRec) {
        if (!this.state.blankStart) ex.answers.forEach(a => { this.state.values[a.itemId] = a.value; });
        (ex.penaltyInputs || []).forEach(p => { this.state.penalties[p.ruleId] = p.count; });
        this.state.penaltyNotes = { ...(ex.penaltyNotes || {}) };
        if (!this.state.blankStart) { this.state.coachingChecks = [...(ex.coachingChecks || [])]; this.state.coachingDetail = ex.coachingDetail || ''; }
        if (ex.hireDate) this.state.hireDate = ex.hireDate;
        if (ex.evalDate) this.state.evalDate = ex.evalDate;
        this.state.prevActionStatus = ex.prevActionStatus || '';
        // หมายเหตุแนวทางดำเนินการ — ใบเก่าที่ยังเป็นตาราง Action Plan แปลงเป็นข้อความบรรทัดละแผน
        if (!this.state.blankStart) this.state.actionNote = ex.actionNote || (ex.actionPlan || []).filter(a => a && (a.task || a.owner || a.due || a.metric)).map(a => [a.task, a.owner, a.due, a.metric].filter(Boolean).join(' · ')).join('\n');
        this.state.empResponse = ex.empResponse || '';
        this.state.empComment = ex.empComment || '';
        this.state.empAckName = ex.empAckName || '';
        this.state.empAckDate = ex.empAckDate || '';
        if (!this.state.blankStart) this.state.overall = ex.overallComment || '';
        this.state.savedId = ex.id;   // มีข้อมูลแล้ว → ปลดล็อกขั้นตอนแนบ/ส่ง
      }
      this._renderQuestions(form);
      this._bindHeader();
      this._renderPenalty(form);
      this._renderResultBox(form);
      this._renderCoaching(form);
      this._renderAttachments(form);
      this._renderSignature(form);
      this._renderImportantNote(form);
      this._enhanceTextareas();
      if (this._loadRec && !this.state.blankStart) this._prefillFromRecord(form, this._loadRec);
      this._renderStepLog(form, ex);
      this._applyKpiPreset(form, ex);
      this._applyDisciplinePreset(form, ex);
      this._updateLive();
    };

    const draftBtn = document.getElementById('evalDraftBtn');
    if (draftBtn) draftBtn.addEventListener('click', () => {
      // โหมดแก้ไข (HR): บันทึกการแก้ไข คงสถานะเดิม
      if (opts.editMode) { this._save('update'); return; }
      // โหมดประเมิน: ตรวจครบทุกข้อก่อน → เด้งยืนยัน (พร้อมสรุปคะแนน) ครั้งเดียว → ส่งให้ HR
      if (!this._validateBeforeSubmit()) return;
      this._confirmSubmitDialog().then(ok => { if (ok) this._save('submit'); });
    });
    // HR: ปุ่ม "ส่งกลับไปแก้ไข" (Reject) — ในฟอร์ม (ย้ายมาจากปุ่มในรายการ)
    const evalRejectBtn = document.getElementById('evalRejectBtn');
    if (evalRejectBtn) evalRejectBtn.addEventListener('click', () => {
      const me2 = Auth.currentUser();
      const recId = this.state.assignmentId || opts.assignmentId;
      const empN = (DB.getUserById(this.state.employeeId) || {}).fullName || '-';
      const isConfirmed = recStatus === 'confirmed';
      confirmDialog({
        title: isConfirmed ? 'ยกเลิกการยืนยัน / ส่งกลับแก้ไข' : 'ส่งกลับให้แก้ไข',
        message: isConfirmed
          ? `ยกเลิกการยืนยันผลของ "${empN}" รอบ ${fmtPeriod(this.state.period)} แล้วส่งกลับให้หัวหน้างานแก้ไขใหม่?\nสถานะจะกลับเป็น "รอประเมิน"`
          : `ส่งรายการของ "${empN}" รอบ ${fmtPeriod(this.state.period)} กลับให้หัวหน้างานแก้ไขใหม่?\nสถานะจะกลับเป็น "รอประเมิน"`,
        confirmText: 'ส่งกลับแก้ไข', type: 'warn',
      }).then(async ok => {
        if (!ok || !recId) return;
        await DB.rejectEvaluation(recId, me2.id, isConfirmed ? 'ยกเลิกการยืนยัน — ส่งกลับให้หัวหน้างานแก้ไข' : 'ส่งกลับให้หัวหน้างานตรวจสอบ/แก้ไข');
        toast(`ส่งกลับให้หัวหน้างานแล้ว — ${empN} (สถานะ → รอประเมิน)`, 'success', { title: 'ส่งกลับแก้ไขสำเร็จ' });
        this._closeModal();
        App.buildNav(me2);
        App.go('hr-list');
      });
    });
    // HR: ปุ่มยืนยันผลการประเมิน (ขั้นตอนสุดท้าย — ตรวจสอบแล้วยืนยัน) — เฉพาะรายการที่รอ HR ตรวจ
    const evalConfirmBtn = document.getElementById('evalConfirmBtn');
    if (evalConfirmBtn) evalConfirmBtn.addEventListener('click', () => {
      const empN = (DB.getUserById(this.state.employeeId) || {}).fullName || '-';
      confirmDialog({
        title: 'ยืนยันการตรวจสอบ',
        message: `ตรวจสอบเรียบร้อยและยืนยันการตรวจสอบผลการประเมินของ "${empN}" รอบ ${fmtPeriod(this.state.period)}?\nระบบจะบันทึกการแก้ไข (ถ้ามี) แล้วเปลี่ยนสถานะเป็น "ยืนยันแล้ว"`,
        confirmText: 'ยืนยันการตรวจสอบ', type: 'info',
      }).then(ok => { if (ok) this._save('confirm'); });
    });
    // แผงสรุปคะแนน Realtime — คลิกพับเปิด/ปิด (default = ปิด)
    const liveTog = document.getElementById('liveToggle');
    if (liveTog) liveTog.addEventListener('click', () => {
      const collapsed = document.getElementById('livePanel').classList.toggle('collapsed');
      liveTog.setAttribute('aria-expanded', String(!collapsed));
    });

    if (lockedForm) renderFormFor(lockedForm.id);
  },

  // =================================================================
  // Paper-style header (Section 1: ข้อมูลพนักงาน + form info)
  // =================================================================
  _renderPaperHeader(form) {
    const emp = DB.getUserById(this.state.employeeId);
    const me = Auth.currentUser();
    // ผู้ประเมิน = หัวหน้างานที่ถูกมอบหมาย (ไม่ใช่ผู้ที่กำลังเปิดดู/HR) — HR เป็นผู้ตรวจสอบเท่านั้น
    const _recHdr = this.state.assignmentId ? DB.getEvaluations().find(x => x.id === this.state.assignmentId) : null;
    const evaluatorUser = _recHdr ? (DB.getUserById(evalCurrentEvaluatorId(_recHdr) || _recHdr.evaluatorId) || {}) : (me || {});
    // ข้อมูลพนักงานแก้ไขได้เฉพาะ HR — สิท SUP/พนักงาน แสดงอ่านอย่างเดียวทุกช่อง
    const canEditInfo = !!(me && me.role === 'admin');
    // HR เปลี่ยน "ผู้ประเมิน" ของใบนี้ได้จากในฟอร์ม (สิทธิ์อื่นแสดงอ่านอย่างเดียวเหมือนเดิม)
    const canEditEvaluator = canEditInfo && this.state.supervisorId !== undefined;
    const curSupId = canEditEvaluator ? (this.state.supervisorId || '') : '';
    const curSup = canEditEvaluator ? (DB.getUserById(curSupId) || {}) : evaluatorUser;
    const supOpts = canEditEvaluator
      ? DB.getSupervisors().filter(s => s.id !== this.state.employeeId)
          .sort((a, b) => String(a.fullName || '').localeCompare(String(b.fullName || ''), 'th'))
      : [];
    // คำนวณสัดส่วนคะแนนจากโครงสร้างฟอร์ม (เพื่อแสดงแถบสรุปคะแนนเหมือนหัวฟอร์มมาตรฐาน)
    const secMaxes = (form.sections || []).map(s => ({ name: secName(s.name), max: calcSectionMax(s) }));
    const discMax = (form.penaltySection && form.penaltySection.enabled) ? (+form.penaltySection.baseScore || 0) : 0;
    const formMax = calcFormMax(form);
    // ผลการประเมินย้อนหลัง 1 ปี (ทุกรายการที่มีคะแนนของพนักงานคนนี้ก่อนรอบปัจจุบัน)
    const [py, pm] = String(this.state.period).split('-').map(Number);
    const cutoff = `${py - 1}-${String(pm || 1).padStart(2, '0')}`;   // ย้อนหลัง 12 เดือน
    const pastList = DB.getEvaluations()
      .filter(e => e.employeeId === this.state.employeeId && e.id !== this.state.assignmentId && e.period < this.state.period && e.period >= cutoff)
      .sort((a, b) => a.period.localeCompare(b.period));   // เรียงตามเดือน-ปีของรอบ (เก่า → ใหม่) ให้ตรงกับบล็อก Action Plan
    const allocBoxes = [
      { label: 'คะแนนรวม', val: formMax, accent: true },
      ...secMaxes.map(s => ({ label: s.name, val: s.max })),
      ...(discMax ? [{ label: secName(form.penaltySection.name), val: discMax }] : []),
    ];
    return `
      <div class="paper-form-header">
        <h2 class="paper-title">${escapeHtml(form.name)}</h2>
        <div class="paper-subtitle">${escapeHtml(form.description || 'Monthly Performance & Discipline Evaluation Form')}</div>
        <div class="score-alloc">
          ${allocBoxes.map(b => `
            <div class="alloc-box${b.accent ? ' accent' : ''}">
              <div class="alloc-label">${escapeHtml(b.label)}</div>
              <div class="alloc-val">${b.val}<span class="alloc-unit">คะแนน</span></div>
            </div>`).join('')}
        </div>
      </div>

      <div class="paper-section">
        <div class="paper-section-title">ข้อมูลพนักงานและการประเมิน <span class="paper-section-en">Employee & Evaluation Information</span></div>
        <table class="paper-table info">
          <tbody>
            <tr><td class="lbl">ชื่อ-นามสกุล</td><td>${escapeHtml(emp?.fullName || '-')} ${emp ? empStatusBadge(emp.status) : ''}</td><td class="lbl">รหัสพนักงาน</td><td>${escapeHtml(emp?.employeeCode || '-')}</td></tr>
            <tr><td class="lbl">ตำแหน่งงาน</td><td>${escapeHtml(emp?.position || '-')}</td><td class="lbl">แผนก / สาขา</td><td>${escapeHtml(emp?.department || '-')}</td></tr>
            <tr>
              <td class="lbl">วันที่เริ่มงาน</td><td>${canEditInfo ? `<input type="date" class="input info-input" id="hdrHireDate" value="${escapeHtml(this.state.hireDate || '')}" />` : `<span class="mono">${escapeHtml(this.state.hireDate || '-')}</span>`}</td>
              <td class="lbl">อายุงาน (ประมาณ)</td><td><span id="hdrTenure" class="mono">${tenureText(this.state.hireDate)}</span></td>
            </tr>
            <tr>
              <td class="lbl">${_recHdr && evalChainOf(_recHdr).length ? `ผู้ประเมิน (ลำดับ ${evalStepOf(_recHdr) + 1}/${evalChainOf(_recHdr).length})` : 'ผู้ประเมิน (หัวหน้า)'}</td>
              <td>${canEditEvaluator
                ? SS.build('hdrEvaluator', '— ยังไม่กำหนดผู้ประเมิน —',
                    supOpts.map(s => ({ value: s.id, label: `${s.fullName || '-'}${s.employeeCode ? ' · ' + s.employeeCode : ''}${s.department ? ' (' + s.department + ')' : ''}` })),
                    curSupId)
                : escapeHtml(evaluatorUser?.fullName || '-')}</td>
              <td class="lbl">ตำแหน่งผู้ประเมิน</td>
              <td><span id="hdrEvaluatorPos">${escapeHtml(curSup?.position || '-')}</span></td>
            </tr>
            ${_recHdr && evalChainOf(_recHdr).length ? `<tr>
              <td class="lbl">ลำดับผู้ประเมิน</td>
              <td colspan="3">${evalChainHtml(_recHdr, { always: true })} <span class="text-mute text-xs ml-2"><i class="fa-solid fa-list-ol mr-1"></i>${evalChainOf(_recHdr).length > 1 ? `${escapeHtml(evalStepText(_recHdr))} — ประเมินตามลำดับ ลำดับถัดไปเห็นคะแนนของลำดับก่อนหน้าและปรับได้ ลำดับสุดท้ายส่งให้ HR` : 'พนักงานคนนี้มีผู้ประเมิน 1 ลำดับ (กำหนดได้สูงสุด 3 ลำดับที่หน้าจัดการพนักงาน)'}</span></td>
            </tr>` : ''}
            <tr>
              <td class="lbl">ประจำเดือน</td><td>${fmtPeriod(this.state.period)}</td>
              <td class="lbl">วันที่ประเมิน</td><td>${canEditInfo ? `<input type="date" class="input info-input" id="hdrEvalDate" value="${escapeHtml(this.state.evalDate || '')}" />` : `<span class="mono">${escapeHtml(this.state.evalDate || '-')}</span>`}</td>
            </tr>
          </tbody>
        </table>

        <div class="prev-review">
          <div class="prev-review-title"><i class="fa-regular fa-clipboard mr-1"></i>ผลการประเมินย้อนหลัง 1 ปี <span class="text-mute" style="font-weight:400">(Previous Reviews — ${pastList.length} รอบ)</span></div>
          ${pastList.length ? `
          <table class="paper-table prev-tbl">
            <thead><tr><th>รอบ</th><th class="c">คะแนนรวม</th><th class="c">ระดับผล</th><th>สถานะ</th><th class="text-right">ดูผล</th></tr></thead>
            <tbody>
              ${pastList.map(p => {
                const scored = p.status !== 'assigned' && p.totalMax > 0;
                const info = scored ? gradeInfoFor(p.totalScore, p.totalMax) : null;
                return `<tr>
                  <td><b>${fmtPeriod(p.period)}</b></td>
                  <td class="c mono">${scored ? `${p.totalScore.toFixed(2)} / ${p.totalMax}` : '—'}</td>
                  <td class="c">${scored ? `<span class="grade-tag" style="color:${info.color};border-color:${info.color};background:${info.color}15">${escapeHtml(info ? info.label : p.grade)}</span>` : '—'}</td>
                  <td>${statusBadgeHTML(p.status)}</td>
                  <td class="text-right">${scored ? `<button type="button" class="btn btn-secondary btn-icon no-print" data-view-past="${p.id}"><i class="fa-solid fa-eye"></i> ดู</button>` : '<span class="text-mute text-xs">—</span>'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>` : '<div class="text-mute text-sm" style="padding:0.4rem 0">— ไม่มีผลการประเมินย้อนหลังในช่วง 1 ปี —</div>'}
        </div>
      </div>
    `;
  },

  // ผูก event ของฟิลด์ในหัวฟอร์ม (ส่วนที่ 1) — เรียกหลัง render formArea
  _bindHeader() {
    const hd = document.getElementById('hdrHireDate');
    const tn = document.getElementById('hdrTenure');
    const ed = document.getElementById('hdrEvalDate');
    const pa = document.getElementById('hdrPrevAction');
    if (hd) hd.addEventListener('input', () => { this.state.hireDate = hd.value; if (tn) tn.textContent = tenureText(hd.value); });
    if (ed) ed.addEventListener('input', () => { this.state.evalDate = ed.value; });
    if (pa) pa.addEventListener('change', () => { this.state.prevActionStatus = pa.value; });
    // HR เปลี่ยนผู้ประเมิน (ดรอปดาวน์ค้นหาได้ — พิมพ์ชื่อ/รหัส/สาขา) → เก็บลง state + อัปเดตตำแหน่งทันที
    const svWrap = document.querySelector('.ss[data-ss="hdrEvaluator"]')?.parentElement;
    const svp = document.getElementById('hdrEvaluatorPos');
    if (svWrap) SS.bind(svWrap, (val) => {
      this.state.supervisorId = val || '';
      if (svp) svp.textContent = (DB.getUserById(val) || {}).position || '-';
    });
    document.querySelectorAll('[data-view-past]').forEach(b => b.addEventListener('click', () => this._viewPastEval(b.dataset.viewPast)));
  },

  // เปิดดูผลการประเมินรอบย้อนหลัง (overlay ซ้อนทับ — ไม่กระทบฟอร์มที่กำลังทำ)
  _viewPastEval(id) {
    const rec = DB.getEvaluations().find(e => e.id === id);
    if (!rec) { toast('ไม่พบรายการ', 'error'); return; }
    const form = DB.getFormForEval(rec);
    const emp = DB.getUserById(rec.employeeId) || {};
    const ov = document.createElement('div');
    ov.className = 'modal-bg';
    ov.style.zIndex = '125';
    ov.innerHTML = `
      <div class="modal" style="max-width:840px;width:95vw">
        <div class="modal-header">
          <div class="modal-title"><i class="fa-solid fa-clock-rotate-left mr-1" style="color:var(--accent)"></i>ผลประเมิน — ${escapeHtml(emp.fullName || '')} • ${fmtPeriod(rec.period)}</div>
          <div class="flex gap-2">
            <button class="btn btn-primary btn-icon" data-pp-pdf><i class="fa-solid fa-download"></i> ดาวน์โหลด PDF</button>
            <button class="btn btn-ghost btn-icon" data-pp-close><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>
        <div class="modal-body" style="background:var(--bg-mute)">${this._buildPrintDoc(rec, form)}</div>
      </div>
    `;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.querySelector('[data-pp-close]').addEventListener('click', close);
    ov.querySelector('[data-pp-pdf]').addEventListener('click', () => this._genEvalPdf(rec, form, 'download'));
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
  },

  // โหลดค่าที่บันทึกไว้กลับเข้า widget ทั้งหมด (สำหรับแก้ไข/ประเมินซ้ำ)
  _prefillFromRecord(form, ex) {
    const area = document.getElementById('formArea');
    const fire = (el, type) => { if (el) el.dispatchEvent(new Event(type, { bubbles: true })); };
    // คะแนนแต่ละข้อ
    form.sections.forEach(sec => sec.items.forEach(it => {
      const v = this.state.values[it.id];
      if (v === undefined || v === null || v === '') return;
      switch (it.type) {
        case 'rating5': { const star = area.querySelector(`[data-stars-for="${it.id}"] .star[data-score="${v}"]`); if (star) star.click(); break; }
        case 'scale10': { const el = area.querySelector(`[data-scale="${it.id}"]`); if (el) { el.value = v; fire(el, 'input'); } break; }
        case 'percent': { const el = area.querySelector(`[data-percent="${it.id}"]`); if (el) { el.value = v; fire(el, 'input'); } break; }
        case 'kpi': { const t = area.querySelector(`[data-kpi-target="${it.id}"]`); const a = area.querySelector(`[data-kpi-actual="${it.id}"]`); if (t && a && v && typeof v === 'object') { t.value = v.target; a.value = v.actual; fire(a, 'input'); } break; }
        case 'choice': { const el = area.querySelector(`[data-choice-sel="${it.id}"]`); if (el) { el.value = String(v); fire(el, 'change'); } break; }
        case 'yesno': { const isYes = (v === true || v === 'true' || v === 1); const btn = area.querySelector(`[data-yesno="${it.id}"][data-val="${isYes}"]`); if (btn) btn.click(); break; }
      }
    }));
    // หมายเหตุรายข้อ
    (ex.answers || []).forEach(a => { const c = document.querySelector(`[data-comment="${a.itemId}"]`); if (c && a.comment) c.value = a.comment; });
    // ส่วนวินัย — จำนวน + หมายเหตุ
    Object.entries(this.state.penalties || {}).forEach(([rid, cnt]) => { const el = document.querySelector(`[data-penalty="${rid}"]`); if (el && cnt) { el.value = cnt; fire(el, 'input'); } });
    Object.entries(this.state.penaltyNotes || {}).forEach(([rid, note]) => { const el = document.querySelector(`[data-pennote="${rid}"]`); if (el && note) el.value = note; });
    // Coaching checkboxes — ตั้ง visual (state โหลดแล้ว)
    (this.state.coachingChecks || []).forEach(idx => { const lbl = document.querySelector(`[data-coaching="${idx}"]`); if (lbl) { lbl.classList.add('selected'); const cb = lbl.querySelector('input[type=checkbox]'); if (cb) cb.checked = true; } });
  },

  // =================================================================
  // Render sections (paper table layout)
  // =================================================================
  _renderQuestions(form) {
    const area = document.getElementById('formArea');
    const me = Auth.currentUser();
    const visibleSections = form.sections.filter(sec => canScoreSection(sec, me.role));

    if (!visibleSections.length) {
      area.innerHTML = this._renderPaperHeader(form) + `
        <div class="paper-section" style="border-left:4px solid var(--warn)">
          <div class="font-bold mb-1"><i class="fa-solid fa-lock mr-1" style="color:var(--warn)"></i>คุณไม่ได้รับสิทธิ์ให้คะแนน Section ใดในฟอร์มนี้</div>
          <div class="text-mute text-xs">โปรดติดต่อแอดมินเพื่อขอสิทธิ์ หรือเลือกฟอร์มอื่น</div>
        </div>
      `;
      return;
    }

    const hiddenCount = form.sections.length - visibleSections.length;
    const hiddenNotice = hiddenCount > 0 ? `
      <div class="muted-bg p-2 rounded mb-2 text-xs" style="border-left:3px solid var(--warn)">
        <i class="fa-solid fa-eye-slash mr-1" style="color:var(--warn)"></i>
        Section ${hiddenCount} ส่วนถูกซ่อน เนื่องจากบทบาทของคุณไม่ได้รับสิทธิ์ให้คะแนน
      </div>
    ` : '';

    area.innerHTML = this._renderPaperHeader(form) + hiddenNotice + visibleSections.map((sec, secIdx) => {
      const secMax = calcSectionMax(sec);
      const sectionNum = secIdx === 0 ? '2' : (secIdx + 2).toString();
      const rolesLabel = (sec.allowedRoles || []).map(r => ({admin:'Admin', supervisor:'Sup', employee:'Emp'})[r] || r).join('/');
      return `
        <div class="paper-section" data-section="${sec.id}">
          <div class="paper-section-title">
            ${escapeHtml(secName(sec.name))}
            <span class="paper-section-meta">
              ${this._kpiGroupBadge(sec)}
              ${sec.allowedRoles?.length ? `<span class="badge info">${rolesLabel}</span>` : ''}
              <span class="weight-tag">${secMax} คะแนน</span>
            </span>
          </div>
          ${sec.description ? `<div class="text-mute text-xs mb-2">${escapeHtml(sec.description)}</div>` : ''}

          ${(sec.items.length && sec.items.every(it => it.type === 'kpi'))
            ? this._renderKpiTable(sec, secMax)
            : `<table class="paper-table score-table">
            <thead>
              <tr>
                <th class="col-no">#</th>
                <th>หัวข้อประเมิน</th>
                <th class="col-input">ค่าที่ตอบ / Score</th>
                <th class="col-max">เต็ม</th>
                <th class="col-got">ได้</th>
              </tr>
            </thead>
            <tbody>
              ${sec.items.map((it, i) => this._renderItemRow(sec, it, i + 1)).join('')}
              <tr class="paper-total-row">
                <td colspan="3"><b>รวม ${escapeHtml(secName(sec.name))}</b></td>
                <td class="col-max mono"><b>${secMax}</b></td>
                <td class="col-got mono" data-section-total="${sec.id}"><b>—</b></td>
              </tr>
            </tbody>
          </table>`}
        </div>
      `;
    }).join('');

    visibleSections.forEach(sec => sec.items.forEach(it => this._bindItem(sec, it)));
  },

  // เติมค่า KPI (เป้า/จริง) ที่ HR โหลดไว้ (kpiPreset) เข้า input — เฉพาะที่ยังไม่มีค่า
  _applyKpiPreset(form, ex) {
    if (!ex || !ex.kpiPreset) return;
    const area = document.getElementById('formArea');
    (form.sections || []).forEach(sec => {
      if (!(sec.items.length && sec.items.every(it => it.type === 'kpi'))) return;
      sec.items.forEach(it => {
        const p = ex.kpiPreset[it.id]; if (!p) return;
        const t = area.querySelector(`[data-kpi-target="${it.id}"]`);
        const a = area.querySelector(`[data-kpi-actual="${it.id}"]`);
        if (t && p.target != null && p.target !== '') t.value = p.target;
        if (a && a.value === '' && p.actual != null && p.actual !== '') a.value = p.actual;
        if (a) a.dispatchEvent(new Event('input', { bubbles: true }));
        const c = area.querySelector(`[data-comment="${it.id}"]`);
        if (c && c.value === '' && p.note) c.value = p.note;
      });
    });
  },

  // เติมค่าวินัย (จำนวน/หมายเหตุ) ที่ HR โหลดไว้ (disciplinePreset) เข้า input — เฉพาะตอนยังไม่ประเมิน
  _applyDisciplinePreset(form, ex) {
    if (this._loadRec) return;  // ถ้ามีข้อมูลประเมินแล้ว ใช้ค่าจาก record (ไม่ override)
    const ps = form.penaltySection;
    if (!ex || !ex.disciplinePreset || !ps) return;
    const area = document.getElementById('penaltyArea');
    if (!area) return;
    (ps.rules || []).forEach(r => {
      const p = ex.disciplinePreset[r.id]; if (!p) return;
      const inp = area.querySelector(`[data-penalty="${r.id}"]`);
      if (inp && p.count != null && p.count !== '') { inp.value = p.count; inp.dispatchEvent(new Event('input', { bubbles: true })); }
      const note = area.querySelector(`[data-pennote="${r.id}"]`);
      if (note && note.value === '' && p.note) note.value = p.note;
    });
  },

  // ป้ายบอก "กลุ่ม KPI" ของใบนี้ในส่วนหัว — ให้เห็นชัดว่าใช้เวทกลุ่มไหน / แสดงกี่หัวข้อ
  //   (แสดงผลอย่างเดียว — จำนวนหัวข้อ/น้ำหนักถูกกำหนดโดย resolveFormForGroup อยู่แล้ว ไม่ได้เปลี่ยนการคิดคะแนน)
  _kpiGroupBadge(sec) {
    if (!sec || !sec.kpiGrouped) return '';
    const n = (sec.items || []).length;
    const key = this.state && this.state.kpiGroup;
    const g = key && (sec.kpiGroups || []).find(x => x.key === key);
    if (g) return `<span class="badge" style="background:var(--link);color:#fff" title="ใบนี้ใช้เวทคะแนนของกลุ่ม '${escapeHtml(g.label)}' — แสดง ${n} หัวข้อตามที่ตั้งค่า"><i class="fa-solid fa-users-gear mr-1"></i>กลุ่ม: ${escapeHtml(g.label)} · ${n} หัวข้อ</span>`;
    // ไม่ได้ระบุกลุ่ม → เตือนว่ากำลังแสดงทุกหัวข้อด้วยเวทเริ่มต้น
    return `<span class="badge warn" title="ใบนี้ยังไม่ได้ระบุกลุ่ม KPI จึงแสดงทุกหัวข้อด้วยน้ำหนักเริ่มต้น — กำหนดกลุ่มได้ตอนนำเข้า (คอลัมน์ 'กลุ่ม KPI')"><i class="fa-solid fa-triangle-exclamation mr-1"></i>ยังไม่ระบุกลุ่ม KPI · แสดงทุกหัวข้อ (${n})</span>`;
  },

  // ตาราง KPI แบบฟอร์มมาตรฐาน: เป้าหมาย · ผลจริง · %บรรลุ · น้ำหนัก% · คะแนนที่ได้ · หมายเหตุ
  // ค่าเป้าหมาย/ผลจริง = ฝ่ายบุคคล (HR) เป็นผู้กำหนด/โหลด — หัวหน้างานแก้ไขไม่ได้ (read-only)
  _renderKpiTable(sec, secMax) {
    const lock = Auth.currentUser().role !== 'admin' ? 'disabled' : '';
    const lockCls = lock ? ' field-locked' : '';
    const rows = sec.items.map((it) => {
      const target = (it.config && it.config.target) || 100;
      const weightPct = secMax > 0 ? +(((+it.maxScore || 0) / secMax) * 100).toFixed(0) : 0;
      return `
        <tr data-item-row="${it.id}">
          <td class="paper-item-name"><b>${escapeHtml(it.name)}</b>${it.optional ? ' <span class="badge" style="font-size:9px">ไม่บังคับ</span>' : ''}${it.description ? `<div class="paper-item-desc">${escapeHtml(it.description)}</div>` : ''}${(it.config && (it.config.direction === 'lower' || (+it.config.capPct > 100) || (+it.config.minPct > 0))) ? `<div class="paper-item-desc" style="color:var(--accent-dark)">${it.config.direction === 'lower' ? 'ยิ่งต่ำยิ่งดี (%บรรลุ = เป้า ÷ จริง)' : ''}${(+it.config.capPct > 100) ? ` · เพดาน ${+it.config.capPct}%` : ''}${(+it.config.minPct > 0) ? ` · ขั้นต่ำ ${+it.config.minPct}%` : ''}</div>` : ''}</td>
          <td class="kpi-cell"><input type="number" step="0.01" class="input mono kpi-num${lockCls}" data-kpi-target="${it.id}" value="${target}" ${lock} /></td>
          <td class="kpi-cell"><input type="number" step="0.01" class="input mono kpi-num${lockCls}" placeholder="0" data-kpi-actual="${it.id}" ${lock} /></td>
          <td class="kpi-cell mono" data-kpi-pct="${it.id}">—</td>
          <td class="kpi-cell mono"><b>${weightPct}%</b></td>
          <td class="col-got mono" data-display="${it.id}">—</td>
          <td class="col-note"><input type="text" class="input${lock ? lockCls : ' expandable'}" data-label="หมายเหตุ — ${escapeHtml(it.name)}" data-comment="${it.id}" placeholder="หมายเหตุ..." ${lock} /></td>
        </tr>`;
    }).join('');
    return `
      <table class="paper-table score-table kpi-table">
        <thead>
          <tr>
            <th>KPI / ตัวชี้วัด</th>

  _bindItem(sec, item) {
    const area = document.getElementById('formArea');
    const setVal = (val) => {
      this.state.values[item.id] = val;
      const display = area.querySelector(`[data-display="${item.id}"]`);
      const score = calcItemScore(item, val);
      if (display) display.textContent = (val === undefined || val === null || val === '') ? '—' : score.toFixed(2);
      this._updateLive();
    };

    switch (item.type) {
      case 'rating5': {
        const row = area.querySelector(`[data-stars-for="${item.id}"]`);
        row.querySelectorAll('.star').forEach(st => {
          st.addEventListener('click', () => {
            const s = +st.dataset.score;
            row.querySelectorAll('.star').forEach((x, i) => x.classList.toggle('filled', i < s));
            setVal(s);
          });
        });
        break;
      }
      case 'scale10': {
        const inp = area.querySelector(`[data-scale="${item.id}"]`);
        const show = area.querySelector(`[data-slider-show="${item.id}"]`);
        const sync = () => { show.textContent = inp.value; setVal(+inp.value); };
        sync();
        inp.addEventListener('input', sync);
        break;
      }
      case 'percent': {
        const inp = area.querySelector(`[data-percent="${item.id}"]`);
        inp.addEventListener('input', () => setVal(inp.value === '' ? '' : +inp.value));
        break;
      }
      case 'kpi': {
        const tgt = area.querySelector(`[data-kpi-target="${item.id}"]`);
        const act = area.querySelector(`[data-kpi-actual="${item.id}"]`);
        const pctEl = area.querySelector(`[data-kpi-pct="${item.id}"]`);
        const updatePct = (target, actual) => {
          if (!pctEl) return;
          // ค่าว่าง = 0 → แสดง 0% (คิดคะแนน 0 ทุกหัวข้อ KPI) • target ต้อง > 0 จึงคำนวณ %บรรลุได้
          pctEl.textContent = (target <= 0) ? '—' : kpiAchievePct(item, target, actual).toFixed(0) + '%';   // ตามทิศทาง/เพดาน/ขั้นต่ำที่ตั้งในแบบฟอร์ม
        };
        const sync = () => {
          const target = +tgt.value || 0;
          const actual = act.value === '' ? 0 : +act.value;   // ค่าว่าง = 0 (และ 0 = 0)
          updatePct(target, actual);
          setVal({ target, actual });
        };
        tgt.addEventListener('input', sync);
        act.addEventListener('input', sync);
        // ตอนโหลด: ถ้ายังไม่มีค่าที่โหลดไว้ ให้คิดค่าว่าง = 0 (แสดง 0% / 0.00) — ค่าที่โหลด/preset จะ fire input มาทับทีหลัง
        const loadedKpi = this.state.values[item.id];
        if (loadedKpi === undefined || loadedKpi === null || loadedKpi === '') sync();
        break;
      }
      case 'choice': {
        const sel = area.querySelector(`[data-choice-sel="${item.id}"]`);
        if (sel) {
          sel.addEventListener('change', () => {
            const v = sel.value;
            setVal(v === '' ? '' : +v);
          });
        } else {
          // legacy radio fallback
          area.querySelectorAll(`[data-choice-opt="${item.id}"]`).forEach(opt => {
            opt.addEventListener('click', () => {
              const idx = +opt.dataset.idx;
              area.querySelectorAll(`[data-choice-opt="${item.id}"]`).forEach(o => o.classList.toggle('selected', +o.dataset.idx === idx));
              opt.querySelector('input').checked = true;
              setVal(idx);
            });
          });
        }
        break;
      }
      case 'yesno': {
        area.querySelectorAll(`[data-yesno="${item.id}"]`).forEach(btn => {
          btn.addEventListener('click', () => {
            const isYes = btn.dataset.val === 'true';
            area.querySelectorAll(`[data-yesno="${item.id}"]`).forEach(b => b.classList.toggle('selected', b === btn));
            setVal(isYes);
          });
        });
        break;
      }
    }
  },

  // =================================================================

    area.innerHTML = `
      <div class="paper-section" data-pensection>
        <div class="paper-section-title">${escapeHtml(secName(ps.name))}

            ${ps.rules.map(r => {

                : `หัก${r.unit ? r.unit + 'ละ' : 'ครั้งละ'} ${r.perOccurrence} คะแนน`);
              const notePh = ({ p_absent: 'ระบุวันที่...', p_warning: 'ระบุประเด็น...' })[r.id] || 'ระบุ...';
              return `

                  <td><b>${escapeHtml(r.name)}</b></td>

                  <td class="text-xs" style="color:var(--err)">${escapeHtml(ruleDesc)}</td>
                  <td class="col-got mono"><span data-penalty-show="${r.id}" style="color:var(--err);font-weight:700">0</span></td>
                  <td class="col-note"><input type="text" class="input${lock ? lockCls : ' expandable'}" data-label="หมายเหตุ — ${escapeHtml(r.name)}" data-pennote="${r.id}" placeholder="${notePh}" ${lock} /></td>
                </tr>
              `;
            }).join('')}
            ${(ps.bonusRules || []).length ? `
              <tr class="pen-subhead"><td colspan="5"><i class="fa-solid fa-circle-plus mr-1" style="color:var(--ok)"></i>รายการบวกคะแนน (Bonuses)</td></tr>
              ${ps.bonusRules.map(b => `
                <tr>
                  <td><b>${escapeHtml(b.name)}</b></td>
                  <td class="col-input text-mute" style="font-size:12px"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>อัตโนมัติ</td>
                  <td class="text-xs" style="color:var(--ok)">${escapeHtml(b.note || `+${b.amount} คะแนน`)}</td>
                  <td class="col-got mono"><span data-penbonus="${b.id}" style="color:var(--ok);font-weight:700">+0</span></td>
                  <td class="col-note"><input type="text" class="input${lock ? lockCls : ' expandable'}" data-label="หมายเหตุ — ${escapeHtml(b.name)}" data-pennote="${b.id}" placeholder="ระบุ..." ${lock} /></td>
                </tr>`).join('')}
            ` : ''}
            <tr class="paper-total-row">
              <td colspan="4" class="text-right"><b>คะแนนวินัย (${ps.baseScore} – หัก${(ps.bonusRules || []).length ? ' + โบนัส' : 'รวม'}) :</b></td>

        <label class="label mt-3">หมายเหตุ — จะดำเนินการอย่างไร <span class="paper-section-en">How to proceed</span></label>
        <textarea id="actionNote" rows="3" class="input expandable" data-label="หมายเหตุ — จะดำเนินการอย่างไร" placeholder="ระบุว่าจะดำเนินการอย่างไร เช่น แผนงาน ผู้รับผิดชอบ กำหนดเวลา วิธีติดตามผล...">${escapeHtml(this.state.actionNote || '')}</textarea>

        <label class="label mt-3">ข้อเสนอแนะจากผู้ประเมิน <span class="paper-section-en">Evaluator Comments</span></label>
        <textarea id="coachDetail" rows="3" class="input expandable" data-label="ข้อเสนอแนะจากผู้ประเมิน" placeholder="ระบุข้อเสนอแนะ จุดแข็ง จุดพัฒนา หรือข้อสังเกตเพิ่มเติม...">${escapeHtml(this.state.coachingDetail || '')}</textarea>
      </div>
    `;

    area.querySelectorAll('[data-coaching]').forEach(lbl => {
      const cb = lbl.querySelector('input[type=checkbox]');
      lbl.addEventListener('click', (e) => {
        if (cb.disabled) {   // ข้อที่ถูกล็อกตามระดับผลประเมิน — คลิกไม่ได้ (กันคลิกที่กล่อง/ข้อความด้วย)
          e.preventDefault();
          if (lbl.title) toast(lbl.title, 'error', { title: 'เลือกข้อนี้ไม่ได้' });
          return;
        }
        if (e.target !== cb) cb.checked = !cb.checked;
        this._coachingTouched = true;   // ผู้ใช้แก้เองแล้ว — หยุดใส่ค่าเริ่มต้นอัตโนมัติ
        lbl.classList.toggle('selected', cb.checked);
        const idx = +lbl.dataset.coaching;
        if (cb.checked && !this.state.coachingChecks.includes(idx)) this.state.coachingChecks.push(idx);
        else if (!cb.checked) this.state.coachingChecks = this.state.coachingChecks.filter(x => x !== idx);
      });
    });
    document.getElementById('actionNote').addEventListener('input', e => this.state.actionNote = e.target.value);
    document.getElementById('coachDetail').addEventListener('input', e => this.state.coachingDetail = e.target.value);
  },

  // =================================================================

    const me = Auth.currentUser();
    const visibleSections = form.sections.filter(sec => canScoreSection(sec, me.role));
    const ps = form.penaltySection;

    return `

        <table class="paper-table score-table">
          <thead>
            <tr><th>รายการ</th><th class="col-max">คะแนนเต็ม</th><th class="col-got">คะแนนที่ได้</th></tr>
          </thead>
          <tbody>
            ${visibleSections.map(sec => `
              <tr>
                <td>${escapeHtml(secName(sec.name))}</td>
                <td class="col-max mono">${calcSectionMax(sec)}</td>
                <td class="col-got mono" data-summary-sec="${sec.id}">—</td>
              </tr>
            `).join('')}

            <tr>
              <td>${escapeHtml(secName(ps.name))}</td>
