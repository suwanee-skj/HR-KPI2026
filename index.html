      data: { labels: secA.labels, datasets: [{ data: secA.data, backgroundColor: ['#dc2626', '#0891b2', '#f59e0b', '#7c3aed'], borderRadius: 3, barThickness: 34 }] },
      options: Analytics.barOpts(100),
    });

    const st = Analytics.statusCounts(allF);
    const stCv = document.getElementById('supStatus');
    if (stCv) this.charts.status = new Chart(stCv, {
      type: 'doughnut',
      data: { labels: st.labels, datasets: [{ data: st.data, backgroundColor: st.colors, borderWidth: 2, borderColor: '#fff' }] },
      options: Analytics.doughnutOpts(),
    });

    const empScores = team.map(u => {
      const evs = scored.filter(x => x.employeeId === u.id);
      return { name: u.fullName, score: evs.length ? +(evs.reduce((s, e) => s + e.totalScore, 0) / evs.length).toFixed(1) : 0 };
    }).sort((a, b) => b.score - a.score);
    const empCv = document.getElementById('supEmp');
    if (empCv) this.charts.emp = new Chart(empCv, {
      type: 'bar',
      data: { labels: empScores.map(e => e.name), datasets: [{ data: empScores.map(e => e.score), backgroundColor: empScores.map(e => gradeInfoFor(e.score, 100).color), borderRadius: 3 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#dc2626' } }, scales: { x: { beginAtZero: true, max: 100, grid: { color: '#f0f0f0' } }, y: { grid: { display: false } } } },
    });
  },

  // =================================================================
  // หน้าเดียว — รายการประเมินทั้งหมด (ทุกสถานะ)
  // =================================================================
  async renderList(container) {
    const me = Auth.currentUser();
    // โหลดใบประเมินของทีมตนให้ครบทุกรอบ (แบ่งหน้า server 500/หน้า)
    { let p = 0, total = 0; do { const res = await DB.loadEvaluations({ ...DB.OPEN_ONLY, evaluatorIds: { op: 'cs', value: me.id } }, { pageSize: 500, page: p, count: true, append: p > 0 }); total = res.total || 0; p++; } while (p * 500 < total && p < 200); }
    const baseList = DB.getAssignmentsForSupervisor(me.id);
    const allP = [...new Set(baseList.map(e => e.period))].sort().reverse();
    const empIds = [...new Set(baseList.map(e => e.employeeId))];
    const allEmp = empIds.map(id => DB.getUserById(id)).filter(Boolean)
      .sort((a, b) => (a.fullName || '').localeCompare(b.fullName || '', 'th'));
    const gradeLevels = DB.getSettings().gradeLevels || [];
    // ตัวเลือก "แบบฟอร์มการประเมิน" = ฟอร์มที่ถูกใช้จริงในรายการของหัวหน้าคนนี้
    const _fname = {}; DB.getForms().forEach(f => { _fname[f.id] = f.name; });
    const formOpts = [...new Set(baseList.map(e => e.formId).filter(Boolean))].map(id => ({ value: id, label: _fname[id] || id }));

    container.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">รายการประเมิน</div>
          <div class="page-sub">ทุกสถานะในรายการเดียว — ประเมิน → ส่ง HR → HR ยืนยัน → พนักงานรับทราบผ่านระบบ</div>
        </div>
        <div class="flex items-center gap-2 no-print">
          <button id="slManual" class="btn btn-slate-solid" title="คู่มือการใช้งาน"><i class="fa-solid fa-book-open"></i> คู่มือ</button>
        </div>
      </div>
      <div class="card mb-4 no-print">
        <div class="flex items-center gap-2 flex-wrap" id="slFilters">
          ${MS.build('lsStatus', 'ทุกสถานะ', [{ value: 'assigned', label: 'รอประเมิน' }, { value: 'pending_review', label: 'รอ HR ตรวจ' }, { value: 'confirmed', label: 'ยืนยันแล้ว' }], '180px')}
          ${MS.build('lsPeriod', 'ทุกรอบ', allP.map(p => ({ value: p, label: fmtPeriod(p) })), '160px')}
          ${MS.build('lsEmp', 'ทุกพนักงาน', allEmp.map(u => ({ value: u.id, label: `${u.fullName} (${u.employeeCode || ''})` })), '220px')}
          ${MS.build('lsGrade', 'ทุกเกรด', gradeLevels.map(g => ({ value: g.label, label: g.label })), '200px')}
          ${formOpts.length > 1 ? MS.build('lsForm', 'ทุกแบบฟอร์ม', formOpts, '210px') : ''}
          <input id="lsSearch" class="input" placeholder="ค้นหาทุกคอลัมน์..." style="width:240px;flex:0 0 auto" />
          <button id="lsClear" class="btn btn-secondary btn-icon" title="ล้างตัวกรองทั้งหมด"><i class="fa-solid fa-rotate-left"></i> ล้างตัวกรอง</button>
        </div>
        <div id="lsCount" class="text-mute text-xs mt-2"></div>
      </div>
      <div class="card !p-0 overflow-x-auto">
        <table class="tbl">
          <thead><tr><th>รอบ</th><th>พนักงาน</th><th>สถานะ</th><th>คะแนน</th><th>การรับทราบ</th><th class="text-right">การดำเนินการ</th></tr></thead>
          <tbody id="lsBody"></tbody>
        </table>
      </div>
      <div id="lsPager" class="flex items-center justify-center gap-2 mt-3 no-print"></div>
    `;

    const statusLabel = { assigned: 'รอประเมิน', evaluated: 'รอส่ง HR', pending_review: 'รอ HR ตรวจ', confirmed: 'ยืนยันแล้ว' };
    const PER_PAGE = 100;
    let page = 0;

    const draw = () => {
      const fs = MS.values('lsStatus'), fp = MS.values('lsPeriod'),
            femp = MS.values('lsEmp'), fg = MS.values('lsGrade'), fform = MS.values('lsForm');
      const q = (document.getElementById('lsSearch')?.value || '').trim().toLowerCase();
      let list = DB.getAssignmentsForSupervisor(me.id);
      if (fs.length) list = list.filter(e => fs.includes(e.status));
      if (fp.length) list = list.filter(e => fp.includes(e.period));
      if (femp.length) list = list.filter(e => femp.includes(e.employeeId));
      if (fg.length) list = list.filter(e => fg.includes(e.status !== 'assigned' && e.totalScore != null && e.totalMax ? gradeFor(e.totalScore, e.totalMax) : e.grade));
      if (fform.length) list = list.filter(e => fform.includes(e.formId));
      if (q) list = list.filter(e => {
        const u = DB.getUserById(e.employeeId) || {};
        const scoreText = (e.status !== 'assigned' && e.totalScore != null) ? `${e.totalScore.toFixed(2)} ${e.totalMax}` : '';
        const ackText = e.status === 'assigned' ? '' : (e.empResponse === 'acknowledge' ? 'รับทราบแล้ว' : (e.empResponse === 'dispute' ? 'มีข้อโต้แย้ง' : 'รอรับทราบ'));
        const bag = [
          fmtPeriod(e.period), e.period,
          u.fullName, u.employeeCode, u.department, u.position,
          statusLabel[e.status] || e.status,
          scoreText, (e.status !== 'assigned' && e.totalScore != null && e.totalMax ? gradeFor(e.totalScore, e.totalMax) : (e.grade || '')), ackText,
        ].join(' ').toLowerCase();
        return bag.includes(q);
      });
      // เรียง: รอประเมิน/รอแนบ มาก่อน → รอบล่าสุดบนสุด
      const order = { assigned: 0, evaluated: 1, pending_review: 2, confirmed: 3 };
      list.sort((a, b) => (order[a.status] - order[b.status]) || b.period.localeCompare(a.period));
      const totalPages = Math.max(1, Math.ceil(list.length / PER_PAGE));
      if (page >= totalPages) page = totalPages - 1;
      if (page < 0) page = 0;
      const start = page * PER_PAGE;
      const shown = list.slice(start, start + PER_PAGE);
      const cnt = document.getElementById('lsCount');
      if (cnt) cnt.innerHTML = `พบ <b>${list.length}</b> รายการ` + (list.length > PER_PAGE ? ` • แสดง ${start + 1}–${Math.min(start + PER_PAGE, list.length)} (หน้า ${page + 1}/${totalPages})` : '');

      const body = document.getElementById('lsBody');
      body.innerHTML = shown.map(e => {
        const u = DB.getUserById(e.employeeId) || {};
        const scored = e.status !== 'assigned' || (evalChainCurrent(e).length > 0 && +e.totalMax > 0);   // กลางลำดับ = มีคะแนนของลำดับก่อนหน้าแล้ว
        const info = scored ? gradeInfoFor(e.totalScore, e.totalMax) : null;
        const chainLen = evalChainOf(e).length;
        const myTurn = e.status === 'assigned' && evalCurrentEvaluatorId(e) === me.id;
        let actions = '';
        if (e.status === 'assigned' && !myTurn) {
          // ใบยังอยู่ในลำดับผู้ประเมินคนอื่น — ส่งต่อไปแล้ว (ดูได้) หรือยังไม่ถึงคิว (รอ)
          const st = evalStepOf(e); const myIdx = evalChainOf(e).indexOf(me.id);
          actions = (myIdx >= 0 && myIdx < st)
            ? `<button class="btn btn-secondary btn-icon" data-view="${e.id}" title="ดูรายละเอียด (คุณส่งต่อแล้ว — รอลำดับถัดไป)"><i class="fa-solid fa-eye"></i> ดู</button>`
            : `<span class="text-mute text-xs" style="white-space:nowrap"><i class="fa-solid fa-hourglass-half mr-1"></i>รอลำดับ ${st + 1} (${escapeHtml(evaluatorNameOf(evalCurrentEvaluatorId(e)) || '-')})</span>`;
        } else if (e.status === 'assigned') {
          // โฟลว์ใหม่: กด "ประเมิน" → กรอกคะแนน → ยืนยัน → ส่งให้ HR อัตโนมัติในขั้นตอนเดียว
          actions = `<button class="btn btn-primary btn-icon" data-eval="${e.id}"><i class="fa-solid fa-clipboard-check"></i> ประเมิน${chainLen > 1 ? ` (ลำดับ ${evalStepOf(e) + 1}/${chainLen})` : ''}</button>`;
        } else {
          actions = `<button class="btn btn-secondary btn-icon" data-view="${e.id}" title="ดูรายละเอียด"><i class="fa-solid fa-eye"></i> ดู</button>
            <button class="btn btn-secondary btn-icon" data-pdf="${e.id}" title="เปิดดูไฟล์ PDF"><i class="fa-solid fa-file-pdf"></i> PDF</button>`;
        }
        return `
          <tr>
            <td>${fmtPeriod(e.period)}</td>
            <td><b>${escapeHtml(u.fullName||'-')}</b> <span class="text-mute mono" style="font-size:11px">${escapeHtml(u.employeeCode||'')}</span><div style="margin-top:3px">${empStatusBadge(u.status)}</div></td>
            <td>${statusBadgeHTML(e.status)}${chainLen > 1 ? `<div style="margin-top:4px">${evalChainHtml(e)}</div>` : ''}</td>
            <td class="mono" style="white-space:nowrap">${scored ? `<b>${e.totalScore.toFixed(2)}</b>/${e.totalMax} ${info ? `<span class="grade-tag ml-1" style="color:${info.color};border-color:${info.color};background:${info.color}15">${escapeHtml(info.label)}</span>` : ''}` : '—'}</td>
            <td>${ackBadgeHTML(e)}</td>
            <td class="text-right whitespace-nowrap">${actions}</td>
          </tr>`;
      }).join('') || '<tr><td colspan="6" class="text-center text-mute" style="padding:2rem">ไม่มีรายการ</td></tr>';

      body.querySelectorAll('[data-eval]').forEach(b => b.addEventListener('click', () => window.Evaluation.openModal(b.dataset.eval)));
      body.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => AdminUI.viewEvaluation(b.dataset.view)));
      body.querySelectorAll('[data-pdf]').forEach(b => b.addEventListener('click', () => { const r = DB.getEvaluations().find(x => x.id === b.dataset.pdf); if (r) window.Evaluation._genEvalPdf(r, DB.getFormForEval(r), 'view'); }));

      // แถบเปลี่ยนหน้า (100 รายการ/หน้า) — แสดงเสมอ
      Pager.render(document.getElementById('lsPager'), page, totalPages, (np) => { page = np; draw(); });
    };
    MS.bind(document.getElementById('slFilters'), () => { page = 0; draw(); });
    document.getElementById('slManual')?.addEventListener('click', () => window.Manual && Manual.open('supervisor', 'list'));
    document.getElementById('lsSearch').addEventListener('input', () => { page = 0; draw(); });
    document.getElementById('lsClear').addEventListener('click', () => {
      ['lsStatus', 'lsPeriod', 'lsEmp', 'lsGrade', 'lsForm'].forEach(id => MS.clear(id));
      document.getElementById('lsSearch').value = '';
      page = 0;
      draw();
    });
    draw();
  },

  // =================================================================
  // รายชื่อพนักงานในการประเมินของหัวหน้า — อ่านอย่างเดียว (ไม่มีแก้ไข/เพิ่ม/นำเข้า/ดูรายละเอียด)
};


window.SupervisorUI = SupervisorUI;


</script>
<script>
// ===================================================================
// Employee UI — v3 (100-point + penalty + coaching display)
// ===================================================================
const EmployeeUI = {
  charts: {},
  _destroyCharts() { Object.values(this.charts).forEach(c => c?.destroy?.()); this.charts = {}; },

  renderOverview(container) {
    const u = Auth.currentUser();
    // เฉพาะการประเมินที่ทำแล้ว (ไม่รวม assigned ที่ยังไม่กรอก)
    const evals = DB.getEvaluationsByEmployee(u.id).filter(e => e.status !== 'assigned');
    const latest = evals[0];
    const form = latest ? DB.getFormForEval(latest) : null;
    const info = latest ? gradeInfoFor(latest.totalScore, latest.totalMax) : null;
    const avg = evals.length ? evals.reduce((s, e) => s + e.totalScore, 0) / evals.length : 0;
    const max = evals.length ? Math.max(...evals.map(e => e.totalScore)) : 0;

    container.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">ภาพรวมของฉัน</div>
          <div class="page-sub">สวัสดี ${escapeHtml(u.fullName)} — สรุปผลการประเมินล่าสุด (คะแนนเต็ม 100)</div>
        </div>
      </div>

      <div class="grid lg:grid-cols-4 gap-3 mb-6">
        <div class="stat-card featured">
          <div class="stat-icon"><i class="fa-solid fa-medal"></i></div>
          <div class="stat-label">คะแนนรอบล่าสุด</div>
          ${latest ? `
            <div class="stat-value"><span class="count-up" data-target="${latest.totalScore}" data-decimals="2">${latest.totalScore.toFixed(2)}</span></div>
            <div class="stat-meta"><span style="background:rgba(255,255,255,0.2);padding:0.15rem 0.55rem;border-radius:4px;font-weight:700">${info.label}</span> ${fmtPeriod(latest.period)}</div>
          ` : `<div class="stat-value">—</div><div class="stat-meta">ยังไม่มีการประเมิน</div>`}
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-clipboard-list"></i></div>
          <div class="stat-label">รอบที่ประเมิน</div>
          <div class="stat-value"><span class="count-up" data-target="${evals.length}">${evals.length}</span></div>
          <div class="stat-meta">รวมทั้งหมด</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-chart-line"></i></div>
          <div class="stat-label">คะแนนเฉลี่ย</div>
          <div class="stat-value"><span class="count-up" data-target="${avg}" data-decimals="2">${avg.toFixed(2)}</span></div>
          <div class="stat-meta">/ 100</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-trophy"></i></div>
          <div class="stat-label">คะแนนสูงสุด</div>
          <div class="stat-value"><span class="count-up" data-target="${max}" data-decimals="2">${max.toFixed(2)}</span></div>
          <div class="stat-meta">${evals.length ? fmtPeriod(evals.find(e => e.totalScore === max).period) : '—'}</div>
        </div>
      </div>

      <div class="grid lg:grid-cols-2 gap-4 mb-6">
        <div class="card lift">
          <div class="card-title">แนวโน้มคะแนนรวม (/100)</div>
          <div style="height:260px"><canvas id="trendChart"></canvas></div>
        </div>
        <div class="card lift">
          <div class="card-title">คะแนนแยกตามส่วน (รอบล่าสุด)</div>
          <div style="height:260px"><canvas id="sectionChart"></canvas></div>
        </div>
      </div>

      ${latest && form ? `
        <div class="card">
          <div class="card-title">รายละเอียดการประเมินรอบล่าสุด • ${escapeHtml(form.name)}</div>
          ${form.sections.map(sec => {
            const sScore = latest.sectionScores.find(x => x.sectionId === sec.id);
            return `
              <div class="section-header">
                <h4>${escapeHtml(sec.name)}</h4>
                <span class="mono font-bold">${sScore ? sScore.score.toFixed(2) : '—'} / ${sScore?.maxScore || calcSectionMax(sec)}</span>
              </div>
              <div class="space-y-2 mb-3">
                ${sec.items.map(it => {
                  const a = latest.answers.find(x => x.itemId === it.id);
                  const score = a ? a.score : 0;
                  const pct = (score / (it.maxScore || 1)) * 100;
                  return `
                    <div>
                      <div class="flex justify-between text-xs mb-1">
                        <span class="font-medium">${escapeHtml(it.name)}</span>
                        <span class="mono">ตอบ: <b>${formatAnswerValue(it, a?.value)}</b> → <b>${score.toFixed(2)}</b> / ${it.maxScore}</span>
                      </div>
                      <div class="w-full bg-neutral-200 rounded-full" style="height:6px">
                        <div style="width:${pct}%; height:100%; background:var(--accent); border-radius:999px"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `;
          }).join('')}

          ${form.penaltySection && form.penaltySection.enabled && (form.penaltySection.rules || []).length ? (() => {
            const ps = form.penaltySection;
            const psScore = latest.penaltySectionScore || calcPenaltySectionScore(form, latest.penaltyInputs || []);
            return `
            <div class="section-header" style="margin-top:1rem">
              <h4>${escapeHtml(ps.name)}</h4>
              <span class="mono font-bold">${psScore ? psScore.score.toFixed(2) : ps.baseScore} / ${ps.baseScore}</span>
            </div>
            <div class="text-xs space-y-1">
              ${ps.rules.map(r => {
                const inp = latest.penaltyInputs?.find(p => p.ruleId === r.id);
                const cnt = inp?.count || 0;
                const amt = calcPenaltyAmount(r, cnt);
                if (amt === 0) return '';
                return `<div class="flex justify-between"><span>${escapeHtml(r.name)} (${cnt} ${escapeHtml(r.unit || '')})</span><span class="mono" style="color:var(--err)">-${amt}</span></div>`;
              }).join('') || '<div class="text-mute">ไม่มีการหักคะแนน — เต็ม</div>'}
            </div>
          `; })() : ''}

          ${(latest.coachingChecks || []).length && form.coachingOptions ? `
            <div class="section-header" style="margin-top:1rem">
              <h4>แนวทางพัฒนาที่หัวหน้าระบุ</h4>
            </div>
            <div class="grid md:grid-cols-2 gap-2 text-sm">
              ${form.coachingOptions.map((o, i) => `
                ${latest.coachingChecks.includes(i)
                  ? `<div class="flex items-center gap-2" style="color:var(--accent)"><i class="fa-solid fa-square-check"></i><b>${escapeHtml(o)}</b></div>`
                  : ''}
              `).join('')}
            </div>
            ${latest.coachingDetail ? `<div class="muted-bg p-3 rounded mt-2 text-sm" style="border-left:3px solid var(--accent)"><b>รายละเอียด:</b> ${escapeHtml(latest.coachingDetail)}</div>` : ''}
          ` : ''}

          ${latest.overallComment ? `<div class="muted-bg p-3 rounded mt-3" style="border-left:3px solid var(--accent)"><b>ความเห็นภาพรวมจากผู้ประเมิน:</b> ${escapeHtml(latest.overallComment)}</div>` : ''}
        </div>
      ` : ''}
    `;

    this._destroyCharts();
    if (evals.length) {
      const sorted = [...evals].reverse();
      const tc = document.getElementById('trendChart');
      this.charts.trend = new Chart(tc, {
        type: 'line',
        data: { labels: sorted.map(e => fmtPeriod(e.period)), datasets: [{ label: 'คะแนน', data: sorted.map(e => e.totalScore), borderColor: '#dc2626', backgroundColor: 'rgba(220,38,38,0.1)', fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: '#dc2626' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100, grid: { color: '#f0f0f0' } }, x: { grid: { display: false } } } }
      });

      if (form) {
        const sc = document.getElementById('sectionChart');
        const labels = form.sections.map(s => s.name);
        const data = form.sections.map(s => latest.sectionScores.find(x => x.sectionId === s.id)?.score || 0);
        const maxes = form.sections.map(s => calcSectionMax(s));
        this.charts.section = new Chart(sc, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: 'คะแนนที่ได้', data, backgroundColor: '#dc2626', borderRadius: 2, barThickness: 26 },
              { label: 'คะแนนเต็ม',   data: maxes, backgroundColor: '#fee2e2', borderRadius: 2, barThickness: 26 },
            ]
          },
          options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { position: 'bottom' } }, scales: { x: { beginAtZero: true, grid: { color: '#f0f0f0' } }, y: { grid: { display: false } } } }
        });
      }
    }
  },

  // =================================================================
  // Acknowledge page — รับทราบการประเมินที่หัวหน้าส่งมา
  // =================================================================
  renderAcknowledge(container) {
    const u = Auth.currentUser();
    const pending = DB.getPendingAckForEmployee(u.id);

    if (!pending.length) {
      container.innerHTML = `
        <div class="page-header">
          <div>
            <div class="page-title">รับทราบการประเมิน</div>
            <div class="page-sub">รายการประเมินที่หัวหน้าส่งมา รอการรับทราบจากคุณ</div>
          </div>
        </div>
        <div class="card text-center" style="padding:3rem">
          <i class="fa-solid fa-circle-check text-3xl mb-3" style="color:var(--ok)"></i>
          <p class="font-bold mb-1">ไม่มีรายการรอรับทราบ</p>
          <p class="text-mute text-xs">การประเมินที่หัวหน้าส่งมาทั้งหมดถูกรับทราบแล้ว</p>
          <div class="mt-4">
            <button class="btn btn-secondary" onclick="App.go('emp-history')"><i class="fa-solid fa-clock-rotate-left"></i> ดูประวัติการประเมิน</button>
          </div>
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">รับทราบการประเมิน</div>
          <div class="page-sub">มี ${pending.length} รอบรอการรับทราบ — กรุณาตรวจสอบและกด "รับทราบ" เพื่อยืนยัน</div>
        </div>
      </div>

      <div class="space-y-4" id="ackList">
        ${pending.map(e => this._renderAckCard(e, u)).join('')}
      </div>
    `;

    // ไฟล์แนบ (เปิดดู/ดาวน์โหลด) — ไฟล์อยู่บน Google Drive ดึงผ่าน API ตอนกด
    const _findAtt = (key) => { const [eid, aid] = String(key).split('|'); const ev = pending.find(x => x.id === eid); return ev ? (ev.attachments || []).find(a => a.id === aid) : null; };
    container.querySelectorAll('[data-ack-vfile]').forEach(b => b.addEventListener('click', () => { const a = _findAtt(b.dataset.ackVfile); if (a) Evaluation.viewFile(a); }));
    container.querySelectorAll('[data-ack-dlfile]').forEach(b => b.addEventListener('click', () => { const a = _findAtt(b.dataset.ackDlfile); if (a) Evaluation.downloadFile(a); }));
    container.querySelectorAll('[data-ack]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.ack;
      const ta = container.querySelector(`textarea[data-ack-comment="${id}"]`);
      const comment = ta ? ta.value.trim() : '';
      confirmDialog({
        title: 'ยืนยันการรับทราบ',
        message: 'รับทราบการประเมินนี้แล้ว? ระบบจะบันทึกเวลาที่คุณรับทราบ',
        confirmText: 'รับทราบ',
        type: 'info',
      }).then(ok => {
        if (!ok) return;
        DB.acknowledgeEvaluation(id, comment);
        toast('รับทราบการประเมินแล้ว ขอบคุณ', 'success', { title: 'รับทราบสำเร็จ' });
        // refresh sidebar count first then re-render page (App.go re-applies .active)
        App.buildNav(u);
        App.go('emp-acknowledge');
      });
    }));
  },

  _renderAckCard(e, u) {
    const f = DB.getFormForEval(e);
    const evaluator = { ...(DB.getUserById(evalCurrentEvaluatorId(e)) || {}), fullName: evalChainNames(e) || ((DB.getUserById(e.supervisorId || e.evaluatorId) || {}).fullName || '') };   // ผู้ประเมิน = หัวหน้างาน (ไม่ใช่ HR)
    const info = gradeInfoFor(e.totalScore, e.totalMax);

    const sectionsHtml = (f?.sections || []).map(sec => {
      const ss = e.sectionScores.find(x => x.sectionId === sec.id);
      const items = sec.items.map(it => {
        const a = e.answers.find(x => x.itemId === it.id);
        const score = a ? a.score : 0;
        const pct = (score / (it.maxScore || 1)) * 100;
        return `
          <div>
            <div class="flex justify-between text-xs mb-1">
              <span>${escapeHtml(it.name)}</span>
              <span class="mono"><b>${score.toFixed(2)}</b> / ${it.maxScore}</span>
            </div>
            <div class="w-full bg-neutral-200 rounded-full" style="height:5px">
              <div style="width:${pct}%; height:100%; background:var(--accent); border-radius:999px"></div>
            </div>
          </div>
        `;
      }).join('');
      return `
        <div class="section-header" style="margin-top:0.75rem">
          <h4>${escapeHtml(sec.name)}</h4>
          <span class="mono font-bold">${ss ? ss.score.toFixed(2) : '—'} / ${ss?.maxScore || calcSectionMax(sec)}</span>
        </div>
        <div class="space-y-2 mb-2">${items}</div>
      `;
    }).join('');

    let penaltyHtml = '';
    if (f?.penaltySection && f.penaltySection.enabled && (f.penaltySection.rules || []).length) {
      const ps = f.penaltySection;
      const psScore = e.penaltySectionScore || calcPenaltySectionScore(f, e.penaltyInputs || []);
      penaltyHtml = `
        <div class="section-header" style="margin-top:0.75rem">
          <h4>${escapeHtml(ps.name)}</h4>
          <span class="mono font-bold">${psScore ? psScore.score.toFixed(2) : ps.baseScore} / ${ps.baseScore}</span>
        </div>
        <div class="text-xs space-y-1">
          ${ps.rules.map(r => {
            const inp = e.penaltyInputs?.find(p => p.ruleId === r.id);
            const cnt = inp?.count || 0;
            const amt = calcPenaltyAmount(r, cnt);
            if (amt === 0) return '';
            return `<div class="flex justify-between"><span>${escapeHtml(r.name)} (${cnt} ${escapeHtml(r.unit || '')})</span><span class="mono" style="color:var(--err)">-${amt}</span></div>`;
          }).join('') || '<div class="text-mute">ไม่มีการหักคะแนน — เต็ม</div>'}
        </div>
      `;
    }

    let coachHtml = '';
    if ((e.coachingChecks || []).length && f?.coachingOptions) {
      coachHtml = `
        <div class="section-header" style="margin-top:0.75rem">
          <h4>แนวทางพัฒนา</h4>
        </div>
        <div class="grid md:grid-cols-2 gap-1 text-sm">
          ${e.coachingChecks.map(idx => `<div class="flex items-center gap-2"><i class="fa-solid fa-square-check" style="color:var(--accent)"></i> ${escapeHtml(f.coachingOptions[idx] || '-')}</div>`).join('')}
        </div>
        ${e.coachingDetail ? `<div class="muted-bg p-2 rounded mt-2 text-xs" style="border-left:3px solid var(--accent)"><b>รายละเอียด:</b> ${escapeHtml(e.coachingDetail)}</div>` : ''}
      `;
    }

    // Attachments
    let attachHtml = '';
    const atts = e.attachments || [];
    if (atts.length) {
      attachHtml = `
        <div class="section-header" style="margin-top:0.75rem">
          <h4><i class="fa-solid fa-paperclip mr-1"></i>เอกสารแนบ</h4>
          <span class="text-mute text-xs">${atts.length} ไฟล์</span>
        </div>
        <div class="attach-list">
          ${atts.map(a => `
            <div class="attach-item">
              <i class="fa-solid ${fileIcon(a.type, a.name)}"></i>
              <div class="attach-item-info">
                <div class="attach-item-name">${escapeHtml(a.name)}</div>
                <div class="attach-item-size">${fmtBytes(a.size)}</div>
              </div>
              <button class="btn btn-secondary btn-icon" data-ack-vfile="${escapeHtml(e.id)}|${escapeHtml(a.id)}" title="เปิดดู"><i class="fa-solid fa-eye"></i></button>
              <button class="btn btn-secondary btn-icon" data-ack-dlfile="${escapeHtml(e.id)}|${escapeHtml(a.id)}" title="ดาวน์โหลด"><i class="fa-solid fa-download"></i></button>
            </div>
          `).join('')}
        </div>
      `;
    }

    return `
      <div class="card" style="border-left:4px solid var(--warn)">
        <div class="flex justify-between items-start flex-wrap gap-2 mb-3 pb-3 border-b border-neutral-100">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="badge warn"><i class="fa-solid fa-clock mr-1"></i>รอรับทราบ</span>
              <span class="font-bold">${fmtPeriod(e.period)}</span>
            </div>
            <div class="text-xs text-mute">ฟอร์ม: ${escapeHtml(f?.name || '-')} • ผู้ประเมิน: <b>${escapeHtml(evaluator?.fullName || '-')}</b> • วันที่ประเมิน ${fmtDate(e.createdAt)}</div>
          </div>
          <div class="text-right">
            <div class="big-score" style="font-size:1.8rem">${e.totalScore.toFixed(2)}</div>
            <div class="text-mute text-xs">/ ${e.totalMax || 100}</div>
            ${e.chainAvg ? `<div class="text-xs mt-1" style="color:var(--accent-dark)"><i class="fa-solid fa-scale-balanced mr-1"></i>${escapeHtml(chainAvgText(e, { short: true }))}</div>` : ''}
            <span class="grade-tag mt-1" style="color:${info?.color};border-color:${info?.color};background:${info?.color}15">${escapeHtml(info ? info.label : (e.grade || '-'))}</span>
          </div>
        </div>

        ${sectionsHtml}
        ${penaltyHtml}
        ${coachHtml}
        ${attachHtml}
        ${Evaluation.stepLogHtml(e, f, u)}

        ${e.overallComment ? `<div class="muted-bg p-3 rounded mt-3 text-sm" style="border-left:3px solid var(--accent)"><b>ความเห็นภาพรวม:</b> ${escapeHtml(e.overallComment)}</div>` : ''}

        <div class="mt-4 pt-4 border-t border-neutral-200">
          <label class="label">ความเห็นของพนักงาน (ไม่บังคับ)</label>
          <textarea rows="2" class="input" data-ack-comment="${e.id}" placeholder="ความคิดเห็นหรือข้อสงสัย..."></textarea>
        </div>

        <div class="mt-3 flex justify-end gap-2">
          <button class="btn btn-primary" data-ack="${e.id}"><i class="fa-solid fa-check"></i> รับทราบการประเมินนี้</button>
        </div>
      </div>
    `;
  },

  async renderHistory(container) {
    const u = Auth.currentUser();
    await DB.loadEvaluationsByEmployee(u.id);   // โหลดเฉพาะประวัติของตน (bounded) จาก DB
    // เฉพาะรายการที่ทำการประเมินแล้ว (ไม่รวม assigned ที่ยังไม่มีคะแนน)
    const evals = DB.getEvaluationsByEmployee(u.id).filter(e => e.status !== 'assigned' && e.totalScore != null);
    const allP = [...new Set(evals.map(e => e.period))].sort().reverse();
    const evalIds = [...new Set(evals.flatMap(e => evalChainOf(e).length ? evalChainOf(e) : [e.supervisorId || e.evaluatorId]))].filter(Boolean);
    const allEvaluators = evalIds.map(id => DB.getUserById(id)).filter(Boolean)
      .sort((a, b) => (a.fullName || '').localeCompare(b.fullName || '', 'th'));
    const gradeLevels = DB.getSettings().gradeLevels || [];

    container.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">ประวัติการประเมิน</div>
          <div class="page-sub">รายการประเมินทั้งหมดของคุณ เรียงจากใหม่สุด</div>
        </div>
        <div class="flex items-center gap-2 no-print">
          <button id="ehManual" class="btn btn-slate-solid" title="คู่มือการใช้งาน"><i class="fa-solid fa-book-open"></i> คู่มือ</button>
        </div>
      </div>

      ${evals.length ? `
        <div class="card mb-4 no-print">
          <div class="flex items-center gap-2 flex-wrap" id="ehFilters">
            ${MS.build('ehPeriod', 'ทุกรอบ', allP.map(p => ({ value: p, label: fmtPeriod(p) })), '160px')}
            ${MS.build('ehGrade', 'ทุกเกรด', gradeLevels.map(g => ({ value: g.label, label: g.label })), '200px')}
            ${MS.build('ehEvaluator', 'ผู้ประเมินทุกคน', allEvaluators.map(e => ({ value: e.id, label: e.fullName })), '200px')}
            <input id="ehSearch" class="input" placeholder="ค้นหาทุกคอลัมน์..." style="width:240px;flex:0 0 auto" />
            <button id="ehClear" class="btn btn-secondary btn-icon" title="ล้างตัวกรองทั้งหมด"><i class="fa-solid fa-rotate-left"></i> ล้างตัวกรอง</button>
          </div>
          <div id="ehCount" class="text-mute text-xs mt-2"><i class="fa-solid fa-clipboard-list mr-1"></i>ทั้งหมด ${evals.length} รอบการประเมิน</div>
        </div>
        <div id="ehAckBanner" class="no-print"></div>
        <div class="card !p-0 overflow-x-auto"><table class="tbl">
          <thead><tr>
            <th>รอบ</th><th>KPI Performance</th><th>Behavioral KPI</th><th>ส่วนวินัย</th>
            <th class="text-right">คะแนนรวม</th><th class="text-center">ระดับ</th><th>ผู้ประเมิน</th><th class="text-center">การรับทราบ</th><th class="text-right">ดู</th>
          </tr></thead>
          <tbody id="ehBody"></tbody>
        </table></div>
        <div id="ehPager" class="flex items-center justify-center gap-2 mt-3 flex-wrap"></div>
      ` : `
        <div class="card text-center" style="padding:3rem">
          <i class="fa-solid fa-clipboard-list text-3xl text-mute mb-3"></i>
          <p class="text-mute">ยังไม่มีประวัติการประเมิน</p>
        </div>
      `}
    `;

    if (!evals.length) return;

    let ehPage = 0;
    const EH_PER_PAGE = 100;
    const draw = () => {
      const fp = MS.values('ehPeriod'), fg = MS.values('ehGrade'), fev = MS.values('ehEvaluator');
      const q = (document.getElementById('ehSearch')?.value || '').trim().toLowerCase();
      let list = evals.slice();
      if (fp.length) list = list.filter(e => fp.includes(e.period));
      if (fg.length) list = list.filter(e => fg.includes(e.totalMax ? gradeFor(e.totalScore, e.totalMax) : e.grade));
      if (fev.length) list = list.filter(e => evalChainOf(e).some(id => fev.includes(id)) || fev.includes(e.evaluatorId));
      if (q) list = list.filter(e => {
        const ev = { ...(DB.getUserById(evalCurrentEvaluatorId(e)) || {}), fullName: evalChainNames(e) || ((DB.getUserById(e.supervisorId || e.evaluatorId) || {}).fullName || '') };
        const s0 = e.sectionScores?.[0], s1 = e.sectionScores?.[1], pen = e.penaltySectionScore;
        const bag = [
          fmtPeriod(e.period), e.period,
          s0 ? `${s0.score.toFixed(2)} ${s0.maxScore}` : '',
          s1 ? `${s1.score.toFixed(2)} ${s1.maxScore}` : '',
          pen ? `${pen.score.toFixed(2)} ${pen.max}` : '',
          `${e.totalScore.toFixed(2)} ${e.totalMax || 100}`,
          (e.totalMax ? gradeFor(e.totalScore, e.totalMax) : (e.grade || '')), ev.fullName, ev.employeeCode,
        ].join(' ').toLowerCase();
        return bag.includes(q);
      });
      list.sort((a, b) => b.period.localeCompare(a.period));
      const cnt = document.getElementById('ehCount');
      if (cnt) cnt.innerHTML = `<i class="fa-solid fa-clipboard-list mr-1"></i>แสดง ${list.length} / ${evals.length} รอบการประเมิน`;

      // แยกกลุ่ม: รอรับทราบ (ยังไม่กดรับทราบ) มาก่อน • รับทราบแล้ว ตามหลัง
      const pending = list.filter(e => e.empResponse !== 'acknowledge');
      const acked = list.filter(e => e.empResponse === 'acknowledge');

      // แบนเนอร์แจ้งรายการค้างรับทราบ (นับจากทั้งหมด ไม่ใช่เฉพาะที่กรอง)
      const totalPending = evals.filter(e => e.empResponse !== 'acknowledge').length;
      const banner = document.getElementById('ehAckBanner');
      if (banner) banner.innerHTML = totalPending > 0
        ? `<div class="card mb-4" style="border-left:4px solid var(--warn);background:#fffbeb;border-color:#fde68a;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
             <i class="fa-solid fa-bell" style="color:var(--warn);font-size:1.3rem"></i>
             <div style="flex:1;min-width:200px"><b>คุณมี ${totalPending} รายการที่ยังไม่ได้กดรับทราบ</b><div class="text-mute text-xs">เปิดดูใบประเมินแล้วกดปุ่มสีเขียว "รับทราบผลการประเมิน" เพื่อยืนยัน</div></div>
           </div>`
        : `<div class="card mb-4" style="border-left:4px solid var(--ok);background:#f0fdf4;border-color:#bbf7d0;display:flex;align-items:center;gap:.75rem">
             <i class="fa-solid fa-circle-check" style="color:var(--ok);font-size:1.3rem"></i>
             <div><b>รับทราบครบทุกรายการแล้ว</b><div class="text-mute text-xs">ไม่มีรายการค้างรับทราบ</div></div>
           </div>`;

      const rowHtml = (e) => {
        const info = gradeInfoFor(e.totalScore, e.totalMax);
        const ev = { ...(DB.getUserById(evalCurrentEvaluatorId(e)) || {}), fullName: evalChainNames(e) || ((DB.getUserById(e.supervisorId || e.evaluatorId) || {}).fullName || '') };   // ผู้ประเมิน = หัวหน้างานทุกลำดับ
        const secCell = (idx) => { const ss = e.sectionScores[idx]; if (!ss) return '<span class="text-mute">—</span>'; return `<span class="mono">${ss.score.toFixed(2)}</span> <span class="text-mute text-xs">/ ${ss.maxScore}</span>`; };
        const penCell = e.penaltySectionScore ? `<span class="mono">${e.penaltySectionScore.score.toFixed(2)}</span> <span class="text-mute text-xs">/ ${e.penaltySectionScore.max}</span>` : '<span class="text-mute">—</span>';
        const acked1 = e.empResponse === 'acknowledge';
        const ackCell = acked1
          ? `<span class="badge ok"><i class="fa-solid fa-circle-check mr-1"></i>รับทราบแล้ว</span>${e.empAckDate ? `<div class="text-mute" style="font-size:10px;margin-top:2px">${escapeHtml(e.empAckDate)}</div>` : ''}`
          : (e.empResponse === 'dispute' ? '<span class="badge err"><i class="fa-solid fa-triangle-exclamation mr-1"></i>มีข้อโต้แย้ง</span>' : '<span class="badge warn"><i class="fa-solid fa-clock mr-1"></i>รอรับทราบ</span>');
        const actBtn = acked1
          ? `<button class="btn btn-secondary btn-icon" data-emp-view="${e.id}" title="ดูใบประเมิน"><i class="fa-solid fa-eye"></i> ดู</button>`
          : `<button class="btn btn-success btn-icon btn-ack-solid" data-emp-view="${e.id}" title="ดูและกดรับทราบ"><i class="fa-solid fa-user-check"></i> รับทราบ</button>`;
        return `<tr${acked1 ? '' : ' style="background:#fffdf5"'}>
          <td><b>${fmtPeriod(e.period)}</b><div class="text-mute text-xs">${fmtDate(e.createdAt)}</div></td>
          <td>${secCell(0)}</td>
          <td>${secCell(1)}</td>
          <td>${penCell}</td>
          <td class="text-right"><b class="mono" style="font-size:1.05rem;color:${info?.color}">${e.totalScore.toFixed(2)}</b> <span class="text-mute text-xs">/ ${e.totalMax || 100}</span></td>
          <td class="text-center"><span class="grade-tag" style="color:${info?.color};border-color:${info?.color};background:${info?.color}15">${escapeHtml(info ? info.label : (e.grade || '-'))}</span></td>
          <td class="text-xs">${escapeHtml(ev?.fullName || '-')}</td>
          <td class="text-center">${ackCell}</td>
          <td class="text-right whitespace-nowrap">${actBtn}</td>
        </tr>`;
      };

      const groupHead = (icon, color, bg, text, n) => `<tr><td colspan="9" style="background:${bg};color:${color};font-weight:800;padding:8px 14px;letter-spacing:.02em"><i class="fa-solid ${icon} mr-1"></i>${text} (${n} รายการ)</td></tr>`;

      // แบ่งหน้า 100 รายการ/หน้า — จัดกลุ่ม "รอรับทราบ" ก่อน แล้ว "รับทราบแล้ว"
      const ordered = [...pending, ...acked];
      const totalPages = Math.max(1, Math.ceil(ordered.length / EH_PER_PAGE));
      ehPage = Math.min(Math.max(0, ehPage), totalPages - 1);
      const ehStart = ehPage * EH_PER_PAGE;
      const pageRows = ordered.slice(ehStart, ehStart + EH_PER_PAGE);
      Pager.render(document.getElementById('ehPager'), ehPage, totalPages, (np) => { ehPage = np; draw(); });
      const pPend = pageRows.filter(e => e.empResponse !== 'acknowledge');
      const pAck = pageRows.filter(e => e.empResponse === 'acknowledge');

      const body = document.getElementById('ehBody');
      let html = '';
      if (pPend.length) html += groupHead('fa-clock', '#b45309', '#fef3c7', 'รอการรับทราบ', pending.length) + pPend.map(rowHtml).join('');
      if (pAck.length) html += groupHead('fa-circle-check', '#15803d', '#dcfce7', 'รับทราบแล้ว', acked.length) + pAck.map(rowHtml).join('');
      body.innerHTML = html || '<tr><td colspan="9" class="text-center text-mute" style="padding:2rem">ไม่พบรายการตามเงื่อนไขที่กรอง</td></tr>';
      body.querySelectorAll('[data-emp-view]').forEach(b => b.addEventListener('click', () => this._viewEvalReadonly(b.dataset.empView)));
    };

    document.getElementById('ehManual')?.addEventListener('click', () => window.Manual && Manual.open('employee'));
    MS.bind(document.getElementById('ehFilters'), () => { ehPage = 0; draw(); });
    document.getElementById('ehSearch').addEventListener('input', () => { ehPage = 0; draw(); });
    document.getElementById('ehClear').addEventListener('click', () => {
      ['ehPeriod', 'ehGrade', 'ehEvaluator'].forEach(id => MS.clear(id));
      document.getElementById('ehSearch').value = '';
      ehPage = 0;
      draw();
    });
    draw();
  },

  // ดูใบประเมินแบบอ่านอย่างเดียว — ไม่มีปุ่มดาวน์โหลด/ส่งออก PDF + กดรับทราบผ่านระบบได้
  _viewEvalReadonly(id) {
    const rec = DB.getEvaluations().find(e => e.id === id);
    if (!rec) { toast('ไม่พบรายการประเมิน', 'error'); return; }
    const me = Auth.currentUser();
    const form = DB.getFormForEval(rec);
    const docHtml = (window.Evaluation && Evaluation._buildPrintDoc) ? Evaluation._buildPrintDoc(rec, form) : '<div class="text-mute">ไม่สามารถแสดงผลได้</div>';

    // เจ้าของผลประเมินกดรับทราบเองได้ (ทุกสถานะตั้งแต่หัวหน้าส่งผลมา) — ยังไม่รับทราบเท่านั้น
    const isOwner = rec.employeeId === me.id;
    const acked = rec.empResponse === 'acknowledge';
    const canAck = isOwner && !acked && rec.status !== 'assigned' && rec.totalScore != null;

    const ackBarHtml = acked
      ? `<div class="ack-bar" style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:.7rem .9rem;margin:0 0 .25rem">
           <i class="fa-solid fa-circle-check mr-1" style="color:var(--ok)"></i>
           <b>รับทราบผลการประเมินแล้ว</b> โดย ${escapeHtml(rec.empAckName || me.fullName)}${rec.empAckDate ? ` • วันที่ ${escapeHtml(rec.empAckDate)}` : ''}
           ${rec.empComment ? `<div class="text-mute text-xs mt-1"><b>ความเห็น:</b> ${escapeHtml(rec.empComment)}</div>` : ''}
         </div>`
      : (canAck
        ? `<div class="ack-bar" style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:.7rem .9rem;margin:0 0 .25rem">
             <div class="font-semibold text-sm mb-1"><i class="fa-solid fa-pen-clip mr-1" style="color:var(--warn)"></i>กดรับทราบผลการประเมินผ่านระบบ</div>
             <div class="text-mute text-xs mb-2">เมื่อกด "รับทราบ" ระบบจะบันทึกชื่อ-นามสกุลและวันที่ลงในช่องลงนามของพนักงานโดยอัตโนมัติ</div>
             <textarea id="ackComment" rows="2" class="input" placeholder="ความเห็นเพิ่มเติม (ไม่บังคับ)..."></textarea>
           </div>`
        : '');

    const ov = document.createElement('div');
    ov.className = 'modal-bg'; ov.style.zIndex = '130';
    ov.innerHTML = `
      <div class="modal" style="max-width:840px;width:95vw">
        <div class="modal-header">
          <div class="modal-title"><i class="fa-solid fa-clipboard-check mr-1" style="color:var(--accent)"></i>ผลการประเมินของฉัน • ${fmtPeriod(rec.period)}</div>
          <button class="btn btn-ghost btn-icon" data-close><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body" style="background:var(--bg-mute)">${docHtml}</div>
        ${ackBarHtml ? `<div style="padding:.6rem 1.1rem 0">${ackBarHtml}</div>` : ''}
        <div class="modal-footer">
          <span class="text-mute text-xs mr-auto"><i class="fa-solid fa-lock mr-1"></i>ดูได้อย่างเดียว — ไม่อนุญาตให้ดาวน์โหลด</span>
          <button class="btn ${canAck ? 'btn-secondary' : 'btn-primary'}" data-close>ปิด</button>
          ${canAck ? `<button class="btn btn-success btn-lg ack-cta" data-ack-now style="font-size:1.02rem;font-weight:800"><i class="fa-solid fa-user-check"></i> รับทราบผลการประเมิน</button>` : ''}
        </div>
      </div>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
    ov.addEventListener('click', e => { if (e.target === ov) close(); });

    const ackBtn = ov.querySelector('[data-ack-now]');
    if (ackBtn) ackBtn.addEventListener('click', () => {
      const comment = (ov.querySelector('#ackComment')?.value || '').trim();
      confirmDialog({
        title: 'ยืนยันการรับทราบ',
        message: `รับทราบผลการประเมินรอบ ${fmtPeriod(rec.period)}? ระบบจะบันทึกชื่อและวันที่ลงในช่องลงนาม`,
        confirmText: 'รับทราบ', type: 'info',
      }).then(async ok => {
        if (!ok) return;
        await DB.acknowledgeEvaluation(rec.id, comment, me.id);
        toast('รับทราบผลการประเมินแล้ว ขอบคุณ', 'success', { title: 'รับทราบสำเร็จ' });
        close();
        App.go(App.currentPage || 'emp-history');
      });
    });
  },

  renderProfile(container) {
    const u = Auth.currentUser();
    container.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">ข้อมูลส่วนตัว</div>
          <div class="page-sub">รายละเอียดบัญชีและตำแหน่ง</div>
        </div>
      </div>

      <div class="card max-w-2xl">
        <div class="flex items-center gap-4 mb-5 pb-5 border-b border-neutral-200">
          <div style="width:56px;height:56px;background:var(--accent);color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700">${escapeHtml(u.fullName.charAt(0))}</div>
          <div>
            <div class="text-lg font-bold">${escapeHtml(u.fullName)}</div>
            <div class="text-mute text-sm">${escapeHtml(u.position || '-')}</div>
            <span class="badge ${u.role === 'admin' ? 'info' : ''} mt-1">${({ admin: 'ฝ่ายบุคคล (HR)', supervisor: 'หัวหน้างาน', employee: 'พนักงาน' })[u.role] || u.role}</span>
          </div>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
          ${[
            ['รหัสพนักงาน', u.employeeCode],
            ['แผนก', u.department],
            ['ตำแหน่ง', u.position],
            ['วันที่เริ่มงาน', u.hireDate ? new Date(u.hireDate).toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' }) : '-'],
          ].map(([k, v]) => `
            <div>
              <div class="stat-label">${k}</div>
              <div class="font-semibold mt-1">${escapeHtml(v || '-')}</div>
            </div>
          `).join('')}
        </div>

        <div class="mt-5 pt-5 border-t border-neutral-200 text-xs text-mute">
          <i class="fa-solid fa-info-circle"></i> ข้อมูลโปรไฟล์ (ชื่อ / แผนก / ตำแหน่ง) แก้ไขโดยฝ่ายบุคคล (HR) · รหัสผ่านเข้าระบบจัดการที่ระบบ HR กลาง (เข้าระบบด้วยรหัสพนักงาน + รหัสผ่าน HR)
        </div>
      </div>
    `;
    // โหมดฐานข้อมูล Google Sheets: ผู้ใช้เปลี่ยนรหัสผ่านของตัวเองได้ที่นี่ (รหัสผ่านเริ่มต้น = รหัสพนักงาน)
    if (window.SupaDB && typeof SupaDB.setPassword === 'function' && SupaDB.enabled) {
      const card = document.createElement('div');
      card.className = 'card mt-4';
      card.innerHTML = `
        <div class="card-title"><i class="fa-solid fa-key mr-1" style="color:var(--accent)"></i>เปลี่ยนรหัสผ่านเข้าระบบ</div>
        <div class="text-mute text-xs mb-3">รหัสผ่านเริ่มต้นของทุกบัญชี = รหัสพนักงานของตัวเอง — แนะนำให้เปลี่ยนหลังเข้าระบบครั้งแรก (อย่างน้อย 4 ตัวอักษร)</div>
        <div class="grid md:grid-cols-3 gap-3">
          <div><label class="label">รหัสผ่านใหม่</label><input type="password" id="pwNew" class="input" autocomplete="new-password" /></div>
          <div><label class="label">ยืนยันรหัสผ่านใหม่</label><input type="password" id="pwNew2" class="input" autocomplete="new-password" /></div>
          <div style="display:flex;align-items:flex-end"><button id="pwSave" class="btn btn-primary btn-icon"><i class="fa-solid fa-floppy-disk"></i> บันทึกรหัสผ่าน</button></div>
        </div>`;
      container.appendChild(card);
      card.querySelector('#pwSave').addEventListener('click', async () => {
        const a = card.querySelector('#pwNew').value, b = card.querySelector('#pwNew2').value;
        if (a.length < 4) { toast('รหัสผ่านต้องยาวอย่างน้อย 4 ตัวอักษร', 'error'); return; }
        if (a !== b) { toast('รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'error'); return; }
        try { await SupaDB.setPassword(a); toast('เปลี่ยนรหัสผ่านแล้ว — ใช้รหัสใหม่ในการเข้าระบบครั้งถัดไป', 'success'); card.querySelector('#pwNew').value = ''; card.querySelector('#pwNew2').value = ''; }
        catch (e) { toast(e.message || 'เปลี่ยนรหัสผ่านไม่สำเร็จ', 'error'); }
      });
    }
  },
};


</script>
<script>
// ===== App Bootstrap & Router =====
const App = {
  currentPage: null,

  async init() {
    this.bindLogin();
    this.bindLogout();
    this.bindSidebarToggle();
    this.bindGlobalRipple();
    ExpandText.init();

    // 0) SSO: ถ้ามาจากระบบ HR หลักพร้อม ?tokens=<JWT> → เข้าระบบอัตโนมัติ (ไม่ต้องกรอกรหัสผ่าน)
    //    - สำเร็จ: ตั้ง session + cache user แล้วปล่อยให้ flow บูตปกติเข้าแอปต่อ
    //    - ผิด/หมดอายุ: เด้งกลับ portal (return — หยุด flow ปกติเพราะหน้ากำลังจะ unload)
    if ((await this.trySSO()) === 'redirect') return;

    // 1) ตัดสินใจหน้าจาก session ที่ cache ไว้ "ทันที" — กันอาการเด้งไปหน้า login ตอน refresh
    //    (ระหว่างรอดึงข้อมูลจาก DB หน้า login จะไม่โผล่อีก ถ้าล็อกอินอยู่แล้ว)
    this._booting = true;   // ระหว่างบูต ถ้าหน้าโหลดพลาดเพราะ DB ยังไม่พร้อม → โชว์สปินเนอร์ (ไม่ใช่ error)
    const cachedUser = Auth.currentUser();
    if (cachedUser) this.enterApp(cachedUser, { deferGo: true });   // โชว์โครงแอปทันที แต่รอข้อมูลพร้อมก่อน render หน้า (ครั้งเดียวจบ)
    // แสดงหน้า login เฉพาะเมื่อ "ไม่มี session จริง" เท่านั้น
    //   ถ้ามี session อยู่แล้ว (เคยล็อกอิน) แต่ resolve user record ไม่ได้ตอนนี้ (รายชื่อพนักงานเก็บใน memory จึงว่างจนกว่า pull เสร็จ)
    //   → คง bootLoader (สปินเนอร์) ไว้ ห้ามเด้ง login รอ pull แล้วค่อยเข้าแอปหน้าเดิม (กันอาการรีเฟรชเด้ง login)
    else if (!DB.getSession()) this.showLogin();


    // 2) ดึงข้อมูลล่าสุดจาก DB (เบื้องหลัง) แล้วซิงค์หน้าให้เป็นปัจจุบัน
    if (window.SupaDB) { try { await SupaDB.init(); } catch (e) { console.warn(e); } }
    DB.seedIfEmpty();
    this._booting = false;   // บูตเสร็จ — ถ้าหน้าโหลดพลาดหลังจากนี้ = ปัญหาจริง แสดง error + ปุ่มลองใหม่

    const user = Auth.currentUser();
    if (user && !cachedUser) this.enterApp(user);                  // ครั้งแรก (ยังไม่มี cache) แต่ดึง DB แล้วเจอผู้ใช้
    else if (user && this._pendingStart) {                     // รีเฟรช: render หน้าที่จำไว้ "ครั้งเดียว" หลังข้อมูลพร้อม
      const p = this._pendingStart; this._pendingStart = null;
      this.go(p);
    }
    else if (!user) this.showLogin();                              // ยังไม่ล็อกอิน หรือผู้ใช้ถูกลบจาก DB

    if (user) this._notifyPending(user);   // popup แจ้งรายการค้าง (ใบประเมิน) หลังข้อมูลพร้อม
  },

  // ===== Popup แจ้งเตือนรายการค้างตอนเข้าระบบ (ทุกสิทธิ์) =====
  // เด้งครั้งเดียวต่อการเข้าระบบ (ต่อ page load ต่อผู้ใช้) เฉพาะเมื่อ "มีรายการค้าง" เท่านั้น
  //   HR: ใบประเมินรอตรวจ
  //   SUP: ใบประเมินรอประเมิน
  //   EMP: ผลประเมินที่ยืนยันแล้วรอกดรับทราบ
  async _notifyPending(user) {
    try {
      if (!user || this._pendingNotified === user.id) return;
      this._pendingNotified = user.id;
      const items = [];   // { icon, label, count, page, btn }
      if (user.role === 'admin') {
        const nReview = await DB.countEvaluations({ status: 'pending_review' });
        if (nReview) items.push({ icon: 'fa-clipboard-check', label: 'ใบประเมินรอ HR ตรวจสอบ', count: nReview, page: 'hr-list' });
      } else if (user.role === 'supervisor') {
        const nTodo = await DB.countEvaluations({ supervisorId: user.id, status: 'assigned' });
        if (nTodo) items.push({ icon: 'fa-pen-to-square', label: 'ใบประเมินรอประเมิน', count: nTodo, page: 'sup-list' });
      } else {
        // พนักงาน: นับ "ยืนยันแล้วทั้งหมด - รับทราบแล้ว" (ห้ามใช้ neq เพราะค่า null จะหลุดจากตัวกรองฝั่ง server)
        const [nConfirmed, nAcked] = await Promise.all([
          DB.countEvaluations({ employeeId: user.id, status: 'confirmed' }),
          DB.countEvaluations({ employeeId: user.id, status: 'confirmed', empResponse: 'acknowledge' }),
        ]);
        const nAck = Math.max(0, nConfirmed - nAcked);
        if (nAck) items.push({ icon: 'fa-circle-check', label: 'ผลประเมินรอกดรับทราบ', count: nAck, page: 'emp-history' });
      }
      if (!items.length) return;   // ไม่มีรายการค้าง → ไม่เด้ง
      const body = `
        <div class="text-sm mb-3">สวัสดี <b>${escapeHtml(user.fullName || '')}</b> — คุณมีรายการค้างรอดำเนินการ:</div>
        ${items.map((it, i) => `
          <div class="flex items-center gap-3" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fffbeb;border-color:#fde68a">
            <i class="fa-solid ${it.icon}" style="color:#b45309;font-size:18px;width:22px;text-align:center"></i>
            <div style="flex:1;min-width:0" class="text-sm">${it.label}</div>
            <span class="badge warn" style="font-size:12px;font-weight:700">${it.count} รายการ</span>
            <button class="btn btn-primary btn-icon" data-np-go="${it.page}" data-np-i="${i}"><i class="fa-solid fa-arrow-right"></i> ไปจัดการ</button>
          </div>`).join('')}
        <div class="text-mute text-xs mt-1"><i class="fa-solid fa-circle-info mr-1"></i>แจ้งเตือนนี้แสดงเมื่อเข้าระบบและยังมีรายการค้างอยู่</div>`;
      showModal({
        title: '🔔 รายการค้างรอดำเนินการ',
        body, size: '560',
        footer: '<button class="btn btn-secondary" onclick="closeModal()">ปิด — ไว้จัดการภายหลัง</button>',
      });
      setTimeout(() => {
        document.querySelectorAll('[data-np-go]').forEach(b => b.addEventListener('click', () => { closeModal(); App.go(b.dataset.npGo); }));
      }, 30);
    } catch (e) { console.warn('[notifyPending]', e); }   // แจ้งเตือนล้มเหลวต้องไม่กระทบการเข้าระบบ
  },

  // SSO: เข้าระบบอัตโนมัติจากระบบ HR หลักผ่าน ?tokens=<JWT>
  //   คืน 'ok' (ตั้ง session แล้ว ให้ flow ปกติเข้าแอปต่อ) | 'redirect' (กำลังเด้งกลับ portal) | 'none' (ไม่มี token)
  async trySSO() {
    let token = null;
    try { token = new URLSearchParams(location.search).get('tokens'); } catch { /* */ }
    if (!token) return 'none';
    // ล้าง token ออกจาก URL ทันที (กัน token ค้างใน address bar / ประวัติ / ถูกแชร์ต่อ)
    try { history.replaceState(null, '', location.pathname + location.hash); } catch { /* */ }
    let res = {};
    try {
      const r = await fetch((window.__BASE_PATH__ || '') + '/api/sso', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ token }),
      });
      res = await r.json().catch(() => ({}));
    } catch (e) {
      // ต่อ endpoint ไม่ได้ → ปล่อยให้ไปหน้า login ปกติ (ไม่เด้ง เพื่อกันหลุดวน)
      console.warn('[SSO] เชื่อมต่อไม่ได้', e);
      return 'none';
    }
    if (res && res.ok && res.user) {
      DB.upsertUserCache(res.user);
      DB.setSession(res.user.id);
      return 'ok';   // flow บูตปกติจะ resolve user จาก cache แล้วเข้าแอปเอง
    }
    // token ผิด/หมดอายุ/ไม่พบสิทธิ์ → เด้งกลับ portal ตามที่เซิร์ฟเวอร์กำหนด
    if (res && res.redirect) { location.replace(res.redirect); return 'redirect'; }
    return 'none';   // ไม่มีปลายทาง → ตกไปหน้า login ปกติ
  },

  bindLogin() {
    const form = document.getElementById('loginForm');
    // ปุ่มแสดง/ซ่อนรหัสผ่าน (ไอคอนรูปตา) — สลับ type ระหว่าง password/text
    const pwToggle = document.getElementById('loginPwToggle');
    const pwInput = document.getElementById('loginPassword');
    if (pwToggle && pwInput) pwToggle.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      pwToggle.querySelector('i').className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      pwToggle.title = show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน';
      pwInput.focus();
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = form.querySelector('button[type="submit"]');
      const original = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังตรวจสอบ...'; }
      let res;
      try { res = await Auth.login(username, password); }
      catch (err) { res = { ok: false, error: 'เกิดข้อผิดพลาด กรุณาลองใหม่' }; }
      finally { if (btn) { btn.disabled = false; btn.innerHTML = original; } }
      if (!res.ok) { toast(res.error, 'error'); return; }
      toast('ยินดีต้อนรับ ' + res.user.fullName, 'success', { title: 'เข้าสู่ระบบสำเร็จ' });
      this.enterApp(res.user);
      this._notifyPending(res.user);   // popup แจ้งรายการค้างหลังเข้าระบบ
    });
  },

  bindLogout() {
    document.getElementById('logoutBtn').addEventListener('click', () => {
      confirmDialog({
        title: 'ออกจากระบบ',
        message: 'ต้องการออกจากระบบใช่หรือไม่?',
        confirmText: 'ออกจากระบบ',
        type: 'warn',
      }).then(ok => {
        if (ok) { try { sessionStorage.removeItem('eval_lastPage'); } catch (e) { /* */ } Auth.logout(); location.reload(); }
      });
    });
  },

  bindSidebarToggle() {
    const sb = document.getElementById('sidebar');
    const bd = document.getElementById('sidebarBackdrop');
    document.getElementById('sidebarToggle')?.addEventListener('click', () => {
      sb.classList.add('open'); bd.classList.remove('hidden');
    });
    bd?.addEventListener('click', () => {
      sb.classList.remove('open'); bd.classList.add('hidden');
    });
  },

  // Global ripple effect on .btn click
  bindGlobalRipple() {
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn');
      if (!btn || btn.disabled) return;
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  },

  showLogin() {
    document.getElementById('bootLoader')?.remove();
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('appPage').classList.add('hidden');
  },

  enterApp(user, opts = {}) {
    document.getElementById('bootLoader')?.remove();
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('appPage').classList.remove('hidden');

    document.getElementById('userAvatar').textContent = user.fullName.charAt(0);
    document.getElementById('userName').textContent = user.fullName;
    const roleLabel = { admin:'HR / ฝ่ายบุคคล', supervisor:'หัวหน้างาน', employee:'พนักงาน' };
    document.getElementById('userRole').textContent = roleLabel[user.role] || user.role;

    this.buildNav(user);
    const firstPage = user.role === 'admin' ? 'hr-dashboard' : (user.role === 'employee' ? 'emp-history' : 'sup-dashboard');
    // รีเฟรชแล้วคงอยู่หน้าเดิม — จำหน้าล่าสุดไว้ต่อแท็บ (sessionStorage) และใช้ได้เฉพาะหน้าที่สิทธิ์นี้มีในเมนู
    let startPage = firstPage;
    try {
      const saved = sessionStorage.getItem('eval_lastPage');
      if (saved && document.querySelector(`#sidebarNav .nav-link[data-page="${saved}"]`)) startPage = saved;
    } catch (e) { /* sessionStorage ใช้ไม่ได้ → หน้าแรกตาม role */ }
    if (opts.deferGo) {
      // ระหว่างบูต (รีเฟรช): ยังโหลดข้อมูลหน้าไม่ได้จนกว่า pull จะเสร็จ (SupaDB.enabled ยัง false)
      // → โชว์โครงแอป + สปินเนอร์ไว้ก่อน แล้วค่อย render "ครั้งเดียว" หลังข้อมูลพร้อม (init เป็นคนเรียก go)
      this._pendingStart = startPage;
      const c = document.getElementById('pageContainer');
      if (c) c.innerHTML = '<div style="padding:3rem;text-align:center;color:var(--mute)"><i class="fa-solid fa-spinner fa-spin fa-lg"></i><div class="mt-2">กำลังโหลดข้อมูล...</div></div>';
    } else {
      this.go(startPage);
    }
  },

  buildNav(user) {
    const nav = document.getElementById('sidebarNav');
    let html = '';

    // badge เป็น placeholder (ซ่อนไว้) แล้วเติมตัวเลขด้วย count query ภายหลัง — nav แสดงทันทีไม่ต้องรอ DB
    const badge = (id, cls) => `<span class="nav-badge ${cls || ''}" id="${id}" hidden></span>`;
    if (user.role === 'admin') {
      html += `
        <div class="nav-section-label">ภาพรวม</div>
        <div class="nav-link" data-page="hr-dashboard"><i class="fa-solid fa-chart-simple"></i><span>แดชบอร์ด</span></div>

        <div class="nav-section-label">การประเมิน</div>
        <div class="nav-link" data-page="hr-assign"><i class="fa-solid fa-user-plus"></i><span>มอบหมายการประเมิน</span></div>
        <div class="nav-link" data-page="hr-list">
          <i class="fa-solid fa-list-check"></i>
          <span>รายการประเมิน ${badge('nbHrReview', 'alert')}</span>
        </div>

        <div class="nav-section-label">ตั้งค่า</div>
        <div class="nav-link" data-page="hr-employees">
          <i class="fa-solid fa-users"></i>
          <span>จัดการพนักงาน</span>
        </div>
        <div class="nav-link" data-page="hr-forms"><i class="fa-solid fa-clipboard-list"></i><span>จัดการแบบฟอร์ม</span></div>
      `;
    } else if (user.role === 'supervisor') {
      html += `
        <div class="nav-section-label">ทีมของฉัน</div>
        <div class="nav-link" data-page="sup-dashboard"><i class="fa-solid fa-chart-simple"></i><span>แดชบอร์ดทีม</span></div>
        <div class="nav-link" data-page="sup-list">
          <i class="fa-solid fa-list-check"></i>
          <span>รายการประเมิน ${badge('nbSupTodo', 'alert')}</span>
        </div>
      `;
    } else if (user.role === 'employee') {
      html += `
        <div class="nav-section-label">ของฉัน</div>
        <div class="nav-link" data-page="emp-history"><i class="fa-solid fa-clock-rotate-left"></i><span>ประวัติการประเมิน</span></div>
        <div class="nav-link" data-page="emp-profile"><i class="fa-solid fa-user"></i><span>โปรไฟล์</span></div>
      `;
    }

    // ทุกสิทธิ์: บัญชีของฉัน (ผลประเมินของฉัน + โปรไฟล์) — admin/supervisor ก็ถูกประเมินได้
    if (user.role === 'admin' || user.role === 'supervisor') {
      html += `
        <div class="nav-section-label">บัญชีของฉัน</div>
        <div class="nav-link" data-page="emp-history"><i class="fa-solid fa-clock-rotate-left"></i><span>ผลประเมินของฉัน ${badge('nbMyEvals')}</span></div>
        <div class="nav-link" data-page="emp-profile"><i class="fa-solid fa-user"></i><span>โปรไฟล์</span></div>
      `;
    }
    nav.innerHTML = html;
    nav.querySelectorAll('.nav-link').forEach(el => {
      el.addEventListener('click', () => this.go(el.dataset.page));
    });
    this._updateNavBadges(user);   // เติมตัวเลข badge แบบ async (ไม่บล็อกการแสดง nav)
    // อัปเดต badge อัตโนมัติทุก 60 วินาที — ให้ตัวเลข "ค้างไว้" และตรงเสมอแม้ไม่เปลี่ยนหน้า
    if (this._navBadgeTimer) clearInterval(this._navBadgeTimer);
    this._navBadgeTimer = setInterval(() => { try { const u = Auth.currentUser(); if (u) this._updateNavBadges(u); else { clearInterval(this._navBadgeTimer); this._navBadgeTimer = null; } } catch (e) { /* */ } }, 60000);
  },

  // เติมตัวเลข badge ด้วย count query (ไม่โหลดข้อมูลจริง) — เรียกหลัง buildNav
  async _updateNavBadges(user) {
    const set = (id, n) => { const el = document.getElementById(id); if (!el) return; if (n > 0) { el.textContent = n; el.hidden = false; } else { el.hidden = true; } };
    try {
      // ยิงทุก count พร้อมกัน — ชั้นข้อมูลรวมเป็นคำขอเดียว (batch) ไม่ต้องรอทีละรอบ
      const jobs = [];
      if (user.role === 'admin') jobs.push(DB.countEvaluations({ status: 'pending_review' }).then(n => set('nbHrReview', n)));
      if (user.role === 'supervisor') jobs.push(DB.countEvaluations({ supervisorId: user.id, status: 'assigned' }).then(n => set('nbSupTodo', n)));
      if (user.role === 'admin' || user.role === 'supervisor') jobs.push(DB.countEvaluations({ employeeId: user.id, status: { op: 'neq', value: 'assigned' } }).then(n => set('nbMyEvals', n)));
      await Promise.all(jobs);
    } catch (e) { console.warn('[nav badges]', e); }
  },

  async go(pageId) {
    this.currentPage = pageId;
    try { sessionStorage.setItem('eval_lastPage', pageId); } catch (e) { /* จำหน้าไม่ได้ก็ข้าม */ }
    document.querySelectorAll('#sidebarNav .nav-link').forEach(el => {
      el.classList.toggle('active', el.dataset.page === pageId);
    });
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('sidebarBackdrop')?.classList.add('hidden');

    const container = document.getElementById('pageContainer');
    container.innerHTML = '<div style="padding:3rem;text-align:center;color:var(--mute)"><i class="fa-solid fa-spinner fa-spin fa-lg"></i><div class="mt-2">กำลังโหลด...</div></div>';
    container.classList.remove('page');
    void container.offsetWidth;
    container.classList.add('page');

    try {
      switch (pageId) {
        // ----- HR -----
        case 'hr-dashboard': await AdminUI.renderDashboard(container); break;
        case 'hr-assign':    await AdminUI.renderAssign(container); break;
        case 'hr-list':      await AdminUI.renderList(container); break;
        case 'hr-employees': await AdminUI.renderEmployees(container); break;
        case 'hr-forms':     await AdminUI.renderForms(container); break;
        case 'hr-grades':    await AdminUI.renderGrades(container); break;
        // ----- Supervisor -----
        case 'sup-dashboard': await SupervisorUI.renderDashboard(container); break;
        case 'sup-list':      await SupervisorUI.renderList(container); break;
        // ----- Employee (read-only) -----
        case 'emp-history':   await EmployeeUI.renderHistory(container); break;
        case 'emp-profile':   await EmployeeUI.renderProfile(container); break;
      }
    } catch (e) {
      if (this._booting) {
        // ยังบูตอยู่ (โหลดข้อมูลครั้งแรก) — DB ยังไม่พร้อม → โชว์สปินเนอร์ เดี๋ยว init จะ render ใหม่เมื่อพร้อม
        container.innerHTML = '<div style="padding:3rem;text-align:center;color:var(--mute)"><i class="fa-solid fa-spinner fa-spin fa-lg"></i><div class="mt-2">กำลังโหลดข้อมูล...</div></div>';
      } else {
        console.error('[go] โหลดหน้าไม่สำเร็จ', e);
        container.innerHTML = `<div class="card" style="padding:2.5rem;text-align:center">
          <i class="fa-solid fa-triangle-exclamation fa-2x mb-2" style="color:var(--err)"></i>
          <div style="font-weight:800;margin-bottom:.3rem">โหลดข้อมูลไม่สำเร็จ</div>
          <div class="text-mute text-sm" style="margin-bottom:1rem">เชื่อมต่อฐานข้อมูลไม่ได้ชั่วคราว (อาจมีผู้ใช้งานพร้อมกันจำนวนมาก) — กดลองใหม่อีกครั้ง</div>
          <button id="pageRetryBtn" class="btn btn-primary"><i class="fa-solid fa-rotate-right"></i> ลองใหม่</button>
        </div>`;
        const rb = document.getElementById('pageRetryBtn');
        if (rb) rb.addEventListener('click', async () => {
          rb.disabled = true; rb.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังเชื่อมต่อ...';
          try { if (window.SupaDB) await SupaDB.init(); } catch { /* */ }
          this.go(pageId);
        });
      }
    }

    runCountUps(container);
    // รีเฟรช badge แจ้งเตือนบนเมนูทุกครั้งที่เปลี่ยนหน้า — ตอนนี้ gateway พร้อมแล้วจึงนับได้ครบ (กันเคสตอน login ยังนับไม่ได้ → badge ว่าง)
    try { const u = Auth.currentUser(); if (u) this._updateNavBadges(u); } catch (e) { /* */ }
  },
};

// ===================================================================
// Modern Toast
// ===================================================================
function toast(message, type = 'info', opts = {}) {
  const box = document.getElementById('toastBox');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success: 'fa-circle-check', error: 'fa-circle-exclamation', info: 'fa-circle-info' };
  const titles = { success: 'สำเร็จ', error: 'เกิดข้อผิดพลาด', info: 'แจ้งเตือน' };
  el.innerHTML = `
    <div class="toast-icon"><i class="fa-solid ${icons[type] || icons.info}"></i></div>
    <div class="toast-body">
      <div class="toast-title">${escapeHtml(opts.title || titles[type] || 'แจ้งเตือน')}</div>
      <div class="toast-msg">${escapeHtml(message)}</div>
    </div>
    <div class="toast-close" title="ปิด"><i class="fa-solid fa-xmark"></i></div>
    <div class="toast-progress"></div>
  `;
  box.appendChild(el);

  const close = () => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
  };
  el.querySelector('.toast-close').addEventListener('click', close);
  const timer = setTimeout(close, opts.duration || 3500);
  el.addEventListener('mouseenter', () => {
    clearTimeout(timer);
    const p = el.querySelector('.toast-progress'); if (p) p.style.animationPlayState = 'paused';
  });
}

// ===================================================================
// Modern Confirm Dialog (replaces window.confirm)
// ===================================================================
function confirmDialog({ title = 'ยืนยันการดำเนินการ', message = '', confirmText = 'ยืนยัน', cancelText = 'ยกเลิก', type = 'warn' } = {}) {
  return new Promise(resolve => {
    const iconMap = {
      warn:    { icon: 'fa-triangle-exclamation', cls: 'warn' },
      delete:  { icon: 'fa-trash-can', cls: 'warn' },
      info:    { icon: 'fa-circle-question', cls: 'warn' },
    };
    const ic = iconMap[type] || iconMap.warn;

    // ใช้ overlay ของตัวเองต่อท้าย body (ไม่เขียนทับ #modalContainer) — เรียกซ้อนจากใน modal อื่นได้
    const host = document.createElement('div');
    host.innerHTML = `
      <div class="modal-bg" style="z-index:200">
        <div class="modal confirm-modal">
          <div class="confirm-body">
            <div class="confirm-icon ${ic.cls}"><i class="fa-solid ${ic.icon}"></i></div>
            <div class="confirm-title">${escapeHtml(title)}</div>
            <div class="confirm-msg">${escapeHtml(message)}</div>
          </div>
          <div class="modal-footer">
            <button data-cancel class="btn btn-secondary">${escapeHtml(cancelText)}</button>
            <button data-ok class="btn btn-primary"><i class="fa-solid fa-check"></i> ${escapeHtml(confirmText)}</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(host);
    const bg = host.querySelector('.modal-bg');
    const cleanup = (ans) => { document.removeEventListener('keydown', onKey); host.remove(); resolve(ans); };
    host.querySelector('[data-ok]').addEventListener('click', () => cleanup(true));
    host.querySelector('[data-cancel]').addEventListener('click', () => cleanup(false));
    bg.addEventListener('click', (e) => { if (e.target === bg) cleanup(false); });

    const onKey = (e) => {
      if (e.key === 'Escape') cleanup(false);
      if (e.key === 'Enter')  cleanup(true);
    };
    document.addEventListener('keydown', onKey);
  });
}

// ===================================================================
// Modal (form-style)
// ===================================================================
function showModal({ title, body, footer, onClose, size = '640', stack = false }) {
  // stack=true → ซ้อนทับ modal เดิม (ไม่ล้าง #modalContainer) สำหรับเปิดฟอร์มซ้อนจากในฟอร์มประเมิน
  let wrap, bgId, closeId;
  if (stack) {
    wrap = document.createElement('div');
    document.body.appendChild(wrap);
    bgId = 'modalBgStack'; closeId = 'modalCloseStack';
  } else {
    wrap = document.getElementById('modalContainer');
    bgId = 'modalBg'; closeId = 'modalClose';
  }
  wrap.innerHTML = `
    <div class="modal-bg" id="${bgId}" ${stack ? 'style="z-index:200"' : ''}>
      <div class="modal" style="max-width:${size}px">
        <div class="modal-header">
          <h3 class="modal-title">${title}</h3>
          <button id="${closeId}" class="btn btn-ghost btn-icon" aria-label="ปิด"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">${body}</div>
        ${footer ? `<div class="modal-footer">${footer}</div>` : ''}
      </div>
    </div>
  `;
  const close = () => { if (stack) wrap.remove(); else wrap.innerHTML = ''; if (onClose) onClose(); };
  document.getElementById(closeId).addEventListener('click', close);
  document.getElementById(bgId).addEventListener('click', (e) => { if (e.target.id === bgId) close(); });
  // Trigger count-ups inside modal
  setTimeout(() => runCountUps(wrap), 50);
  return { close, wrap };
}

function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

// ===== ExpandText — ปุ่มขยายช่องข้อความหลังบ้าน (.expandable) ในทุก modal =====
// (เว้นฟอร์มประเมิน #evalModalBody ที่มีตัวจัดการของตัวเอง)
const ExpandText = {
  _wrap(el) {
    if (el.dataset.exp || el.dataset.enhanced) return;
    if (el.closest('#evalModalBody')) return;            // ฟอร์มประเมินจัดการเอง
    el.dataset.exp = '1';
    const isTa = el.tagName === 'TEXTAREA';
    const wrap = document.createElement('div');
    wrap.className = isTa ? 'ta-wrap' : 'ta-wrap ta-wrap-inline';
    // ย้าย margin utility จาก field → wrap เพื่อคงระยะห่างเดิม
    ['mt-3', 'mt-2', 'mt-1', 'mb-3', 'mb-2', 'mb-1'].forEach(m => { if (el.classList.contains(m)) { wrap.classList.add(m); el.classList.remove(m); } });
    el.parentNode.insertBefore(wrap, el);
    wrap.appendChild(el);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = isTa ? 'ta-expand no-print' : 'ta-expand ta-expand-sm no-print';
    btn.title = 'ขยาย / พิมพ์รายละเอียด';
    btn.innerHTML = '<i class="fa-solid fa-up-right-and-down-left-from-center"></i>';
    btn.addEventListener('click', () => this._openModal(el));
    wrap.appendChild(btn);
    if (isTa) {
      const grow = () => { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 2, 320) + 'px'; };
      el.addEventListener('input', grow);
      if (el.value) grow();
    }
  },
  enhance(root) {
    root = root || document;
    // ฟอร์มประเมินมีตัวจัดการของตัวเอง — ข้ามทั้งก้อนเพื่อไม่ให้สแกนถี่ตอนคำนวณคะแนนสด
    if (root.querySelector && root.querySelector('#evalModalBody')) return;
    root.querySelectorAll('textarea.expandable, input.expandable').forEach(el => this._wrap(el));
  },
  init() {
    const wrap = document.getElementById('modalContainer');
    if (!wrap) return;
    this.enhance(wrap);
    let pending = false;
    new MutationObserver(() => {
      if (pending) return; pending = true;
      requestAnimationFrame(() => { pending = false; this.enhance(wrap); });
    }).observe(wrap, { childList: true, subtree: true });
  },
  _openModal(el) {
    const label = el.getAttribute('data-label') || 'รายละเอียด';
    const ov = document.createElement('div');
    ov.className = 'modal-bg'; ov.style.zIndex = '140';
    ov.innerHTML = `
      <div class="modal" style="max-width:760px;width:95vw">
        <div class="modal-header">
          <div class="modal-title"><i class="fa-solid fa-pen-to-square mr-1" style="color:var(--accent)"></i>${escapeHtml(label)}</div>
          <button class="btn btn-ghost btn-icon" data-txclose><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body"><textarea id="txBigG" class="input" rows="14" style="width:100%;font-size:15px;line-height:1.6"></textarea></div>
        <div class="modal-footer"><button class="btn btn-primary" data-txdone><i class="fa-solid fa-check"></i> เสร็จสิ้น</button></div>
      </div>`;
    document.body.appendChild(ov);
    const big = ov.querySelector('#txBigG');
    big.value = el.value; big.focus();
    const sync = () => { el.value = big.value; el.dispatchEvent(new Event('input', { bubbles: true })); };
    big.addEventListener('input', sync);
    const close = () => { sync(); ov.remove(); };
    ov.querySelector('[data-txclose]').addEventListener('click', close);
    ov.querySelector('[data-txdone]').addEventListener('click', close);
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
  },
};

// ===== Analytics — ตัวช่วยสรุปข้อมูลหลายมิติสำหรับแดชบอร์ด (SUP/HR) =====
const Analytics = {
  STATUS_LABEL: { assigned: 'รอประเมิน', pending_review: 'รอ HR ตรวจ', confirmed: 'ยืนยันแล้ว' },
  STATUS_COLOR: { assigned: '#dc2626', pending_review: '#f59e0b', confirmed: '#16a34a' },

  // คะแนนเฉลี่ยรายส่วน (% ของเต็ม) จากรายการที่ประเมินแล้ว
  sectionAverages(evals, form) {
    const labels = [], data = [];
    (form && form.sections || []).forEach(s => {
      const vals = [];
      evals.forEach(e => { const ss = (e.sectionScores || []).find(x => x.sectionId === s.id); if (ss && ss.maxScore) vals.push((ss.score / ss.maxScore) * 100); });
      labels.push(secName(s.name));
      data.push(vals.length ? +(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : 0);
    });
    const ps = form && form.penaltySection;
    if (ps && ps.enabled) {
      const vals = [];
      evals.forEach(e => { const p = e.penaltySectionScore; if (p && p.max) vals.push((p.score / p.max) * 100); });
      labels.push(secName(ps.name));
      data.push(vals.length ? +(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : 0);
    }
    return { labels, data };
  },

  statusCounts(list) {
    const keys = Object.keys(this.STATUS_LABEL);
    return { labels: keys.map(k => this.STATUS_LABEL[k]), data: keys.map(k => list.filter(e => e.status === k).length), colors: keys.map(k => this.STATUS_COLOR[k]) };
  },

  // คะแนนเฉลี่ยทีมรายรอบ (line trend) — คืน {labels, data}
  trendByPeriod(evals) {
    const byP = {};
    evals.forEach(e => { (byP[e.period] = byP[e.period] || []).push(e.totalScore); });
    const periods = Object.keys(byP).sort();
    return { labels: periods.map(fmtPeriod), data: periods.map(p => +(byP[p].reduce((s, v) => s + v, 0) / byP[p].length).toFixed(2)) };
  },

  // Heatmap พนักงาน × รอบ (สีตามคะแนน)
  heatmapHTML(employees, allEvals, limit = 6) {
    const scored = allEvals.filter(e => e.status !== 'assigned' && e.totalMax > 0);
    const periods = [...new Set(scored.map(e => e.period))].sort().slice(-limit);
    if (!periods.length || !employees.length) return '<div class="text-mute text-sm" style="padding:1rem">— ยังไม่มีข้อมูลคะแนนเพียงพอ —</div>';
    const head = `<tr><th>พนักงาน</th>${periods.map(p => `<th>${fmtPeriod(p)}</th>`).join('')}</tr>`;
    const rows = employees.map(u => {
      const cells = periods.map(p => {
        const e = scored.find(x => x.employeeId === u.id && x.period === p);
        if (!e) return '<td class="heatmap-cell empty">—</td>';
        const info = gradeInfoFor(e.totalScore, e.totalMax);
        return `<td class="heatmap-cell" style="background:${info.color}1f;color:${info.color};font-weight:700" title="${escapeHtml(u.fullName)} • ${fmtPeriod(p)}: ${e.totalScore.toFixed(1)}/${e.totalMax} (${escapeHtml(info ? info.label : (e.grade || ''))})">${e.totalScore.toFixed(0)}</td>`;
      }).join('');
      return `<tr><td class="heatmap-name">${escapeHtml(u.fullName)} <span class="text-mute mono" style="font-size:10px">${escapeHtml(u.employeeCode || '')}</span></td>${cells}</tr>`;
    }).join('');
    return `<div style="overflow-x:auto"><table class="heatmap-tbl">${head}${rows}</table></div>`;
  },

  // ตัวเลือก default ของกราฟ
  barOpts(max = 100) { return { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#dc2626' } }, scales: { y: { beginAtZero: true, max, grid: { color: '#f0f0f0' } }, x: { grid: { display: false } } } }; },
  doughnutOpts() { return { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } } } }; },

  // ค่าเฉลี่ยรายข้อ (% ของเต็ม) ภายในหนึ่งส่วน
  itemAverages(evals, items) {
    return (items || []).map(it => {
      const vals = [];
      evals.forEach(e => {
