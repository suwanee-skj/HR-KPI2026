        const ans = (e.answers || []).find(a => a.itemId === it.id);
        if (ans && ans.value != null && ans.value !== '') vals.push((typeof calcItemScore === 'function' ? calcItemScore(it, ans.value) : 0) * 100);
      });
      return { label: secName(it.name), value: vals.length ? +(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : 0 };
    });
  },

  // ค่าเฉลี่ยจำนวนครั้งที่หัก รายกฎวินัย (ต่อคน)
  penaltyAverages(evals, form) {
    const rules = (form && form.penaltySection && form.penaltySection.rules) || [];
    return rules.map(r => {
      const total = evals.reduce((s, e) => { const pi = (e.penaltyInputs || []).find(x => x.ruleId === r.id); return s + (pi ? (+pi.count || 0) : 0); }, 0);
      return { label: secName(r.name), value: evals.length ? +(total / evals.length).toFixed(2) : 0 };
    });
  },

  // จำนวนครั้งที่พบ รายข้อความเสี่ยง

  // จำนวนครั้งที่เลือก รายตัวเลือก Coaching
  coachingCounts(evals, form) {
    return ((form && form.coachingOptions) || []).map((label, i) => ({ label: secName(label), value: evals.filter(e => (e.coachingChecks || []).includes(i)).length }));
  },

  // ความเห็นพนักงาน (รับทราบ/โต้แย้ง/ยังไม่ระบุ)
  empResponseCounts(evals) {
    const ack = evals.filter(e => e.empResponse === 'acknowledge').length;
    const dispute = evals.filter(e => e.empResponse === 'dispute').length;
    return { labels: ['รับทราบ', 'มีข้อโต้แย้ง', 'ยังไม่ระบุ'], data: [ack, dispute, Math.max(0, evals.length - ack - dispute)], colors: ['#16a34a', '#dc2626', '#9ca3af'] };
  },
};
window.Analytics = Analytics;

// Safety net: promise error ที่ไม่มีใครจับ (เช่น บันทึกลง DB ไม่สำเร็จ) → ต้องแสดง error เสมอ ห้ามเงียบ

  try { hideBusy(); } catch { /* */ }
  const msg = (ev.reason && (ev.reason.message || String(ev.reason))) || 'เกิดข้อผิดพลาด — ข้อมูลอาจยังไม่ถูกบันทึก';

});

// ===== MS — ตัวกรองแบบเลือกหลายรายการ + ค้นหา (Multi-select with search) =====
const MS = {
  _data: {},   // id -> { options:[{value,label}], selected:Set } — เก็บใน JS เพื่อรองรับลิสต์ใหญ่ (พนักงาน 4,000+ คน)
  CAP: 200,    // จำนวน option สูงสุดที่ render เป็น DOM ในแต่ละครั้ง (ที่เหลือใช้ค้นหากรอง)
  // สร้าง HTML ของ widget — options: [{value,label}] (ตัว option ถูก render ตอนเปิด dropdown ไม่ใช่ตอน build เพื่อไม่ให้ DOM ใหญ่)
  build(id, placeholder, options, width = '180px') {
    this._data[id] = { options: (options || []).map(o => ({ value: String(o.value), label: String(o.label) })), selected: new Set() };
    return `<div class="ms" data-ms="${id}" style="width:${width};flex:0 0 auto">
      <div class="ms-control" data-ms-toggle><span class="ms-label" data-ph="${escapeHtml(placeholder)}">${escapeHtml(placeholder)}</span><i class="fa-solid fa-chevron-down ms-caret"></i></div>
      <div class="ms-panel" hidden>
        <input type="text" class="ms-search input" placeholder="พิมพ์ค้นหา..." />
        <div class="ms-opts"></div>
      </div>
    </div>`;
  },
  // render รายการตัวเลือก (กรองตามคำค้น + จำกัดจำนวนที่แสดง) — วาดเฉพาะตอนเปิด/ค้นหา จึงไม่มีวันเกิน CAP โหนด
  _renderOpts(ms, id, query) {
    const data = this._data[id]; if (!data) return;
    const box = ms.querySelector('.ms-opts');
    const q = (query || '').toLowerCase();
    const matched = q ? data.options.filter(o => o.label.toLowerCase().includes(q)) : data.options;
    const shown = matched.slice(0, this.CAP);
    let html = shown.map(o => `<label class="ms-opt"><input type="checkbox" value="${escapeHtml(o.value)}"${data.selected.has(o.value) ? ' checked' : ''} /><span>${escapeHtml(o.label)}</span></label>`).join('');
    if (!matched.length) html = '<div class="text-mute text-xs" style="padding:6px">— ไม่มีรายการ —</div>';
    else if (matched.length > shown.length) html += `<div class="text-mute text-xs" style="padding:6px">แสดง ${shown.length} จาก ${matched.length} — พิมพ์ค้นหาเพื่อกรอง</div>`;
    box.innerHTML = html;
  },
  // ผูก event ให้ทุก widget ใน root + callback เมื่อค่าเปลี่ยน
  bind(root, onChange) {
    (root || document).querySelectorAll('.ms').forEach(ms => {
      if (ms._bound) return; ms._bound = true;
      const id = ms.dataset.ms;
      const data = this._data[id] || (this._data[id] = { options: [], selected: new Set() });
      const ctrl = ms.querySelector('[data-ms-toggle]');
      const panel = ms.querySelector('.ms-panel');
      const search = ms.querySelector('.ms-search');
      const optsBox = ms.querySelector('.ms-opts');
      const label = ms.querySelector('.ms-label');
      const ph = label.dataset.ph;
      const update = () => {
        const n = data.selected.size;
        if (!n) { label.textContent = ph; label.classList.remove('ms-has'); }
        else if (n === 1) { const v = [...data.selected][0]; const o = data.options.find(x => x.value === v); label.textContent = o ? o.label : v; label.classList.add('ms-has'); }
        else { label.textContent = `เลือก ${n} รายการ`; label.classList.add('ms-has'); }
      };
      ms._update = update;
      ms._rerender = () => this._renderOpts(ms, id, search.value);
      ctrl.addEventListener('click', e => {
        e.stopPropagation();
        const willOpen = panel.hidden;
        document.querySelectorAll('.ms-panel').forEach(p => { p.hidden = true; });
        panel.hidden = !willOpen;
        if (willOpen) { search.value = ''; this._renderOpts(ms, id, ''); search.focus(); }
      });
      panel.addEventListener('click', e => e.stopPropagation());
      search.addEventListener('input', () => this._renderOpts(ms, id, search.value));
      // event delegation: จับติ๊ก checkbox ที่กล่องเดียว แทนผูกทีละ checkbox (สำคัญมากกับลิสต์หลายพันรายการ)
      optsBox.addEventListener('change', e => {
        const cb = e.target.closest('input[type=checkbox]'); if (!cb) return;
        if (cb.checked) data.selected.add(cb.value); else data.selected.delete(cb.value);
        update(); if (onChange) onChange();
      });
      update();
    });
    if (!MS._outside) { document.addEventListener('click', () => document.querySelectorAll('.ms-panel').forEach(p => { p.hidden = true; })); MS._outside = true; }
  },
  // อ่านค่าที่เลือก (array) — อ่านจาก state ไม่ใช่ DOM จึงถูกต้องแม้ยังไม่เปิด dropdown
  values(id) { const d = this._data[id]; return d ? [...d.selected] : []; },
  clear(id) {
    const d = this._data[id]; if (!d) return;
    d.selected.clear();
    const ms = document.querySelector(`.ms[data-ms="${id}"]`);
    if (ms) { if (ms._rerender) ms._rerender(); if (ms._update) ms._update(); }
  },
};
window.MS = MS;

// ===================================================================
// Pager — แถบแบ่งหน้ากลาง (แสดงเสมอ • ล็อกปุ่มเมื่อมีหน้าเดียว)
//   Pager.render(el, page, totalPages, onGo)  → onGo(newPage) ถูกเรียกเมื่อกดเปลี่ยนหน้า
// ===================================================================
const Pager = {
  render(el, page, totalPages, onGo) {
    if (!el) return;
    const tp = Math.max(1, totalPages || 1);
    const p = Math.min(Math.max(0, page || 0), tp - 1);
    const atFirst = p <= 0, atLast = p >= tp - 1;
    el.innerHTML = `
      <button class="btn btn-secondary btn-icon" ${atFirst ? 'disabled' : ''} data-pg="first" title="หน้าแรก"><i class="fa-solid fa-angles-left"></i></button>
      <button class="btn btn-secondary btn-icon" ${atFirst ? 'disabled' : ''} data-pg="prev"><i class="fa-solid fa-angle-left"></i> ก่อนหน้า</button>
      <span class="text-sm" style="padding:0 10px">หน้า <b>${p + 1}</b> / ${tp}</span>
      <button class="btn btn-secondary btn-icon" ${atLast ? 'disabled' : ''} data-pg="next">ถัดไป <i class="fa-solid fa-angle-right"></i></button>
      <button class="btn btn-secondary btn-icon" ${atLast ? 'disabled' : ''} data-pg="last" title="หน้าสุดท้าย"><i class="fa-solid fa-angles-right"></i></button>`;
    el.querySelectorAll('[data-pg]').forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.pg;
      const np = a === 'first' ? 0 : a === 'prev' ? Math.max(0, p - 1) : a === 'next' ? Math.min(tp - 1, p + 1) : tp - 1;
      if (np !== p && typeof onGo === 'function') onGo(np);
    }));
  },
};
window.Pager = Pager;

// SS = Single-select แบบพิมพ์ค้นหาได้ (สำหรับดรอปดาวรายชื่อยาว เช่น ผู้ประเมิน/หัวหน้างาน 300+ คน)
// เก็บ state ใน JS + render option เฉพาะตอนเปิด (รองรับลิสต์ใหญ่) • panel เป็น position:fixed จึงไม่ถูก modal ตัด (clip)
const SS = {
  _data: {},   // id -> { options:[{value,label}], selected:'', placeholder }
  CAP: 200,    // จำนวน option สูงสุดที่ render ต่อครั้ง (ที่เหลือใช้ค้นหากรอง)
  build(id, placeholder, options, selectedValue, width = '100%') {
    const opts = (options || []).map(o => ({ value: String(o.value), label: String(o.label) }));
    const sel = (selectedValue != null && selectedValue !== '') ? String(selectedValue) : '';
    this._data[id] = { options: opts, selected: sel, placeholder: placeholder || 'เลือก...' };
    return `<div class="ss" data-ss="${id}" style="width:${width}">
      <div class="ss-control" data-ss-toggle><span class="ss-label"></span><i class="fa-solid fa-chevron-down ss-caret"></i></div>
      <div class="ss-panel" hidden>
        <input type="text" class="ss-search input" placeholder="พิมพ์ค้นหา..." />
        <div class="ss-opts"></div>
      </div>
    </div>`;
  },
  _render(ss, id, query) {
    const d = this._data[id]; if (!d) return;
    const box = ss.querySelector('.ss-opts');
    const q = (query || '').toLowerCase().trim();
    const matched = q ? d.options.filter(o => o.label.toLowerCase().includes(q)) : d.options;
    const shown = matched.slice(0, this.CAP);
    const row = (val, label, active) => `<div class="ss-opt${active ? ' ss-active' : ''}" data-val="${escapeHtml(val)}">${escapeHtml(label)}</div>`;
    let html = row('', d.placeholder, d.selected === '');
    html += shown.map(o => row(o.value, o.label, d.selected === o.value)).join('');
    if (!matched.length) html += '<div class="text-mute text-xs" style="padding:6px">— ไม่พบ —</div>';
    else if (matched.length > shown.length) html += `<div class="text-mute text-xs" style="padding:6px">แสดง ${shown.length} จาก ${matched.length} — พิมพ์ค้นหาเพื่อกรอง</div>`;
    box.innerHTML = html;
  },
  _label(ss, id) {
    const d = this._data[id]; const el = ss.querySelector('.ss-label');
    const o = d.options.find(x => x.value === d.selected);
    el.textContent = o ? o.label : d.placeholder;
    el.classList.toggle('ss-has', !!o);
  },
  _position(ss) {
    const ctrl = ss.querySelector('[data-ss-toggle]');
    const panel = ss.querySelector('.ss-panel');
    const r = ctrl.getBoundingClientRect();
    panel.style.left = r.left + 'px';
    panel.style.width = r.width + 'px';
    const spaceBelow = window.innerHeight - r.bottom;
    if (spaceBelow < 300 && r.top > spaceBelow) { panel.style.top = 'auto'; panel.style.bottom = (window.innerHeight - r.top + 4) + 'px'; }
    else { panel.style.bottom = 'auto'; panel.style.top = (r.bottom + 4) + 'px'; }
  },
  bind(root, onChange) {
    (root || document).querySelectorAll('.ss').forEach(ss => {
      if (ss._bound) return; ss._bound = true;
      const id = ss.dataset.ss;
      const ctrl = ss.querySelector('[data-ss-toggle]');
      const panel = ss.querySelector('.ss-panel');
      const search = ss.querySelector('.ss-search');
      this._label(ss, id);
      ctrl.addEventListener('click', e => {
        e.stopPropagation();
        const willOpen = panel.hidden;
        document.querySelectorAll('.ss-panel,.ms-panel').forEach(p => { p.hidden = true; });
        if (willOpen) { search.value = ''; this._render(ss, id, ''); this._position(ss); panel.hidden = false; search.focus(); }
      });
      panel.addEventListener('click', e => e.stopPropagation());
      search.addEventListener('input', () => this._render(ss, id, search.value));
      ss.querySelector('.ss-opts').addEventListener('click', e => {
        const opt = e.target.closest('.ss-opt'); if (!opt) return;
        this._data[id].selected = opt.dataset.val || '';
        this._label(ss, id);
        panel.hidden = true;
        if (onChange) onChange(this._data[id].selected);
      });
    });
    if (!SS._outside) { document.addEventListener('click', () => document.querySelectorAll('.ss-panel').forEach(p => { p.hidden = true; })); SS._outside = true; }
  },
  value(id) { const d = this._data[id]; return d ? d.selected : ''; },
  set(id, val) { const d = this._data[id]; if (!d) return; d.selected = (val == null ? '' : String(val)); const ss = document.querySelector(`.ss[data-ss="${id}"]`); if (ss) this._label(ss, id); },
};
window.SS = SS;

// ===================================================================
// ตัวเลือก "ผู้ประเมินหลายลำดับ" — สูงสุด MAX_EVALUATORS คน ประเมินตามลำดับ 1 → 2 → 3
//   build(prefix, ids, {excludeId, sups}) → HTML • bind(root, prefix, onChange) • value(prefix) → [id, ...]
//   ใช้ร่วมกันที่หน้าจัดการพนักงาน (ฟอร์มพนักงาน) และปุ่ม "กำหนดผู้ประเมิน" ในรายการประเมิน
// ===================================================================
const EvaluatorPicker = {
  max() { return (typeof MAX_EVALUATORS !== 'undefined') ? MAX_EVALUATORS : 3; },
  build(prefix, ids, opts = {}) {
    const max = this.max();
    const sups = (opts.sups || DB.getSupervisors()).filter(s => s.id !== opts.excludeId)
      .sort((a, b) => String(a.fullName || '').localeCompare(String(b.fullName || ''), 'th'));
    const optList = sups.map(s => ({ value: s.id, label: `${s.fullName}${s.employeeCode ? ' · ' + s.employeeCode : ''}${s.department ? ' (' + s.department + ')' : ''}` }));
    const cur = Array.isArray(ids) ? ids : [];
    const rows = [];
    for (let i = 0; i < max; i++) {
      rows.push(`<div class="evp-row" data-evp-row="${i}">
        <span class="evp-no" title="ผู้ประเมินลำดับที่ ${i + 1}">${i + 1}</span>
        <div style="flex:1;min-width:0">${SS.build(`${prefix}_${i}`, i === 0 ? '— ไม่กำหนด (ยังไม่มอบหมายผู้ประเมิน) —' : '— ไม่มี (ว่าง) —', optList, cur[i] || '', '100%')}</div>
        <button type="button" class="btn btn-secondary btn-icon evp-btn" data-evp-up="${i}" title="เลื่อนขึ้น (สลับกับลำดับก่อนหน้า)" ${i === 0 ? 'disabled' : ''}><i class="fa-solid fa-arrow-up"></i></button>
        <button type="button" class="btn btn-secondary btn-icon evp-btn" data-evp-down="${i}" title="เลื่อนลง (สลับกับลำดับถัดไป)" ${i === max - 1 ? 'disabled' : ''}><i class="fa-solid fa-arrow-down"></i></button>
      </div>`);
    }
    return `<div class="evp" data-evp="${prefix}">${rows.join('')}
      <div class="text-mute text-xs mt-1"><i class="fa-solid fa-circle-info mr-1"></i>ประเมินตามลำดับ 1 → 2 → 3 — ลำดับถัดไปจะได้คิวเมื่อลำดับก่อนหน้า "ส่งต่อ" แล้ว • ลำดับสุดท้ายเป็นผู้ส่งให้ HR • ว่างไว้ได้ (ใช้เท่าที่กำหนด)</div>
    </div>`;
  },
  bind(root, prefix, onChange) {
    const wrap = (root || document).querySelector(`.evp[data-evp="${prefix}"]`);
    if (!wrap) return;
    SS.bind(wrap, () => { if (onChange) onChange(this.value(prefix)); });
    const swap = (a, b) => {
      const va = SS.value(`${prefix}_${a}`), vb = SS.value(`${prefix}_${b}`);
      SS.set(`${prefix}_${a}`, vb); SS.set(`${prefix}_${b}`, va);
      if (onChange) onChange(this.value(prefix));
    };
    wrap.querySelectorAll('[data-evp-up]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.evpUp; if (i > 0) swap(i, i - 1); }));
    wrap.querySelectorAll('[data-evp-down]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.evpDown; if (i < this.max() - 1) swap(i, i + 1); }));
  },
  // ค่าที่เลือก — ตัดค่าว่าง/ซ้ำ คงลำดับตามที่จัด
  value(prefix) {
    const out = [];
    for (let i = 0; i < this.max(); i++) { const v = SS.value(`${prefix}_${i}`); if (v && !out.includes(v)) out.push(v); }
    return out;
  },
};
window.EvaluatorPicker = EvaluatorPicker;

// ===================================================================
// Number Counter Animation
// ===================================================================
function runCountUps(root) {
  if (!root) root = document;
  root.querySelectorAll('.count-up:not([data-counted])').forEach(el => {
    el.setAttribute('data-counted', '1');
    const target = parseFloat(el.dataset.target || el.textContent) || 0;
    const decimals = parseInt(el.dataset.decimals || '0');
    const duration = parseInt(el.dataset.duration || '700');
    const start = performance.now();
    el.textContent = (0).toFixed(decimals);
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
      el.textContent = (eased * target).toFixed(decimals);
      if (t < 1) requestAnimationFrame(step);
      else el.textContent = target.toFixed(decimals);
    }
    requestAnimationFrame(step);
  });
}

// ===================================================================
// Format helpers
// ===================================================================
function fmtDate(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
}
function fmtPeriod(period) {
  if (!period) return '-';
  const [y, m] = period.split('-');
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${months[parseInt(m) - 1]} ${parseInt(y) + 543}`;
}
function escapeHtml(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ===================================================================
// แจ้งเตือนเมื่อมีเวอร์ชันใหม่ขึ้นระบบ
// หน้าที่เปิดค้างไว้จะยังใช้ไฟล์ JS ชุดเดิมที่โหลดตอนเปิดหน้า จนกว่าจะโหลดหน้าใหม่
// (เคยทำให้ผู้ใช้เห็นของเก่าทั้งที่ deploy ไปแล้ว) — เทียบเวอร์ชันกับเซิร์ฟเวอร์แล้วชวนให้กดโหลดใหม่
// ===================================================================
const VersionWatch = {
  _shown: false,
  async check() {
    const mine = window.__ASSET_VER;
    if (!mine || this._shown) return;
    if (window.__GSHEET_API__) return;   // โหมด GitHub Pages + Google Sheets ไม่มี /api/version
    try {
      const r = await fetch((window.__BASE_PATH__ || '') + '/api/version', { cache: 'no-store' });
      if (!r.ok) return;
      const d = await r.json();
      if (d && d.ver && d.ver !== mine) this._notify();
    } catch (e) { /* ออฟไลน์ / UAT ที่ไม่มี endpoint นี้ — เงียบไว้ */ }
  },
  _notify() {
    if (this._shown || document.getElementById('verUpdateBar')) return;
    this._shown = true;
    const bar = document.createElement('div');
    bar.id = 'verUpdateBar';
    bar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:300;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.28);display:flex;align-items:center;gap:14px;font-size:14px;max-width:92vw';
    bar.innerHTML = '<span><i class="fa-solid fa-arrows-rotate"></i> มีเวอร์ชันใหม่ของระบบแล้ว — โหลดใหม่เพื่อใช้ของล่าสุด</span>'
      + '<button type="button" id="verUpdateGo" style="background:#dc2626;color:#fff;border:0;border-radius:7px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:inherit">โหลดใหม่</button>'
      + '<button type="button" id="verUpdateLater" style="background:transparent;color:#cbd5e1;border:0;cursor:pointer;font-family:inherit">ไว้ก่อน</button>';
    document.body.appendChild(bar);
    bar.querySelector('#verUpdateGo').addEventListener('click', () => location.reload());
    bar.querySelector('#verUpdateLater').addEventListener('click', () => bar.remove());
  },
  start() {
    setTimeout(() => this.check(), 20000);                 // หลังเปิดหน้า 20 วิ (ไม่ไปแย่งจังหวะโหลดข้อมูลตอนบูต)
    setInterval(() => this.check(), 5 * 60 * 1000);        // แล้วทุก 5 นาที
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.check(); });
  },
};

// ===== ThaiCal — ปฏิทิน/ตัวเลือกเดือนภาษาไทย (พ.ศ.) แทน picker ของเบราว์เซอร์ =====
// เบราว์เซอร์ไม่ยอมให้กำหนดภาษาปฏิทิน native ต่อหน้าเว็บ (ขึ้นกับภาษาเครื่องผู้ใช้)
// → ซ่อน input[type=date|month] เดิมไว้เป็น "ตัวเก็บค่า" (id/value/required/listener เดิมทำงานครบ
//   ค่ายังเป็น YYYY-MM-DD / YYYY-MM ตามเดิม — ข้อมูลบันทึก/นำเข้า/ส่งออกไม่เปลี่ยน)
//   แล้ววางช่องแสดงผลภาษาไทย + แผงปฏิทินไทยแทน • ครอบทุกจุดอัตโนมัติรวมถึงฟอร์มที่สร้างภายหลัง
const ThaiCal = {
  M_ABBR: ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'],
  DOW: ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'],
  fmtDate(v) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return m ? `${+m[3]} ${this.M_ABBR[+m[2] - 1]} ${+m[1] + 543}` : ''; },
  fmtMonth(v) { const m = /^(\d{4})-(\d{2})$/.exec(v || ''); return m ? `${this.M_ABBR[+m[2] - 1]} ${+m[1] + 543}` : ''; },
  _pad(n) { return String(n).padStart(2, '0'); },

  init() {
    const scan = (root) => { if (root.querySelectorAll) root.querySelectorAll('input[type="date"], input[type="month"]').forEach(el => this.enhance(el)); };
    scan(document);
    new MutationObserver(muts => muts.forEach(m => m.addedNodes.forEach(n => {
      if (n.nodeType !== 1) return;
      if (n.matches && n.matches('input[type="date"], input[type="month"]')) this.enhance(n);
      else scan(n);
    }))).observe(document.documentElement, { childList: true, subtree: true });
    // ปิดแผงเมื่อคลิกที่อื่น / กด ESC / เลื่อนหน้า
    document.addEventListener('mousedown', (e) => { if (this._panel && !this._panel.contains(e.target) && e.target !== this._anchor) this.close(); }, true);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') this.close(); });
    window.addEventListener('scroll', (e) => { if (this._panel && !this._panel.contains(e.target)) this.close(); }, true);
  },

  enhance(inp) {
    if (inp.dataset.tcal) return;
    inp.dataset.tcal = '1';
    const mode = inp.type === 'month' ? 'month' : 'date';
    const disp = document.createElement('input');
    disp.type = 'text'; disp.readOnly = true;
    disp.className = inp.className;
    disp.classList.add('tcal-disp');
    disp.placeholder = mode === 'month' ? 'เลือกเดือน...' : 'เลือกวันที่...';
    const sync = () => {
      disp.value = mode === 'month' ? this.fmtMonth(inp.value) : this.fmtDate(inp.value);
      disp.disabled = inp.disabled;
      disp.classList.toggle('field-locked', inp.classList.contains('field-locked'));
      if (inp.title) disp.title = inp.title;
    };
    inp.style.display = 'none';
    inp.insertAdjacentElement('afterend', disp);
    sync();
    inp.addEventListener('input', sync);
    inp.addEventListener('change', sync);
    new MutationObserver(sync).observe(inp, { attributes: true, attributeFilter: ['disabled', 'class', 'title'] });
    disp.addEventListener('click', () => { sync(); if (!inp.disabled) this.open(inp, disp, mode); });
  },

  close() { if (this._panel) { this._panel.remove(); this._panel = null; this._anchor = null; } },
  _set(inp, v) {
    inp.value = v;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    inp.dispatchEvent(new Event('change', { bubbles: true }));
    this.close();
  },

  open(inp, disp, mode) {
    this.close();
    const panel = document.createElement('div');
    panel.className = 'tcal-panel';
    this._panel = panel; this._anchor = disp;
    document.body.appendChild(panel);
    const now = new Date();
    const cur = /^(\d{4})-(\d{2})/.exec(inp.value || '');
    let vy = cur ? +cur[1] : now.getFullYear();
    let vm = cur ? +cur[2] : now.getMonth() + 1;

    const place = () => {
      const r = disp.getBoundingClientRect();
      const h = panel.offsetHeight || 300;
      panel.style.left = Math.max(6, Math.min(r.left, window.innerWidth - panel.offsetWidth - 8)) + 'px';
      panel.style.top = (r.bottom + 4 + h > window.innerHeight ? Math.max(6, r.top - 4 - h) : r.bottom + 4) + 'px';
    };

    const render = () => {
      if (mode === 'month') {
        const sel = /^(\d{4})-(\d{2})$/.exec(inp.value || '');
        panel.innerHTML = `
          <div class="tcal-head">
            <button type="button" class="tcal-nav" data-tc="py">‹</button>
            <div class="tcal-title">พ.ศ. ${vy + 543}</div>
            <button type="button" class="tcal-nav" data-tc="ny">›</button>
          </div>
          <div class="tcal-mgrid">${this.M_ABBR.map((m, i) =>
            `<button type="button" class="tcal-m ${sel && +sel[1] === vy && +sel[2] === i + 1 ? 'sel' : ''}" data-m="${i + 1}">${m}</button>`).join('')}</div>
          <div class="tcal-foot"><button type="button" class="tcal-link" data-tc="now">เดือนนี้</button><button type="button" class="tcal-link" data-tc="clear">ล้างค่า</button></div>`;
        panel.querySelector('[data-tc="py"]').onclick = () => { vy--; render(); };
        panel.querySelector('[data-tc="ny"]').onclick = () => { vy++; render(); };
        panel.querySelectorAll('[data-m]').forEach(b => b.onclick = () => this._set(inp, `${vy}-${this._pad(+b.dataset.m)}`));
        panel.querySelector('[data-tc="now"]').onclick = () => this._set(inp, `${now.getFullYear()}-${this._pad(now.getMonth() + 1)}`);
        panel.querySelector('[data-tc="clear"]').onclick = () => this._set(inp, '');
      } else {
        const selV = inp.value || '';
        const todayV = `${now.getFullYear()}-${this._pad(now.getMonth() + 1)}-${this._pad(now.getDate())}`;
        const first = new Date(vy, vm - 1, 1).getDay();          // 0=อาทิตย์
        const days = new Date(vy, vm, 0).getDate();
        let cells = '';
        for (let i = 0; i < first; i++) cells += '<button type="button" class="tcal-d out" tabindex="-1"></button>';
        for (let d = 1; d <= days; d++) {
          const v = `${vy}-${this._pad(vm)}-${this._pad(d)}`;
          cells += `<button type="button" class="tcal-d ${v === selV ? 'sel' : ''} ${v === todayV ? 'today' : ''}" data-d="${v}">${d}</button>`;
        }
        panel.innerHTML = `
          <div class="tcal-head">
            <button type="button" class="tcal-nav" data-tc="pm">‹</button>
            <div class="tcal-title">${this.M_ABBR[vm - 1]} ${vy + 543}</div>
            <button type="button" class="tcal-nav" data-tc="nm">›</button>
          </div>
          <div class="tcal-head" style="margin-top:-4px">
            <button type="button" class="tcal-nav" data-tc="py" title="ปีก่อนหน้า">«</button>
            <div class="tcal-title" style="font-weight:400;color:var(--mute);font-size:11px">เปลี่ยนปี พ.ศ.</div>
            <button type="button" class="tcal-nav" data-tc="ny" title="ปีถัดไป">»</button>
          </div>
          <div class="tcal-dow">${this.DOW.map(d => `<span>${d}</span>`).join('')}</div>
          <div class="tcal-dgrid">${cells}</div>
          <div class="tcal-foot"><button type="button" class="tcal-link" data-tc="now">วันนี้</button><button type="button" class="tcal-link" data-tc="clear">ล้างค่า</button></div>`;
        panel.querySelector('[data-tc="pm"]').onclick = () => { vm--; if (vm < 1) { vm = 12; vy--; } render(); };
        panel.querySelector('[data-tc="nm"]').onclick = () => { vm++; if (vm > 12) { vm = 1; vy++; } render(); };
        panel.querySelector('[data-tc="py"]').onclick = () => { vy--; render(); };
        panel.querySelector('[data-tc="ny"]').onclick = () => { vy++; render(); };
        panel.querySelectorAll('[data-d]').forEach(b => b.onclick = () => this._set(inp, b.dataset.d));
        panel.querySelector('[data-tc="now"]').onclick = () => this._set(inp, todayV);
        panel.querySelector('[data-tc="clear"]').onclick = () => this._set(inp, '');
      }
      place();
    };
    render();
  },
};

// รองรับทั้งโหลดปกติ และกรณีถูก mount หลัง DOM พร้อมแล้ว (Next.js)
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => { ThaiCal.init(); App.init(); VersionWatch.start(); });
else { ThaiCal.init(); App.init(); VersionWatch.start(); }


</script>
