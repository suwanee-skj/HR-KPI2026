  `;

  document.getElementById('impCancel').addEventListener('click', () => {
    area.innerHTML = '';
    document.getElementById('impFile').value = '';
    document.getElementById('impParseBtn').disabled = true;
  });

  document.getElementById('impConfirm')?.addEventListener('click', () => {
    const doImport = async () => {
      showBusy('กำลังตรวจสอบข้อมูลเดิมในฐานข้อมูล...');
      try {
        // โหลดใบเดิม "ในรอบนี้" (ทุกฟอร์ม) มาแทนที่ — 1 คนมีใบประเมินได้ 1 ใบต่อรอบ
        await DB.loadEvaluations({ period }, { select: 'record_id,employee_id', pageSize: 20000, count: false });
        const dupById = {}; DB.getEvaluations().forEach(e => { dupById[e.employeeId] = e.id; });
        const recs = [];
        parsed.filter(p => !p.errors.length).forEach(p => {
          const ev = buildEvaluation(form, p.employee.id, evaluatorId, period, p.valueMap, p.penaltyMap, p.coachingChecks, '', p.overallComment);
          if (dupById[p.employee.id]) ev.id = dupById[p.employee.id]; // แทนที่ของเดิม
          recs.push(ev);
        });
        updateBusy(`กำลังบันทึกผลประเมินขึ้นฐานข้อมูล... (0/${recs.length})`);
        await DB.bulkUpsertEvaluations(recs, (d, t) => updateBusy(`กำลังบันทึกผลประเมินขึ้นฐานข้อมูล... (${d}/${t})`));
        hideBusy();
        toast(`นำเข้า ${recs.length} รายการสำเร็จ`, 'success', { title: 'Import เสร็จ', duration: 4000 });
        App.go('hr-list');
      } catch (err) {
        hideBusy(); console.error(err);
        toast('นำเข้าไม่สำเร็จ — ข้อมูลยังไม่ถูกบันทึกลงระบบจริง โปรดลองใหม่', 'error', { title: 'นำเข้าไม่สำเร็จ' });
      }
    };

    if (duplicates.length) {
      confirmDialog({
        title: 'พบรายการซ้ำ',
        message: `มี ${duplicates.length} รายการที่มีการประเมินเดิมในรอบนี้อยู่แล้ว ระบบจะแทนที่ของเดิม — ยืนยัน?`,
        confirmText: 'แทนที่และนำเข้า',
        type: 'warn',
      }).then(ok => { if (ok) doImport(); });
    } else {
      doImport();
    }
  });
};

// อ่านไฟล์ Excel (.xlsx/.xls) หรือ CSV → คืน rows (array ของ array) ผ่าน Promise
AdminUI._readSheet = function (file) {
  return new Promise((resolve, reject) => {
    const name = (file.name || '').toLowerCase();
    const reader = new FileReader();
    if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
      if (typeof XLSX === 'undefined') { reject(new Error('XLSX library not loaded')); return; }
      reader.onload = (e) => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          resolve(XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }));
        } catch (err) { reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = (e) => { try { resolve(AdminUI._parseCSV(e.target.result)); } catch (err) { reject(err); } };
      reader.onerror = reject;
      reader.readAsText(file, 'utf-8');
    }
  });
};

// นำเข้ารายชื่อ → สร้าง/อัปเดต user (role employee) + ผูกหัวหน้า แล้ว re-render + ติ๊กเลือก
AdminUI._importEmployees = async function (rows, container) {
  if (!rows || !rows.length) { toast('ไฟล์ว่าง', 'error'); return; }
  // ข้ามแถว header ถ้าพบ
  let start = 0;
  const first = (rows[0] || []).map(c => String(c || '').trim());
  if (first.some(c => /รหัส|ชื่อ|code|name|พนักงาน/i.test(c))) start = 1;

  let created = 0, updated = 0, noSup = 0, skipped = 0;
  const importedCodes = [];
  const toUpsert = [];
  for (let i = start; i < rows.length; i++) {
    const r = rows[i]; if (!r) continue;
    const code = String(r[0] || '').trim();
    const name = String(r[1] || '').trim();
    if (!code || !name) { if (r[0] || r[1]) skipped++; continue; }
    const position = String(r[2] || '').trim();
    const dept = String(r[3] || '').trim();
    const supCode = String(r[4] || '').trim();
    let hireDate = String(r[5] || '').trim();
    if (hireDate) { const d = new Date(hireDate); if (!isNaN(d)) hireDate = d.toISOString().slice(0, 10); }

    let supId = null;
    if (supCode) { const sup = DB.getUserByCode(supCode); if (sup) supId = sup.id; else noSup++; }

    const existing = DB.getUserByCode(code);
    const user = existing ? { ...existing } : {
      id: DB.uid('u'), role: 'employee',
    };
    user.role = 'employee';
    user.employeeCode = code;
    user.fullName = name;
    if (position) user.position = position;
    if (dept) user.department = dept;
    if (hireDate) user.hireDate = hireDate;
    if (supId && supId !== user.id) user.supervisorId = supId;   // กันตั้งตัวเองเป็นผู้ประเมินของตัวเอง
    else if (!existing) user.supervisorId = user.supervisorId || null;
    toUpsert.push(user); existing ? updated++ : created++; importedCodes.push(code);
  }
  showBusy(`กำลังบันทึกขึ้นฐานข้อมูล... (0/${toUpsert.length} คน)`);
  try {
    await DB.bulkUpsertUsers(toUpsert, (d, t) => updateBusy(`กำลังบันทึกขึ้นฐานข้อมูล... (${d}/${t} คน)`));
  } catch (err) {
    hideBusy(); console.error(err);
    toast('บันทึกขึ้นฐานข้อมูลไม่สำเร็จ — ข้อมูลยังไม่ถูกบันทึกลงระบบจริง โปรดลองใหม่', 'error', { title: 'บันทึกไม่สำเร็จ' });
    return;
  }
  hideBusy();

  let msg = `นำเข้า ${created} คนใหม่ • อัปเดต ${updated} คน`;
  if (noSup) msg += ` • ไม่พบรหัสหัวหน้า ${noSup} แถว`;
  if (skipped) msg += ` • ข้าม ${skipped} แถว`;
  toast(msg, (created + updated) ? 'success' : 'error', { title: 'นำเข้ารายชื่อสำเร็จ', duration: 4500 });

  AdminUI.renderAssign(container, importedCodes);   // re-render + ติ๊กรายชื่อที่เพิ่งนำเข้า
};

// ===================================================================
// Template/Import "รวม" — รายชื่อ + KPI + วินัย ในไฟล์เดียว
// ===================================================================
AdminUI._kpiSectionOf = function (form) {
  return form && (form.sections || []).find(s => s.items.length && s.items.every(it => it.type === 'kpi'));
};
AdminUI._discRulesOf = function (form) {
  return (form && form.penaltySection && form.penaltySection.enabled) ? (form.penaltySection.rules || []) : [];
};

// ดาวน์โหลด Template รวม (คอลัมน์ KPI/วินัย ตามฟอร์มที่เลือก)
//   ชีต 1 "นำเข้าข้อมูล"        — หัวคอลัมน์ภาษาไทย + รายชื่อพนักงานปัจจุบันของแผนกที่ใช้ฟอร์ม (ระบบอ่านชีตนี้ตอนนำเข้า)
//   ชีต 2 "คำอธิบายและตัวอย่าง" — ข้อควรรู้ · ตารางอธิบายทุกคอลัมน์ · ตารางตัวอย่างการกรอกที่เติมค่าไว้ให้ดู
AdminUI._downloadCombinedTemplate = function (formId) {
  const form = DB.getFormById(formId);
  if (!form) { toast('ไม่พบฟอร์ม', 'error'); return; }
  const kpiSec = AdminUI._kpiSectionOf(form);
  const kpiItems = kpiSec ? kpiSec.items : [];
  const rules = AdminUI._discRulesOf(form);
  // กลุ่ม KPI (ถ้าฟอร์มเปิดใช้) — เพิ่มคอลัมน์ "กลุ่ม KPI" หลังวันที่เริ่มงาน
  const kpiGroups = (kpiSec && kpiSec.kpiGrouped) ? (kpiSec.kpiGroups || []) : [];
  const hasGroups = kpiGroups.length > 0;
  const groupLabel = (k) => { const g = kpiGroups.find(g => g.key === k); return g ? g.label : (k || ''); };
  const groupHint = hasGroups ? `กลุ่ม KPI (${kpiGroups.map(g => g.label).join(' / ')})` : '';

  // ---------- หัวคอลัมน์ (ภาษาไทยทั้งหมด — ตัวอ่านไฟล์อิงตำแหน่งคอลัมน์ ไม่อิงข้อความหัว) ----------
  // ไม่มีคอลัมน์ "รหัสหัวหน้างาน" — ผู้ประเมินดึงจากลำดับผู้ประเมินที่ HR ตั้งในหน้าจัดการพนักงาน
  const BASE = ['รหัสพนักงาน', 'ชื่อ-นามสกุล', 'ตำแหน่ง', 'แผนก/สาขา', 'วันที่เริ่มงาน (ปี-เดือน-วัน)'];
  const headers = BASE.slice();
  if (hasGroups) headers.push(groupHint);
  kpiItems.forEach(it => headers.push(`${it.name} – เป้าหมาย`, `${it.name} – ผลจริง`, `${it.name} – หมายเหตุ`));
  rules.forEach(r => headers.push(`${r.name} – จำนวน (${r.unit || 'ครั้ง'})`, `${r.name} – หมายเหตุ`));

  const mkRow = (code, name, pos, dept, hire, group, kpiVals, discVals) => {
    const row = [code, name, pos, dept, hire];
    if (hasGroups) row.push(group || '');
    kpiItems.forEach((it, k) => { const v = kpiVals[k] || ['', '', '']; row.push(v[0], v[1], v[2]); });
    rules.forEach((rule, j) => { const v = discVals[j] || [0, '']; row.push(v[0], v[1]); });
    return row;
  };
  // จำกัดพนักงานตาม "แผนกที่ใช้ฟอร์มนี้" (form.departments — อิงชื่อแผนกโดยตรง) — ไม่กำหนด = ทุกคน
  const allowedDepts = (form.departments && form.departments.length) ? new Set(form.departments) : null;
  // ดึงรายชื่อพนักงานปัจจุบัน (สถานะทำงาน) ในแผนกของฟอร์มมาใส่ในไฟล์ให้เลย — HR แค่กรอกค่า KPI/วินัยของแต่ละคน
  const emps = DB.getUsers()
    .filter(u => (u.status || 'active') !== 'resigned')
    .filter(u => !allowedDepts || allowedDepts.has((u.department || '').trim()))
    .slice().sort((a, b) => String(a.employeeCode || '').localeCompare(String(b.employeeCode || ''), 'th'));
  const empRows = emps.map(u => mkRow(
    u.employeeCode || '', u.fullName || '', u.position || '', u.department || '', u.hireDate || '',
    groupLabel(u.kpiGroup),                                       // เติมกลุ่มเดิมของพนักงาน (ถ้ามี) ให้ HR ปรับได้
    kpiItems.map(() => ['', '', '']),                             // เว้นว่างทุกช่อง KPI (เป้า/จริง/หมายเหตุ) ให้ HR กรอกเอง
    rules.map(() => [0, '']),                                     // วินัยเริ่มที่ 0
  ));

  // ---------- ตัวอย่างการกรอก (เติมค่าจริงให้ดู 2 คน) ----------
  const fmtNum = (n) => (Math.round(n * 100) / 100).toString();
  const sampleKpi = (it, factor, note) => {
    const cfg = it.config || {};
    const target = Number(cfg.target) || 100;
    const lower = cfg.direction === 'lower';
    const actual = lower ? target * (2 - factor) : target * factor;   // ยิ่งต่ำยิ่งดี → ผลจริงต่ำกว่าเป้า = ดี
    return [fmtNum(target), fmtNum(actual), note];
  };
  const sampleDisc = (rule, cnt, note) => [cnt, note];
  const exampleRows = [
    mkRow('EMP-101', 'สมหญิง ขยันดี', 'พนักงานเร่งรัดหนี้', 'เร่งรัดหนี้สิน A', '2024-02-15',
      hasGroups ? kpiGroups[0].label : '',
      kpiItems.map((it, k) => sampleKpi(it, k === 0 ? 1.05 : 0.95, k === 0 ? 'ทำได้เกินเป้า' : '')),
      rules.map(() => sampleDisc(null, 0, ''))),
    mkRow('EMP-102', 'สมชาย ตั้งใจ', 'พนักงานเร่งรัดหนี้', 'เร่งรัดหนี้สิน B', '2023-05-01',
      hasGroups ? kpiGroups[kpiGroups.length - 1].label : '',
      kpiItems.map((it, k) => sampleKpi(it, k === 0 ? 0.82 : 1, k === 0 ? 'ลูกหนี้กลุ่มใหญ่เลื่อนชำระ' : '')),
      rules.map((r, j) => (j === 0 ? sampleDisc(r, 1, `${r.name} 1 ${r.unit || 'ครั้ง'} มีเอกสารประกอบ`) : sampleDisc(r, 0, '')))),
  ];
  const mainAoa = [headers, ...(empRows.length ? empRows : exampleRows)];

  // ---------- ชีตคำอธิบาย ----------
  const unitOf = (it) => (it.config && it.config.unit) || '';
  const kpiDesc = (it) => {
    const cfg = it.config || {}; const parts = [];
    if (it.description) parts.push(it.description);
    parts.push(`คะแนนเต็ม ${it.maxScore || 0}`);
    if (cfg.direction === 'lower') parts.push('ยิ่งต่ำยิ่งดี (ผลจริงต่ำกว่าเป้า = บรรลุ)'); else parts.push('ยิ่งสูงยิ่งดี (ผลจริงถึงเป้า = บรรลุ 100%)');
    if (cfg.capPct && Number(cfg.capPct) !== 100) parts.push(`นับ %บรรลุสูงสุด ${cfg.capPct}%`);
    if (cfg.minPct) parts.push(`ต่ำกว่า ${cfg.minPct}% ได้ 0 คะแนน`);
    if (it.optional) parts.push('รายการเสริม — เว้นว่างได้ ไม่นับในคะแนนเต็ม');
    return parts.join(' · ');
  };
  const discDesc = (r) => {
    const parts = [];
    if (r.note) parts.push(r.note);
    parts.push(`หัก ${r.perOccurrence || 0} คะแนน ต่อ 1 ${r.unit || 'ครั้ง'}`);
    if (r.freeCount) parts.push(`ไม่หัก ${r.freeCount} ${r.unit || 'ครั้ง'}แรกของเดือน`);
    return parts.join(' · ');
  };
  const descRows = [
    ['รหัสพนักงาน', 'รหัสประจำตัวพนักงาน ใช้เป็นชื่อผู้ใช้เข้าระบบ และเป็นตัวจับคู่ข้อมูล: มีอยู่แล้ว = อัปเดต / ยังไม่มี = สร้างพนักงานใหม่', 'EMP-101', 'จำเป็น'],
    ['ชื่อ-นามสกุล', 'ชื่อและนามสกุลภาษาไทย ไม่ต้องใส่คำนำหน้า', 'สมหญิง ขยันดี', 'จำเป็น'],
    ['ตำแหน่ง', 'ตำแหน่งงานปัจจุบัน', 'พนักงานเร่งรัดหนี้', 'ไม่จำเป็น'],
    ['แผนก/สาขา', 'ชื่อแผนกหรือสาขา สะกดให้ตรงกับที่ตั้งไว้ในหน้าจัดการพนักงาน (ใช้จับคู่กับฟอร์มประเมินของแผนก)', 'เร่งรัดหนี้สิน A', 'ไม่จำเป็น'],
    ['วันที่เริ่มงาน (ปี-เดือน-วัน)', 'วันเริ่มงาน รูปแบบ ปี ค.ศ.-เดือน-วัน (ใส่แบบข้อความ หรือให้ Excel จัดเป็นวันที่ก็ได้)', '2024-02-15', 'ไม่จำเป็น'],
  ];
  if (hasGroups) descRows.push([groupHint, `กลุ่มน้ำหนัก KPI ของพนักงาน พิมพ์ชื่อกลุ่มให้ตรงตัวเลือก: ${kpiGroups.map(g => g.label).join(' / ')}`, kpiGroups[0].label, 'จำเป็น (ฟอร์มนี้แบ่งกลุ่ม KPI)']);
  kpiItems.forEach((it, k) => {
    const s = sampleKpi(it, 0.95, '');
    const u = unitOf(it) ? ` หน่วย: ${unitOf(it)}` : '';
    descRows.push([`${it.name} – เป้าหมาย`, `เป้าหมายของเดือนนี้${u} · ${kpiDesc(it)} · เว้นว่าง = ใช้ค่าเริ่มต้นของฟอร์ม (${s[0]})`, s[0], it.optional ? 'ไม่จำเป็น' : 'ควรกรอก']);
    descRows.push([`${it.name} – ผลจริง`, `ผลงานที่ทำได้จริงในเดือนนี้${u} · ใส่ตัวเลขล้วน ไม่ต้องใส่เครื่องหมาย % (คั่นหลักพันด้วยลูกน้ำได้) · เว้นว่าง = ยังไม่กรอก หัวหน้ากรอกต่อในใบประเมินได้`, s[1], it.optional ? 'ไม่จำเป็น' : 'ควรกรอก']);
    descRows.push([`${it.name} – หมายเหตุ`, 'คำอธิบายประกอบผลงาน (ถ้ามี) จะแสดงในใบประเมินช่องหมายเหตุของ KPI นี้', 'ทำได้เกินเป้า', 'ไม่จำเป็น']);
  });
  rules.forEach(r => {
    descRows.push([`${r.name} – จำนวน (${r.unit || 'ครั้ง'})`, `จำนวน${r.name}ของเดือนนี้ (${r.unit || 'ครั้ง'}) · ${discDesc(r)} · เว้นว่างหรือ 0 = ไม่มี`, '0', 'ไม่จำเป็น']);
    descRows.push([`${r.name} – หมายเหตุ`, `รายละเอียดประกอบ เช่น วันที่ / เอกสารอ้างอิง`, `${r.name} 1 ${r.unit || 'ครั้ง'} มีเอกสารประกอบ`, 'ไม่จำเป็น']);
  });

  const notes = [
    ['1', 'กรอกข้อมูลในชีต "นำเข้าข้อมูล" เท่านั้น — ระบบอ่านชีตแรกของไฟล์ · ห้ามลบ สลับ หรือเปลี่ยนชื่อคอลัมน์ (ระบบอ่านตามตำแหน่งคอลัมน์)'],
    ['2', '1 แถว = พนักงาน 1 คน · ระบบใช้ "รหัสพนักงาน" เป็นตัวจับคู่ — มีอยู่แล้วจะอัปเดตข้อมูล ยังไม่มีจะสร้างพนักงานใหม่ให้'],
    ['3', 'ไม่ต้องกรอกผู้ประเมิน — ระบบดึงจากลำดับผู้ประเมิน (สูงสุด 3 คน) ที่ HR ตั้งไว้ในหน้า จัดการพนักงาน'],
    ['4', 'ช่องที่เว้นว่างถือว่ายังไม่กรอก หัวหน้างานกรอกต่อในใบประเมินได้ · ช่อง "เป้าหมาย" ที่ว่างจะใช้ค่าเริ่มต้นของฟอร์ม'],
    ['5', 'ตัวเลขใส่ได้ทั้งจำนวนเต็มและทศนิยม (95 หรือ 95.5) ไม่ต้องใส่เครื่องหมาย % · วันที่ใช้รูปแบบ ปี-เดือน-วัน เช่น 2024-02-15'],
    ['6', 'หลังอัปโหลด ระบบจะแสดงรายการ "รอยืนยัน" ให้ตรวจสอบก่อน กด "ยืนยันการนำเข้า" จึงจะสร้างใบประเมินและมอบหมายให้ผู้ประเมินลำดับที่ 1'],
    ['7', 'ตารางตัวอย่างในชีตนี้มีไว้ดูวิธีกรอกเท่านั้น — อย่าคัดลอกแถวตัวอย่างไปนำเข้า'],
  ];
  const guideAoa = [
    [`คำอธิบายการกรอกไฟล์นำเข้าข้อมูลรวม — ฟอร์ม: ${form.name}`],
    [],
    ['ข้อควรรู้ก่อนกรอก'],
    ...notes,
    [],
    ['ตารางที่ 1 — คำอธิบายแต่ละคอลัมน์ในชีต "นำเข้าข้อมูล"'],
    ['ลำดับ', 'ชื่อคอลัมน์', 'คำอธิบาย', 'ตัวอย่างค่า', 'จำเป็นต้องกรอก'],
    ...descRows.map((r, i) => [String(i + 1), ...r]),
    [],
    ['ตารางที่ 2 — ตัวอย่างการกรอก (คอลัมน์เรียงเหมือนชีต "นำเข้าข้อมูล")'],
    headers,
    ...exampleRows,
  ];

  const fname = 'template_นำเข้าข้อมูลรวม';
  if (typeof XLSX !== 'undefined') {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(mainAoa);
    ws['!cols'] = headers.map((h, i) => ({ wch: i === 1 ? 24 : (i < 5 ? 18 : Math.max(18, Math.min(40, h.length + 4))) }));
    ws['!freeze'] = { xSplit: 2, ySplit: 1 };
    XLSX.utils.book_append_sheet(wb, ws, 'นำเข้าข้อมูล');   // ต้องเป็นชีตแรก — ระบบอ่านชีตแรกตอนนำเข้า
    const wg = XLSX.utils.aoa_to_sheet(guideAoa);
    wg['!cols'] = [{ wch: 8 }, { wch: 38 }, { wch: 90 }, { wch: 26 }, { wch: 26 }, ...headers.slice(5).map(() => ({ wch: 22 }))];
    XLSX.utils.book_append_sheet(wb, wg, 'คำอธิบายและตัวอย่าง');
    XLSX.writeFile(wb, fname + '.xlsx');
  } else {
    const csv = mainAoa.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = fname + '.csv'; a.click();
  }
  toast('ดาวน์โหลด Template รวม แล้ว — ชีตแรกกรอกข้อมูล · ชีต "คำอธิบายและตัวอย่าง" มีวิธีกรอกและตัวอย่าง', 'success', { duration: 5000 });
};

// อ่านไฟล์รวม → แปลงเป็นรายการ "รอยืนยัน" (ยังไม่บันทึก) แล้วแสดงให้ตรวจสอบก่อน
AdminUI._stageImport = async function (rows, formId, period, container) {
  if (!rows || !rows.length) { toast('ไฟล์ว่าง', 'error'); return; }
  const form = DB.getFormById(formId);
  if (!form) { toast('ไม่พบฟอร์ม', 'error'); return; }
  if (!period) { toast('กรุณาเลือกรอบประเมินก่อนอัปโหลด', 'error'); return; }
  const kpiSec = AdminUI._kpiSectionOf(form);
  const kpiItems = kpiSec ? kpiSec.items : [];
  const rules = AdminUI._discRulesOf(form);
  // กลุ่ม KPI (ถ้าฟอร์มเปิดใช้) — มีคอลัมน์ "กลุ่ม KPI" แทรกหลังวันที่เริ่มงาน
  const kpiGroups = (kpiSec && kpiSec.kpiGrouped) ? (kpiSec.kpiGroups || []) : [];
  const hasGroups = kpiGroups.length > 0;
  const normG = (s) => String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
  const resolveGroup = (raw) => {
    const v = normG(raw); if (!v) return null;
    const g = kpiGroups.find(g => normG(g.label) === v || normG(g.key) === v);
    return g ? g.key : null;
  };
  const kpiStart = hasGroups ? 6 : 5;   // คอลัมน์ KPI เริ่มหลังคอลัมน์แรก (+1 ถ้ามีคอลัมน์กลุ่ม KPI)
  const KPI_COLS = 3;   // เป้า / จริง / หมายเหตุ
  const discStart = kpiStart + kpiItems.length * KPI_COLS;
  // แปลงตัวเลขแบบทน comma/ช่องว่าง (Excel ส่งค่ามาแบบ "290,000.00" ซึ่ง +x = NaN)
  const num = (v) => { if (v === '' || v == null) return null; const n = Number(String(v).replace(/,/g, '').trim()); return isNaN(n) ? null : n; };

  let start = 0;
  const first = (rows[0] || []).map(c => String(c || '').trim());
  if (first.some(c => /รหัส|ชื่อ|code|name|พนักงาน/i.test(c))) start = 1;

  const items = [];
  let skipped = 0;
  for (let i = start; i < rows.length; i++) {
    const r = rows[i]; if (!r) continue;
    const code = String(r[0] || '').trim();
    const name = String(r[1] || '').trim();
    if (!code || !name) { if (r[0] || r[1]) skipped++; continue; }
    const position = String(r[2] || '').trim();
    const dept = String(r[3] || '').trim();
    let hireDate = String(r[4] || '').trim();
    if (hireDate) { const d = new Date(hireDate); if (!isNaN(d)) hireDate = d.toISOString().slice(0, 10); }
    // กลุ่ม KPI (คอลัมน์ที่ 6 เมื่อฟอร์มเปิดใช้กลุ่ม) → resolve เป็น key ของกลุ่ม
    const kpiGroupRaw = hasGroups ? String(r[5] || '').trim() : '';
    const kpiGroup = hasGroups ? resolveGroup(kpiGroupRaw) : null;

    // ผู้ประเมินดึงจากการจัดการพนักงาน (supervisorId ของผู้ใช้) — ไม่รับจากไฟล์
    // guard: ถ้าข้อมูลเก่าผูกหัวหน้าเป็น "ตัวเอง" → ถือว่ายังไม่กำหนดผู้ประเมิน (กันใบประเมินตัวเอง)
    const existing = DB.getUserByCode(code);
    const evalId = existing ? (evaluatorChainOf(existing)[0] || null) : null;
    const evalUser = evalId ? DB.getUserById(evalId) : null;

    const kpiPreset = {};
    kpiItems.forEach((it, k) => {
      const base = kpiStart + k * KPI_COLS;
      const tgt = num(r[base]), act = num(r[base + 1]), note = r[base + 2];
      kpiPreset[it.id] = {
        target: tgt != null ? tgt : (it.config?.target || 100),
        actual: act,   // null ถ้าว่าง/แปลงไม่ได้
        note: (note == null) ? '' : String(note).trim(),
      };
    });
    const discPreset = {};
    rules.forEach((rule, j) => {
      const cnt = num(r[discStart + j * 2]), note = r[discStart + j * 2 + 1];
      discPreset[rule.id] = { count: cnt != null ? cnt : 0, note: (note == null) ? '' : String(note).trim() };
    });

    items.push({
      code, name, dept, position, hireDate, kpiPreset, discPreset,
      existing: !!existing, empId: existing ? existing.id : null,
      status: existing ? (existing.status || 'active') : null,   // สถานะการเป็นพนักงาน (ทำงาน/ลาออก) — ไม่บล็อก แค่โชว์
      evalId, evalName: evalUser ? evalUser.fullName : '',
      kpiGroup, kpiGroupRaw,   // กลุ่ม KPI (key) + ค่าดิบจากไฟล์ (ไว้เตือนถ้า match ไม่ได้)
    });
  }

  if (!items.length) { toast('ไม่พบรายการที่นำเข้าได้ในไฟล์', 'error'); return; }
  // ดึงพนักงานที่มีใบประเมินในรอบนี้อยู่แล้ว (ทุกฟอร์ม) จาก DB เพื่อ flag รายการซ้ำ (1 คน 1 ใบต่อรอบ)
  const existingEmpIds = new Set();
  showBusy('กำลังตรวจสอบใบประเมินที่มีอยู่ในรอบนี้...');
  try {
    const ex = await SupaDB.query('evaluations', { filters: { period }, select: 'record_id,employee_id', pageSize: 20000, count: false });
    ex.rows.forEach(r => existingEmpIds.add(r.employeeId));
  } catch (err) { hideBusy(); console.error(err); toast('เชื่อมต่อฐานข้อมูลไม่ได้ — โปรดลองใหม่', 'error', { title: 'อ่านไฟล์ไม่สำเร็จ' }); return; }
  hideBusy();
  AdminUI._stage = { items, formId, period, skipped, hasKpi: kpiItems.length > 0, hasDisc: rules.length > 0, existingEmpIds, hasGroups, kpiGroups };
  AdminUI._renderStage(container);
  toast(`อ่านไฟล์สำเร็จ ${items.length} รายการ — ตรวจสอบแล้วกด "ยืนยันการนำเข้า"`, 'success', { duration: 4000 });
};

// แสดงตารางรายการรอยืนยัน (ลบทั้งหมด/บางรายการได้) ก่อนบันทึกเข้าระบบจริง
AdminUI._renderStage = function (container) {
  const stage = AdminUI._stage;
  const wrap = document.getElementById('asStage');
  if (!wrap) return;
  if (!stage || !stage.items.length) { AdminUI._stage = null; wrap.innerHTML = ''; return; }
  // ตรวจสอบสถานะล่าสุดกับ DB + flag "มีใบประเมินในรอบนี้แล้ว" (กันซ้ำ: 1 คน 1 ใบต่อรอบ ทุกฟอร์ม)
  const dupSet = stage.existingEmpIds || new Set();
  stage.items.forEach(it => {
    const u = DB.getUserByCode(it.code);
    it.existing = !!u;
    it.empId = u ? u.id : null;
    it.status = u ? (u.status || 'active') : null;
    it.evalIds = u ? evaluatorChainOf(u) : [];        // ลำดับผู้ประเมินทั้งหมด (สูงสุด 3) — snapshot ลงใบตอนยืนยันนำเข้า
    it.evalId = it.evalIds[0] || null;                 // ลำดับ 1 (guard ตัวเองอยู่ใน evaluatorChainOf แล้ว)
    it.evalName = it.evalIds.length ? it.evalIds.map(id => (DB.getUserById(id) || {}).fullName || '').join(' → ') : '';
    it.dupInPeriod = !!(it.empId && dupSet.has(it.empId));
  });
  const items = stage.items;
  const catOf = (it) => !it.existing ? 'noexist' : (it.dupInPeriod ? 'dup' : (!it.evalId ? 'noeval' : 'ready'));
  const catBadge = {
    ready:   '<span class="badge" style="background:#dcfce7;color:#15803d"><i class="fa-solid fa-circle-check mr-1"></i>พร้อมนำเข้า</span>',
    dup:     '<span class="badge" style="background:#dbeafe;color:#1e40af"><i class="fa-solid fa-clipboard-check mr-1"></i>มีใบประเมินในรอบนี้แล้ว</span>',
    noexist: '<span class="badge" style="background:#fee2e2;color:#b91c1c"><i class="fa-solid fa-user-xmark mr-1"></i>ไม่มีข้อมูลพนักงานในระบบ</span>',
    noeval:  '<span class="badge" style="background:#e0e7ff;color:#4338ca"><i class="fa-solid fa-user-clock mr-1"></i>จะนำเข้า • รอกำหนดผู้ประเมิน</span>',
  };
  // นำเข้าได้ = มีพนักงานในระบบ + ยังไม่มีใบในรอบนี้ (ไม่บังคับว่าต้องมีผู้ประเมินแล้ว — กำหนดทีหลังได้)
  const validCount = items.filter(it => it.existing && !it.dupInPeriod).length;

  wrap.innerHTML = `
    <div class="card mb-4" style="border:2px solid var(--accent)">
      <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
        <div class="card-title" style="margin:0;border:none;padding:0"><i class="fa-solid fa-list-check mr-1" style="color:var(--accent)"></i>ตรวจสอบข้อมูลก่อนนำเข้า — รอยืนยัน (<span id="stgTotal">${items.length}</span> รายการ • พร้อมนำเข้า ${validCount})</div>
        <div class="flex gap-2">
          <button id="stgExport" class="btn btn-green-solid btn-icon"><i class="fa-solid fa-file-excel"></i> Export รายการ</button>
          <button id="stgClear" class="btn btn-ghost btn-icon"><i class="fa-solid fa-eraser"></i> ล้างทั้งหมด</button>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap mb-2">
        <input id="stgSearch" class="input" placeholder="ค้นหา ชื่อ / รหัส / แผนก / ผู้ประเมิน..." style="width:280px;flex:0 0 auto" />
        <select id="stgFilter" class="input" style="width:240px;flex:0 0 auto">
          <option value="">ทุกสถานะ</option>
          <option value="ready">พร้อมนำเข้า</option>
          <option value="dup">มีใบประเมินในรอบนี้แล้ว</option>
          <option value="noexist">ไม่มีข้อมูลพนักงานในระบบ</option>
          <option value="noeval">รอกำหนดผู้ประเมิน (นำเข้าได้)</option>
        </select>
        <button id="stgClearFilter" class="btn btn-secondary btn-icon" title="ล้างค้นหา + ตัวกรองสถานะ"><i class="fa-solid fa-rotate-left"></i> ล้างตัวกรอง</button>
        <span id="stgCount" class="text-mute text-xs"></span>
      </div>
      <div id="stgBulk" class="bulk-bar no-print" style="display:none">
        <div><i class="fa-solid fa-trash mr-1" style="color:var(--err)"></i>เลือก <b id="stgSelCount">0</b> รายการ</div>
        <button id="stgDelSel" class="btn btn-danger btn-icon"><i class="fa-solid fa-trash"></i> ลบที่เลือก</button>
      </div>
      <div class="card !p-0 overflow-x-auto">
        <table class="tbl">
          <thead><tr>
            <th style="width:36px" class="text-center"><input type="checkbox" id="stgAll" title="เลือกทั้งหมดที่แสดง" /></th>
            <th>รหัสพนักงาน</th><th>ชื่อ-นามสกุล</th><th>แผนก</th><th>ผู้ประเมิน</th><th>สถานะ</th><th class="text-right">จัดการ</th>
          </tr></thead>
          <tbody id="stgBody"></tbody>
        </table>
      </div>
      ${stage.skipped ? `<div class="text-mute text-xs mt-2">* ข้ามแถวที่ข้อมูลไม่ครบ ${stage.skipped} แถว</div>` : ''}
      <div class="text-mute text-xs mt-2"><i class="fa-solid fa-circle-info mr-1"></i>นำเข้าได้เฉพาะ <b>พร้อมนำเข้า</b> • <b>มีใบประเมินในรอบนี้แล้ว</b> = ข้าม (พนักงาน 1 คนมีใบประเมินได้ 1 ใบต่อรอบ) • ผู้ประเมินดึงจาก "จัดการพนักงาน" อัตโนมัติ</div>
      <div class="flex justify-end gap-2 mt-3">
        <button id="stgCancel" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> ยกเลิก</button>
        <button id="stgConfirm" class="btn btn-primary" ${validCount ? '' : 'disabled'}><i class="fa-solid fa-circle-check"></i> ยืนยันการนำเข้า (${validCount} รายการ)</button>
      </div>
    </div>`;

  const CAP = 300;
  const getFiltered = () => {
    const q = (document.getElementById('stgSearch').value || '').toLowerCase().trim();
    const f = document.getElementById('stgFilter').value;
    return items.map((it, idx) => ({ it, idx })).filter(({ it }) => {
      if (f && catOf(it) !== f) return false;
      if (q && !`${it.code} ${it.name} ${it.dept || ''} ${it.evalName || ''}`.toLowerCase().includes(q)) return false;
      return true;
    });
  };
  const updSel = () => {
    const n = wrap.querySelectorAll('.stg-cb:checked').length;
    document.getElementById('stgBulk').style.display = n ? 'flex' : 'none';
    document.getElementById('stgSelCount').textContent = n;
  };
  const draw = () => {
    const filtered = getFiltered();
    const shown = filtered.slice(0, CAP);
    const cnt = document.getElementById('stgCount');
    if (cnt) cnt.textContent = `แสดง ${shown.length.toLocaleString()} จาก ${filtered.length.toLocaleString()} รายการ`;
    const body = document.getElementById('stgBody');
    body.innerHTML = shown.map(({ it, idx }) => {
      const cat = catOf(it);
      const evalCell = it.evalId ? escapeHtml(it.evalName) : (!it.existing ? '<span class="text-mute">— เพิ่มพนักงานก่อน —</span>' : '<span style="color:#b45309">⚠ ยังไม่กำหนด</span>');
      return `
        <tr data-stg-row="${idx}" style="cursor:pointer${cat === 'ready' ? '' : ';background:#fff7ed'}">
          <td class="text-center"><input type="checkbox" class="stg-cb" data-idx="${idx}" /></td>
          <td class="mono">${escapeHtml(it.code)}</td>
          <td><b>${escapeHtml(it.name)}</b>${it.existing ? ' ' + empStatusBadge(it.status) : ''}</td>
          <td>${escapeHtml(it.dept || '—')}</td>
          <td class="text-xs">${evalCell}</td>
          <td>${catBadge[cat]}</td>
          <td class="text-right whitespace-nowrap">
            <button class="btn btn-secondary btn-icon" data-stg-view="${idx}" title="ดูรายละเอียด"><i class="fa-solid fa-eye"></i></button>
            <button class="btn btn-secondary btn-icon" data-stg-edit="${idx}" title="${it.existing ? 'แก้ไข / กำหนดผู้ประเมิน' : 'เพิ่มพนักงาน + กำหนดผู้ประเมิน'}"><i class="fa-solid fa-user-pen"></i></button>
            <button class="btn btn-danger btn-icon" data-stg-del="${idx}" title="ลบรายการนี้"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>`;
    }).join('') + (filtered.length > CAP ? `<tr><td colspan="7" class="text-center text-mute" style="padding:1rem"><i class="fa-solid fa-circle-info mr-1"></i>แสดง ${CAP} จาก ${filtered.length.toLocaleString()} — ใช้ค้นหา/ตัวกรองเพื่อจำกัด</td></tr>` : '') || '<tr><td colspan="7" class="text-center text-mute" style="padding:2rem">ไม่พบรายการตามเงื่อนไข</td></tr>';
    body.querySelectorAll('.stg-cb').forEach(cb => cb.addEventListener('change', updSel));
    body.querySelectorAll('[data-stg-del]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); stage.items.splice(+b.dataset.stgDel, 1); AdminUI._renderStage(container); }));
    body.querySelectorAll('[data-stg-view]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); AdminUI._viewStageItem(+b.dataset.stgView); }));
    body.querySelectorAll('[data-stg-edit]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); AdminUI._editStageItem(+b.dataset.stgEdit, container); }));
    body.querySelectorAll('[data-stg-row]').forEach(row => row.addEventListener('click', (e) => { if (e.target.closest('button') || e.target.closest('input')) return; AdminUI._viewStageItem(+row.dataset.stgRow); }));
  };
  document.getElementById('stgSearch').addEventListener('input', draw);
  document.getElementById('stgFilter').addEventListener('change', draw);
  document.getElementById('stgClearFilter').addEventListener('click', () => {
    document.getElementById('stgSearch').value = '';
    document.getElementById('stgFilter').value = '';
    draw();
  });
  document.getElementById('stgAll').addEventListener('change', (e) => {
    document.querySelectorAll('#stgBody .stg-cb').forEach(cb => { cb.checked = e.target.checked; });
    updSel();
  });
  document.getElementById('stgDelSel').addEventListener('click', () => {
    const sel = [...wrap.querySelectorAll('.stg-cb:checked')].map(cb => +cb.dataset.idx).sort((a, b) => b - a);
    sel.forEach(i => stage.items.splice(i, 1));
    AdminUI._renderStage(container);
  });
  document.getElementById('stgClear').addEventListener('click', () => {
    confirmDialog({ title: 'ล้างรายการรอยืนยัน', message: 'ต้องการล้างรายการที่อ่านมาทั้งหมด?', confirmText: 'ล้างทั้งหมด', type: 'delete' }).then(ok => {
      if (!ok) return;
      AdminUI._stage = null; wrap.innerHTML = '';
      toast('ล้างรายการรอยืนยันแล้ว', 'success');
    });
  });
  document.getElementById('stgCancel').addEventListener('click', () => {
    AdminUI._stage = null; wrap.innerHTML = '';
    toast('ยกเลิกการนำเข้าแล้ว', 'success');
  });
  document.getElementById('stgConfirm').addEventListener('click', () => AdminUI._commitImport(container));
  document.getElementById('stgExport').addEventListener('click', () => AdminUI._exportStage(getFiltered().map(x => x.it)));
  draw();
};

// Export รายการรอนำเข้า (ตามที่กรองอยู่) เป็น Excel/CSV
AdminUI._exportStage = function (list) {
  if (!list || !list.length) { toast('ไม่มีรายการให้ส่งออก', 'error'); return; }
  const catLabel = (it) => !it.existing ? 'ไม่มีข้อมูลพนักงานในระบบ' : (it.dupInPeriod ? 'มีใบประเมินในรอบนี้แล้ว' : (!it.evalId ? 'รอกำหนดผู้ประเมิน (นำเข้าได้)' : 'พร้อมนำเข้า'));
  const empLabel = (it) => !it.existing ? '' : ((it.status || 'active') === 'resigned' ? 'ลาออก' : 'ทำงาน');
  const header = ['รหัสพนักงาน', 'ชื่อ-นามสกุล', 'แผนก', 'ตำแหน่ง', 'ผู้ประเมิน', 'สถานะพนักงาน', 'สถานะนำเข้า'];
  const aoa = [header, ...list.map(it => [it.code, it.name, it.dept || '', it.position || '', it.evalName || '', empLabel(it), catLabel(it)])];
  const period = (AdminUI._stage && AdminUI._stage.period) || '';
  if (typeof XLSX !== 'undefined') {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = header.map((h, i) => ({ wch: i === 1 ? 26 : (i === 2 ? 24 : 18) }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'รอนำเข้า');
    XLSX.writeFile(wb, `รายการรอนำเข้า_${period}.xlsx`);
  } else {
    const csv = aoa.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `รายการรอนำเข้า_${period}.csv`; a.click();
  }
  toast(`ส่งออก ${list.length} รายการแล้ว`, 'success');
};

// ดูรายละเอียดทั้งหมดของรายการรอนำเข้า (พนักงาน + KPI + วินัย)
AdminUI._viewStageItem = function (idx) {
  const stage = AdminUI._stage;
  if (!stage || !stage.items[idx]) return;
  const it = stage.items[idx];
  const form = DB.getFormById(stage.formId) || {};
  const kpiItems = (AdminUI._kpiSectionOf(form) || {}).items || [];
  const rules = AdminUI._discRulesOf(form) || [];
  const row = (l, v) => `<tr><td class="lbl" style="white-space:nowrap">${l}</td><td>${v == null || v === '' ? '<span class="text-mute">—</span>' : escapeHtml(String(v))}</td></tr>`;
  const statusBadge = !it.existing
    ? '<span class="badge" style="background:#fee2e2;color:#b91c1c">ไม่มีข้อมูลพนักงานในระบบ</span>'
    : (!it.evalId ? '<span class="badge" style="background:#e0e7ff;color:#4338ca">จะนำเข้า • รอกำหนดผู้ประเมิน</span>' : '<span class="badge" style="background:#dcfce7;color:#15803d">พร้อมนำเข้า</span>');

  const kpiRows = kpiItems.map(k => {
    const p = (it.kpiPreset || {})[k.id] || {};
    const pct = (p.actual != null && p.target) ? Math.round((+p.actual / +p.target) * 100) : null;
    return `<tr>
      <td>${escapeHtml(k.text || k.name || '-')}</td>
      <td class="text-center mono">${p.target != null ? escapeHtml(String(p.target)) : '—'}</td>
      <td class="text-center mono">${p.actual != null ? escapeHtml(String(p.actual)) : '<span class="text-mute">—</span>'}</td>
      <td class="text-center mono">${pct != null ? pct + '%' : '—'}</td>
      <td class="text-xs">${escapeHtml(p.note || '') || '<span class="text-mute">—</span>'}</td>
    </tr>`;
  }).join('');
  const discRows = rules.map(r => {
    const p = (it.discPreset || {})[r.id] || {};
    return `<tr>
      <td>${escapeHtml(r.name || '-')}</td>
      <td class="text-center mono">${p.count != null ? escapeHtml(String(p.count)) : '0'}</td>
      <td class="text-xs">${escapeHtml(p.note || '') || '<span class="text-mute">—</span>'}</td>
    </tr>`;
  }).join('');

  const body = `
    <div class="warn-sec-h">ข้อมูลพนักงาน</div>
    <table class="paper-table info"><tbody>
      ${row('รหัสพนักงาน', it.code)}
      ${row('ชื่อ-นามสกุล', it.name)}
      ${row('ตำแหน่ง', it.position)}
      ${row('แผนก', it.dept)}
      ${row('วันที่เริ่มงาน', it.hireDate)}
      ${row('ผู้ประเมิน (จากการจัดการพนักงาน)', it.evalId ? it.evalName : (it.existing ? '⚠ ยังไม่กำหนดผู้ประเมิน' : '⚠ ไม่มีข้อมูลพนักงานในระบบ'))}
      <tr><td class="lbl">สถานะ</td><td>${statusBadge}</td></tr>
    </tbody></table>
    ${kpiItems.length ? `<div class="warn-sec-h" style="margin-top:14px">การประเมิน KPI Performance</div>
      <div class="overflow-x-auto"><table class="tbl">
        <thead><tr><th>KPI / ตัวชี้วัด</th><th class="text-center">เป้าหมาย</th><th class="text-center">ผลจริง</th><th class="text-center">%บรรลุ</th><th>หมายเหตุ</th></tr></thead>
        <tbody>${kpiRows}</tbody>
      </table></div>` : ''}
    ${rules.length ? `<div class="warn-sec-h" style="margin-top:14px">ข้อมูลวินัย / สถิติการทำงาน</div>
      <div class="overflow-x-auto"><table class="tbl">
        <thead><tr><th>รายการ</th><th class="text-center">จำนวน</th><th>หมายเหตุ</th></tr></thead>
        <tbody>${discRows}</tbody>
      </table></div>` : ''}
    <div class="text-mute text-xs mt-3"><i class="fa-solid fa-circle-info mr-1"></i>รอบประเมิน: <b>${fmtPeriod(stage.period)}</b> • แบบฟอร์ม: <b>${escapeHtml(form.name || '-')}</b></div>
  `;
  showModal({ title: `รายละเอียดรายการนำเข้า — ${escapeHtml(it.name)}`, body, size: '780', stack: true, footer: `<button class="btn btn-primary" onclick="this.closest('.modal-bg').remove()">ปิด</button>` });
};

// ยืนยัน → นำเข้าเฉพาะรายการที่ "พร้อม" (มีข้อมูลพนักงานในระบบ + กำหนดผู้ประเมินแล้ว) • รายการที่ยังไม่พร้อมจะค้างไว้ให้แก้ไข/ลบ
AdminUI._commitImport = async function (container) {
  const stage = AdminUI._stage;
  if (!stage || !stage.items.length) { toast('ไม่มีรายการให้นำเข้า', 'error'); return; }
  const { items, formId, period, hasKpi, hasDisc, hasGroups } = stage;
  const me = Auth.currentUser();

  // นำเข้าได้แม้ยังไม่มีผู้ประเมิน (supervisorId ว่างไว้ก่อน แล้วกำหนดทีหลังในหน้ารายการประเมิน) — ยังกันซ้ำ 1 คน 1 ใบต่อรอบ
  const ready = items.filter(it => it.existing && !it.dupInPeriod);
  const pending = items.filter(it => !(it.existing && !it.dupInPeriod));
  if (!ready.length) {
    toast('ยังไม่มีรายการที่พร้อมนำเข้า — ต้องมีข้อมูลพนักงานในระบบก่อน', 'error', { title: 'นำเข้าไม่ได้' });
    return;
  }

  let updated = 0, assigned = 0, dupAssign = 0, presetCount = 0, noEvalCount = 0;
  // เช็คซ้ำระดับ "รอบ" (ทุกฟอร์ม) — พนักงาน 1 คน มีใบประเมินได้แค่ 1 ใบต่อรอบ (ไม่ว่าฟอร์มไหน)
  showBusy('กำลังตรวจสอบรายการซ้ำกับฐานข้อมูล...');
  const existKeys = new Set();
  try {
    const ex = await SupaDB.query('evaluations', { filters: { period }, select: 'record_id,employee_id', pageSize: 20000, count: false });
    ex.rows.forEach(r => existKeys.add(r.employeeId));
  } catch (err) {
    hideBusy(); console.error('[commitImport] ตรวจซ้ำไม่สำเร็จ', err);
    toast('เชื่อมต่อฐานข้อมูลไม่ได้ — ยกเลิกการนำเข้า (ยังไม่มีข้อมูลถูกบันทึก)', 'error', { title: 'นำเข้าไม่สำเร็จ' });
    return;
  }
  const newRecs = [];
  const userUpdates = [];
  for (const it of ready) {
    const existing = DB.getUserById(it.empId) || DB.getUserByCode(it.code);
    if (!existing) continue;   // ต้องมีพนักงานในระบบเท่านั้น
    const user = { ...existing };
    // อัปเดตข้อมูลพื้นฐานจากไฟล์ (ไม่เปลี่ยนบทบาท/ผู้ประเมินที่ตั้งไว้)
    if (it.name) user.fullName = it.name;
    if (it.position) user.position = it.position;
    if (it.dept) user.department = it.dept;
    if (it.hireDate) user.hireDate = it.hireDate;
    if (hasGroups && it.kpiGroup) user.kpiGroup = it.kpiGroup;   // จำกลุ่ม KPI ล่าสุดของพนักงานไว้ (พรีฟิลไฟล์รอบถัดไป)
    userUpdates.push(user); updated++;

    if (existKeys.has(user.id)) { dupAssign++; continue; }   // มอบหมายรอบนี้อยู่แล้ว
    existKeys.add(user.id);
    const now = new Date().toISOString();
    const rec = {
      id: DB.uid('e'), employeeId: user.id,
      // guard: ห้ามผูกผู้ประเมินเป็นตัวพนักงานเอง (ข้อมูลเก่าบางส่วนเคยชี้ตัวเอง) → ถือว่ายังไม่กำหนด
      evaluatorIds: (it.evalIds && it.evalIds.length) ? it.evalIds.slice() : evaluatorChainOf(user),
      evalStep: 0, evalChain: [],
      supervisorId: null,   // เติมด้านล่าง = ผู้ประเมินลำดับ 1
      evaluatorId: null,
      period, formId, status: 'assigned', assignedBy: me.id, assignedAt: now,
      answers: [], sectionScores: [], penaltyInputs: [], penaltySectionScore: null,
      rawSubtotal: 0, penaltyTotal: 0, totalScore: 0, totalMax: 0, grade: '', resultBox: null,
      coachingChecks: [], coachingDetail: '', attachments: [], signedDocs: [], overallComment: '',
      submittedAt: null, reviewedBy: null, reviewedAt: null, reviewNote: '', history: [], createdAt: now,
    };
    rec.supervisorId = rec.evaluatorIds[0] || null;
    DB.pushHistory(rec, 'assigned', me.id);
    if (hasGroups && it.kpiGroup) rec.kpiGroup = it.kpiGroup;   // ล็อกกลุ่ม KPI ไว้กับใบประเมิน (ใช้เวทคะแนนตามกลุ่ม)
    if (hasKpi) rec.kpiPreset = it.kpiPreset;
    if (hasDisc) rec.disciplinePreset = it.discPreset;
    if ((hasKpi && it.kpiPreset) || (hasDisc && it.discPreset)) presetCount++;
    if (!rec.supervisorId) noEvalCount++;   // ใบที่ยังไม่มีผู้ประเมิน — ต้องไปกำหนดทีหลัง
    newRecs.push(rec);
    assigned++;
  }
  try {
    updateBusy(`กำลังอัปเดตข้อมูลพนักงาน... (0/${userUpdates.length})`);
    await DB.bulkUpsertUsers(userUpdates, (d, t) => updateBusy(`กำลังอัปเดตข้อมูลพนักงาน... (${d}/${t})`));
    updateBusy(`กำลังบันทึกมอบหมายการประเมิน... (0/${newRecs.length})`);
    await DB.bulkUpsertEvaluations(newRecs, (d, t) => updateBusy(`กำลังบันทึกมอบหมายการประเมิน... (${d}/${t})`));
  } catch (err) {
    hideBusy(); console.error('[commitImport] บันทึกมอบหมายไม่สำเร็จ', err);
    toast('บันทึกมอบหมายไม่สำเร็จ — ข้อมูลอาจถูกบันทึกไม่ครบ โปรดลองนำเข้าซ้ำ (ระบบกันซ้ำให้)', 'error', { title: 'บันทึกไม่สำเร็จ' }); return;
  }
  hideBusy();

  // เก็บเฉพาะรายการที่ยังไม่พร้อมไว้ในหน้ารอนำเข้า (ให้ HR แก้ไข/ลบต่อ)
  stage.items = pending;

  let msg = `มอบหมาย ${assigned} รายการ • อัปเดตข้อมูล ${updated} คน`;
  if (noEvalCount) msg += ` • รอกำหนดผู้ประเมิน ${noEvalCount}`;
  if (dupAssign) msg += ` • มอบหมายอยู่แล้ว ${dupAssign}`;
  if (presetCount) msg += ` • โหลด KPI/วินัย ${presetCount}`;
  if (pending.length) msg += ` • ค้างรอแก้ไข ${pending.length} รายการ`;
  toast(msg, 'success', { title: 'นำเข้าสำเร็จ', duration: 6000 });

  if (pending.length) { AdminUI._renderStage(container); }   // ยังมีรายการค้าง → แสดงต่อให้แก้ไข
  else { AdminUI._stage = null; AdminUI.renderAssign(container); }   // นำเข้าครบ → ล้างหน้ารอนำเข้า
};

// แก้ไขข้อมูลรายการรอนำเข้า + กำหนดผู้ประเมิน • ถ้ายังไม่มีพนักงานในระบบ → เพิ่มได้เลย (รหัสผ่าน = รหัสพนักงาน)
AdminUI._editStageItem = function (idx, container) {
  const stage = AdminUI._stage;
  if (!stage || !stage.items[idx]) return;
  const it = stage.items[idx];
  const supervisors = DB.getSupervisors().filter(s => s.id !== it.empId);
  const body = `
    <div class="text-sm mb-3">${it.existing
      ? `แก้ไขข้อมูล <b>${escapeHtml(it.name)}</b> <span class="mono text-mute">(${escapeHtml(it.code)})</span>`
      : `<b style="color:var(--accent)">${escapeHtml(it.code)}</b> ยังไม่มีในระบบ — กรอกข้อมูลให้ครบแล้วกด "บันทึก" เพื่อ <b>เพิ่มพนักงานเข้าระบบ</b> (ชื่อผู้ใช้/รหัสผ่าน = รหัสพนักงาน)`}</div>
    <div class="grid md:grid-cols-2 gap-3">
      <div><label class="label">ชื่อ-นามสกุล <span class="req">*</span></label><input id="si_name" class="input" value="${escapeHtml(it.name || '')}" /></div>
      <div><label class="label">ตำแหน่ง</label><input id="si_pos" class="input" value="${escapeHtml(it.position || '')}" /></div>
      <div><label class="label">แผนก/สาขา</label><input id="si_dept" class="input" value="${escapeHtml(it.dept || '')}" /></div>
      <div><label class="label">วันที่เริ่มงาน</label><input type="date" id="si_hire" class="input" value="${escapeHtml(it.hireDate || '')}" /></div>
      <div class="md:col-span-2"><label class="label">ผู้ประเมิน (หัวหน้างาน)</label>
        ${SS.build('si_eval', '— ไม่กำหนด —', supervisors.filter(s => s.id !== it.empId).map(s => ({ value: s.id, label: `${s.fullName} (${s.department})` })), it.evalId || '')}
      </div>
    </div>
    <div class="text-mute text-xs mt-2"><i class="fa-solid fa-circle-info mr-1"></i>${it.existing ? 'บันทึกจะอัปเดตข้อมูลพนักงานและผู้ประเมินในระบบ' : 'เพิ่มพนักงานใหม่: บทบาท = พนักงาน • ชื่อผู้ใช้/รหัสผ่าน = รหัสพนักงาน • สถานะ = ทำงาน'}</div>`;

    title: it.existing ? 'แก้ไขข้อมูลรายการนำเข้า' : 'เพิ่มพนักงาน + กำหนดผู้ประเมิน', body, size: '560', stack: true,
    footer: `<button class="btn btn-secondary" onclick="this.closest('.modal-bg').remove()">ยกเลิก</button><button id="si_save" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button>`
  });
  setTimeout(() => {
    const sv = document.getElementById('si_save');
    if (!sv) return;
    SS.bind(sv.closest('.modal-bg'));
    sv.addEventListener('click', async () => {
      const name = document.getElementById('si_name').value.trim();
      if (!name) { toast('กรุณากรอกชื่อ-นามสกุล', 'error'); return; }
      const pos = document.getElementById('si_pos').value.trim();
      const dept = document.getElementById('si_dept').value.trim();
      const hire = document.getElementById('si_hire').value;
      const evalId = SS.value('si_eval') || null;
      const wasNew = !it.existing;

      let user = it.existing ? (DB.getUserById(it.empId) || DB.getUserByCode(it.code)) : DB.getUserByCode(it.code);
      if (!user) user = { id: DB.uid('u'), role: 'employee', employeeCode: it.code, status: 'active' };
      user.fullName = name; user.position = pos; user.department = dept; user.hireDate = hire;
      user.supervisorId = (evalId && evalId !== user.id) ? evalId : null;   // กันตั้งตัวเองเป็นผู้ประเมินของตัวเอง
      if (!user.role) user.role = 'employee';
      try { await DB.upsertUser(user); } catch (err) { toast('บันทึกไม่สำเร็จ', 'error'); return; }

      it.existing = true; it.empId = user.id;
      it.name = name; it.position = pos; it.dept = dept; it.hireDate = hire;
      it.evalId = evalId; it.evalName = evalId ? ((DB.getUserById(evalId) || {}).fullName || '') : '';
      const mb = sv.closest('.modal-bg'); if (mb) mb.remove();
      AdminUI._renderStage(container);
      toast(wasNew ? `เพิ่มพนักงาน ${name} เข้าระบบแล้ว (รหัสผ่าน = ${it.code})` : 'บันทึกข้อมูลแล้ว', 'success', { title: wasNew ? 'เพิ่มพนักงานสำเร็จ' : 'บันทึกสำเร็จ' });
    });
  }, 30);
};

        <select id="lsSearchScope" class="input" style="width:170px;flex:0 0 auto" title="เลือกว่าจะค้นหาในข้อมูลของใคร">
          <option value="all">ค้นหา: ทั้งหมด</option>
          <option value="emp">ค้นหา: ผู้ถูกประเมิน</option>
          <option value="sup">ค้นหา: ผู้ประเมิน</option>
        </select>
        <input id="lsSearch" class="input" placeholder="พิมพ์ชื่อ / รหัส..." style="width:220px;flex:0 0 auto" />
        <button id="lsClear" class="btn btn-secondary btn-icon" title="ล้างตัวกรองทั้งหมด"><i class="fa-solid fa-rotate-left"></i> ล้างตัวกรอง</button>
      </div>
      <div id="lsCount" class="text-mute text-xs mt-2"></div>
    </div>
    <div class="card !p-0 overflow-x-auto">
      <table class="tbl">
        <thead><tr><th style="width:36px" class="text-center"><input type="checkbox" id="lsSelAll" title="เลือกทุกรายการที่กรองอยู่ (ทุกหน้า)" /></th><th>รอบ</th><th>พนักงาน</th><th>หัวหน้า</th><th>สถานะ</th><th>คะแนน</th><th>การรับทราบ</th><th class="text-right">การดำเนินการ</th></tr></thead>
        <tbody id="lsBody"></tbody>
      </table>
    </div>
    <div id="lsPager" class="flex items-center justify-center gap-2 mt-3 no-print"></div>
  `;

  const statusLabelMap = { assigned: 'รอประเมิน', evaluated: 'รอส่ง HR', pending_review: 'รอ HR ตรวจ', confirmed: 'ยืนยันแล้ว' };
  const PER_PAGE = 100;
  let page = 0;

  const getList = () => {
    const fs = MS.values('lsStatus'), fp = MS.values('lsPeriod'), fsup = MS.values('lsSup'),
          femp = MS.values('lsEmp'), fg = MS.values('lsGrade'), fack = MS.values('lsAck'),
          fform = MS.values('lsForm'),
          fcoach = MS.values('lsCoach'),
          fdept = MS.values('lsDept'), fpos = MS.values('lsPos'), fbr = MS.values('lsBranch'),
          fActive = MS.values('lsActive');
    const q = document.getElementById('lsSearch').value.trim().toLowerCase();
    const qScope = (document.getElementById('lsSearchScope') || {}).value || 'all';   // all | emp | sup
    const smin = parseFloat(document.getElementById('lsScoreMin').value);
    const smax = parseFloat(document.getElementById('lsScoreMax').value);
    // สถานะการรับทราบของแต่ละรายการ (เฉพาะรายการที่ประเมินแล้ว)
    const ackOf = (e) => e.status === 'assigned' ? null : (e.empResponse === 'acknowledge' ? 'acknowledge' : (e.empResponse === 'dispute' ? 'dispute' : 'pending'));
    let list = DB.getAssignmentsForHR();
    // สถานะใบ (เปิด/ปิด): HR เห็นครบทุกใบเป็นดีฟอลต์ — ใบที่ "ปิด" ซ่อนเฉพาะจากสิทธิ์พนักงาน/หัวหน้างาน
    //   เลือกในตัวกรองเพื่อดูเฉพาะกลุ่มที่ต้องการได้ (เปิดอยู่ / ปิดอยู่)
    if (fActive.length) list = list.filter(e => fActive.includes(e.paused === true ? 'paused' : 'active'));
    if (fs.length) list = list.filter(e => fs.includes(e.status));
    if (fp.length) list = list.filter(e => fp.includes(e.period));
    if (fsup.length) list = list.filter(e => { const ch = evalChainOf(e); return fsup.some(id => ch.includes(id)) || (fsup.includes('__nosup__') && !ch.length); });
    if (femp.length) list = list.filter(e => femp.includes(e.employeeId));
    // กรองตาม ตำแหน่ง/แผนก/สาขา ของพนักงานผู้ถูกประเมิน
    if (fdept.length || fpos.length || fbr.length) list = list.filter(e => {
      const u = DB.getUserById(e.employeeId) || {};
      return (!fdept.length || fdept.includes(u.department)) && (!fpos.length || fpos.includes(u.position)) && (!fbr.length || fbr.includes(u.branch));
    });
    if (fg.length) list = list.filter(e => fg.includes(e.status !== 'assigned' && e.totalScore != null && e.totalMax ? gradeFor(e.totalScore, e.totalMax) : e.grade));
    if (fform.length) list = list.filter(e => fform.includes(e.formId));
    if (fack.length) list = list.filter(e => { const av = ackOf(e); return av && fack.includes(av); });
    if (fcoach.length) list = list.filter(e => { const l = coachLabelsOf(e); return fcoach.some(v => l.includes(v)); });
    if (!isNaN(smin) || !isNaN(smax)) list = list.filter(e => {
      if (e.status === 'assigned' || e.totalScore == null || !e.totalMax) return false;   // ยังไม่มีคะแนน → ไม่เข้าเงื่อนไขช่วงคะแนน
      const pct = e.totalScore / e.totalMax * 100;
      if (!isNaN(smin) && pct < smin) return false;
      if (!isNaN(smax) && pct > smax) return false;
      return true;
    });
    if (q) list = list.filter(e => {
      const u = DB.getUserById(e.employeeId) || {};
      const sup = DB.getUserById(e.supervisorId) || {};
      let bag;
      if (qScope === 'emp') {
        // ค้นเฉพาะ "ผู้ถูกประเมิน" (ชื่อ/รหัส/แผนก/ตำแหน่งของพนักงาน)
        bag = [u.fullName, u.employeeCode, u.department, u.position];
      } else if (qScope === 'sup') {
        // ค้นเฉพาะ "ผู้ประเมิน" (ชื่อ/รหัสหัวหน้างาน)
        bag = [evalChainNames(e, ' '), sup.employeeCode, (evalChainOf(e).length ? '' : 'ยังไม่กำหนดผู้ประเมิน')];
      } else {
        // ทั้งหมด (พฤติกรรมเดิม)
        const scoreText = (e.status !== 'assigned' && e.totalScore != null) ? `${e.totalScore.toFixed(2)} ${e.totalMax}` : '';
        const ackText = e.status === 'assigned' ? '' : (e.empResponse === 'acknowledge' ? 'รับทราบแล้ว' : (e.empResponse === 'dispute' ? 'มีข้อโต้แย้ง' : 'รอรับทราบ'));
        bag = [
          fmtPeriod(e.period), e.period,
          u.fullName, u.employeeCode, u.department, u.position,
          evalChainNames(e, ' '), sup.employeeCode, (evalChainOf(e).length ? '' : 'ยังไม่กำหนดผู้ประเมิน'),
          statusLabelMap[e.status] || e.status,
          scoreText, (e.status !== 'assigned' && e.totalScore != null && e.totalMax ? gradeFor(e.totalScore, e.totalMax) : (e.grade || '')), ackText,
          coachLabelsOf(e).join(' '), e.coachingDetail || '',
        ];
      }
      return bag.join(' ').toLowerCase().includes(q);
    });
    const order = { pending_review: 0, evaluated: 1, assigned: 2, confirmed: 3 };
    return list.sort((a, b) => (order[a.status] - order[b.status]) || b.period.localeCompare(a.period));
  };

  const selected = new Set();

  // ใบที่ถูกเลือกอยู่ (ทุกสถานะ) — อ่านจากชุดข้อมูลที่โหลดไว้
  const selectedEvals = () => DB.getEvaluations().filter(e => selected.has(e.id));

  const updateBulkBar = () => {
    // เก็บเฉพาะ id ที่ยังมีอยู่จริง (กันรายการที่ถูกลบไปแล้วค้างอยู่ในชุดที่เลือก)
    const liveIds = new Set(DB.getEvaluations().map(e => e.id));
    [...selected].forEach(id => { if (!liveIds.has(id)) selected.delete(id); });
    const cnt = document.getElementById('lsSelCount');
    const bar = document.getElementById('lsBulkBar');
    if (cnt) cnt.textContent = selected.size;
    if (bar) bar.style.display = selected.size ? 'flex' : 'none';
    // สรุปว่าในชุดที่เลือกมีอะไรบ้าง + เปิด/ปิดปุ่มให้ตรงกับสิ่งที่ทำได้จริง
    const sel = selectedEvals();
    const nPend = sel.filter(e => e.status === 'pending_review').length;
    const nPaused = sel.filter(e => e.paused === true).length;
    const note = document.getElementById('lsSelNote');
    if (note) {
      const parts = [];
      if (nPend) parts.push(`รอ HR ตรวจ ${nPend}`);
      if (nPaused) parts.push(`ปิดใบอยู่ ${nPaused}`);
      note.textContent = parts.length ? `(${parts.join(' • ')})` : '';
    }
    const setBtn = (id, on) => {
      const b = document.getElementById(id);
      if (!b) return;
      b.disabled = !on;
      b.style.opacity = on ? '' : '.45';
      b.style.cursor = on ? '' : 'not-allowed';
    };
    setBtn('lsApproveSel', nPend > 0);
    setBtn('lsPauseSel', sel.length - nPaused > 0);
    setBtn('lsUnpauseSel', nPaused > 0);
    setBtn('lsDeleteSel', sel.length > 0);
    const selAll = document.getElementById('lsSelAll');
    if (selAll) {
      // "เลือกทั้งหมด" = ทุกรายการที่กรองอยู่ (ข้ามหน้า) ไม่จำกัดสถานะ
      const inFilter = getList();
      selAll.checked = inFilter.length > 0 && inFilter.every(e => selected.has(e.id));
      selAll.indeterminate = !selAll.checked && inFilter.some(e => selected.has(e.id));
    }
  };

  const bulkConfirm = (ids) => {
    const all = DB.getEvaluations();
    const ready = all.filter(e => ids.includes(e.id) && e.status === 'pending_review');
    if (!ready.length) { toast('ไม่มีรายการที่รอตรวจสอบ', 'error'); return; }
    confirmDialog({
      title: 'อนุมัติหลายรายการ',
      message: `ยืนยันผลการประเมิน ${ready.length} รายการพร้อมกัน?`,
      confirmText: `ยืนยัน ${ready.length} รายการ`, type: 'info',
    }).then(async ok => {
      if (!ok) return;
      // ยืนยันทีละรายการ (ทยอย 6 พร้อมกัน กันยิงถี่เกิน) พร้อม popup สถานะ
      showBusy(`กำลังยืนยันผลการประเมิน... (0/${ready.length})`);
      try {
        for (let i = 0; i < ready.length; i += 6) {
          await Promise.all(ready.slice(i, i + 6).map(e => DB.confirmEvaluation(e.id, me.id, 'อนุมัติแบบกลุ่ม')));
          updateBusy(`กำลังยืนยันผลการประเมิน... (${Math.min(i + 6, ready.length)}/${ready.length})`);
        }
      } catch (err) {
        hideBusy(); console.error(err);
        toast('ยืนยันไม่สำเร็จบางรายการ — โปรดรีเฟรชแล้วลองใหม่', 'error', { title: 'ยืนยันไม่สำเร็จ' });
        App.buildNav(me); draw(); return;
      }
      hideBusy();
      selected.clear();
      toast(`ยืนยัน ${ready.length} รายการเรียบร้อย`, 'success', { title: 'อนุมัติสำเร็จ' });
      App.buildNav(me); draw();
    });
  };

  const draw = () => {
    const list = getList();
    const totalPages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    if (page >= totalPages) page = totalPages - 1;
    if (page < 0) page = 0;
    const start = page * PER_PAGE;
    const shown = list.slice(start, start + PER_PAGE);
    const cnt = document.getElementById('lsCount');
    if (cnt) cnt.innerHTML = `พบ <b>${list.length}</b> รายการ` + (list.length > PER_PAGE ? ` • แสดง ${start + 1}–${Math.min(start + PER_PAGE, list.length)} (หน้า ${page + 1}/${totalPages})` : '');
    const body = document.getElementById('lsBody');
    body.innerHTML = shown.map(e => {
      const u = DB.getUserById(e.employeeId) || {};
      const sup = DB.getUserById(e.supervisorId) || {};
      const scored = e.status !== 'assigned';
      const info = scored ? gradeInfoFor(e.totalScore, e.totalMax) : null;
      const lastTs = (e.history && e.history.length) ? e.history[e.history.length - 1].ts : (e.reviewedAt || e.submittedAt || e.assignedAt || e.createdAt);
      let actions = `<button class="btn btn-secondary btn-icon" data-view="${e.id}" title="ดูรายละเอียด"><i class="fa-solid fa-eye"></i></button>
        <button class="btn btn-secondary btn-icon" data-log="${e.id}" title="ประวัติการดำเนินการ"><i class="fa-solid fa-clock-rotate-left"></i></button>`;
      if (scored) {
        actions += `<button class="btn btn-secondary btn-icon" data-pdf="${e.id}" title="เปิดดูไฟล์ PDF"><i class="fa-solid fa-file-pdf"></i></button>`;
        // เปิดฟอร์มเพื่อ ตรวจสอบ/ยืนยัน/ส่งกลับแก้ไข (ปุ่มยืนยัน + ส่งกลับ ย้ายไปอยู่ในฟอร์มแล้ว)
        if (e.status === 'pending_review') {
          actions += `<button class="btn btn-primary btn-icon" data-edit="${e.id}" title="ตรวจสอบ / ยืนยัน / ส่งกลับแก้ไข (เปิดฟอร์ม)"><i class="fa-solid fa-pen-to-square"></i></button>`;
        } else if (e.status === 'confirmed') {
          // ยืนยันแล้ว = ล็อก — เปิดฟอร์มเพื่อกด "ส่งกลับไปแก้ไข (ยกเลิกการยืนยัน)" ภายในฟอร์ม
          actions += `<button class="btn btn-secondary btn-icon" data-edit="${e.id}" title="เปิดฟอร์ม (ส่งกลับไปแก้ไข / ยกเลิกการยืนยัน)"><i class="fa-solid fa-folder-open"></i></button>`;
        }
      } else if (me.role === 'admin') {
        // ใบที่ยังไม่ประเมิน (มอบหมายแล้ว) — HR เปิดฟอร์มกรอก/แก้ไขข้อมูลประเมินเองได้
        actions += `<button class="btn btn-primary btn-icon" data-edit="${e.id}" title="กรอก / แก้ไขข้อมูลประเมิน (เปิดฟอร์ม)"><i class="fa-solid fa-pen-to-square"></i></button>`;
      }
      // ใบที่ยังไม่มีผู้ประเมิน (นำเข้ามาก่อน) — HR กำหนดผู้ประเมินทีหลังได้ตรงนี้
      if (me.role === 'admin' && !evalChainOf(e).length && !scored) {
        actions += `<button class="btn btn-primary btn-icon" data-assign="${e.id}" title="กำหนดผู้ประเมิน"><i class="fa-solid fa-user-plus"></i></button>`;
      }
      // HR เปิด-ปิด(พัก)ใบ + ลบใบประเมินได้ทุกสถานะ (ทีละรายการ)
      if (me.role === 'admin') {
        const pd = e.paused === true;
        actions += `<button class="btn btn-secondary btn-icon" data-pause="${e.id}" data-to="${pd ? '0' : '1'}" title="${pd ? 'เปิดใบประเมินนี้ — ให้พนักงานและหัวหน้างานเห็นตามปกติ' : 'ปิดใบประเมินนี้ — พนักงานและหัวหน้างานจะไม่เห็น + ไม่นับสถิติ (HR ยังเห็น)'}"><i class="fa-solid ${pd ? 'fa-circle-play' : 'fa-circle-pause'}"></i></button>`;
        actions += `<button class="btn btn-danger btn-icon" data-del="${e.id}" title="ลบใบประเมินนี้"><i class="fa-solid fa-trash"></i></button>`;
      }
      const pausedRow = e.paused === true;
      return `
        <tr${pausedRow ? ' style="opacity:.55;background:#f8fafc"' : ''}>
          <td class="text-center"><input type="checkbox" data-sel="${e.id}" ${selected.has(e.id) ? 'checked' : ''} title="เลือกรายการนี้" /></td>
          <td>${fmtPeriod(e.period)}<div class="text-mute" style="font-size:10px;margin-top:2px"><i class="fa-regular fa-clock"></i> ${fmtDateTime(lastTs)}</div></td>
          <td><b>${escapeHtml(u.fullName||'-')}</b> <span class="text-mute mono" style="font-size:11px">${escapeHtml(u.employeeCode||'')}</span><div style="margin-top:3px">${empStatusBadge(u.status)}</div></td>
          <td>${evalChainOf(e).length ? evalChainHtml(e) : '<span style="color:#b45309;white-space:nowrap"><i class="fa-solid fa-user-clock mr-1"></i>ยังไม่กำหนด</span>'}${evalStepText(e) ? `<div class="text-mute" style="font-size:10px;margin-top:2px"><i class="fa-solid fa-list-ol mr-1"></i>${escapeHtml(evalStepText(e))}</div>` : ''}</td>
          <td>${statusBadgeHTML(e.status)}${pausedRow ? ' <span class="badge warn" title="ใบนี้ถูกปิด — พนักงานและหัวหน้างานไม่เห็น + ไม่นับสถิติ (HR ยังเห็นในหน้านี้)"><i class="fa-solid fa-circle-pause mr-1"></i>ปิดใบ</span>' : ''}</td>
          <td class="mono" style="white-space:nowrap">${scored ? `<b>${e.totalScore.toFixed(2)}</b>/${e.totalMax} ${info ? `<span class="grade-tag ml-1" style="color:${info.color};border-color:${info.color};background:${info.color}15">${escapeHtml(info.label)}</span>` : ''}` : '—'}</td>
          <td>${ackBadgeHTML(e)}</td>
          <td class="text-right whitespace-nowrap">${actions}</td>
        </tr>`;
    }).join('') || '<tr><td colspan="8" class="text-center text-mute" style="padding:2rem">ไม่พบรายการ</td></tr>';

    // แถบเปลี่ยนหน้า (100 รายการ/หน้า) — แสดงเสมอ
    Pager.render(document.getElementById('lsPager'), page, totalPages, (np) => { page = np; draw(); });

    body.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => AdminUI.viewEvaluation(b.dataset.view)));
    body.querySelectorAll('[data-log]').forEach(b => b.addEventListener('click', () => AdminUI.viewHistory(b.dataset.log)));
    body.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => window.Evaluation.openModal(b.dataset.edit, { editMode: true })));
    body.querySelectorAll('[data-pdf]').forEach(b => b.addEventListener('click', async () => { const r = await DB.getEvaluationFull(b.dataset.pdf); if (r) window.Evaluation._genEvalPdf(r, DB.getFormForEval(r), 'view'); }));
    body.querySelectorAll('[data-sel]').forEach(cb => cb.addEventListener('change', () => {
      if (cb.checked) selected.add(cb.dataset.sel); else selected.delete(cb.dataset.sel);
      updateBulkBar();
    }));
    body.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => AdminUI._deleteEval(b.dataset.del, () => { App.buildNav(me); draw(); })));
    body.querySelectorAll('[data-assign]').forEach(b => b.addEventListener('click', () => AdminUI._assignEvaluator(b.dataset.assign, () => { App.buildNav(me); draw(); })));
    body.querySelectorAll('[data-pause]').forEach(b => b.addEventListener('click', async () => {
      const to = b.dataset.to === '1';
      showBusy(to ? 'กำลังปิดใบประเมิน...' : 'กำลังเปิดใบประเมิน...');
      try { await DB.setEvaluationsPaused([b.dataset.pause], to); }
      catch (e) { hideBusy(); toast('ไม่สำเร็จ — ข้อมูลยังไม่ถูกบันทึกลงระบบ โปรดลองใหม่', 'error', { title: 'บันทึกไม่สำเร็จ' }); return; }
      hideBusy();
      toast(to ? 'ปิดใบประเมินแล้ว — พนักงานและหัวหน้างานจะไม่เห็นใบนี้ (HR ยังเห็น)' : 'เปิดใบประเมินแล้ว — พนักงานและหัวหน้างานเห็นตามปกติ', 'success');
      App.buildNav(me); draw();
    }));
    // หมายเหตุ: ปุ่ม "ยืนยัน" และ "ส่งกลับแก้ไข" ย้ายเข้าไปอยู่ภายในฟอร์มประเมินแล้ว
    // (เปิดฟอร์มผ่านปุ่มในคอลัมน์ "การดำเนินการ") — การอนุมัติแบบกลุ่มยังใช้แถบด้านบนได้
    updateBulkBar();
  };

  // โหลดข้อมูลจาก DB แล้วกรอง/ค้นหาในฝั่ง client — ไม่เลือกรอบ = โหลดทุกรอบ (แบ่งหน้า client 100/หน้า)
  let loadedKey = null;
  const reload = async () => {
    const wantP = MS.values('lsPeriod');
    const filters = wantP.length ? { period: wantP } : {};   // ว่าง = ทุกรอบ ทุกสถานะ
    let p = 0, total = 0;
    do {
      const res = await DB.loadEvaluations(filters, { select: LIGHT, pageSize: 500, page: p, count: true, append: p > 0 });
      total = res.total || 0;
      p++;
    } while (p * 500 < total && p < 200);
  };
  // ตัวกรองที่ต้อง query ใหม่เมื่อ "รอบ" เปลี่ยน — อื่น ๆ กรองใน client • เปลี่ยนตัวกรอง = กลับหน้าแรก
  const onFilter = async () => {
    const wantP = MS.values('lsPeriod');
    const key = (wantP.length ? wantP.slice().sort().join(',') : 'ALL');
    page = 0;
    if (key !== loadedKey) { loadedKey = key; showBusy('กำลังโหลดรายการประเมิน...'); try { await reload(); } finally { hideBusy(); } }
    draw();
  };
  MS.bind(document.getElementById('lsFilters'), onFilter);
  document.getElementById('lsSearch').addEventListener('input', () => { page = 0; draw(); });
  document.getElementById('lsSearchScope').addEventListener('change', () => { page = 0; draw(); });
  document.getElementById('lsScoreMin').addEventListener('input', () => { page = 0; draw(); });
  document.getElementById('lsScoreMax').addEventListener('input', () => { page = 0; draw(); });
  document.getElementById('lsClear').addEventListener('click', async () => {
    ['lsStatus', 'lsPeriod', 'lsSup', 'lsEmp', 'lsDept', 'lsPos', 'lsBranch', 'lsGrade', 'lsForm', 'lsAck', 'lsActive', 'lsCoach'].forEach(id => MS.clear(id));
    document.getElementById('lsSearch').value = '';
    document.getElementById('lsSearchScope').value = 'all';
    document.getElementById('lsScoreMin').value = '';
    document.getElementById('lsScoreMax').value = '';
    page = 0;
    if (loadedKey !== 'ALL') { loadedKey = 'ALL'; showBusy('กำลังโหลดรายการประเมิน...'); try { await reload(); } finally { hideBusy(); } }
    draw();
  });
  document.getElementById('lsExport').addEventListener('click', () => AdminUI.exportExcel(getList()));
  document.getElementById('lsManual')?.addEventListener('click', () => window.Manual && Manual.open('admin', 'list'));
  // เปิด-ปิด(พัก) หลายใบ — src = ชุดเป้าหมาย (ดีฟอลต์ = ที่กรองอยู่ตอนนี้ • ส่ง selectedEvals() = เฉพาะที่เลือก)
  const bulkSetPaused = async (paused, src, scope) => {
    const label = scope || 'ที่กรองอยู่';
    const targets = (src || getList()).filter(e => (e.paused === true) !== paused);
    if (!targets.length) { toast(paused ? `ใบ${label}ถูกปิดหมดแล้ว` : `ใบ${label}เปิดอยู่แล้ว`, 'error'); return; }
    const ok = await confirmDialog({
      title: paused ? `ปิดใบประเมิน${label}` : `เปิดใบประเมิน${label}`,
      message: paused
        ? `ปิดใบประเมิน ${targets.length} ใบ${label}? — พนักงานและหัวหน้างานจะไม่เห็นใบเหล่านี้ และไม่ถูกนับในสถิติ • HR ยังเห็นครบในหน้ารายการประเมิน (ไม่ลบ เปิดคืนได้ทุกเมื่อ)`
        : `เปิดใบประเมิน ${targets.length} ใบ${label}? — พนักงานและหัวหน้างานจะกลับมาเห็นตามปกติ และถูกนับในสถิติอีกครั้ง`,
      confirmText: paused ? `ปิด ${targets.length} ใบ` : `เปิด ${targets.length} ใบ`, cancelText: 'ยกเลิก', type: paused ? 'warn' : 'info',
    });
    if (!ok) return;
    showBusy(paused ? `กำลังปิดใบประเมิน... (${targets.length})` : `กำลังเปิดใบประเมิน... (${targets.length})`);
    try { await DB.setEvaluationsPaused(targets.map(e => e.id), paused); }
    catch (e) { hideBusy(); console.error('[bulkSetPaused]', e); toast('ไม่สำเร็จ — ข้อมูลยังไม่ถูกบันทึกลงระบบ โปรดลองใหม่', 'error', { title: 'บันทึกไม่สำเร็จ' }); return; }
    hideBusy();
    toast(`${paused ? 'ปิด' : 'เปิด'}ใบประเมิน ${targets.length} ใบเรียบร้อย`, 'success', { title: 'สำเร็จ' });
    App.buildNav(me); draw();
  };
  document.getElementById('lsPauseFiltered')?.addEventListener('click', () => bulkSetPaused(true));
  document.getElementById('lsUnpauseFiltered')?.addEventListener('click', () => bulkSetPaused(false));
  document.getElementById('lsPauseSel')?.addEventListener('click', () => bulkSetPaused(true, selectedEvals(), 'ที่เลือก'));
  document.getElementById('lsUnpauseSel')?.addEventListener('click', () => bulkSetPaused(false, selectedEvals(), 'ที่เลือก'));
  // ลบหลายใบ — list = ชุดเป้าหมาย (ทั้งหมดที่กรอง / เฉพาะที่เลือก)
  const bulkDelete = async (list, scope) => {
    if (!list.length) { toast('ไม่มีรายการให้ลบ', 'error'); return; }
    const ok = await AdminUI._confirmDeleteWithCode({
      title: `ลบใบประเมิน${scope}`,
      detail: `จะลบใบประเมิน <b style="color:var(--err)">${list.length}</b> รายการ${escapeHtml(scope)}`,
      count: list.length, confirmText: `ลบ ${list.length} รายการ`,
    });
    if (!ok) return;
    const ids = list.map(e => e.id);
    showBusy(`กำลังลบใบประเมิน... (0/${ids.length})`);
    try {
      await DB.deleteEvaluations(ids, (d, t) => updateBusy(`กำลังลบใบประเมิน... (${d}/${t})`));
    } catch (err) {
      hideBusy(); console.error('[bulkDelete] ลบไม่สำเร็จ', err);
      toast('ลบไม่สำเร็จบางส่วน — โปรดรีเฟรชแล้วลองใหม่', 'error', { title: 'ลบไม่สำเร็จ' });
      await reload(); App.buildNav(me); draw(); return;
    }
    hideBusy();
    selected.clear();
    toast(`ลบใบประเมิน ${ids.length} รายการเรียบร้อย`, 'success', { title: 'ลบสำเร็จ' });
    App.buildNav(me); draw();
  };
  document.getElementById('lsDeleteAll')?.addEventListener('click', () => bulkDelete(getList(), 'ทั้งหมดที่กรองอยู่'));
  document.getElementById('lsDeleteSel')?.addEventListener('click', () => bulkDelete(selectedEvals(), 'ที่เลือก'));
  document.getElementById('lsApproveAll').addEventListener('click', () => bulkConfirm(DB.getAssignmentsForHR('pending_review').map(e => e.id)));
  document.getElementById('lsApproveSel').addEventListener('click', () => bulkConfirm([...selected]));
  document.getElementById('lsClearSel').addEventListener('click', () => { selected.clear(); draw(); });
  // เลือกทั้งหมด = ทุกรายการที่กรองอยู่ตอนนี้ (ครบทุกหน้า ทุกสถานะ) ไม่ใช่เฉพาะที่รอตรวจ
  document.getElementById('lsSelAll').addEventListener('change', (ev) => {
    const inFilter = getList();
    if (ev.target.checked) inFilter.forEach(e => selected.add(e.id));
    else inFilter.forEach(e => selected.delete(e.id));
    draw();
  });
  // โหลดครั้งแรก = ทุกรอบ
  loadedKey = 'ALL';
  showBusy('กำลังโหลดรายการประเมิน...');
  try { await reload(); } finally { hideBusy(); }
  draw();
};

// ลบใบประเมิน 1 รายการ (HR) — ยืนยันก่อน แล้วลบจาก DB จริง
// ===================================================================
// กล่องยืนยันการลบใบประเมิน — ต้องพิมพ์ "รหัสพนักงานของผู้ลบ (HR)" ให้ถูกก่อนจึงลบได้
//   • กัน HR เผลอกดลบ (โดยเฉพาะการลบทีละหลายพันใบ)
//   • ใช้ showModal เพราะ confirmDialog ไม่มีช่องกรอกและ escape HTML
//   • ถ้าบัญชีผู้ใช้ไม่มีรหัสพนักงาน → ข้ามการตรวจรหัส (ไม่บล็อกการทำงาน) แต่ยังต้องกดยืนยัน
// ===================================================================
AdminUI._confirmDeleteWithCode = function ({ title, detail, count, confirmText }) {
  return new Promise(resolve => {
    const me = Auth.currentUser() || {};
    const myCode = String(me.employeeCode || '').trim();
    let settled = false;
    const done = (v) => { if (settled) return; settled = true; resolve(v); };
    showModal({
      title,
      size: '520',
      body: `
        <div class="ad-block" style="background:var(--accent-soft);border-color:var(--accent-line)">
          <div class="text-sm"><i class="fa-solid fa-triangle-exclamation mr-1" style="color:var(--err)"></i>${detail}</div>
          <div class="text-mute text-xs mt-1"><b>การลบนี้กู้คืนไม่ได้</b> — ข้อมูลคะแนน ความเห็น และประวัติทั้งหมดของใบที่ลบจะหายถาวร</div>
        </div>
        <div class="mt-3">
          <label class="label">ยืนยันตัวตนผู้ลบ — พิมพ์ <b>รหัสพนักงานของคุณ</b> <span class="req">*</span></label>
          <input id="dcCode" class="input" autocomplete="off" placeholder="รหัสพนักงานของคุณ" />
          <div class="text-mute text-xs mt-1"><i class="fa-solid fa-user-shield mr-1"></i>ผู้ลบ: <b>${escapeHtml(me.fullName || '-')}</b>${myCode ? '' : ' <span style="color:var(--warn)">(บัญชีนี้ไม่มีรหัสพนักงาน — ข้ามการตรวจรหัส)</span>'}</div>
          <div id="dcErr" class="text-xs mt-1" style="color:var(--err);display:none"></div>
        </div>`,
      footer: `<button class="btn btn-secondary" id="dcCancel">ยกเลิก</button><button class="btn btn-red-solid" id="dcOk"><i class="fa-solid fa-trash"></i> ${escapeHtml(confirmText)}</button>`,
      onClose: () => done(false),
    });
    const input = document.getElementById('dcCode');
    const err = document.getElementById('dcErr');
    const submit = () => {
      const typed = String(input.value || '').trim();
      if (myCode) {
        if (!typed) { err.textContent = 'กรุณากรอกรหัสพนักงานของคุณเพื่อยืนยันการลบ'; err.style.display = 'block'; input.focus(); return; }
        if (typed.toLowerCase() !== myCode.toLowerCase()) {
          err.textContent = 'รหัสพนักงานไม่ถูกต้อง — กรุณากรอกรหัสพนักงานของบัญชีที่กำลังใช้งาน';
          err.style.display = 'block'; input.select(); return;
        }
      }
      closeModal(); done(true);
    };
    document.getElementById('dcCancel').addEventListener('click', () => { closeModal(); done(false); });
    document.getElementById('dcOk').addEventListener('click', submit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    input.addEventListener('input', () => { err.style.display = 'none'; });
    setTimeout(() => input.focus(), 60);
  });
};

AdminUI._deleteEval = async function (id, onDone) {
  const ev = DB.getEvaluations().find(e => e.id === id);
  const u = ev ? (DB.getUserById(ev.employeeId) || {}) : {};
  const ok = await AdminUI._confirmDeleteWithCode({
    title: 'ลบใบประเมิน',
    detail: `จะลบใบประเมินของ <b>${escapeHtml(u.fullName || '-')}</b>${ev ? ` รอบ <b>${escapeHtml(fmtPeriod(ev.period))}</b>` : ''} จำนวน 1 ใบ`,
    count: 1, confirmText: 'ลบใบประเมิน',
  });
  if (!ok) return;
  showBusy('กำลังลบใบประเมิน...');
  try {
    await DB.deleteEvaluation(id);
  } catch (err) {
    hideBusy(); console.error('[deleteEval] ลบไม่สำเร็จ', err);
    toast('ลบไม่สำเร็จ — โปรดลองใหม่', 'error', { title: 'ลบไม่สำเร็จ' }); return;
  }
  hideBusy();
  toast('ลบใบประเมินแล้ว', 'success');
  if (onDone) onDone();
};

// กำหนด/เปลี่ยนผู้ประเมินให้ใบประเมิน (ใช้กับใบที่นำเข้ามาก่อนโดยยังไม่มีผู้ประเมิน)
// ** ดึงใบเต็มด้วย getEvaluationFull ก่อนบันทึก — กัน kpiPreset/answers หาย (ตารางรายการโหลดคอลัมน์แบบ LIGHT)
AdminUI._assignEvaluator = async function (evalId, onDone) {
  const lite = DB.getEvaluations().find(e => e.id === evalId);
  if (!lite) { toast('ไม่พบใบประเมิน', 'error'); return; }
  const emp = DB.getUserById(lite.employeeId) || {};
  const sups = DB.getSupervisors().filter(s => s.id !== lite.employeeId);
  const body = `
    <div class="text-sm mb-3">กำหนดผู้ประเมินให้ <b>${escapeHtml(emp.fullName || '-')}</b> <span class="mono text-mute">(${escapeHtml(emp.employeeCode || '')})</span> • รอบ ${fmtPeriod(lite.period)}</div>
    <div class="label">ผู้ประเมิน (สูงสุด ${typeof MAX_EVALUATORS !== 'undefined' ? MAX_EVALUATORS : 3} คน · ประเมินตามลำดับ)</div>
    ${EvaluatorPicker.build('aeEv', evaluatorChainOf(emp), { excludeId: lite.employeeId, sups })}
    <div class="text-mute text-xs mt-2"><i class="fa-solid fa-circle-info mr-1"></i>เมื่อกำหนดแล้ว หัวหน้าคนนี้จะเห็นใบประเมินและกรอกได้ • ไม่กระทบข้อมูลในหน้าจัดการพนักงาน</div>`;
  showModal({
    title: 'กำหนดผู้ประเมิน',
    body,
    footer: `<button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="aeSave"><i class="fa-solid fa-check"></i> บันทึก</button>`,
    size: '460',
  });
  EvaluatorPicker.bind(document.querySelector('.modal-bg') || document, 'aeEv');
  document.getElementById('aeSave').addEventListener('click', async () => {
    const ids = EvaluatorPicker.value('aeEv');
    const sid = ids[0];
    if (!sid) { toast('กรุณาเลือกผู้ประเมินอย่างน้อยลำดับ 1', 'error'); return; }
    showBusy('กำลังบันทึกผู้ประเมิน...');
    try {
      const rec = await DB.getEvaluationFull(evalId);
      if (!rec) throw new Error('not found');
      rec.evaluatorIds = ids.slice(); rec.evalStep = 0; rec.evalChain = [];
      rec.supervisorId = sid;
      DB.pushHistory(rec, 'assigned', (Auth.currentUser() || {}).id, `กำหนดผู้ประเมิน: ${ids.map(id => (DB.getUserById(id) || {}).fullName || id).join(' → ')}`);
      await DB.upsertEvaluation(rec);
      // ตั้งลำดับผู้ประเมินให้ตัวพนักงานด้วย (ให้หน้าจัดการพนักงานตรงกัน — รอบถัดไปใช้ลำดับนี้)
      if (emp.id) await DB.upsertUser({ ...emp, evaluatorIds: ids.slice(), supervisorId: sid });
    } catch (err) {
      hideBusy(); console.error('[assignEvaluator]', err);
      toast('บันทึกไม่สำเร็จ — โปรดลองใหม่ (ข้อมูลยังไม่ถูกบันทึก)', 'error', { title: 'บันทึกไม่สำเร็จ' });
      return;
    }
    hideBusy();
    closeModal();
    toast('กำหนดผู้ประเมินเรียบร้อย', 'success');
    if (onDone) onDone();
  });
};

// ===================================================================
// Helper: format answer value for display
// ===================================================================
function formatAnswerValue(item, value) {
  if (value === undefined || value === null || value === '') return '—';
  switch (item.type) {
    case 'rating5': return `${value}/5`;
    case 'scale10': return `${value}/10`;
    case 'percent': return `${value}%`;
    case 'kpi': {
      if (typeof value === 'object' && value !== null) {
        return `${value.actual} / ${value.target} ${escapeHtml(item.config?.unit || '')}`;
      }
      return String(value);
    }
    case 'choice': {
      const opts = (item.config && item.config.options) || [];
      return escapeHtml(opts[+value]?.label || '—');
    }
    case 'yesno': return (value === true || value === 'true' || value === 'yes') ? 'ใช่' : 'ไม่ใช่';
    default: return String(value);
  }
}

// เปิดให้เรียกใช้จากไฟล์อื่น (evaluation.js) ผ่าน window.AdminUI
window.AdminUI = AdminUI;

          <div class="flow-steps">
            <div class="flow-step done"><div class="flow-step-no">1</div><div><b>HR มอบหมาย</b><div class="text-mute text-xs">โหลดรายชื่อเข้าระบบ</div></div></div>
            <div class="flow-step ${cAssigned ? 'active' : 'done'}"><div class="flow-step-no">2</div><div><b>หัวหน้าประเมิน + ส่ง HR</b><div class="text-mute text-xs">กรอกคะแนน → กด "บันทึกการประเมิน" → ส่งให้ HR</div></div></div>
            <div class="flow-step ${cReview ? 'active' : ''}"><div class="flow-step-no">3</div><div><b>HR ตรวจสอบ + ยืนยัน</b><div class="text-mute text-xs">HR ตรวจสอบผลและยืนยัน</div></div></div>
            <div class="flow-step"><div class="flow-step-no">4</div><div><b>พนักงานรับทราบ</b><div class="text-mute text-xs">พนักงานกด "รับทราบผลการประเมิน" ผ่านระบบ</div></div></div>
          </div>
        </div>
        <div class="card lift">
          <div class="card-title">แนวโน้มคะแนนทีม (ยืนยันแล้ว)</div>
          <div style="height:220px"><canvas id="supTrend"></canvas></div>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-wrap mb-3 no-print" id="supFilters">
        <span class="text-sm font-semibold"><i class="fa-solid fa-filter mr-1" style="color:var(--accent)"></i>มุมมองวิเคราะห์:</span>
        ${MS.build('supDashPeriod', 'ทุกรอบ', periods.map(p => ({ value: p, label: fmtPeriod(p) })), '180px')}
        <button id="supDashClear" class="btn btn-secondary btn-icon" title="ล้างตัวกรองทั้งหมด"><i class="fa-solid fa-rotate-left"></i> ล้างตัวกรอง</button>
        <span class="text-mute text-xs">(เลือกได้หลายรอบ + ค้นหา)</span>
      </div>
      <div id="supAnalytics"></div>
    `;

    document.getElementById('sdManual')?.addEventListener('click', () => window.Manual && Manual.open('supervisor', 'dashboard'));
    this._destroyCharts();

    // แนวโน้มคะแนนทีม (ไม่ขึ้นกับตัวกรองรอบ — เป็นไทม์ไลน์)
    if (confirmed.length) {
      const tr = Analytics.trendByPeriod(confirmed);
      const cv = document.getElementById('supTrend');
      if (cv) this.charts.trend = new Chart(cv, {
        type: 'line',
        data: { labels: tr.labels, datasets: [{ data: tr.data, borderColor: '#dc2626', backgroundColor: 'rgba(220,38,38,0.1)', fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: '#dc2626' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100, grid: { color: '#f0f0f0' } }, x: { grid: { display: false } } } }
      });
    }

    MS.bind(document.getElementById('supFilters'), () => this._drawSupAnalytics());
    document.getElementById('supDashClear')?.addEventListener('click', () => { MS.clear('supDashPeriod'); this._drawSupAnalytics(); });
    this._drawSupAnalytics();
  },

  // กราฟวิเคราะห์ของหัวหน้า (กรองตามรอบได้) — รายส่วน / สถานะ / รายคน / heatmap
  _drawSupAnalytics() {
    const me = Auth.currentUser();
    const all = DB.getAssignmentsForSupervisor(me.id);
    const team = DB.getSubordinates(me.id);
    const form = DB.getDefaultForm();
    const fPeriod = MS.values('supDashPeriod');
    const allF = all.filter(e => !fPeriod.length || fPeriod.includes(e.period));
    const scored = allF.filter(e => e.status !== 'assigned');

    document.getElementById('supAnalytics').innerHTML = `
      <div class="grid lg:grid-cols-3 gap-4 mb-4">
        <div class="card lift"><div class="card-title">คะแนนเฉลี่ยรายส่วน (%)</div><div style="height:230px"><canvas id="supSection"></canvas></div></div>
        <div class="card lift"><div class="card-title">สัดส่วนสถานะงาน</div><div style="height:230px"><canvas id="supStatus"></canvas></div></div>
        <div class="card lift"><div class="card-title">เปรียบเทียบคะแนนเฉลี่ยรายคน</div><div style="height:230px"><canvas id="supEmp"></canvas></div></div>
      </div>
      <div class="card lift">
        <div class="card-title">Heatmap คะแนน — พนักงาน × รอบ</div>
        <div class="text-mute text-xs mb-2">สีเข้ม = คะแนนสูง • เลื่อนชี้เพื่อดูรายละเอียด</div>
        ${Analytics.heatmapHTML(team, allF, fPeriod.length ? Math.max(fPeriod.length, 1) : 6)}
      </div>
    `;

    ['section', 'status', 'emp'].forEach(k => { if (this.charts[k]) { this.charts[k].destroy(); delete this.charts[k]; } });

    const secA = Analytics.sectionAverages(scored, form);
    const secCv = document.getElementById('supSection');
    if (secCv) this.charts.section = new Chart(secCv, {
      type: 'bar',
