        <button id="addFormBtn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> สร้างฟอร์มใหม่</button>
      </div>

      <div class="grid lg:grid-cols-2 gap-4">
        ${forms.map(f => {
          const totalItems = f.sections.reduce((s, sec) => s + sec.items.length, 0);
          const totalMax = calcFormMax(f);
          const penCount = (f.penaltyRules || []).length + ((f.penaltySection && f.penaltySection.enabled && f.penaltySection.rules) || []).length;
          const coachCount = (f.coachingOptions || []).length;
          return `
            <div class="card lift">
              <div class="flex justify-between items-start mb-3">
                <div>
                  <div class="flex items-center gap-2 mb-1">
                    <h3 class="font-bold text-base">${escapeHtml(f.name)}</h3>
                    ${f.isDefault ? '<span class="badge info">default</span>' : ''}
                    ${f.active ? '<span class="badge ok">active</span>' : '<span class="badge">ปิด</span>'}
                  </div>
                  <div class="text-mute text-xs">${escapeHtml(f.description || '')}</div>
                </div>
              </div>
              <div class="grid grid-cols-4 gap-2 text-xs mb-3">
                <div class="muted-bg p-2 rounded">
                  <div class="text-mute">Sections</div><div class="mono text-base font-bold">${f.sections.length}</div>
                </div>
                <div class="muted-bg p-2 rounded">
                  <div class="text-mute">คำถาม</div><div class="mono text-base font-bold">${totalItems}</div>
                </div>
                <div class="muted-bg p-2 rounded">
                  <div class="text-mute">คะแนนเต็ม</div><div class="mono text-base font-bold ${totalMax === 100 ? 'text-green-600' : 'text-amber-600'}">${totalMax}</div>
                </div>
                <div class="muted-bg p-2 rounded">
                  <div class="text-mute">หักคะแนน</div><div class="mono text-base font-bold">${penCount}</div>
                </div>
              </div>
              <div class="text-xs mb-3" style="border-top:1px dashed var(--border);padding-top:8px;line-height:1.9">
                <span class="text-mute"><i class="fa-solid fa-building mr-1"></i>แผนกที่ใช้ฟอร์มนี้:</span>
                ${(f.departments && f.departments.length) ? f.departments.map(d => `<span class="badge info" style="margin-left:4px;white-space:nowrap">${escapeHtml(d)}</span>`).join('') : '<span class="badge" style="margin-left:4px">ทุกแผนก (ทุกคน)</span>'}
                <button class="btn btn-secondary btn-icon" data-dept-form="${f.id}" style="margin-left:6px;padding:2px 9px;font-size:11px"><i class="fa-solid fa-gear"></i> กำหนด</button>
              </div>
              <div class="flex gap-2 flex-wrap">
                <button class="btn btn-primary btn-icon" data-edit-form="${f.id}"><i class="fa-solid fa-pen"></i> แก้ไข</button>
                ${!f.isDefault ? `<button class="btn btn-secondary btn-icon" data-default-form="${f.id}"><i class="fa-solid fa-star"></i> ตั้งเป็นค่าเริ่มต้น</button>` : ''}
                <button class="btn btn-secondary btn-icon" data-toggle-form="${f.id}">${f.active ? 'ปิด' : 'เปิด'}</button>
                ${forms.length > 1 ? `<button class="btn btn-danger btn-icon" data-del-form="${f.id}"><i class="fa-solid fa-trash"></i></button>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;

    document.getElementById('addFormBtn').addEventListener('click', () => this.openFormBuilder(null));
    container.querySelectorAll('[data-edit-form]').forEach(b => b.addEventListener('click', () => this.openFormBuilder(b.dataset.editForm)));
    container.querySelectorAll('[data-default-form]').forEach(b => b.addEventListener('click', () => {
      const f = DB.getFormById(b.dataset.defaultForm); f.isDefault = true; DB.upsertForm(f);
      toast('ตั้งเป็นค่าเริ่มต้นแล้ว', 'success'); App.go('hr-forms');
    }));
    container.querySelectorAll('[data-toggle-form]').forEach(b => b.addEventListener('click', () => {
      const f = DB.getFormById(b.dataset.toggleForm); f.active = !f.active; DB.upsertForm(f);
      App.go('hr-forms');
    }));
    container.querySelectorAll('[data-del-form]').forEach(b => b.addEventListener('click', () => {
      confirmDialog({ title: 'ลบแบบฟอร์ม', message: 'ต้องการลบแบบฟอร์มนี้?', confirmText: 'ลบ', type: 'delete' }).then(ok => {
        if (!ok) return;
        DB.deleteForm(b.dataset.delForm);
        toast('ลบแบบฟอร์มแล้ว', 'success'); App.go('hr-forms');
      });
    }));
    container.querySelectorAll('[data-dept-form]').forEach(b => b.addEventListener('click', () => this._openFormDepartments(b.dataset.deptForm)));
  },

  // กำหนด "แผนกที่ใช้ฟอร์มนี้" (form.departments) — อิงชื่อแผนกจากตารางพนักงานโดยตรง
  //   ใช้กรองรายชื่อใน Template รวม ตอนมอบหมายการประเมิน • ไม่เลือกเลย = ทุกแผนก
  _openFormDepartments(formId) {
    const form = DB.getFormById(formId); if (!form) return;
    const counts = {};
    DB.getUsers().forEach(u => { const d = (u.department || '').trim(); if (d && (u.status || 'active') !== 'resigned') counts[d] = (counts[d] || 0) + 1; });
    const depts = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'th'));
    const cur = new Set(form.departments || []);
    const body = `
      <div class="text-sm mb-2">เลือกแผนกที่ต้องประเมินด้วยฟอร์ม <b>${escapeHtml(form.name)}</b>
        <div class="text-mute text-xs">รายชื่อแผนกดึงจากตารางพนักงานโดยตรง • ไม่เลือกเลย = ทุกแผนก • Template รวมจะแสดงเฉพาะพนักงานในแผนกที่เลือก</div></div>
      <input id="fdSearch" class="input mb-2" placeholder="ค้นหาแผนก..." />
      <div style="max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px">
        ${depts.length ? depts.map(d => `<label class="flex items-center gap-2" data-fd-row style="padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer">
          <input type="checkbox" data-fd="${escapeHtml(d)}" ${cur.has(d) ? 'checked' : ''} style="accent-color:var(--accent)" />
          <span style="flex:1">${escapeHtml(d)}</span><span class="text-mute text-xs">${counts[d]} คน</span></label>`).join('')
        : '<div class="text-center text-mute" style="padding:1.5rem">— ยังไม่มีพนักงานในระบบ —</div>'}
      </div>
      <div class="text-mute text-xs mt-2"><span id="fdCount">${cur.size}</span> แผนกที่เลือก</div>`;
    showModal({ title: `แผนกที่ใช้ฟอร์ม — ${escapeHtml(form.name)}`, body, size: '560',
      footer: `<button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button><button class="btn btn-secondary" id="fdClear">ล้าง (ทุกแผนก)</button><button class="btn btn-primary" id="fdSave"><i class="fa-solid fa-check"></i> บันทึก</button>` });
    const upd = () => { const n = document.querySelectorAll('[data-fd]:checked').length; const c = document.getElementById('fdCount'); if (c) c.textContent = n; };
    document.querySelectorAll('[data-fd]').forEach(cb => cb.addEventListener('change', upd));
    document.getElementById('fdSearch').addEventListener('input', (e) => { const q = e.target.value.trim().toLowerCase(); document.querySelectorAll('[data-fd-row]').forEach(r => { r.style.display = !q || r.textContent.toLowerCase().includes(q) ? '' : 'none'; }); });
    document.getElementById('fdClear').addEventListener('click', () => { document.querySelectorAll('[data-fd]').forEach(cb => { cb.checked = false; }); upd(); });
    document.getElementById('fdSave').addEventListener('click', () => {
      const picked = [...document.querySelectorAll('[data-fd]:checked')].map(cb => cb.dataset.fd);
      const forms = DB.getForms(); const fresh = forms.find(x => x.id === formId); if (!fresh) return;
      fresh.departments = picked;
      DB.saveForms(forms);
      closeModal();
      toast(picked.length ? `กำหนดแผนกให้ฟอร์มแล้ว (${picked.length} แผนก)` : 'ตั้งเป็นทุกแผนกแล้ว', 'success');
      App.go('hr-forms');
    });
  },

  // ---- Form Builder ----
  _builderState: null,
  _builderTab: 'sections',

  openFormBuilder(id) {
    const isEdit = !!id;
    const f = isEdit ? JSON.parse(JSON.stringify(DB.getFormById(id))) : {
      id: '', name: '', description: '', active: true, isDefault: false,
      sections: [{ id: DB.uid('s'), name: 'Section ใหม่', description: '', allowedRoles: ['admin', 'supervisor'], items: [] }],
      penaltyRules: [],
      coachingOptions: [],
    };
    if (!f.penaltyRules) f.penaltyRules = [];
    if (!f.coachingOptions) f.coachingOptions = [];
    if (!f.resultBoxes) f.resultBoxes = [];
    if (f.importantNote === undefined) f.importantNote = '';
    if (!f.penaltySection) f.penaltySection = { id: 's_disc', name: 'ส่วนที่ 5 — การประเมินวินัยการทำงาน (Discipline & Compliance)', enabled: false, baseScore: 15, allowedRoles: ['admin','supervisor'], rules: [] };
    this._builderState = f;
    this._builderTab = 'sections';

    showModal({
      title: isEdit ? 'แก้ไขแบบฟอร์ม' : 'สร้างแบบฟอร์มใหม่',
      size: '960',
      body: `
        <div class="grid md:grid-cols-2 gap-4 mb-4">
          <div><label class="label">ชื่อแบบฟอร์ม <span class="req">*</span></label><input id="fb_name" class="input expandable" data-label="ชื่อแบบฟอร์ม" value="${escapeHtml(f.name)}" /></div>
          <div><label class="label">คำอธิบาย</label><input id="fb_desc" class="input expandable" data-label="คำอธิบายแบบฟอร์ม" value="${escapeHtml(f.description)}" /></div>
          <div class="flex items-center gap-4 md:col-span-2 flex-wrap">
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="fb_active" ${f.active ? 'checked' : ''} style="accent-color:var(--accent)" /><span>เปิดใช้งาน</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="fb_default" ${f.isDefault ? 'checked' : ''} style="accent-color:var(--accent)" /><span>เป็นค่าเริ่มต้น</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="fb_attach" ${f.allowAttachments ? 'checked' : ''} style="accent-color:var(--accent)" /><span><i class="fa-solid fa-paperclip mr-1"></i>อนุญาตแนบไฟล์</span></label>
          </div>
          <div class="md:col-span-2" id="fb_attachLabelWrap" style="${f.allowAttachments ? '' : 'display:none'}">
            <label class="label">ป้ายกำกับส่วนแนบไฟล์</label>
            <input id="fb_attachLabel" class="input" value="${escapeHtml(f.attachmentLabel || 'เอกสาร/หลักฐานประกอบการประเมิน')}" />
          </div>
        </div>

        <div class="flex border-b border-neutral-200 mb-3 flex-wrap" style="gap:0">
          <button class="btn btn-ghost" data-tab="sections" style="border-radius:0;padding:0.6rem 0.9rem">📋 Sections (ส่วน 2-3)</button>
          <button class="btn btn-ghost" data-tab="penalty" style="border-radius:0;padding:0.6rem 0.9rem">🛡️ วินัย/หักคะแนน (ส่วน 4)</button>
          <button class="btn btn-ghost" data-tab="results" style="border-radius:0;padding:0.6rem 0.9rem">🎯 กล่องสถานะ (ส่วน 5)</button>
          <button class="btn btn-ghost" data-tab="coaching" style="border-radius:0;padding:0.6rem 0.9rem">📚 Coaching (ส่วน 6)</button>
          <button class="btn btn-ghost" data-tab="note" style="border-radius:0;padding:0.6rem 0.9rem">📝 หมายเหตุ</button>
        </div>

        <div id="fb_tabContent"></div>
      `,
      footer: `<button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button><button id="fb_save" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> บันทึกแบบฟอร์ม</button>`
    });

    document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
      this._builderTab = b.dataset.tab;
      this._drawBuilderTab();
    }));
    // toggle attachment label visibility
    document.getElementById('fb_attach').addEventListener('change', e => {
      document.getElementById('fb_attachLabelWrap').style.display = e.target.checked ? '' : 'none';
    });
    document.getElementById('fb_save').addEventListener('click', () => this._saveBuilder());
    this._drawBuilderTab();
  },

  _drawBuilderTab() {
    document.querySelectorAll('[data-tab]').forEach(b => {
      const active = b.dataset.tab === this._builderTab;
      b.style.borderBottom = active ? '2px solid var(--accent)' : '2px solid transparent';
      b.style.color = active ? 'var(--accent)' : '';
      b.style.fontWeight = active ? '700' : '500';
    });
    const wrap = document.getElementById('fb_tabContent');
    if (this._builderTab === 'sections') this._drawBuilderSections(wrap);
    else if (this._builderTab === 'results') this._drawBuilderResults(wrap);
    else if (this._builderTab === 'coaching') this._drawBuilderCoaching(wrap);
    else if (this._builderTab === 'penalty') this._drawBuilderPenalty(wrap);
    else if (this._builderTab === 'note') this._drawBuilderNote(wrap);
  },

  // ---- Sections tab ----
  _drawBuilderSections(wrap) {
    const f = this._builderState;
    const totalMax = calcFormMax(f);
    wrap.innerHTML = `
      <div class="flex justify-between mb-2">
        <span class="text-mute text-xs">ลาก ↑↓ เพื่อย้ายลำดับ • ทุกคำถามใช้คะแนนเต็มเป็นค่าจริง (ไม่ใช่ %)</span>
        <span class="weight-sum ${totalMax === 100 ? 'ok' : 'warn'}">คะแนนเต็มรวม: ${totalMax}</span>
      </div>
      <div id="fb_sections"></div>
      <div class="mt-2"><button id="fb_addSec" class="btn btn-secondary"><i class="fa-solid fa-plus"></i> เพิ่ม Section</button></div>
    `;
    this._renderSectionsList();
    document.getElementById('fb_addSec').addEventListener('click', () => {
      this._builderState.sections.push({ id: DB.uid('s'), name: 'Section ใหม่', description: '', allowedRoles: ['admin', 'supervisor'], items: [] });
      this._renderSectionsList();
      this._updateMaxSum();
    });
  },

  _renderSectionsList() {
    const wrap = document.getElementById('fb_sections');
    const f = this._builderState;
    wrap.innerHTML = f.sections.map((sec, sIdx) => {
      const secMax = calcSectionMax(sec);
      const allow = sec.allowedRoles || [];
      return `
        <div class="section-block alt" data-sec-idx="${sIdx}">
          <div class="grid md:grid-cols-12 gap-2 items-center mb-2">
            <div class="md:col-span-9"><label class="label" style="font-size:11px">ชื่อส่วน (Section)</label><input class="input expandable" data-label="ชื่อ Section" placeholder="ชื่อ Section เช่น การประเมิน KPI Performance" value="${escapeHtml(sec.name)}" data-sec-field="name" /></div>
            <div class="md:col-span-3 flex gap-1 justify-end items-end" style="padding-bottom:2px">
              <span class="weight-tag" title="คะแนนเต็มของส่วนนี้ (รวมจากทุกหัวข้อ)">${secMax}</span>
              <button class="btn btn-ghost btn-icon" data-sec-dup="${sIdx}" title="คัดลอก Section นี้"><i class="fa-solid fa-copy"></i></button>
              <button class="btn btn-ghost btn-icon" data-sec-up="${sIdx}" ${sIdx === 0 ? 'disabled' : ''}><i class="fa-solid fa-arrow-up"></i></button>
              <button class="btn btn-ghost btn-icon" data-sec-down="${sIdx}" ${sIdx === f.sections.length - 1 ? 'disabled' : ''}><i class="fa-solid fa-arrow-down"></i></button>
              <button class="btn btn-danger btn-icon" data-sec-del="${sIdx}" ${f.sections.length <= 1 ? 'disabled' : ''}><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>

          <div class="mb-2"><label class="label" style="font-size:11px">คำอธิบาย / หลักเกณฑ์ของส่วนนี้ <span class="text-mute">(แสดงใต้ชื่อส่วนในฟอร์มและ PDF — เว้นว่างได้)</span></label><input class="input expandable" data-label="คำอธิบาย Section" placeholder="เช่น เกณฑ์คะแนน: 5=ดีเยี่ยม / 4=ดีมาก / 3=เป็นไปตามมาตรฐาน …" value="${escapeHtml(sec.description || '')}" data-sec-field="description" /></div>
          <div class="text-xs flex items-center gap-3 mb-2 px-1 flex-wrap" style="padding:0.4rem 0.6rem;background:var(--accent-soft);border-radius:4px;border-left:3px solid var(--accent)">
            <span class="text-mute font-semibold"><i class="fa-solid fa-shield-halved mr-1" style="color:var(--accent)"></i>ผู้มีสิทธิ์ให้คะแนน Section นี้:</span>
            <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" data-sec-allow="admin" ${allow.includes('admin') ? 'checked' : ''} style="accent-color:var(--accent)"/> Admin</label>
            <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" data-sec-allow="supervisor" ${allow.includes('supervisor') ? 'checked' : ''} style="accent-color:var(--accent)"/> Supervisor</label>
            <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" data-sec-allow="employee" ${allow.includes('employee') ? 'checked' : ''} style="accent-color:var(--accent)"/> Employee</label>
            ${!allow.length ? '<span class="text-mute italic">(ว่างไว้ = ทุก role)</span>' : ''}
          </div>

          ${this._renderKpiGroupBar(sec, sIdx)}

          <div data-items="${sIdx}">
            ${sec.items.map((it, iIdx) => this._renderBuilderItem(sIdx, iIdx, it, sec.items.length, sec)).join('')}
          </div>

          <div class="mt-2"><button class="btn btn-secondary btn-icon" data-add-item="${sIdx}"><i class="fa-solid fa-plus"></i> เพิ่มคำถาม</button></div>
        </div>
      `;
    }).join('');

    // Section field bindings + allowedRoles checkboxes
    wrap.querySelectorAll('[data-sec-idx]').forEach(secEl => {
      const sIdx = +secEl.dataset.secIdx;
      secEl.querySelectorAll('[data-sec-field]').forEach(inp => {
        inp.addEventListener('input', () => {
          this._builderState.sections[sIdx][inp.dataset.secField] = inp.value;
        });
      });
      secEl.querySelectorAll('[data-sec-allow]').forEach(cb => {
        cb.addEventListener('change', () => {
          const sec = this._builderState.sections[sIdx];
          if (!sec.allowedRoles) sec.allowedRoles = [];
          const role = cb.dataset.secAllow;
          if (cb.checked) {
            if (!sec.allowedRoles.includes(role)) sec.allowedRoles.push(role);
          } else {
            sec.allowedRoles = sec.allowedRoles.filter(r => r !== role);
          }
        });
      });
    });
    wrap.querySelectorAll('[data-sec-up]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.secUp; const arr = this._builderState.sections;
      [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; this._renderSectionsList(); this._updateMaxSum();
    }));
    wrap.querySelectorAll('[data-sec-down]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.secDown; const arr = this._builderState.sections;
      [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; this._renderSectionsList(); this._updateMaxSum();
    }));
    wrap.querySelectorAll('[data-sec-dup]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.secDup; const src = this._builderState.sections[i];
      const copy = JSON.parse(JSON.stringify(src)); copy.id = DB.uid('s'); copy.name = (src.name || 'Section') + ' (สำเนา)';
      copy.items = (copy.items || []).map(it => Object.assign({}, it, { id: DB.uid('i') }));
      this._builderState.sections.splice(i + 1, 0, copy); this._renderSectionsList(); this._updateMaxSum();
    }));
    wrap.querySelectorAll('[data-sec-del]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.secDel;
      confirmDialog({ title: 'ลบ Section', message: 'ต้องการลบ Section นี้ทั้งหมด?', confirmText: 'ลบ', type: 'delete' }).then(ok => {
        if (!ok) return;
        this._builderState.sections.splice(i, 1); this._renderSectionsList(); this._updateMaxSum();
      });
    }));
    wrap.querySelectorAll('[data-add-item]').forEach(b => b.addEventListener('click', () => {
      const sIdx = +b.dataset.addItem;
      this._builderState.sections[sIdx].items.push({
        id: DB.uid('i'), name: 'คำถามใหม่', description: '', type: 'rating5', maxScore: 10, config: {},
      });
      this._renderSectionsList(); this._updateMaxSum();
    }));
    // สลับลำดับคำถามขึ้น/ลง ภายใน section
    wrap.querySelectorAll('[data-it-up]').forEach(b => b.addEventListener('click', () => {
      const [s, i] = b.dataset.itUp.split('-').map(Number);
      const arr = this._builderState.sections[s].items;
      if (i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; this._renderSectionsList(); this._updateMaxSum(); }
    }));
    wrap.querySelectorAll('[data-it-down]').forEach(b => b.addEventListener('click', () => {
      const [s, i] = b.dataset.itDown.split('-').map(Number);
      const arr = this._builderState.sections[s].items;
      if (i < arr.length - 1) { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; this._renderSectionsList(); this._updateMaxSum(); }
    }));

    // KPI grouping: สลับเปิด/ปิด + จัดการกลุ่ม
    wrap.querySelectorAll('[data-sec-kpigroup]').forEach(cb => cb.addEventListener('change', () => {
      const sec = this._builderState.sections[+cb.dataset.secKpigroup];
      sec.kpiGrouped = cb.checked;
      if (cb.checked && !(sec.kpiGroups || []).length) sec.kpiGroups = [{ key: DB.uid('g'), label: 'กลุ่ม 1' }, { key: DB.uid('g'), label: 'กลุ่ม 2' }];
      this._renderSectionsList(); this._updateMaxSum();
    }));
    wrap.querySelectorAll('[data-add-group]').forEach(b => b.addEventListener('click', () => {
      const sec = this._builderState.sections[+b.dataset.addGroup];
      (sec.kpiGroups || (sec.kpiGroups = [])).push({ key: DB.uid('g'), label: 'กลุ่มใหม่' });
      this._renderSectionsList();
    }));
    wrap.querySelectorAll('[data-group-label]').forEach(inp => inp.addEventListener('input', () => {
      const [s, gi] = inp.dataset.groupLabel.split('-').map(Number);
      this._builderState.sections[s].kpiGroups[gi].label = inp.value;
    }));
    wrap.querySelectorAll('[data-group-del]').forEach(b => b.addEventListener('click', () => {
      const [s, gi] = b.dataset.groupDel.split('-').map(Number);
      this._builderState.sections[s].kpiGroups.splice(gi, 1);
      this._renderSectionsList();
    }));

    this._builderState.sections.forEach((sec, sIdx) => {
      sec.items.forEach((it, iIdx) => this._bindBuilderItem(sIdx, iIdx));
    });
  },

  _updateMaxSum() {
    const f = this._builderState;
    const max = calcFormMax(f);
    const sumEl = document.querySelector('#fb_tabContent .weight-sum');
    if (sumEl) {
      sumEl.textContent = `คะแนนเต็มรวม: ${max}`;
      sumEl.className = `weight-sum ${max === 100 ? 'ok' : 'warn'}`;
    }
  },

  // แถบแบ่งกลุ่มน้ำหนัก KPI ของ section (จับกลุ่มจากคอลัมน์ตอนนำเข้า)
  _renderKpiGroupBar(sec, sIdx) {
    // แสดงเฉพาะ Section ที่เป็น KPI (มีหัวข้อชนิด kpi/percent) — Section พฤติกรรมไม่ต้องแบ่งกลุ่ม
    const isKpiSec = (sec.items || []).some(it => it.type === 'kpi' || it.type === 'percent');
    if (!isKpiSec) return '';
    const on = !!sec.kpiGrouped;
    const groups = sec.kpiGroups || [];
    const groupSum = (key) => (sec.items || []).reduce((t, it) => { const w = it.groupWeights && it.groupWeights[key]; return t + ((w == null || w === '') ? 0 : +w); }, 0);
    return `
      <div class="text-xs mb-2" style="padding:0.45rem 0.7rem;background:#eff6ff;border-radius:5px;border-left:3px solid #2563eb">
        <label class="flex items-center gap-1 cursor-pointer" style="color:#1d4ed8;font-weight:600">
          <input type="checkbox" data-sec-kpigroup="${sIdx}" ${on ? 'checked' : ''} style="accent-color:#2563eb"/>
          <i class="fa-solid fa-users-rectangle mr-1"></i>แบ่งกลุ่มน้ำหนัก KPI (ตามประเภทพนักงาน — ระบบจับกลุ่มจากคอลัมน์ "กลุ่ม KPI" ตอนนำเข้า)
        </label>
        ${on ? `
          <div class="mt-2 flex flex-col gap-1">
            <span class="text-mute">กลุ่ม (ชื่อกลุ่ม = ค่าที่ใช้จับคู่ในไฟล์นำเข้า) • "รวม" คือผลรวมน้ำหนักของแต่ละกลุ่ม (ควรได้ 100):</span>
            ${groups.map((g, gi) => { const s = groupSum(g.key); return `
              <div class="flex items-center gap-1">
                <input class="input" style="max-width:280px" placeholder="ชื่อกลุ่ม เช่น มีวิ่งบังคับคดี" value="${escapeHtml(g.label || '')}" data-group-label="${sIdx}-${gi}"/>
                <span class="weight-sum ${s === 100 ? 'ok' : 'warn'}" data-group-sum="${sIdx}-${gi}" style="font-size:11px">รวม ${s}</span>
                <button class="btn btn-danger btn-icon" data-group-del="${sIdx}-${gi}" ${groups.length <= 1 ? 'disabled' : ''} title="ลบกลุ่ม"><i class="fa-solid fa-xmark"></i></button>
              </div>`; }).join('')}
            <div><button class="btn btn-secondary btn-icon" data-add-group="${sIdx}"><i class="fa-solid fa-plus"></i> เพิ่มกลุ่ม</button></div>
          </div>` : ''}
      </div>`;
  },

  // อัปเดตผลรวมน้ำหนักต่อกลุ่มแบบสด (เรียกตอนพิมพ์น้ำหนักในแต่ละหัวข้อ)
  _updateGroupSums(sIdx) {
    const sec = this._builderState.sections[sIdx];
    if (!sec || !sec.kpiGrouped) return;
    (sec.kpiGroups || []).forEach((g, gi) => {
      const el = document.querySelector(`[data-group-sum="${sIdx}-${gi}"]`);
      if (!el) return;
      const sum = (sec.items || []).reduce((t, it) => { const w = it.groupWeights && it.groupWeights[g.key]; return t + ((w == null || w === '') ? 0 : +w); }, 0);
      el.textContent = `รวม ${sum}`;
      el.className = `weight-sum ${sum === 100 ? 'ok' : 'warn'}`;
    });
  },

  _renderBuilderItem(sIdx, iIdx, it, count = 1, sec = null) {
    const typeMeta = ITEM_TYPES[it.type] || { label: it.type, icon: 'fa-circle' };
    return `
      <div class="item-block" data-item-key="${sIdx}-${iIdx}">
        <div class="grid md:grid-cols-12 gap-2 items-end">
          <div class="md:col-span-5"><label class="label" style="font-size:11px">หัวข้อ / คำถาม ${iIdx + 1}</label><input class="input expandable" data-label="ชื่อคำถาม" placeholder="ชื่อหัวข้อประเมิน" value="${escapeHtml(it.name)}" data-it-field="name" /></div>
          <div class="md:col-span-3"><label class="label" style="font-size:11px">รูปแบบคำตอบ</label>
            <select class="input" data-it-field="type">
              ${Object.entries(ITEM_TYPES).map(([k, v]) => `<option value="${k}" ${it.type === k ? 'selected' : ''}>${v.label}</option>`).join('')}
            </select>
          </div>
          <div class="md:col-span-2"><label class="label" style="font-size:11px">คะแนนเต็ม</label><input type="number" class="input mono" min="0" max="100" step="0.5" value="${it.maxScore || 10}" data-it-field="maxScore" /></div>
          <div class="md:col-span-2 flex items-center justify-end gap-1" style="padding-bottom:2px">
            <button class="btn btn-ghost btn-icon" data-it-up="${sIdx}-${iIdx}" ${iIdx === 0 ? 'disabled' : ''} title="เลื่อนขึ้น"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="btn btn-ghost btn-icon" data-it-down="${sIdx}-${iIdx}" ${iIdx === count - 1 ? 'disabled' : ''} title="เลื่อนลง"><i class="fa-solid fa-arrow-down"></i></button>
            <button class="btn btn-ghost btn-icon" data-dup-item="${sIdx}-${iIdx}" title="คัดลอกหัวข้อนี้"><i class="fa-solid fa-copy"></i></button>
            <button class="btn btn-danger btn-icon" data-del-item="${sIdx}-${iIdx}" title="ลบหัวข้อ"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
        <div class="grid md:grid-cols-12 gap-2 items-end mt-1">
          <div class="md:col-span-9"><label class="label" style="font-size:11px">คำอธิบาย / นิยามหัวข้อ <span class="text-mute">(แสดงใต้ชื่อหัวข้อในฟอร์ม)</span></label><input class="input expandable" data-label="คำอธิบายคำถาม" placeholder="เช่น ผลการจัดเก็บตามเป้าหมาย — น้ำหนัก 60%" value="${escapeHtml(it.description || '')}" data-it-field="description" /></div>
          <div class="md:col-span-3" style="padding-bottom:6px"><label class="flex items-center gap-2 cursor-pointer text-xs"><input type="checkbox" data-it-optional ${it.optional ? 'checked' : ''} style="accent-color:var(--accent)" /> ไม่บังคับกรอก <span class="text-mute">(เว้นว่างได้ = 0 คะแนน)</span></label></div>
        </div>
        <div class="mt-2" data-item-config="${sIdx}-${iIdx}" style="padding:6px 8px;background:var(--bg-soft);border-radius:6px">
          <div class="text-mute text-xs mb-1"><i class="fa-solid ${typeMeta.icon} mr-1"></i>การตั้งค่าเฉพาะรูปแบบ "${typeMeta.label}"</div>
          ${this._renderBuilderItemConfig(it, sec)}
        </div>
      </div>
    `;
  },

  _renderBuilderItemConfig(it, sec = null) {
    switch (it.type) {
      case 'percent':
      case 'kpi': {
        const cfg = it.config || {};
        const gw = it.groupWeights || {};
        const groupWeightsRow = (sec && sec.kpiGrouped && (sec.kpiGroups || []).length) ? `
          <div class="flex items-center gap-2 text-xs flex-wrap mt-1" style="padding-top:5px;border-top:1px dashed var(--line)">
            <span style="color:#1d4ed8;font-weight:600"><i class="fa-solid fa-scale-balanced mr-1"></i>น้ำหนักต่อกลุ่ม:</span>
            ${(sec.kpiGroups || []).map(g => `<span class="flex items-center gap-1"><span class="text-mute">${escapeHtml(g.label || 'กลุ่ม')}:</span><input type="number" min="0" step="0.5" class="input mono" style="max-width:72px" value="${gw[g.key] ?? ''}" data-gw="${escapeHtml(g.key)}" /></span>`).join('')}
            <span class="text-mute">(0 / ว่าง = ไม่อยู่ในกลุ่มนี้)</span>
          </div>` : '';
        return `
          <div class="flex items-center gap-3 text-xs flex-wrap">
            <div class="flex items-center gap-1"><span class="text-mute">เป้าหมาย:</span>
              <input type="number" class="input mono" style="max-width:100px" min="0.01" step="0.01" value="${cfg.target || 100}" data-cfg="target" /></div>
            ${it.type === 'kpi' ? `<div class="flex items-center gap-1"><span class="text-mute">หน่วย:</span>
              <input class="input" style="max-width:80px" value="${escapeHtml(cfg.unit || '%')}" data-cfg="unit" /></div>
            <div class="flex items-center gap-1"><span class="text-mute">ทิศทาง:</span>
              <select class="input" style="max-width:190px" data-cfg="direction">
                <option value="higher" ${(cfg.direction || 'higher') === 'higher' ? 'selected' : ''}>ยิ่งสูงยิ่งดี (จริง ÷ เป้า)</option>
                <option value="lower" ${cfg.direction === 'lower' ? 'selected' : ''}>ยิ่งต่ำยิ่งดี (เป้า ÷ จริง)</option>
              </select></div>
            <div class="flex items-center gap-1"><span class="text-mute">เพดาน %บรรลุ:</span>
              <input type="number" class="input mono" style="max-width:80px" min="1" step="1" value="${cfg.capPct || 100}" data-cfg="capPct" title="100 = ได้ไม่เกินคะแนนเต็ม • 120 = ทำเกินเป้าได้คะแนนเพิ่มถึง 120%" /></div>
            <div class="flex items-center gap-1"><span class="text-mute">ขั้นต่ำ %บรรลุ:</span>
              <input type="number" class="input mono" style="max-width:80px" min="0" step="1" value="${cfg.minPct || 0}" data-cfg="minPct" title="ต่ำกว่านี้ = 0 คะแนน (0 = ไม่กำหนด)" /></div>` : ''}
            <span class="text-mute">คะแนน = %บรรลุ × ${(sec && sec.kpiGrouped) ? 'น้ำหนักกลุ่ม' : it.maxScore} ÷ 100</span>
          </div>${groupWeightsRow}`;
      }
      case 'yesno': {
        const cfg = it.config || {};
        return `
          <div class="flex items-center gap-3 text-xs">
            <div class="flex items-center gap-1"><span class="text-mute">ใช่ → fraction:</span><input type="number" min="0" max="1" step="0.05" class="input mono" style="max-width:80px" value="${cfg.yesFraction ?? 1}" data-cfg="yesFraction" /></div>
            <div class="flex items-center gap-1"><span class="text-mute">ไม่ใช่ → fraction:</span><input type="number" min="0" max="1" step="0.05" class="input mono" style="max-width:80px" value="${cfg.noFraction ?? 0.2}" data-cfg="noFraction" /></div>
            <span class="text-mute">(× คะแนนเต็ม ${it.maxScore})</span>
          </div>`;
      }
      case 'choice': {
        const opts = (it.config && it.config.options) || [];
        return `
          <div class="text-xs">
            <div class="text-mute mb-1">ตัวเลือก (label + fraction 0-1):</div>
            <div data-choice-opts>
              ${opts.map((o, i) => `
                <div class="flex gap-1 mb-1" data-opt-idx="${i}">
                  <input class="input expandable" data-label="ข้อความตัวเลือก" placeholder="ข้อความตัวเลือก" value="${escapeHtml(o.label)}" data-opt-field="label" />
                  <input type="number" min="0" max="1" step="0.05" class="input mono" style="max-width:80px" value="${o.fraction ?? 1}" data-opt-field="fraction" />
                  <button class="btn btn-danger btn-icon" data-opt-del="${i}"><i class="fa-solid fa-xmark"></i></button>
                </div>
              `).join('')}
            </div>
            <button class="btn btn-secondary btn-icon" data-add-opt><i class="fa-solid fa-plus"></i> เพิ่มตัวเลือก</button>
          </div>`;
      }
      case 'rating5': {
        const a = (it.config && it.config.anchors) || {};
        return `
          <div class="text-xs">
            <div class="text-mute mb-1">เกณฑ์การให้คะแนน (Anchor) — แสดงในปุ่ม "?" ของหัวข้อ (เว้นว่าง = ไม่แสดงระดับนั้น):</div>
            ${['5', '4', '3', '2', '1'].map(k => `
              <div class="flex items-center gap-2 mb-1">
                <span class="mono" style="width:20px;text-align:center;font-weight:700;color:var(--accent)">${k}</span>
                <input class="input expandable" data-label="เกณฑ์การให้คะแนน ระดับ ${k}" style="flex:1" placeholder="คำอธิบายระดับ ${k}" value="${escapeHtml(a[k] || '')}" data-anchor="${k}" />
              </div>`).join('')}
          </div>`;
      }
      default:
        return `<div class="text-mute text-xs">(ประเภทนี้ไม่มีการตั้งค่าเพิ่มเติม)</div>`;
    }
  },

  _bindBuilderItem(sIdx, iIdx) {
    const root = document.querySelector(`[data-item-key="${sIdx}-${iIdx}"]`);
    if (!root) return;
    const it = this._builderState.sections[sIdx].items[iIdx];

    root.querySelectorAll('[data-it-field]').forEach(inp => {
      inp.addEventListener('input', () => {
        const field = inp.dataset.itField;
        if (field === 'maxScore') {
          it.maxScore = +inp.value || 0;
          this._updateMaxSum();
          // also refresh section header sum
          const secEl = root.closest('[data-sec-idx]');
          const weightTag = secEl?.querySelector('.weight-tag');
          if (weightTag) weightTag.textContent = calcSectionMax(this._builderState.sections[sIdx]);
        } else if (field === 'type') {
          it.type = inp.value;
          if (it.type === 'choice') it.config = { options: [{ label: 'ผ่าน', fraction: 1 }, { label: 'ไม่ผ่าน', fraction: 0 }] };
          else if (it.type === 'percent') it.config = { target: 100 };
          else if (it.type === 'kpi') it.config = { target: 100, unit: '%' };
          else if (it.type === 'yesno') it.config = { yesFraction: 1, noFraction: 0.2 };
          else it.config = {};
          const cfgWrap = root.querySelector(`[data-item-config="${sIdx}-${iIdx}"]`);
          cfgWrap.innerHTML = this._renderBuilderItemConfig(it, this._builderState.sections[sIdx]);
          this._bindConfigInputs(sIdx, iIdx);
        } else {
          it[field] = inp.value;
        }
      });
    });

    root.querySelector('[data-it-optional]')?.addEventListener('change', (e) => { it.optional = !!e.target.checked; });
    root.querySelector(`[data-dup-item="${sIdx}-${iIdx}"]`)?.addEventListener('click', () => {
      const copy = JSON.parse(JSON.stringify(it)); copy.id = DB.uid('i'); copy.name = (it.name || 'หัวข้อ') + ' (สำเนา)';
      this._builderState.sections[sIdx].items.splice(iIdx + 1, 0, copy);
      this._renderSectionsList(); this._updateMaxSum();
    });
    root.querySelector(`[data-del-item="${sIdx}-${iIdx}"]`)?.addEventListener('click', () => {
      this._builderState.sections[sIdx].items.splice(iIdx, 1);
      this._renderSectionsList(); this._updateMaxSum();
    });

    this._bindConfigInputs(sIdx, iIdx);
  },

  _bindConfigInputs(sIdx, iIdx) {
    const root = document.querySelector(`[data-item-key="${sIdx}-${iIdx}"]`);
    if (!root) return;
    const it = this._builderState.sections[sIdx].items[iIdx];

    root.querySelectorAll('[data-cfg]').forEach(inp => {
      const apply = () => {
        const field = inp.dataset.cfg;
        if (!it.config) it.config = {};
        it.config[field] = inp.type === 'number' ? +inp.value : inp.value;
      };
      inp.addEventListener('input', apply); inp.addEventListener('change', apply);
    });
    // น้ำหนักต่อกลุ่ม KPI (ว่าง = ไม่อยู่ในกลุ่มนั้น)
    root.querySelectorAll('[data-gw]').forEach(inp => {
      inp.addEventListener('input', () => {
        if (!it.groupWeights) it.groupWeights = {};
        const key = inp.dataset.gw; const v = inp.value.trim();
        if (v === '') delete it.groupWeights[key]; else it.groupWeights[key] = +v;
        AdminUI._updateGroupSums(sIdx);
      });
    });
    // anchors (เกณฑ์คะแนน rating5)
    root.querySelectorAll('[data-anchor]').forEach(inp => {
      inp.addEventListener('input', () => {
        if (!it.config) it.config = {};
        if (!it.config.anchors) it.config.anchors = {};
        const v = inp.value.trim();
        if (v) it.config.anchors[inp.dataset.anchor] = v;
        else delete it.config.anchors[inp.dataset.anchor];
      });
    });

    if (it.type === 'choice') {
      const redrawChoice = () => {
        const cfgWrap = root.querySelector(`[data-item-config="${sIdx}-${iIdx}"]`);
        cfgWrap.innerHTML = this._renderBuilderItemConfig(it);
        this._bindConfigInputs(sIdx, iIdx);
      };
      root.querySelectorAll('[data-opt-field]').forEach(inp => {
        inp.addEventListener('input', () => {
          const optEl = inp.closest('[data-opt-idx]');
          const optIdx = +optEl.dataset.optIdx;
          const field = inp.dataset.optField;
          it.config.options[optIdx][field] = field === 'fraction' ? +inp.value : inp.value;
        });
      });
      root.querySelectorAll('[data-opt-del]').forEach(b => b.addEventListener('click', () => {
        it.config.options.splice(+b.dataset.optDel, 1);
        redrawChoice();
      }));
      root.querySelector('[data-add-opt]')?.addEventListener('click', () => {
        it.config.options.push({ label: 'ตัวเลือกใหม่', fraction: 0.5 });
        redrawChoice();
      });
    }
  },

  // ---- Penalty tab ----
  _drawBuilderPenalty(wrap) {
    const f = this._builderState;
    // เปิดส่วนวินัยถ้ายังไม่มี
    if (!f.penaltySection) {
      f.penaltySection = { id: 's_disc', name: 'การประเมินวินัยการทำงาน (Discipline & Compliance)', enabled: true, baseScore: 20, allowedRoles: ['admin','supervisor'], rules: [], bonusRules: [] };
    }
    const ps = f.penaltySection;
    if (!Array.isArray(ps.bonusRules)) ps.bonusRules = [];

    wrap.innerHTML = `
      <div class="text-mute text-xs mb-2">ส่วนวินัย (ส่วนที่ 5) — เริ่มต้นที่คะแนนเต็มแล้วหักตามสถิติ คะแนน = max(0, เต็ม − หักรวม) รวมเข้าคะแนนรวม</div>
      <div class="grid md:grid-cols-3 gap-3 mb-3">
        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="fb_psEnabled" ${ps.enabled ? 'checked' : ''} style="accent-color:var(--accent)" /><span>เปิดใช้ส่วนวินัย</span></label>
        <div class="flex items-center gap-2"><span class="text-mute text-xs">คะแนนเต็ม:</span><input type="number" min="0" id="fb_psBase" class="input mono" style="max-width:90px" value="${ps.baseScore}" /></div>
      </div>

        <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" data-ps-allow="admin" ${(ps.allowedRoles||[]).includes('admin') ? 'checked' : ''} style="accent-color:var(--accent)"/> Admin</label>
        <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" data-ps-allow="supervisor" ${(ps.allowedRoles||[]).includes('supervisor') ? 'checked' : ''} style="accent-color:var(--accent)"/> Supervisor</label>
        <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" data-ps-allow="employee" ${(ps.allowedRoles||[]).includes('employee') ? 'checked' : ''} style="accent-color:var(--accent)"/> Employee</label>
      </div>
      <div class="text-mute text-xs mb-1"><i class="fa-solid fa-circle-minus mr-1" style="color:var(--err)"></i>รายการหักคะแนน (Deductions):</div>
      <div id="fb_pen"></div>
      <button id="fb_addPen" class="btn btn-secondary mt-2"><i class="fa-solid fa-plus"></i> เพิ่มรายการหัก</button>

      <div class="text-mute text-xs mb-1 mt-4"><i class="fa-solid fa-circle-plus mr-1" style="color:var(--ok)"></i>รายการบวกคะแนน (Bonuses) — ให้คะแนนเมื่อรายการหักที่กำหนด = 0 ทั้งหมด:</div>
      <div id="fb_bonus"></div>
      <button id="fb_addBonus" class="btn btn-secondary mt-2"><i class="fa-solid fa-plus"></i> เพิ่มโบนัส</button>
    `;

    document.getElementById('fb_psEnabled').addEventListener('change', e => { ps.enabled = e.target.checked; });
    document.getElementById('fb_psBase').addEventListener('input', e => { ps.baseScore = +e.target.value || 0; });
    document.getElementById('fb_psName').addEventListener('input', e => { ps.name = e.target.value; });
    wrap.querySelectorAll('[data-ps-allow]').forEach(cb => cb.addEventListener('change', () => {
      if (!ps.allowedRoles) ps.allowedRoles = [];
      const role = cb.dataset.psAllow;
      if (cb.checked) { if (!ps.allowedRoles.includes(role)) ps.allowedRoles.push(role); }
      else ps.allowedRoles = ps.allowedRoles.filter(r => r !== role);
    }));

    const drawPen = () => {
      const pwrap = document.getElementById('fb_pen');
      pwrap.innerHTML = ps.rules.map((r, i) => `
        <div class="item-block" data-pen-idx="${i}">
          <div class="grid md:grid-cols-12 gap-2 items-center">
            <div class="md:col-span-3"><input class="input expandable" data-label="ชื่อรายการหักคะแนน" placeholder="ชื่อรายการ" value="${escapeHtml(r.name)}" data-pen-field="name" /></div>
            <div class="md:col-span-3"><input class="input expandable" data-label="เกณฑ์การหัก (note)" placeholder="เกณฑ์การหัก (note)" value="${escapeHtml(r.note || '')}" data-pen-field="note" /></div>
            <div class="md:col-span-1"><input class="input" placeholder="หน่วย" value="${escapeHtml(r.unit || '')}" data-pen-field="unit" /></div>
            <div class="md:col-span-2 flex items-center gap-1">
              <span class="text-mute text-xs">Free:</span>
              <input type="number" min="0" class="input mono" value="${r.freeCount || 0}" data-pen-field="freeCount" />
            </div>
            <div class="md:col-span-2 flex items-center gap-1">
              <span class="text-mute text-xs">-/หน่วย:</span>
              <input type="number" min="0" step="0.5" class="input mono" value="${r.perOccurrence || 0}" data-pen-field="perOccurrence" />
            </div>
            <div class="md:col-span-1 flex justify-end gap-1">
              <button class="btn btn-danger btn-icon" data-pen-del="${i}"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        </div>
      `).join('') || '<div class="text-mute text-xs italic">ยังไม่มีรายการหักคะแนน</div>';

      pwrap.querySelectorAll('[data-pen-idx]').forEach(el => {
        const i = +el.dataset.penIdx;
        el.querySelectorAll('[data-pen-field]').forEach(inp => {
          inp.addEventListener('input', () => {
            const field = inp.dataset.penField;
            ps.rules[i][field] = (field === 'freeCount' || field === 'perOccurrence') ? +inp.value : inp.value;
          });
        });
      });
      pwrap.querySelectorAll('[data-pen-del]').forEach(b => b.addEventListener('click', () => {
        ps.rules.splice(+b.dataset.penDel, 1); drawPen(); drawBonus();
      }));
    };

    // --- รายการบวกคะแนน (Bonuses) ---
    const drawBonus = () => {
      const bwrap = document.getElementById('fb_bonus');
      if (!bwrap) return;
      bwrap.innerHTML = ps.bonusRules.map((b, i) => `
        <div class="item-block" data-bonus-idx="${i}">
          <div class="grid md:grid-cols-12 gap-2 items-center">
            <div class="md:col-span-3"><input class="input expandable" data-label="ชื่อโบนัส" placeholder="ชื่อโบนัส" value="${escapeHtml(b.name || '')}" data-bonus-field="name" /></div>
            <div class="md:col-span-5"><input class="input expandable" data-label="หมายเหตุ/เกณฑ์ โบนัส" placeholder="หมายเหตุ/เกณฑ์" value="${escapeHtml(b.note || '')}" data-bonus-field="note" /></div>
            <div class="md:col-span-3 flex items-center gap-1"><span class="text-mute text-xs">+คะแนน:</span><input type="number" min="0" step="0.5" class="input mono" value="${b.amount || 0}" data-bonus-field="amount" /></div>
            <div class="md:col-span-1 flex justify-end"><button class="btn btn-danger btn-icon" data-bonus-del="${i}"><i class="fa-solid fa-trash"></i></button></div>
          </div>
          <div class="text-xs mt-2" style="padding-left:4px">
            <span class="text-mute">ให้โบนัสเมื่อรายการต่อไปนี้ = 0 ทั้งหมด:</span>
            <div class="flex flex-wrap gap-3 mt-1">
              ${ps.rules.length ? ps.rules.map(r => `<label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" data-bonus-cond="${r.id}" ${((b.condition && b.condition.allZero) || []).includes(r.id) ? 'checked' : ''} style="accent-color:var(--ok)"/> ${escapeHtml(r.name)}</label>`).join('') : '<span class="text-mute italic">เพิ่มรายการหักก่อน</span>'}
            </div>
          </div>
        </div>
      `).join('') || '<div class="text-mute text-xs italic">ยังไม่มีรายการโบนัส</div>';

      bwrap.querySelectorAll('[data-bonus-idx]').forEach(el => {
        const i = +el.dataset.bonusIdx;
        const b = ps.bonusRules[i];
        if (!b.condition) b.condition = { allZero: [] };
        el.querySelectorAll('[data-bonus-field]').forEach(inp => {
          inp.addEventListener('input', () => {
            const field = inp.dataset.bonusField;
            b[field] = field === 'amount' ? (+inp.value || 0) : inp.value;
          });
        });
        el.querySelectorAll('[data-bonus-cond]').forEach(cb => cb.addEventListener('change', () => {
          if (!b.condition) b.condition = { allZero: [] };
          if (!Array.isArray(b.condition.allZero)) b.condition.allZero = [];
          const rid = cb.dataset.bonusCond;
          if (cb.checked) { if (!b.condition.allZero.includes(rid)) b.condition.allZero.push(rid); }
          else b.condition.allZero = b.condition.allZero.filter(x => x !== rid);
        }));
      });
      bwrap.querySelectorAll('[data-bonus-del]').forEach(btn => btn.addEventListener('click', () => {
        ps.bonusRules.splice(+btn.dataset.bonusDel, 1); drawBonus();
      }));
    };

    drawPen();
    drawBonus();
    document.getElementById('fb_addPen').addEventListener('click', () => {
      ps.rules.push({ id: DB.uid('p'), name: 'รายการใหม่', unit: 'ครั้ง', perOccurrence: 2, freeCount: 0, note: '' });
      drawPen(); drawBonus();
    });
    document.getElementById('fb_addBonus').addEventListener('click', () => {
      ps.bonusRules.push({ id: DB.uid('b'), name: 'โบนัสใหม่', amount: 2, condition: { allZero: [] }, note: '' });
      drawBonus();
    });
  },

  // ---- Coaching tab ----
  _drawBuilderCoaching(wrap) {
    const f = this._builderState;
    wrap.innerHTML = `
      <div class="text-mute text-xs mb-2">ตัวเลือกแนวทางพัฒนาที่หัวหน้าจะติ๊กได้หลังการประเมิน</div>
      <div id="fb_coach"></div>
      <button id="fb_addCoach" class="btn btn-secondary mt-2"><i class="fa-solid fa-plus"></i> เพิ่มตัวเลือก</button>
    `;
    const draw = () => {
      const cwrap = document.getElementById('fb_coach');
      cwrap.innerHTML = f.coachingOptions.map((o, i) => `
        <div class="item-block" data-coach-idx="${i}">
          <div class="flex gap-2 items-center">
            <input class="input expandable" data-label="ตัวเลือกแนวทางพัฒนา (Coaching)" placeholder="ข้อความ" value="${escapeHtml(o)}" data-coach-field />
            <button class="btn btn-ghost btn-icon" data-coach-up="${i}" ${i === 0 ? 'disabled' : ''}><i class="fa-solid fa-arrow-up"></i></button>
            <button class="btn btn-ghost btn-icon" data-coach-down="${i}" ${i === f.coachingOptions.length - 1 ? 'disabled' : ''}><i class="fa-solid fa-arrow-down"></i></button>
            <button class="btn btn-danger btn-icon" data-coach-del="${i}"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('') || '<div class="text-mute text-xs italic">ยังไม่มีตัวเลือก Coaching</div>';

      cwrap.querySelectorAll('[data-coach-idx]').forEach(el => {
        const i = +el.dataset.coachIdx;
        el.querySelector('[data-coach-field]').addEventListener('input', e => { f.coachingOptions[i] = e.target.value; });
      });
      cwrap.querySelectorAll('[data-coach-up]').forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.coachUp; [f.coachingOptions[i - 1], f.coachingOptions[i]] = [f.coachingOptions[i], f.coachingOptions[i - 1]]; draw();
      }));
      cwrap.querySelectorAll('[data-coach-down]').forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.coachDown; [f.coachingOptions[i + 1], f.coachingOptions[i]] = [f.coachingOptions[i], f.coachingOptions[i + 1]]; draw();
      }));
      cwrap.querySelectorAll('[data-coach-del]').forEach(b => b.addEventListener('click', () => {
        f.coachingOptions.splice(+b.dataset.coachDel, 1); draw();
      }));
    };
    draw();
    document.getElementById('fb_addCoach').addEventListener('click', () => {
      f.coachingOptions.push('ตัวเลือกใหม่'); draw();
    });
  },

    document.getElementById('fb_noteConsider').addEventListener('input', e => { n.considerations = e.target.value; });

  _saveBuilder() {
    const f = this._builderState;
    f.name = document.getElementById('fb_name').value.trim();
    f.description = document.getElementById('fb_desc').value.trim();
    f.active = document.getElementById('fb_active').checked;
    f.isDefault = document.getElementById('fb_default').checked;
    f.allowAttachments = document.getElementById('fb_attach').checked;
    f.attachmentLabel = document.getElementById('fb_attachLabel').value.trim() || 'เอกสาร/หลักฐานประกอบ';

    if (!f.name) { toast('กรุณาระบุชื่อฟอร์ม', 'error'); return; }
    if (!f.sections.length) { toast('ต้องมีอย่างน้อย 1 Section', 'error'); return; }
    for (const sec of f.sections) {
      if (!sec.name.trim()) { toast('Section ต้องมีชื่อ', 'error'); return; }
      if (!sec.items.length) { toast(`Section "${sec.name}" ต้องมีอย่างน้อย 1 คำถาม`, 'error'); return; }
      for (const it of sec.items) {
        if (!it.name.trim()) { toast('คำถามต้องมีชื่อ', 'error'); return; }
        if (!it.maxScore || it.maxScore <= 0) { toast(`คำถาม "${it.name}" ต้องมีคะแนนเต็ม > 0`, 'error'); return; }
        if (it.type === 'choice' && (!it.config.options || it.config.options.length < 2)) {
          toast(`คำถาม "${it.name}" ต้องมีตัวเลือกอย่างน้อย 2 ตัว`, 'error'); return;
        }
      }
    }
    if (!f.id) f.id = DB.uid('f');
    DB.upsertForm(f);
    closeModal();
    toast('บันทึกฟอร์มสำเร็จ', 'success');
    App.go('hr-forms');
  },

      </div>

      <div class="card !p-0 overflow-x-auto">
        <table class="tbl">
          <thead>
            <tr><th>รอบ</th><th>พนักงาน</th><th>แผนก</th><th>KPI</th><th>พฤติกรรม</th><th>วินัย</th><th>รวม</th><th>ระดับ</th><th>สถานะ</th><th>วันที่</th><th class="no-print">การดำเนินการ</th></tr>
          </thead>
          <tbody id="reportBody"></tbody>
        </table>
      </div>
      <div id="reportPager" class="flex items-center justify-center gap-2 mt-3 flex-wrap"></div>
    `;

    let rpPage = 0;
    const RP_PER_PAGE = 100;
    const draw = () => {
      const fFrom = document.getElementById('filterFrom').value;
      const fTo = document.getElementById('filterTo').value;
      const fQ = document.getElementById('filterSearch').value.trim().toLowerCase();
      const fDateType = document.getElementById('filterDateType').value;
      const fDateFrom = document.getElementById('filterDateFrom').value;
      const fDateTo = document.getElementById('filterDateTo').value;
      const fe = document.getElementById('filterEmp').value;
      const ff = document.getElementById('filterForm').value;
      const fg = document.getElementById('filterGrade').value;
      const fs = document.getElementById('filterStatus').value;
      const list = evals.filter(e => {
        if (fFrom && e.period < fFrom) return false;
        if (fTo && e.period > fTo) return false;
        if (fe && e.employeeId !== fe) return false;
        if (ff && e.formId !== ff) return false;
        if (fg && e.grade !== fg) return false;
        if (fs && e.status !== fs) return false;
        if (fDateType) {
          const field = fDateType === 'created' ? 'createdAt' : 'reviewedAt';
          const v = e[field] ? e[field].slice(0, 10) : '';
          if (!v) return false;
          if (fDateFrom && v < fDateFrom) return false;
          if (fDateTo && v > fDateTo) return false;
        }
        if (fQ) {
          const u = DB.getUserById(e.employeeId);
          const hay = `${u?.fullName || ''} ${u?.employeeCode || ''} ${u?.department || ''} ${evalChainNames(e, ' ')} ${e.overallComment || ''}`.toLowerCase();
          if (!hay.includes(fQ)) return false;
        }
        return true;
      });
      const totalPages = Math.max(1, Math.ceil(list.length / RP_PER_PAGE));
      rpPage = Math.min(Math.max(0, rpPage), totalPages - 1);
      const rpStart = rpPage * RP_PER_PAGE;
      const shown = list.slice(rpStart, rpStart + RP_PER_PAGE);
      Pager.render(document.getElementById('reportPager'), rpPage, totalPages, (np) => { rpPage = np; draw(); });
      const body = document.getElementById('reportBody');
      body.innerHTML = shown.map(e => {
        const u = DB.getUserById(e.employeeId);
        const f = DB.getFormForEval(e);
        const info = gradeInfoFor(e.totalScore, e.totalMax);
        const kpi = e.sectionScores[0];
        const behav = e.sectionScores[1];
        const psc = e.penaltySectionScore;
        return `
          <tr>
            <td>${fmtPeriod(e.period)}</td>
            <td><b>${escapeHtml(u?.fullName || '-')}</b> <span class="text-mute mono" style="font-size:11px">${escapeHtml(u?.employeeCode || '')}</span></td>
            <td>${escapeHtml(u?.department || '-')}</td>
            <td class="mono">${kpi ? `${kpi.score.toFixed(1)}/${kpi.maxScore}` : '—'}</td>
            <td class="mono">${behav ? `${behav.score.toFixed(1)}/${behav.maxScore}` : '—'}</td>
            <td class="mono">${psc ? `${psc.score.toFixed(1)}/${psc.max}` : '—'}</td>
            <td class="mono"><b>${e.totalScore.toFixed(2)}</b>/${e.totalMax}</td>
            <td><span class="grade-tag" style="color:${info?.color};border-color:${info?.color};background:${info?.color}15">${e.grade}</span></td>
            <td>${({assigned:'<span class="badge warn">รอประเมิน</span>', pending_review:'<span class="badge info">รอ HR ตรวจ</span>', confirmed:'<span class="badge ok"><i class="fa-solid fa-check mr-1"></i>ยืนยันแล้ว</span>'}[e.status] || e.status)}</td>
            <td class="text-xs text-mute">${fmtDate(e.createdAt)}</td>
            <td class="no-print whitespace-nowrap">
              <button class="btn btn-secondary btn-icon" data-view="${e.id}"><i class="fa-solid fa-eye"></i></button>
              <button class="btn btn-danger btn-icon" data-del="${e.id}"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      }).join('') || `<tr><td colspan="11" class="text-center text-mute" style="padding:2rem">ไม่พบข้อมูล</td></tr>`;
      body.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => this.viewEvaluation(b.dataset.view)));
      body.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
        confirmDialog({ title: 'ลบการประเมิน', message: 'ต้องการลบการประเมินนี้?', confirmText: 'ลบ', type: 'delete' }).then(ok => {
          if (!ok) return;
          DB.deleteEvaluation(b.dataset.del);
          toast('ลบการประเมินแล้ว', 'success'); App.go('hr-list');
        });
      }));
    };
    const redraw = () => { rpPage = 0; draw(); };
    document.getElementById('filterFrom').addEventListener('change', redraw);
    document.getElementById('filterTo').addEventListener('change', redraw);
    document.getElementById('filterSearch').addEventListener('input', redraw);
    document.getElementById('filterDateType').addEventListener('change', redraw);
    document.getElementById('filterDateFrom').addEventListener('change', redraw);
    document.getElementById('filterDateTo').addEventListener('change', redraw);
    document.getElementById('filterEmp').addEventListener('change', redraw);
    document.getElementById('filterForm').addEventListener('change', redraw);
    document.getElementById('filterGrade').addEventListener('change', redraw);
    document.getElementById('filterStatus').addEventListener('change', redraw);
    document.getElementById('exportBtn').addEventListener('click', () => this.exportExcel(evals));
    draw();
  },

  async viewEvaluation(id) {
    const e = await DB.getEvaluationFull(id);   // ดึงใบเต็ม (ลิสต์โหลดคอลัมน์เบา)
    if (!e) return;
    const u = DB.getUserById(e.employeeId);
    // ผู้ประเมิน = หัวหน้างานตามลำดับ (ไม่ใช่ HR) — แสดงครบทุกลำดับ
    const ev = { ...(DB.getUserById(evalCurrentEvaluatorId(e)) || {}), fullName: evalChainNames(e) || ((DB.getUserById(e.supervisorId || e.evaluatorId) || {}).fullName || '') };
    const f = DB.getFormForEval(e);
    const info = gradeInfoFor(e.totalScore, e.totalMax);

    const fmtN = (v) => (v === null || v === undefined || v === '') ? '—' : (isNaN(+v) ? escapeHtml(String(v)) : (+v).toLocaleString('en-US'));
    const kpiPreset = e.kpiPreset || {};
    const isDraft = e.status === 'assigned';
    const hasPreset = Object.keys(kpiPreset).length > 0 || (e.disciplinePreset && Object.keys(e.disciplinePreset).length > 0);
    const sectionsHtml = (f?.sections || []).map(sec => {
      const sScore = e.sectionScores.find(x => x.sectionId === sec.id);
      const items = sec.items.map(it => {
        const a = e.answers.find(x => x.itemId === it.id);
        let valCell;
        if (it.type === 'kpi') {
          // ค่าจากการประเมินจริงก่อน — ถ้ายังไม่ประเมินใช้ค่าที่ HR นำเข้าไว้ (kpiPreset)
          const kv = (a && a.value && typeof a.value === 'object') ? a.value
                   : ((kpiPreset[it.id] && typeof kpiPreset[it.id] === 'object') ? kpiPreset[it.id] : null);
          if (kv && (kv.target != null || kv.actual != null)) {
            // เป้า/ผลจริง แสดงเป็นตัวเลขล้วน (ไม่ต่อหน่วย) • %บรรลุ แสดงค่าจริง (เกิน 100% ได้) — การ cap อยู่ที่ "คะแนน" (fraction ≤ 1) ไม่ใช่ที่ %บรรลุ
            const pct = (kv.target != null && +kv.target !== 0) ? ((+kv.actual / +kv.target) * 100).toFixed(1) + '%' : '—';
            valCell = `<div class="kpi-sub"><span><b>เป้า</b> ${fmtN(kv.target)}</span><span><b>ผลจริง</b> ${fmtN(kv.actual)}</span><span><b>%บรรลุ</b> ${pct}</span></div>${kv.note ? `<div class="text-xs text-mute" style="margin-top:3px">${escapeHtml(kv.note)}</div>` : ''}`;
          } else valCell = '<span class="text-mute">—</span>';
        } else {
          valCell = `<span class="mono">${formatAnswerValue(it, a?.value)}</span>`;
        }
        return `
          <tr>
            <td>${escapeHtml(it.name)}</td>
            <td class="text-xs"><span class="type-tag">${ITEM_TYPES[it.type]?.label || it.type}</span></td>
            <td>${valCell}</td>
            <td class="mono">${a ? a.score.toFixed(2) : '—'} / ${it.maxScore}</td>
          </tr>
        `;
      }).join('');
      return `
        <div class="section-header" style="margin-top:1rem">
          <h4>${escapeHtml(sec.name)}</h4>
          <span class="mono font-bold">${sScore ? sScore.score.toFixed(2) : '—'} / ${sScore?.maxScore || calcSectionMax(sec)}</span>
        </div>
        <table class="tbl">
          <thead><tr><th>คำถาม</th><th>ประเภท</th><th>ค่าที่ตอบ / รายละเอียด</th><th>คะแนน</th></tr></thead>
          <tbody>${items}</tbody>
        </table>
      `;
    }).join('');

    // Penalty breakdown
    // ส่วนวินัย (penalty section)
    let penaltyHtml = '';
    if (f && f.penaltySection && f.penaltySection.enabled && (f.penaltySection.rules || []).length) {
      const ps = f.penaltySection;
      const pNotes = e.penaltyNotes || {};
      const dPreset = e.disciplinePreset || {};
      // ยังไม่ประเมิน + ไม่มี penaltyInputs แต่มีค่าที่ HR นำเข้า → ใช้ค่าจาก disciplinePreset มาแสดง
      const inById = {}; (e.penaltyInputs || []).forEach(p => inById[p.ruleId] = p.count);
      const cntOf = (rid) => inById[rid] != null ? inById[rid] : ((dPreset[rid] && dPreset[rid].count) || 0);
      const effInputs = (e.penaltyInputs && e.penaltyInputs.length) ? e.penaltyInputs
                      : Object.entries(dPreset).map(([ruleId, v]) => ({ ruleId, count: (v && v.count) || 0 }));
      const psScore = e.penaltySectionScore || calcPenaltySectionScore(f, effInputs);
      const rows = ps.rules.map(r => {
        const cnt = cntOf(r.id);
        const amt = calcPenaltyAmount(r, cnt);
        const rnote = pNotes[r.id] || (dPreset[r.id] && dPreset[r.id].note) || '';
        return `<tr>
          <td>${escapeHtml(r.name)}</td>
          <td class="mono">${cnt} ${escapeHtml(r.unit || '')}</td>
          <td class="text-xs text-mute">${escapeHtml(r.note || '')}</td>
          <td class="mono" style="color:${amt > 0 ? 'var(--err)' : 'inherit'}">${amt > 0 ? `-${amt}` : '0'}</td>
          <td class="text-xs">${escapeHtml(rnote)}</td>
        </tr>`;
      }).join('');
      const bRows = (ps.bonusRules || []).map(b => {
        const ids = (b.condition && b.condition.allZero) || [];
        const ok = ids.length > 0 && ids.every(rid => cntOf(rid) === 0);
        return `<tr>
          <td>${escapeHtml(b.name)} <span class="badge ok" style="font-size:10px">โบนัส</span></td>
          <td class="mono text-mute">อัตโนมัติ</td>
          <td class="text-xs text-mute">${escapeHtml(b.note || '')}</td>
          <td class="mono" style="color:var(--ok)">${ok ? `+${b.amount}` : '0'}</td>
          <td class="text-xs">${escapeHtml(pNotes[b.id] || '')}</td>
        </tr>`;
      }).join('');
      penaltyHtml = `
        <div class="section-header" style="margin-top:1rem">
          <h4>${escapeHtml(ps.name)}</h4>
          <span class="mono font-bold">${psScore ? psScore.score.toFixed(2) : ps.baseScore} / ${ps.baseScore}</span>
        </div>
        <table class="tbl">
          <thead><tr><th>รายการ</th><th>จำนวน</th><th>เกณฑ์</th><th>หัก/บวก</th><th>หมายเหตุ</th></tr></thead>
          <tbody>${rows}${bRows}</tbody>
        </table>
      `;
    }

    // Coaching plan
    let coachHtml = '';
    if (f && f.coachingOptions && f.coachingOptions.length) {
      const checks = e.coachingChecks || [];
      coachHtml = `
        <div class="section-header" style="margin-top:1rem">
          <h4>แนวทางพัฒนา / Coaching Plan</h4>
          <span class="text-mute text-xs">${checks.length} ข้อ</span>
        </div>
        <div class="grid md:grid-cols-2 gap-2 text-sm">
          ${f.coachingOptions.map((o, i) => `<div class="flex items-center gap-2"><i class="fa-solid ${checks.includes(i) ? 'fa-square-check text-red-600' : 'fa-square text-mute'}"></i> ${escapeHtml(o)}</div>`).join('')}
        </div>
        ${e.actionNote ? `<div class="muted-bg p-3 rounded mt-2 text-sm" style="border-left:3px solid var(--accent)"><b>หมายเหตุ — จะดำเนินการอย่างไร:</b> ${escapeHtml(e.actionNote)}</div>` : ''}
        ${e.coachingDetail ? `<div class="muted-bg p-3 rounded mt-2 text-sm" style="border-left:3px solid var(--accent)"><b>ข้อเสนอแนะจากผู้ประเมิน:</b> ${escapeHtml(e.coachingDetail)}</div>` : ''}
      `;
    }

    // Attachments
    // เอกสารแนบ — เซ็นรับทราบ (signedDocs) + ประกอบ (attachments) พร้อมปุ่มเปิดดู
    const fileRow = (a) => `
      <div class="attach-item">
        <i class="fa-solid ${fileIcon(a.type, a.name)}"></i>
        <div class="attach-item-info">
          <div class="attach-item-name">${escapeHtml(a.name)}</div>
          <div class="attach-item-size">${fmtBytes(a.size)}</div>
        </div>
        <button class="btn btn-secondary btn-icon" data-vfile="${a.id}" title="เปิดดู"><i class="fa-solid fa-eye"></i></button>
        <button class="btn btn-secondary btn-icon" data-dlfile="${a.id}" title="ดาวน์โหลด"><i class="fa-solid fa-download"></i></button>
      </div>`;
    let attachHtml = '';
    const signed = e.signedDocs || [];
    const atts = e.attachments || [];
    if (signed.length) {
      attachHtml += `
        <div class="section-header" style="margin-top:1rem;border-left-color:var(--accent)">
          <h4 style="color:var(--accent-dark)"><i class="fa-solid fa-paperclip mr-1"></i>เอกสารแนบประกอบการประเมิน</h4>
          <span class="text-mute text-xs">${signed.length} ไฟล์</span>
        </div>
        <div class="attach-list">${signed.map(fileRow).join('')}</div>`;
    }
    if (atts.length) {
      attachHtml += `
        <div class="section-header" style="margin-top:1rem">
          <h4><i class="fa-solid fa-paperclip mr-1"></i>เอกสารประกอบเพิ่มเติม</h4>
          <span class="text-mute text-xs">${atts.length} ไฟล์</span>
        </div>
        <div class="attach-list">${atts.map(fileRow).join('')}</div>`;
    }
    // เก็บ map ไฟล์ทั้งหมดไว้ผูก event หลัง showModal 
    this._viewFileMap = {};
    [...signed, ...atts].forEach(a => { this._viewFileMap[a.id] = a; });

    const body = `
      <div class="grid grid-cols-3 gap-3 mb-4">
        <div class="muted-bg p-3 rounded text-center">
          <div class="stat-label">คะแนนรวม</div>
          <div class="big-score" style="font-size:2.2rem">${e.totalScore.toFixed(2)}</div>
          <div class="text-mute text-xs">/ ${e.totalMax || 100}</div>
          ${e.chainAvg ? `<div class="text-xs mt-1" style="color:var(--accent-dark)"><i class="fa-solid fa-scale-balanced mr-1"></i>${escapeHtml(chainAvgText(e, { short: true }))}</div>` : ''}
          <div class="grade-tag mt-2" style="color:${info?.color};border-color:${info?.color};background:${info?.color}15">${escapeHtml(info ? info.label : (e.grade || '-'))}</div>
        </div>
        <div class="muted-bg p-3 rounded">
          <div class="stat-label">ข้อมูล</div>
          <div class="text-xs mt-2 space-y-1">
            <div><b>พนักงาน:</b> ${escapeHtml(u?.fullName || '-')} ${u ? empStatusBadge(u.status) : ''}</div>
            <div><b>รอบ:</b> ${fmtPeriod(e.period)}</div>
            <div><b>ฟอร์ม:</b> ${escapeHtml(f?.name || '-')}</div>
            <div><b>ผู้ประเมิน:</b> ${escapeHtml(ev?.fullName || '-')}</div>
            <div><b>วันที่:</b> ${fmtDate(e.createdAt)}</div>
          </div>
        </div>
        <div class="muted-bg p-3 rounded">
          <div class="stat-label">คะแนนรายส่วน</div>
          <div class="text-xs mt-2 space-y-1">
            ${e.sectionScores.map(ss => {
              const sec = f?.sections.find(s => s.id === ss.sectionId);
              return `<div class="flex justify-between"><span>${escapeHtml(sec?.name || '-')}</span><span class="mono font-bold">${ss.score.toFixed(2)} / ${ss.maxScore || calcSectionMax(sec || {items:[]})}</span></div>`;
            }).join('')}
            ${e.penaltySectionScore ? `<div class="flex justify-between"><span>${escapeHtml(f?.penaltySection?.name || 'ส่วนวินัย')}</span><span class="mono font-bold">${e.penaltySectionScore.score.toFixed(2)} / ${e.penaltySectionScore.max}</span></div>` : ''}
            <div class="flex justify-between border-t border-neutral-200 pt-1 mt-1"><span><b>คะแนนรวม</b></span><span class="mono font-bold">${e.totalScore.toFixed(2)} / ${e.totalMax}</span></div>
          </div>
        </div>
      </div>
      ${Evaluation.stepLogHtml(e, f, Auth.currentUser())}
      ${(isDraft && hasPreset) ? `<div class="muted-bg p-3 rounded mb-3" style="border-left:3px solid var(--accent)"><i class="fa-solid fa-circle-info mr-1" style="color:var(--accent)"></i><b>ใบนี้ยังไม่ได้ประเมิน (มอบหมายแล้ว)</b> — ค่า <b>เป้า / ผลจริง</b> และจำนวนวินัยด้านล่างเป็นข้อมูลที่ HR นำเข้าไว้ล่วงหน้า • คะแนนจะคำนวณเมื่อหัวหน้างานกดประเมิน</div>` : ''}
      ${sectionsHtml}
      ${penaltyHtml}
      ${coachHtml}
      ${attachHtml}
      ${e.overallComment ? `<div class="muted-bg p-3 rounded mt-3" style="border-left:3px solid var(--accent)"><b>ความเห็นภาพรวม:</b> ${escapeHtml(e.overallComment)}</div>` : ''}
      ${(e.empResponse || e.empComment) ? `<div class="muted-bg p-3 rounded mt-3" style="border-left:3px solid #ca8a04"><b>ความเห็นของพนักงาน:</b> ${e.empResponse === 'acknowledge' ? '<span class="badge ok">รับทราบ — ไม่มีข้อโต้แย้ง</span>' : (e.empResponse === 'dispute' ? '<span class="badge warn">มีข้อโต้แย้ง</span>' : '')} ${e.empComment ? `<div class="mt-1">${escapeHtml(e.empComment)}</div>` : ''}</div>` : ''}
    `;
    const pdfBtn = (f && e.status !== 'assigned') ? '<button class="btn btn-primary btn-icon" id="vePdfBtn"><i class="fa-solid fa-file-pdf"></i> ดู PDF เอกสารประเมิน</button>' : '';
    showModal({ title: 'รายละเอียดการประเมิน', body, footer: `${pdfBtn}<button class="btn btn-secondary" onclick="closeModal()">ปิด</button>`, size: '920' });
    // ผูกปุ่มเปิดดูไฟล์
    document.querySelectorAll('[data-vfile]').forEach(b => b.addEventListener('click', () => {
      const a = this._viewFileMap[b.dataset.vfile];
      if (a) Evaluation.viewFile(a);
    }));
    document.querySelectorAll('[data-dlfile]').forEach(b => b.addEventListener('click', () => {
      const a = this._viewFileMap[b.dataset.dlfile];
      if (a) Evaluation.downloadFile(a);
    }));
    document.getElementById('vePdfBtn')?.addEventListener('click', () => Evaluation._genEvalPdf(e, f, 'view'));
  },

  // ดูประวัติการดำเนินการ (Log) ของการประเมินหนึ่งรายการ
  async viewHistory(id) {
    const e = await DB.getEvaluationFull(id);
    if (!e) { toast('ไม่พบรายการ', 'error'); return; }
    const u = DB.getUserById(e.employeeId) || {};
    const entries = buildHistoryEntries(e);
    const timeline = entries.length ? entries.map(h => `
      <div class="tl-item">
        <div class="tl-dot" style="background:${h.color}"><i class="fa-solid ${h.icon}"></i></div>
        <div class="tl-body">
          <div class="tl-top"><b>${escapeHtml(h.label)}</b><span class="tl-time">${fmtDateTime(h.ts)}</span></div>
          <div class="tl-by"><i class="fa-solid fa-user mr-1"></i>${escapeHtml(h.by || '-')}</div>
          ${h.note ? `<div class="tl-note">${escapeHtml(h.note)}</div>` : ''}
        </div>
      </div>`).join('') : '<div class="text-mute text-center" style="padding:1.5rem"><i class="fa-regular fa-folder-open mr-1"></i>ยังไม่มีประวัติการดำเนินการ</div>';
    const body = `
      <div class="muted-bg p-3 rounded mb-3 text-sm">
        <b>${escapeHtml(u.fullName||'-')}</b> <span class="mono text-mute">${escapeHtml(u.employeeCode||'')}</span> ${empStatusBadge(u.status)} • รอบ ${fmtPeriod(e.period)}<br>
        สถานะปัจจุบัน: ${statusBadgeHTML(e.status)}
      </div>
      <div class="timeline">${timeline}</div>`;
    showModal({ title: 'ประวัติการดำเนินการ (Log)', body, footer: '<button class="btn btn-secondary" onclick="closeModal()">ปิด</button>', size: '560' });
  },

  // ส่งออก Excel — ดึงข้อมูลครบทุกหัวข้อในฟอร์มประเมิน
  exportExcel(evals) {
    if (typeof XLSX === 'undefined') { toast('ตัวสร้าง Excel ยังโหลดไม่เสร็จ ลองรีเฟรช', 'error'); return; }
    if (!evals || !evals.length) { toast('ไม่มีข้อมูลให้ส่งออก', 'error'); return; }
    const form = DB.getFormById(evals[0].formId) || DB.getDefaultForm();
    const cols = this._evalExportColumns(form);
    const aoa = [cols.map(c => c.label), ...evals.map(e => cols.map(c => { try { const v = c.get(e); return v == null ? '' : v; } catch (_) { return ''; } }))];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = cols.map((c, i) => ({ wch: i === 2 ? 24 : 16 }));
    ws['!freeze'] = { xSplit: 3, ySplit: 1 };
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'ผลการประเมิน');
    const d = new Date();
    XLSX.writeFile(wb, `ผลการประเมิน_${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.xlsx`);
    toast(`ส่งออก Excel ${evals.length} รายการ × ${cols.length} คอลัมน์ (ครบทุกหัวข้อ)`, 'success', { title: 'Export Excel' });
  },

  // ค่าที่อ่านง่ายของแต่ละ item (ที่ไม่ใช่ KPI)
  _exportItemVal(item, v) {
    if (v == null || v === '') return '';
    switch (item.type) {
      case 'rating5': return `${v}/5`;
      case 'scale10': return `${v}/10`;
      case 'percent': return `${v}%`;
      case 'choice': { const o = item.config && item.config.options ? item.config.options[+v] : null; return o ? o.label : ''; }
      case 'yesno': return (v === true || v === 'true' || v === 'yes' || v === 1) ? 'ใช่' : 'ไม่ใช่';
      default: return String(v);
    }
  },

  // สร้างคอลัมน์ส่งออกครบทุกหัวข้อในฟอร์ม
  _evalExportColumns(form) {

    const clean = s => String(s || '').replace(/[\r\n]+/g, ' ');

      { label: 'รอบ', get: e => fmtPeriod(e.period) },
      { label: 'รหัสพนักงาน', get: e => U(e).employeeCode || '' },

    (form.sections || []).forEach(sec => {

// ----- Template generation -----
AdminUI._downloadImportTemplate = function (form) {
  const headers = ['employee_code'];
  const sampleRow = ['EMP-001'];

  form.sections.forEach(sec => sec.items.forEach(item => {
    if (item.type === 'kpi') {
      headers.push(`${item.id}_target`, `${item.id}_actual`);
      sampleRow.push(item.config?.target || 100, 85);
    } else if (item.type === 'choice') {
      headers.push(item.id);
      sampleRow.push(0); // option index
    } else if (item.type === 'yesno') {
      headers.push(item.id);
      sampleRow.push('yes');
    } else {
      headers.push(item.id);
      sampleRow.push(item.type === 'rating5' ? 4 : item.type === 'scale10' ? 8 : item.type === 'percent' ? 80 : 0);
    }
  }));

  const penRules = [...(form.penaltyRules || []), ...((form.penaltySection && form.penaltySection.enabled && form.penaltySection.rules) || [])];
  penRules.forEach(r => {
    headers.push(r.id);
    sampleRow.push(0);
  });

  headers.push('coaching', 'overall_comment');
  sampleRow.push('0;1', 'ผลงานดี ติดตามภายใน 30 วัน');

  const csv = [
    headers.join(','),
    sampleRow.map(c => `"${String(c).replace(/"/g, '""')}"`).join(','),
  ].join('\n');

  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `template_${form.id}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('ดาวน์โหลด Template สำเร็จ', 'success');
};

// ----- CSV parser (vanilla, supports quoted fields) -----
AdminUI._parseCSV = function (text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  const t = text.replace(/^﻿/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inQuotes) {
      if (c === '"' && t[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0].trim()));
};

// ----- Preview parsed rows -----
AdminUI._previewImport = function (form, period, evaluatorId, csvText) {
  const rows = AdminUI._parseCSV(csvText);
  if (rows.length < 2) {
    document.getElementById('impStatus').innerHTML = `<span style="color:var(--err)">ไฟล์ว่างเปล่าหรือไม่มีข้อมูล</span>`;
    return;
  }
  const headers = rows[0].map(h => h.trim());
  const dataRows = rows.slice(1);

  const items = form.sections.flatMap(s => s.items);
  const penaltyRules = [...(form.penaltyRules || []), ...((form.penaltySection && form.penaltySection.enabled && form.penaltySection.rules) || [])];

  const parsed = dataRows.map((cols, rowIdx) => {
    const r = {};
    headers.forEach((h, i) => { r[h] = (cols[i] || '').trim(); });
    const errors = [];

    const empCode = r.employee_code || '';
    const employee = DB.getUserByCode(empCode);
    if (!employee) errors.push(`ไม่พบรหัสพนักงาน "${empCode}"`);

    // build valueMap
    const valueMap = {};
    items.forEach(item => {
      if (item.type === 'kpi') {
        const t = +r[`${item.id}_target`] || +(item.config?.target || 100);
        const a = r[`${item.id}_actual`];
        if (a === '' || a === undefined) errors.push(`ข้อ "${item.name}" ขาด actual`);
        else valueMap[item.id] = { target: t, actual: +a };
      } else if (item.type === 'yesno') {
        const v = (r[item.id] || '').toLowerCase();
        if (!['yes','no','true','false','1','0','y','n','ใช่','ไม่ใช่'].includes(v)) {
          if (v === '') errors.push(`ข้อ "${item.name}" ขาดค่า`);
          else errors.push(`ข้อ "${item.name}" ค่าผิด (yes/no)`);
        } else {
          valueMap[item.id] = ['yes','true','1','y','ใช่'].includes(v);
        }
      } else {
        const v = r[item.id];
        if (v === '' || v === undefined) errors.push(`ข้อ "${item.name}" ขาดค่า`);
        else if (isNaN(+v)) errors.push(`ข้อ "${item.name}" ไม่ใช่ตัวเลข`);
        else valueMap[item.id] = +v;
      }
    });

    const penaltyMap = {};
    penaltyRules.forEach(rule => {
      penaltyMap[rule.id] = +r[rule.id] || 0;
    });

    const coachingChecks = (r.coaching || '').split(/[;,]/).map(s => s.trim()).filter(s => s !== '').map(Number).filter(n => !isNaN(n));
    const overallComment = r.overall_comment || '';

    let totalScore = 0, totalMax = 0, grade = '';
    if (!errors.length && employee) {
      try {
        const ev = buildEvaluation(form, employee.id, evaluatorId, period, valueMap, penaltyMap, coachingChecks, '', overallComment);
        totalScore = ev.totalScore;
        totalMax = ev.totalMax;
        grade = ev.grade;
        return { rowIdx, employee, valueMap, penaltyMap, coachingChecks, overallComment, totalScore, totalMax, grade, errors };
      } catch (err) {
        errors.push(err.message || 'คำนวณผิดพลาด');
      }
    }
    return { rowIdx, employee, errors, totalScore, totalMax, grade };
  });

  const validCount = parsed.filter(p => !p.errors.length).length;
  const errorCount = parsed.length - validCount;

  // Find duplicates
  const duplicates = parsed.filter(p => !p.errors.length && p.employee).filter(p => {
    return DB.getEvaluations().some(e => e.employeeId === p.employee.id && e.formId === form.id && e.period === period);
  });

  const area = document.getElementById('impPreviewArea');
  area.innerHTML = `
    <div class="card mb-3">
      <div class="card-title">ผลการ Preview — รอบ ${fmtPeriod(period)} • ${escapeHtml(form.name)}</div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">

        <div class="muted-bg p-3 rounded" style="border-left:3px solid var(--ok)"><div class="text-mute text-xs">ผ่าน</div><div class="mono font-bold text-lg" style="color:var(--ok)">${validCount}</div></div>
        <div class="muted-bg p-3 rounded" style="border-left:3px solid var(--err)"><div class="text-mute text-xs">ผิดพลาด</div><div class="mono font-bold text-lg" style="color:var(--err)">${errorCount}</div></div>

                <td>
                  ${p.errors.length

    <div class="flex gap-2 justify-end">

        <i class="fa-solid fa-cloud-arrow-up"></i> ยืนยันนำเข้า ${validCount} รายการ
      </button>
