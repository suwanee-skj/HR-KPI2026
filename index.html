    if (forwardNext) { const nx = DB.getUserById(ev.supervisorId) || {}; toast(`ส่งต่อผลประเมินของ ${emp?.fullName || '-'} ให้ผู้ประเมินลำดับ ${(ev.evalStep || 0) + 1} (${nx.fullName || '-'}) แล้ว • ${ev.totalScore.toFixed(2)}/${ev.totalMax} (${ev.grade})`, 'success', { title: 'ส่งต่อสำเร็จ' }); }
    else toast(`ส่งผลประเมินของ ${emp?.fullName || '-'} ให้ HR เรียบร้อย • ${ev.totalScore.toFixed(2)}/${ev.totalMax} (${ev.grade})`, 'success', { title: 'ส่งให้ HR สำเร็จ' });
    this._closeModal();
    App.buildNav(me);
    App.go(me.role === 'admin' ? 'hr-list' : 'sup-list');

    const info = gradeInfoFor(ev.totalScore, ev.totalMax);
    const isSubmit = mode === 'submit';
    const wrap = document.getElementById('modalContainer');
    wrap.innerHTML = `
      <div class="modal-bg" id="savedBg">

            <div class="confirm-title">${isSubmit ? 'ส่งให้ HR ตรวจสอบแล้ว' : 'บันทึกร่างเรียบร้อย'}</div>

              <span class="grade-tag ml-2" style="color:${info?.color};border-color:${info?.color};background:${info?.color}15">${escapeHtml(info ? info.label : (ev.grade || '-'))}</span>

                ${isSubmit
                  ? `<i class="fa-solid fa-paper-plane" style="color:var(--ok)"></i> ส่งให้ HR ตรวจสอบและยืนยันแล้ว — พนักงานจะกด "รับทราบผลการประเมิน" เองผ่านระบบ`
                  : `<i class="fa-solid fa-floppy-disk" style="color:var(--link)"></i> บันทึกร่างแล้ว`}
              </div>
            </div>
          </div>

          </div>

      wrap.innerHTML = '';

  // ===================================================================
  // ส่งผลประเมินให้ HR (สำหรับรายการสถานะ evaluated) — ยืนยันแล้วส่งตรง ไม่มีการแนบไฟล์
  // (พนักงานรับทราบผ่านระบบ)
  // ===================================================================
  async openAttachSubmit(evalId) {
    const rec = DB.getEvaluations().find(e => e.id === evalId) || (await DB.getEvaluationFull(evalId));

    const emp = DB.getUserById(rec.employeeId) || {};
    confirmDialog({
      title: 'ส่งผลประเมินให้ HR',
      message: `ส่งผลประเมินของ "${emp.fullName || '-'}" รอบ ${fmtPeriod(rec.period)} (คะแนน ${(+rec.totalScore).toFixed(2)}/${rec.totalMax}) ให้ HR ตรวจสอบ?\nพนักงานจะกด "รับทราบผลการประเมิน" เองผ่านระบบ`,
      confirmText: 'ส่งให้ HR', type: 'info',
    }).then(async ok => {
      if (!ok) return;
      rec.status = 'pending_review';
      rec.submittedAt = new Date().toISOString();
      DB.pushHistory(rec, 'submitted', Auth.currentUser().id, `ส่งให้ HR ตรวจสอบ • คะแนน ${(+rec.totalScore).toFixed(2)}/${rec.totalMax}`);
      try { await DB.upsertEvaluation(rec); } catch (err) { toast('บันทึกไม่สำเร็จ', 'error'); return; }
      toast('ส่งให้ HR ตรวจสอบแล้ว', 'success', { title: 'ส่งสำเร็จ' });
      App.buildNav(Auth.currentUser());
      App.go('sup-list');
    });
  },
};

// ตัดคำนำหน้า "ส่วนที่ X —" / "ส่วนที่ X :" ออกจากชื่อหัวข้อ
function secName(name) {
  return String(name || '').replace(/^\s*ส่วนที่\s*\d+\s*[—:\-]\s*/, '').trim();
}

// ===================================================================
// File helpers (global)
// ===================================================================
function fmtBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}
function fileIcon(type, name) {
  const t = (type || '').toLowerCase();
  const n = (name || '').toLowerCase();
  if (t.startsWith('image/')) return 'fa-file-image';
  if (t.includes('pdf') || n.endsWith('.pdf')) return 'fa-file-pdf';
  if (t.includes('word') || n.endsWith('.doc') || n.endsWith('.docx')) return 'fa-file-word';
  if (t.includes('sheet') || t.includes('excel') || n.endsWith('.xls') || n.endsWith('.xlsx')) return 'fa-file-excel';
  if (t.startsWith('text/') || n.endsWith('.txt')) return 'fa-file-lines';
  return 'fa-file';
}

// Expose explicitly on window to ensure cross-script access (fixes "Evaluation is not defined")
window.Evaluation = Evaluation;

            <tr><th style="width:60px">อันดับ</th><th>พนักงาน</th><th>แผนก</th><th>รอบที่ประเมิน</th><th>คะแนนเฉลี่ย</th><th>ระดับล่าสุด</th></tr>
          </thead>
          <tbody>
            ${userScores.slice(0, 10).map((u, i) => {
              const info = u.latest ? gradeInfoFor(u.latest.totalScore, u.latest.totalMax) : null;
              return `
                <tr>
                  <td class="mono">${i + 1}</td>
                  <td><b>${escapeHtml(u.user.fullName)}</b> <span class="text-mute mono" style="font-size:11px">${escapeHtml(u.user.employeeCode)}</span></td>
                  <td>${escapeHtml(u.user.department)}</td>

    this._drawDashExtra(evals, users, statusEvals);
    this._drawFormCharts(evals);
    runCountUps(document.getElementById('dashBody'));
    // การ์ดสถานะ (มุมมองรวม ไม่กรอง) → นับสดจากเซิร์ฟเวอร์ ให้ตรงกับ badge เมนู + หน้ารายการ (รวมคนลาออก)
    //   หน่วง 800ms ให้ count-up animation จบก่อนจึงเขียนทับ (runCountUps cache เป้าไว้ตั้งแต่เริ่ม)
    const _dashFiltered = !!(fPeriod.length || fDept.length || fSup.length || fEmp.length);
    if (!_dashFiltered) {
      const _setN = (id, n) => { const el = document.getElementById(id); if (el) { el.textContent = (n || 0).toLocaleString(); el.setAttribute('data-target', n || 0); } };
      Promise.all([
        DB.countEvaluations({}),
        DB.countEvaluations({ status: 'assigned' }),
        DB.countEvaluations({ status: 'pending_review' }),
        DB.countEvaluations({ status: 'confirmed' }),
      ]).then(v => { setTimeout(() => { _setN('dashTotal', v[0]); _setN('dashAssigned', v[1]); _setN('dashReview', v[2]); _setN('dashConfirmed', v[3]); }, 800); })
        .catch(() => { /* นับไม่ได้ (ออฟไลน์) → คงค่าที่โหลดในหน่วยความจำ */ });
    }
  },

  // แดชบอร์ดรายบุคคล — โปรไฟล์ + แนวโน้ม + คะแนนรายส่วน/รายข้อ + ประวัติการประเมิน
  _renderIndividualDash(empId) {

            <div class="text-mute text-sm">${escapeHtml(emp.position || '-')} • ${escapeHtml(emp.department || '-')} • หัวหน้า: ${escapeHtml(sup ? sup.fullName : '—')}</div>

          <thead><tr><th>รอบ</th><th>คะแนน</th><th>%</th><th>เกรด</th><th>สถานะ</th><th class="text-right">เอกสาร</th></tr></thead>
          <tbody>${[...scored].reverse().map(e => { const g = gradeInfoFor(e.totalScore, e.totalMax); return `<tr><td><b>${fmtPeriod(e.period)}</b></td><td class="mono">${e.totalScore.toFixed(2)}/${e.totalMax}</td><td class="mono">${e.totalMax ? ((e.totalScore / e.totalMax) * 100).toFixed(1) + '%' : '-'}</td><td><span class="grade-tag" style="color:${g.color};border-color:${g.color};background:${g.color}15">${escapeHtml(g ? g.label : (e.grade || '-'))}</span></td><td>${statusBadgeHTML(e.status)}</td><td class="text-right"><button class="btn btn-secondary btn-icon" data-ind-view="${e.id}"><i class="fa-solid fa-eye"></i> PDF</button></td></tr>`; }).join('') || '<tr><td colspan="6" class="text-center text-mute" style="padding:1.5rem">— ยังไม่มีการประเมิน —</td></tr>'}</tbody>

  // เจาะลึกทุกหัวข้อในฟอร์มประเมิน — รายข้อในแต่ละส่วน + วินัย + Coaching + ความเห็นพนักงาน
  _drawFormCharts(evals) {
    const wrap = document.getElementById('formCharts');
    if (!wrap) return;

    (form.sections || []).forEach((sec, i) => {
      const items = Analytics.itemAverages(evals, sec.items);
      blocks.push({ id: `fcSec${i}`, title: `${secName(sec.name)} — รายข้อ (% เฉลี่ย)`, kind: 'barH', labels: items.map(x => x.label), data: items.map(x => x.value), max: 100, color: '#0891b2' });
    });
    if (form.penaltySection && form.penaltySection.enabled) {
      const pen = Analytics.penaltyAverages(evals, form);
      blocks.push({ id: 'fcPen', title: `${secName(form.penaltySection.name)} — สถิติหักเฉลี่ย/คน`, kind: 'bar', labels: pen.map(x => x.label), data: pen.map(x => x.value), max: null, color: '#dc2626' });
    }
    if ((form.coachingOptions || []).length) {
      const co = Analytics.coachingCounts(evals, form);
      blocks.push({ id: 'fcCoach', title: 'ประเภทการดำเนินการ / Coaching (จำนวนครั้ง)', kind: 'barH', labels: co.map(x => x.label), data: co.map(x => x.value), max: null, color: '#7c3aed' });
    }
    const er = Analytics.empResponseCounts(evals);
    blocks.push({ id: 'fcResp', title: 'ความเห็นพนักงาน (รับทราบ/โต้แย้ง)', kind: 'doughnut', labels: er.labels, data: er.data, colors: er.colors });

    wrap.innerHTML = `
      <div class="card-title" style="margin:0.5rem 0 0.75rem"><i class="fa-solid fa-layer-group mr-1" style="color:var(--accent)"></i>เจาะลึกทุกหัวข้อในฟอร์มประเมิน</div>
      <div class="grid lg:grid-cols-2 gap-4 mb-6">
        ${blocks.map(b => `<div class="card lift"><div class="card-title">${escapeHtml(b.title)}</div><div style="height:${b.kind === 'barH' ? Math.max(220, b.labels.length * 26 + 60) : 240}px"><canvas id="${b.id}"></canvas></div></div>`).join('')}
      </div>

    Object.keys(this.charts).filter(k => k.startsWith('fc')).forEach(k => { this.charts[k].destroy(); delete this.charts[k]; });

    const barV = max => ({ responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#dc2626' } }, scales: { y: Object.assign({ beginAtZero: true, grid: { color: '#f0f0f0' } }, max != null ? { max } : {}), x: { grid: { display: false } } } });

      } else {
        this.charts[b.id] = new Chart(cv, { type: 'bar', data: { labels: b.labels, datasets: [{ data: b.data, backgroundColor: b.color, borderRadius: 3 }] }, options: b.kind === 'barH' ? barH(b.max) : barV(b.max) });
      }
    });
  },

  // กราฟเชิงลึกหลายมิติ — แนวโน้ม / รายส่วน / สถานะ / รายทีม
  _drawDashExtra(evals, users, statusEvals) {
    const form = DB.getDefaultForm();
    const allEvals = statusEvals || DB.getEvaluations();
    const confirmed = evals.filter(e => e.status === 'confirmed');

    // แนวโน้มคะแนนเฉลี่ยทั้งบริษัท
    const trCv = document.getElementById('trendChart');
    if (trCv && confirmed.length) {
      const tr = Analytics.trendByPeriod(confirmed);
      this.charts.trend = new Chart(trCv, {
        type: 'line',
        data: { labels: tr.labels, datasets: [{ data: tr.data, borderColor: '#dc2626', backgroundColor: 'rgba(220,38,38,0.1)', fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: '#dc2626' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100, grid: { color: '#f0f0f0' } }, x: { grid: { display: false } } } },
      });
    }

    // คะแนนเฉลี่ยรายส่วน
    const secCv = document.getElementById('secChart');
    if (secCv) {
      const secA = Analytics.sectionAverages(evals, form);
      this.charts.sec = new Chart(secCv, {
        type: 'bar',
        data: { labels: secA.labels, datasets: [{ data: secA.data, backgroundColor: ['#dc2626', '#0891b2', '#f59e0b', '#7c3aed'], borderRadius: 3, barThickness: 38 }] },
        options: Analytics.barOpts(100),
      });
    }

    // สัดส่วนสถานะงาน
    const stCv = document.getElementById('statusChart');
    if (stCv) {
      const st = Analytics.statusCounts(allEvals);
      this.charts.status = new Chart(stCv, {
        type: 'doughnut',
        data: { labels: st.labels, datasets: [{ data: st.data, backgroundColor: st.colors, borderWidth: 2, borderColor: '#fff' }] },
        options: Analytics.doughnutOpts(),
      });
    }

    // เปรียบเทียบคะแนนเฉลี่ยรายทีม (หัวหน้างาน)
    const supCv = document.getElementById('supTeamChart');
    if (supCv) {
      const sups = DB.getSupervisors();
      const teamScores = sups.map(s => {
        const ids = users.filter(u => evaluatorChainOf(u).includes(s.id)).map(u => u.id);
        const list = evals.filter(e => ids.includes(e.employeeId));
        return { name: s.fullName, score: list.length ? +(list.reduce((a, e) => a + e.totalScore, 0) / list.length).toFixed(1) : 0 };
      }).filter(t => t.score > 0).sort((a, b) => b.score - a.score);
      this.charts.supTeam = new Chart(supCv, {
        type: 'bar',
        data: { labels: teamScores.map(t => t.name), datasets: [{ data: teamScores.map(t => t.score), backgroundColor: teamScores.map(t => gradeInfoFor(t.score, 100).color), borderRadius: 3 }] },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#dc2626' } }, scales: { x: { beginAtZero: true, max: 100, grid: { color: '#f0f0f0' } }, y: { grid: { display: false } } } },
      });
    }
  },

  _drawDeptChart(users, evals) {
    const depts = [...new Set(users.map(u => u.department))];
    const data = depts.map(d => {
      const ids = users.filter(u => u.department === d).map(u => u.id);
      const list = evals.filter(e => ids.includes(e.employeeId));
      return list.length ? +(list.reduce((s, e) => s + e.totalScore, 0) / list.length).toFixed(2) : 0;
    });
    const canvas = document.getElementById('deptChart');
    if (!canvas) return;
    this.charts.dept = new Chart(canvas, {
      type: 'bar',
      data: { labels: depts, datasets: [{ data, backgroundColor: '#dc2626', borderRadius: 2, barThickness: 40 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { backgroundColor: '#dc2626' } },
        scales: { y: { beginAtZero: true, max: 100, grid: { color: '#f0f0f0' } }, x: { grid: { display: false } } }
      }
    });
  },

  _drawGradeChart(userScores) {
    const levels = DB.getSettings().gradeLevels;
    const counts = levels.map(l => userScores.filter(u => u.latest && u.latest.totalScore >= l.min && u.latest.totalScore < l.max).length);
    const canvas = document.getElementById('gradeChart');
    if (!canvas) return;
    // แสดง "จำนวน (xx%)" บนชิ้นโดนัทเลยโดยไม่ต้อง hover — ชิ้นเล็ก (<~4.5%) วาดนอกขอบด้วยสีของชิ้นแทน กันตัวหนังสือล้น
    const total = counts.reduce((s, n) => s + n, 0);
    const sliceLabels = {
      id: 'gradeSliceLabels',
      afterDatasetsDraw(chart) {
        if (!total) return;
        const ctx = chart.ctx;
        const ds = chart.data.datasets[0];
        chart.getDatasetMeta(0).data.forEach((arc, i) => {
          const v = ds.data[i];
          if (!v) return;
          const pct = (v / total) * 100;
          const mid = (arc.startAngle + arc.endAngle) / 2;
          const small = (arc.endAngle - arc.startAngle) < 0.28;
          const r = small ? arc.outerRadius + 13 : (arc.innerRadius + arc.outerRadius) / 2;
          ctx.save();
          ctx.font = '700 11px Sarabun, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = small ? (ds.backgroundColor[i] || '#374151') : '#fff';
          ctx.fillText(v.toLocaleString() + ' (' + (pct >= 10 ? Math.round(pct) : pct.toFixed(1)) + '%)', arc.x + Math.cos(mid) * r, arc.y + Math.sin(mid) * r);
          ctx.restore();
        });
      },
    };
    this.charts.grade = new Chart(canvas, {
      type: 'doughnut',
      data: { labels: levels.map(l => l.label), datasets: [{ data: counts, backgroundColor: levels.map(l => l.color), borderWidth: 1, borderColor: '#fff' }] },
      options: { responsive: true, maintainAspectRatio: false, layout: { padding: 16 }, plugins: { legend: { position: 'right' } } },
      plugins: [sliceLabels],
    });
  },

      <div class="card mb-4">
        <div class="flex items-center gap-2 flex-wrap" id="empFilters">
          <input id="searchEmp" class="input" placeholder="ค้นหา ชื่อ / รหัสพนักงาน..." style="width:240px;flex:0 0 auto" />
          ${MS.build('filterDept', 'ทุกแผนก', [...new Set(DB.getUsers().map(u => u.department))].filter(Boolean).map(d => ({ value: d, label: d })), '180px')}
          ${MS.build('filterPos', 'ทุกตำแหน่ง', [...new Set(DB.getUsers().map(u => u.position))].filter(Boolean).sort((a, b) => String(a).localeCompare(String(b), 'th')).map(p => ({ value: p, label: p })), '190px')}
          ${MS.build('filterRole', 'ทุกบทบาท', [{ value: 'admin', label: 'HR / ฝ่ายบุคคล' }, { value: 'supervisor', label: 'หัวหน้างาน' }, { value: 'employee', label: 'พนักงาน' }], '170px')}
          ${MS.build('filterStatus', 'ทุกสถานะการเป็นพนักงาน', [{ value: 'active', label: 'ทำงาน' }, { value: 'resigned', label: 'ลาออก' }], '210px')}
          ${MS.build('filterSup', 'ทุกหัวหน้า', [{ value: '__nosup__', label: '— ยังไม่มีผู้ประเมิน —' }, ..._sups.map(s => ({ value: s.id, label: s.fullName }))], '190px')}
          <button id="empClear" class="btn btn-secondary btn-icon" title="ล้างตัวกรองทั้งหมด"><i class="fa-solid fa-rotate-left"></i> ล้างตัวกรอง</button>
        </div>
        <div id="empCount" class="text-mute text-xs mt-2"></div>
      </div>

      <div class="card !p-0 overflow-x-auto">
        <table class="tbl">
          <thead>
            <tr>
              <th>รหัสพนักงาน</th><th>ชื่อ-นามสกุล</th><th>แผนก</th><th>ตำแหน่ง</th><th>บทบาท</th><th>สถานะ</th><th>ผู้ประเมิน (ลำดับ 1→2→3)</th><th class="text-right">การดำเนินการ</th>
            </tr>
          </thead>
          <tbody id="empBody"></tbody>
        </table>
      </div>
      <div id="empPager" class="flex items-center justify-center gap-2 mt-3 no-print"></div>
    `;

    const EMP_PER_PAGE = 100;
    let empPage = 0;
    // กรองตามเงื่อนไขปัจจุบัน — ใช้ทั้งวาดตารางและ Export Excel
    const getFiltered = () => {
      const q = document.getElementById('searchEmp').value.toLowerCase().trim();
      const d = MS.values('filterDept'), r = MS.values('filterRole'), st = MS.values('filterStatus'), sp = MS.values('filterSup'), pos = MS.values('filterPos');
      return DB.getUsers().filter(u => {
        const cl = DB.getChangeLog(u.id);
        const supName = userChainNames(u, ' ');
        // ค้นหาครอบทุกหัวข้อ: ชื่อ/รหัส/แผนก/ตำแหน่ง/หัวหน้า
        const hit = !q || `${u.fullName || ''} ${u.employeeCode || ''} ${u.department || ''} ${u.position || ''} ${supName}`.toLowerCase().includes(q);
        const uChain = evaluatorChainOf(u);
        const supOk = !sp.length || sp.some(id => uChain.includes(id)) || (sp.includes('__nosup__') && !uChain.length && u.role === 'employee');
        return hit && (!d.length || d.includes(u.department)) && (!pos.length || pos.includes(u.position)) && (!r.length || r.includes(u.role)) && (!st.length || st.includes(u.status || 'active')) && supOk;
      });
    };
    const draw = () => {
      const list = getFiltered();
      const body = document.getElementById('empBody');
      const roleLabel = { admin: 'HR', supervisor: 'หัวหน้างาน', employee: 'พนักงาน' };
      const roleClass = { admin: 'info', supervisor: 'warn', employee: '' };
      const totalPages = Math.max(1, Math.ceil(list.length / EMP_PER_PAGE));
      if (empPage >= totalPages) empPage = totalPages - 1;
      if (empPage < 0) empPage = 0;
      const startIdx = empPage * EMP_PER_PAGE;
      const shown = list.slice(startIdx, startIdx + EMP_PER_PAGE);
      const cnt = document.getElementById('empCount');
      if (cnt) {
        const total = DB.getUsers().length;
        const filtered = !!((document.getElementById('searchEmp').value || '').trim() || MS.values('filterDept').length || MS.values('filterPos').length || MS.values('filterRole').length || MS.values('filterStatus').length || MS.values('filterSup').length );
        cnt.innerHTML = `<i class="fa-solid fa-users mr-1"></i>` +
          (filtered ? `พบ <b>${list.length.toLocaleString()}</b> คน (จากทั้งหมด ${total.toLocaleString()})`
                    : `ทั้งหมด <b>${total.toLocaleString()}</b> คน`) +
          (list.length > EMP_PER_PAGE ? ` • แสดง ${startIdx + 1}–${Math.min(startIdx + EMP_PER_PAGE, list.length)} (หน้า ${empPage + 1}/${totalPages})` : '');
      }
      body.innerHTML = shown.map(u => {
        const status = u.status || 'active';
        const statusBadge = status === 'resigned'
          ? `<button class="badge err" data-act="status" data-id="${u.id}" title="คลิกเพื่อเปลี่ยนเป็น ทำงาน" style="cursor:pointer;white-space:nowrap"><i class="fa-solid fa-user-slash mr-1"></i>ลาออก</button>`
          : `<button class="badge ok" data-act="status" data-id="${u.id}" title="คลิกเพื่อเปลี่ยนเป็น ลาออก" style="cursor:pointer;white-space:nowrap"><i class="fa-solid fa-user-check mr-1"></i>ทำงาน</button>`;
        const cl = DB.getChangeLog(u.id);
        return `
        <tr>
          <td class="mono">${escapeHtml(u.employeeCode)}</td>
          <td><b>${escapeHtml(u.fullName)}</b></td>
          <td>${escapeHtml(u.department)}</td>
          <td>${escapeHtml(u.position)}</td>
          <td style="white-space:nowrap"><span class="badge ${roleClass[u.role] || ''}" style="white-space:nowrap">${roleLabel[u.role] || u.role}</span></td>
          <td style="white-space:nowrap">${statusBadge}</td>
          <td class="text-xs">${userChainHtml(u)}</td>
          <td class="text-right whitespace-nowrap">
            ${cl ? `<button class="btn btn-secondary btn-icon" data-act="timeline" data-id="${u.id}" title="ประวัติการแก้ไขข้อมูล (โดย HR)"><i class="fa-solid fa-clock-rotate-left"></i></button>` : ''}
            <button class="btn btn-secondary btn-icon" data-act="edit" data-id="${u.id}" title="แก้ไข"><i class="fa-solid fa-pen"></i></button>
            ${u.id === Auth.currentUser().id ? ''
              : status !== 'resigned'
                ? `<button class="btn btn-secondary btn-icon" disabled title="พนักงานสถานะ 'ทำงาน' ลบไม่ได้ — เปลี่ยนเป็น 'ลาออก' ก่อน" style="opacity:.4;cursor:not-allowed"><i class="fa-solid fa-trash"></i></button>`
                : `<button class="btn btn-danger btn-icon" data-act="del" data-id="${u.id}" title="ลบ (เฉพาะสถานะลาออก)"><i class="fa-solid fa-trash"></i></button>`}
          </td>
        </tr>
      `; }).join('') || `<tr><td colspan="9" class="text-center text-mute" style="padding:2rem">ไม่พบข้อมูล</td></tr>`;

      // แถบเปลี่ยนหน้า (100 รายชื่อ/หน้า) — แสดงเสมอ
      Pager.render(document.getElementById('empPager'), empPage, totalPages, (np) => { empPage = np; draw(); });
    };

    // event delegation: ผูก listener ครั้งเดียวที่ tbody แทนการผูกทีละปุ่ม (หลายพันปุ่ม) ทุกครั้งที่วาด
    document.getElementById('empBody').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-act]'); if (!btn) return;
      const id = btn.dataset.id;
      if (btn.dataset.act === 'edit') AdminUI.openUserForm(id);
      else if (btn.dataset.act === 'del') AdminUI.confirmDeleteUser(id);
      else if (btn.dataset.act === 'status') AdminUI.toggleUserStatus(id);
      else if (btn.dataset.act === 'timeline') AdminUI._viewChangeTimeline(id);
    });
    document.getElementById('searchEmp').addEventListener('input', () => { empPage = 0; draw(); });
    MS.bind(document.getElementById('empFilters'), () => { empPage = 0; draw(); });
    document.getElementById('empClear')?.addEventListener('click', () => {
      ['filterDept', 'filterPos', 'filterRole', 'filterStatus', 'filterSup'].forEach(id => MS.clear(id));
      document.getElementById('searchEmp').value = '';
      empPage = 0;
      draw();
    });
    document.getElementById('empManual')?.addEventListener('click', () => window.Manual && Manual.open('admin', 'employees'));
    document.getElementById('addUserBtn').addEventListener('click', () => this.openUserForm(null));
    // Template + นำเข้า Excel/CSV (พนักงาน/หัวหน้างาน/HR)
    document.getElementById('empTplBtn').addEventListener('click', () => AdminUI._downloadUserTemplate());
    // Export Excel — ส่งออกรายชื่อพนักงานตามตัวกรองปัจจุบัน
    document.getElementById('empExportBtn').addEventListener('click', () => AdminUI._exportEmployees(getFiltered()));
    document.getElementById('empImportBtn').addEventListener('click', () => document.getElementById('empImport').click());
    document.getElementById('empImport').addEventListener('change', (ev) => {
      const file = ev.target.files[0]; if (!file) return;
      AdminUI._readSheet(file).then(rows => AdminUI._importUsers(rows, container))
        .catch(err => { console.error(err); toast('อ่านไฟล์ไม่สำเร็จ — ตรวจสอบรูปแบบไฟล์ (.xlsx / .csv)', 'error'); });
      ev.target.value = '';
    });
    draw();
  },

  openUserForm(id) {
    const isEdit = !!id;
    const u = isEdit ? DB.getUserById(id) : { id:'', role:'employee', fullName:'', employeeCode:'', department:'', position:'', hireDate:'', supervisorId:null, status:'active' };
    const supervisors = DB.getSupervisors();
    const body = `
      <div class="grid md:grid-cols-2 gap-4">
        <div><label class="label">ชื่อ-นามสกุล <span class="req">*</span></label><input id="uf_name" class="input" value="${escapeHtml(u.fullName)}" /></div>
        <div><label class="label">รหัสพนักงาน <span class="req">*</span> <span class="text-mute text-xs">(ใช้เข้าระบบ — ตรงกับรหัสพนักงาน HR)</span></label><input id="uf_code" class="input" value="${escapeHtml(u.employeeCode)}" placeholder="เช่น EMP-009 / SUP-003" /></div>
        <div>
          <label class="label">แผนก</label>
          <input id="uf_dept" class="input" value="${escapeHtml(u.department)}" list="deptList" />
          <datalist id="deptList">${[...new Set(DB.getUsers().map(x => x.department))].map(d => `<option value="${escapeHtml(d)}">`).join('')}</datalist>
        </div>
        <div><label class="label">ตำแหน่ง</label><input id="uf_pos" class="input" value="${escapeHtml(u.position)}" /></div>
        <div><label class="label">วันที่เริ่มงาน</label><input type="date" id="uf_hire" class="input" value="${u.hireDate || ''}" /></div>
        <div>
          <label class="label">บทบาท <span class="req">*</span></label>
          <select id="uf_role" class="input">
            <option value="employee" ${u.role === 'employee' ? 'selected' : ''}>พนักงาน</option>
            <option value="supervisor" ${u.role === 'supervisor' ? 'selected' : ''}>หัวหน้างาน</option>
            <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>HR / ฝ่ายบุคคล</option>
          </select>
        </div>
        <div id="uf_supWrap" style="${u.role === 'admin' ? 'display:none' : ''}">
          <label class="label">ผู้ประเมิน (สูงสุด ${typeof MAX_EVALUATORS !== 'undefined' ? MAX_EVALUATORS : 3} คน · ประเมินตามลำดับ) <span class="text-mute text-xs">— ลำดับ 1 ประเมินก่อน แล้วส่งต่อลำดับถัดไปจนถึงลำดับสุดท้ายซึ่งเป็นผู้ส่งให้ HR</span></label>
          ${EvaluatorPicker.build('uf_ev', evaluatorChainOf(u), { excludeId: u.id })}
        </div>
        <div>
          <label class="label">สถานะการเป็นพนักงาน <span class="req">*</span></label>
          <select id="uf_status" class="input">
            <option value="active" ${(u.status || 'active') === 'active' ? 'selected' : ''}>ทำงาน (เข้าระบบได้)</option>
            <option value="resigned" ${(u.status || 'active') === 'resigned' ? 'selected' : ''}>ลาออก (เข้าระบบไม่ได้)</option>
          </select>
        </div>
        <div>
          <label class="label">รหัสผ่านเข้าระบบ <span class="text-mute text-xs">— ตั้ง/เปลี่ยนให้พนักงาน (เว้นว่าง = คงเดิม)</span></label>
          <input type="text" id="uf_pw" class="input" autocomplete="off" placeholder="${isEdit ? 'เว้นว่างถ้าไม่เปลี่ยน' : 'เว้นว่าง = ใช้รหัสพนักงานเป็นรหัสผ่าน'}" />
        </div>
      </div>
      <div class="text-mute text-xs mt-3"><i class="fa-solid fa-circle-info mr-1"></i>เข้าระบบด้วย รหัสพนักงาน + รหัสผ่าน (คอลัมน์ password ในตาราง users — HR แก้ในชีตได้เช่นกัน) • รหัสผ่านเริ่มต้นของบัญชีที่ยังไม่ตั้ง = รหัสพนักงานของตัวเอง</div>
    `;
    showModal({
      title: isEdit ? 'แก้ไขพนักงาน' : 'เพิ่มพนักงานใหม่', body,
      footer: `<button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button><button id="uf_save" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button>`
    });
    EvaluatorPicker.bind(document.getElementById('uf_supWrap'), 'uf_ev');
    // Toggle ตัวเลือกผู้ประเมิน: พนักงาน + หัวหน้างาน กำหนดได้ (เพราะหัวหน้างานก็ถูกประเมินได้) • HR ไม่ต้องมีผู้ประเมิน
    document.getElementById('uf_role').addEventListener('change', (e) => {
      document.getElementById('uf_supWrap').style.display = e.target.value === 'admin' ? 'none' : '';
    });

    document.getElementById('uf_save').addEventListener('click', () => {
      const role = document.getElementById('uf_role').value;
      const code = document.getElementById('uf_code').value.trim();
      const data = {
        ...(u || {}),   // คงฟิลด์อื่นที่ไม่ได้อยู่ในฟอร์ม เช่น changeLog (timeline การเปลี่ยนแปลง)
        id: u.id || DB.uid('u'),
        fullName: document.getElementById('uf_name').value.trim(),
        employeeCode: code,
        department: document.getElementById('uf_dept').value.trim(),
        position: document.getElementById('uf_pos').value.trim(),
        hireDate: document.getElementById('uf_hire').value,
        role,
        evaluatorIds: role !== 'admin' ? EvaluatorPicker.value('uf_ev') : [],
        supervisorId: role !== 'admin' ? (EvaluatorPicker.value('uf_ev')[0] || null) : null,
        status: document.getElementById('uf_status').value || 'active',
      };
      // รหัสผ่าน: ส่งไปเฉพาะเมื่อกรอก (เซิร์ฟเวอร์คงค่าเดิมถ้าไม่ส่ง)
      { const pw = (document.getElementById('uf_pw').value || '').trim(); if (pw) data.password = pw; }
      if (!data.fullName || !data.employeeCode) { toast('กรุณากรอกชื่อ-นามสกุล และรหัสพนักงาน', 'error'); return; }
      const ex = DB.getUserByCode(data.employeeCode);
      if (ex && ex.id !== data.id) { toast('รหัสพนักงานนี้ถูกใช้แล้ว', 'error'); return; }
      // เก็บ diff ของฟิลด์สำคัญไว้ลง timeline (เฉพาะตอนแก้ไข)
      const me = Auth.currentUser();
      const rl = { admin: 'HR', supervisor: 'หัวหน้างาน', employee: 'พนักงาน' };
      const supName = (sid) => sid ? ((DB.getUserById(sid) || {}).fullName || '—') : '—';
      const diffs = [];
      if (isEdit && u) {
        if ((u.employeeCode || '') !== data.employeeCode) diffs.push({ label: 'รหัสพนักงาน', from: u.employeeCode || '—', to: data.employeeCode });
        if ((u.department || '') !== data.department) diffs.push({ label: 'แผนก/สาขา', from: u.department || '—', to: data.department || '—' });
        if ((u.position || '') !== data.position) diffs.push({ label: 'ตำแหน่ง', from: u.position || '—', to: data.position || '—' });
        { const oldC = evaluatorChainOf(u), newC = normalizeEvaluatorIds(data.evaluatorIds, data.id);
          if (oldC.join('|') !== newC.join('|')) diffs.push({ label: 'ผู้ประเมิน (ลำดับ 1→2→3)', from: oldC.length ? oldC.map(supName).join(' → ') : '—', to: newC.length ? newC.map(supName).join(' → ') : '—' }); }
        if ((u.role || '') !== data.role) diffs.push({ label: 'บทบาท', from: rl[u.role] || u.role || '—', to: rl[data.role] || data.role });
        if ((u.status || 'active') !== (data.status || 'active')) diffs.push({ label: 'สถานะ', from: (u.status || 'active') === 'resigned' ? 'ลาออก' : 'ทำงาน', to: (data.status || 'active') === 'resigned' ? 'ลาออก' : 'ทำงาน' });
      }
      DB.upsertUser(data).then(async () => {
        // ลง timeline เมื่อมีการเปลี่ยนแปลงจริง (เคลียร์สถานะ "รอตรวจ" ให้ด้วย)
        try { if (diffs.length) await DB.logEmployeeChange(data, 'edited', me ? me.id : null, diffs, ''); } catch (e) { console.warn('บันทึก timeline ไม่ได้', e); }
        closeModal();
        toast(isEdit ? 'แก้ไขสำเร็จ' : 'เพิ่มพนักงานสำเร็จ', 'success');
        App.go('hr-employees');
      }).catch(() => toast('บันทึกไม่สำเร็จ — โปรดลองใหม่', 'error', { title: 'บันทึกไม่สำเร็จ' }));
    });
  },

  // ประวัติการแก้ไขข้อมูลพนักงาน (Timeline) — เฉพาะการแก้ไขโดย HR (ไม่มีคำขอจากหัวหน้างานแล้ว)
  _changeTimelineHtml(cl) {
    if (!cl || !(cl.timeline || []).length) return '<div class="text-mute" style="padding:0.5rem">— ยังไม่มีประวัติ —</div>';
    const typeMap = { edited: { l: 'HR แก้ไขข้อมูล', c: 'ok', i: 'fa-user-pen' }, comment: { l: 'ข้อความ', c: 'info', i: 'fa-comment-dots' } };
    return (cl.timeline || []).slice().sort((a, b) => String(b.ts || '').localeCompare(String(a.ts || ''))).map(h => {
      const t = typeMap[h.type] || { l: h.type, c: '', i: 'fa-circle' };
      const chips = (h.changes || []).map(ch => `<div class="text-xs" style="padding:1px 0">• <b>${escapeHtml(ch.label)}:</b> <span class="text-mute">${escapeHtml(ch.from || '—')}</span> → <b>${escapeHtml(ch.to || '—')}</b></div>`).join('');
      return `<div class="muted-bg p-2 rounded mt-2" style="border-left:3px solid var(--accent)">
        <div class="flex justify-between items-center gap-2"><span class="badge ${t.c}"><i class="fa-solid ${t.i} mr-1"></i>${t.l}</span><span class="text-mute text-xs mono">${fmtDateTime(h.ts)}</span></div>
        ${chips ? `<div class="mt-1">${chips}</div>` : ''}
        ${h.note ? `<div class="text-xs mt-1">${escapeHtml(h.note)}</div>` : ''}
        ${h.byName ? `<div class="text-mute text-xs mt-1">โดย ${escapeHtml(h.byName)}</div>` : ''}
      </div>`;
    }).join('');
  },
  _viewChangeTimeline(empId) {
    const u = DB.getUserById(empId);
    const cl = DB.getChangeLog(empId);
    const body = `
      <div class="text-sm mb-2"><b>${escapeHtml(u ? u.fullName : '')}</b> <span class="mono text-mute">${escapeHtml(u ? (u.employeeCode || '') : '')}</span></div>
      <div style="max-height:360px;overflow:auto;padding-right:2px">${this._changeTimelineHtml(cl)}</div>`;
    showModal({ title: 'ประวัติการแก้ไขข้อมูลพนักงาน', body, footer: '<button class="btn btn-secondary" onclick="closeModal()">ปิด</button>', size: '560' });
  },

  confirmDeleteUser(id) {
    const u = DB.getUserById(id);
    if (!u) return;
    // กันลบพนักงานสถานะ "ทำงาน" — ต้องเปลี่ยนเป็น "ลาออก" ก่อนเท่านั้น
    if ((u.status || 'active') !== 'resigned') {
      toast('ลบไม่ได้ — พนักงานสถานะ "ทำงาน" ให้เปลี่ยนสถานะเป็น "ลาออก" ก่อน', 'error', { title: 'ลบไม่ได้' });
      return;
    }
    confirmDialog({ title: 'ลบพนักงาน', message: `ต้องการลบ "${u.fullName}"? การประเมินของพนักงานคนนี้จะถูกลบทั้งหมด`, confirmText: 'ลบ', type: 'delete' }).then(async ok => {
      if (!ok) return;
      await DB.deleteUser(id);
      toast(`ลบพนักงาน ${u.fullName} แล้ว`, 'success');
      App.go('hr-employees');
    });
  },

  // สลับสถานะการเป็นพนักงาน ทำงาน ⇄ ลาออก (HR เปลี่ยนได้เสมอ)
  toggleUserStatus(id) {
    const u = DB.getUserById(id);
    if (!u) return;
    const next = (u.status || 'active') === 'active' ? 'resigned' : 'active';
    const apply = async () => {
      await DB.upsertUser({ ...u, status: next });
      toast(next === 'resigned'
        ? `ตั้งสถานะ "${u.fullName}" เป็น "ลาออก" — เข้าระบบไม่ได้`
        : `คืนสถานะ "${u.fullName}" เป็น "ทำงาน" — เข้าระบบได้`, 'success');
      App.go('hr-employees');
    };
    if (next === 'resigned') {
      confirmDialog({ title: 'เปลี่ยนเป็นลาออก', message: `ตั้งสถานะ "${u.fullName}" เป็น "ลาออก"?\nผู้ใช้นี้จะไม่สามารถเข้าระบบได้จนกว่าจะเปลี่ยนกลับ`, confirmText: 'ยืนยัน', type: 'warn' }).then(ok => { if (ok) apply(); });
    } else {
      apply();
    }
  },

  // ดาวน์โหลด Template รายชื่อผู้ใช้ (พนักงาน/หัวหน้างาน/HR) สำหรับหน้าจัดการพนักงาน
  _downloadUserTemplate() {
    const header = ['รหัสพนักงาน (ใช้เข้าระบบ)', 'ชื่อ-นามสกุล', 'แผนก/สาขา', 'ตำแหน่ง', 'บทบาท (HR/หัวหน้างาน/พนักงาน)', 'รหัสผู้ประเมิน 1 (หัวหน้างาน)', 'วันที่เริ่มงาน (YYYY-MM-DD)', 'สถานะ (ทำงาน/ลาออก)', 'รหัสผู้ประเมิน 2', 'รหัสผู้ประเมิน 3', 'รหัสผ่าน (เว้นว่าง = คงเดิม/ใช้รหัสพนักงาน)'];
    const roleLabel = { admin: 'HR', supervisor: 'หัวหน้างาน', employee: 'พนักงาน' };
    // ดึงรายชื่อพนักงานปัจจุบันทั้งหมดออกมาในไฟล์ (แก้ไขแล้วอัปโหลดกลับ จับคู่ด้วยรหัสพนักงาน)
    const users = DB.getUsers().slice().sort((a, b) => String(a.employeeCode || '').localeCompare(String(b.employeeCode || ''), 'th'));
    const rows = users.map(u => {
      const ch = evaluatorChainOf(u).map(id => (DB.getUserById(id) || {}).employeeCode || '');
      return [u.employeeCode || '', u.fullName || '', u.department || '', u.position || '',
        roleLabel[u.role] || 'พนักงาน', ch[0] || '', u.hireDate || '',
        (u.status || 'active') === 'resigned' ? 'ลาออก' : 'ทำงาน', ch[1] || '', ch[2] || '', ''];
    });
    const example = [
      ['EMP-101', 'สมหญิง ขยันดี', 'เร่งรัดหนี้สิน C', 'พนักงานเร่งรัดหนี้', 'พนักงาน', 'SUP-003', '2024-02-15', 'ทำงาน', 'SUP-001', '', ''],

    if (typeof XLSX !== 'undefined') {

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'รายชื่อพนักงาน');
      XLSX.writeFile(wb, 'template_จัดการพนักงาน.xlsx');
    } else {
      const csv = aoa.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'template_จัดการพนักงาน.csv'; a.click();
    }
    toast('ดาวน์โหลด Template แล้ว — กรอกข้อมูลแล้วอัปโหลดกลับ (จับคู่ด้วยรหัสพนักงาน)', 'success', { duration: 4500 });
  },

  // Export Excel รายชื่อพนักงาน "ตามตัวกรองปัจจุบัน" (คอลัมน์ตรงกับ Template + ชื่อผู้ประเมินทุกลำดับ)
  _exportEmployees(list) {
    if (!list || !list.length) { toast('ไม่มีรายชื่อให้ส่งออก (ตามตัวกรองปัจจุบัน)', 'error'); return; }
    const roleLabel = { admin: 'HR', supervisor: 'หัวหน้างาน', employee: 'พนักงาน' };
    const header = ['รหัสพนักงาน', 'ชื่อ-นามสกุล', 'แผนก/สาขา', 'ตำแหน่ง', 'บทบาท', 'สถานะ', 'รหัสผู้ประเมิน 1', 'ชื่อผู้ประเมิน 1', 'วันที่เริ่มงาน', 'รหัสผู้ประเมิน 2', 'ชื่อผู้ประเมิน 2', 'รหัสผู้ประเมิน 3', 'ชื่อผู้ประเมิน 3'];
    const rows = list.slice()
      .sort((a, b) => String(a.employeeCode || '').localeCompare(String(b.employeeCode || ''), 'th'))
      .map(u => {
        const ch = evaluatorChainOf(u).map(id => DB.getUserById(id) || {});
        const sup = ch[0] || {}, s2 = ch[1] || {}, s3 = ch[2] || {};
        return [u.employeeCode || '', u.fullName || '', u.department || '',
          u.position || '', roleLabel[u.role] || 'พนักงาน',
          (u.status || 'active') === 'resigned' ? 'ลาออก' : 'ทำงาน',
          sup.employeeCode || '', sup.fullName || '', u.hireDate || '',
          s2.employeeCode || '', s2.fullName || '', s3.employeeCode || '', s3.fullName || ''];
      });
    const aoa = [header, ...rows];
    const fname = `รายชื่อพนักงาน_${new Date().toISOString().slice(0, 10)}.xlsx`;
    if (typeof XLSX !== 'undefined') {
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = [{ wch: 14 }, { wch: 24 }, { wch: 22 }, { wch: 18 }, { wch: 22 }, { wch: 12 }, { wch: 10 }, { wch: 14 }, { wch: 24 }, { wch: 14 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'รายชื่อพนักงาน');
      XLSX.writeFile(wb, fname);
    } else {
      const csv = aoa.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname.replace('.xlsx', '.csv'); a.click();
    }
    toast(`ส่งออก ${list.length.toLocaleString()} รายชื่อแล้ว`, 'success', { title: 'Export Excel สำเร็จ' });
  },

  // นำเข้ารายชื่อผู้ใช้จาก Excel/CSV → สร้าง/อัปเดต ทุกบทบาท (login ยืนยันรหัสผ่านกับ HR กลาง)
  async _importUsers(rows, container) {
    if (!rows || !rows.length) { toast('ไฟล์ว่าง', 'error'); return; }
    let start = 0;
    const first = (rows[0] || []).map(c => String(c || '').trim());
    if (first.some(c => /รหัส|ชื่อ|code|name|บทบาท|พนักงาน/i.test(c))) start = 1;
    const roleOf = (t) => {
      const s = String(t || '').trim().toLowerCase();
      if (/hr|บุคคล|admin/.test(s)) return 'admin';
      if (/หัวหน้า|supervisor|sup/.test(s)) return 'supervisor';
      return 'employee';
    };
    let created = 0, updated = 0, noSup = 0, skipped = 0;
    const toUpsert = [];
    for (let i = start; i < rows.length; i++) {
      const r = rows[i]; if (!r) continue;
      const code = String(r[0] || '').trim();
      const name = String(r[1] || '').trim();
      if (!code || !name) { if (r[0] || r[1]) skipped++; continue; }
      const dept = String(r[2] || '').trim();
      const position = String(r[3] || '').trim();
      const roleRaw = String(r[4] || '').trim();
      const supCode = String(r[5] || '').trim();
      let hireDate = String(r[6] || '').trim();
      if (hireDate) { const d = new Date(hireDate); if (!isNaN(d)) hireDate = d.toISOString().slice(0, 10); }
      const statusRaw = String(r[7] || '').trim();
      const status = statusRaw ? (/ลาออก|resign|inactive|พ้นสภาพ/i.test(statusRaw) ? 'resigned' : 'active') : '';

      const existing = DB.getUserByCode(code);   // จับคู่ด้วยรหัสพนักงาน → ถ้ามีอยู่แล้วถือเป็นการ "อัปเดต"
      // ไม่ระบุบทบาทในไฟล์ + เป็นคนเดิม → คงบทบาทเดิมไว้ (กันหัวหน้างาน/HR ถูกลดสิทธิ์ตอนอัปเดต)
      const role = roleRaw ? roleOf(roleRaw) : (existing ? existing.role : 'employee');

      // รหัสหัวหน้างาน (ผู้ประเมิน): ใส่รหัส = กำหนด • "ไม่มี/-/ลบ" = ล้าง • เว้นว่าง = คงค่าเดิม (ใช้ได้ทุกบทบาท)
      const CLEAR_RE = /^(ไม่มี|ไม่กำหนด|none|null|-|ลบ|x)$/i;
      const clearSup = CLEAR_RE.test(supCode);
      let supId = null;
      if (supCode && !clearSup) { const sup = DB.getUserByCode(supCode); if (sup) supId = sup.id; else noSup++; }
      // ผู้ประเมินลำดับ 2-3 (คอลัมน์ท้าย) — กติกาเดียวกับลำดับ 1: ใส่รหัส = กำหนด • "ไม่มี/-/ลบ" = ล้าง • เว้นว่าง = คงเดิม
      const evCodes = [supCode, String(r[8] || '').trim(), String(r[9] || '').trim()];
      const newPw = String(r[10] || '').trim();   // คอลัมน์รหัสผ่าน (ไม่บังคับ)

      const user = existing ? { ...existing } : {
        id: DB.uid('u'), role, fullName: '', employeeCode: '', department: '', position: '', hireDate: '', supervisorId: null, status: 'active',
      };
      user.role = role;
      user.employeeCode = code;
      user.fullName = name;
      if (dept) user.department = dept;
      if (position) user.position = position;
      if (hireDate) user.hireDate = hireDate;
      { const oldChain = existing ? evaluatorChainOf(existing) : [];
        const chain = evCodes.map((cd, i) => {
          if (!cd) return oldChain[i] || null;                 // เว้นว่าง → คงเดิม
          if (CLEAR_RE.test(cd)) return null;                  // ล้าง
          const su = DB.getUserByCode(cd);
          if (!su) { if (i > 0) noSup++; return oldChain[i] || null; }   // รหัสไม่พบ → คงเดิม (ลำดับ 1 นับไว้แล้วด้านบน)
          return su.id !== user.id ? su.id : (oldChain[i] || null);      // ตัวเอง → คงเดิม
        });
        user.evaluatorIds = normalizeEvaluatorIds(chain, user.id);
        user.supervisorId = user.evaluatorIds[0] || null; }
      if (status) user.status = status;             // มีระบุในไฟล์ → ใช้ค่านั้น
      else if (!existing) user.status = 'active';    // ผู้ใช้ใหม่ที่ไม่ได้ระบุ = ทำงาน
      if (newPw) user.password = newPw;   // ตั้งรหัสผ่านให้จากไฟล์ (เว้นว่าง = คงเดิม)
      toUpsert.push(user); existing ? updated++ : created++;
    }
    // บันทึกทีละก้อน (แบ่ง 200) ขึ้น DB จริง พร้อม popup สถานะ — พลาด = error + ยกเลิก
    showBusy(`กำลังบันทึกขึ้นฐานข้อมูล... (0/${toUpsert.length} คน)`);
    try {
      await DB.bulkUpsertUsers(toUpsert, (d, t) => updateBusy(`กำลังบันทึกขึ้นฐานข้อมูล... (${d}/${t} คน)`));
    } catch (err) {
      hideBusy(); console.error(err);
      toast('บันทึกขึ้นฐานข้อมูลไม่สำเร็จ — ข้อมูลยังไม่ถูกบันทึกลงระบบจริง โปรดลองใหม่', 'error', { title: 'บันทึกไม่สำเร็จ' });
      return;
    }
    hideBusy();
    let msg = `นำเข้า ${created} คนใหม่ • อัปเดต ${updated} คน`;
    if (noSup) msg += ` • ไม่พบรหัสหัวหน้า ${noSup} แถว`;
    if (skipped) msg += ` • ข้าม ${skipped} แถว`;
    toast(msg, (created + updated) ? 'success' : 'error', { title: 'นำเข้ารายชื่อสำเร็จ', duration: 5500 });
    App.go('hr-employees');
  },

      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button id="visReset" class="btn btn-secondary"><i class="fa-solid fa-rotate-left"></i> ค่าเริ่มต้น</button>
        <button id="visSave" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button>
      </div>`;
    const syncOn = () => container.querySelectorAll('.vis-opt').forEach(l => { const i = l.querySelector('input'); l.classList.toggle('on', !!(i && i.checked)); });
    container.querySelectorAll('.vis-opt input').forEach(i => i.addEventListener('change', syncOn));
    container.querySelector('#visSave').addEventListener('click', () => {
      const s = DB.getSettings();
      s.finalScoreMode = (container.querySelector('input[name="visScore"]:checked') || {}).value || 'average';
      s.stepVisibility = {
        evaluators: (container.querySelector('input[name="visEval"]:checked') || {}).value || 'all',
        employee: (container.querySelector('input[name="visEmp"]:checked') || {}).value || 'final',
        carryScores: !!container.querySelector('#visCarry').checked,
        pdf: !!container.querySelector('#visPdf').checked,
      };
      DB.saveSettings(s);
      toast('บันทึกนโยบายการมองเห็นผลรายลำดับแล้ว', 'success');
    });
    container.querySelector('#visReset').addEventListener('click', () => {
      const s = DB.getSettings(); s.stepVisibility = Object.assign({}, STEP_VIS_DEFAULT); s.finalScoreMode = 'average'; DB.saveSettings(s);
      this._renderVisibilityPanel(container); toast('คืนค่าเริ่มต้นแล้ว', 'success');
    });
  },

  // =================================================================
  _renderFormsListBody(container) {

    container.innerHTML = `
