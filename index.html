            <tr class="paper-total-row paper-grand-total">
              <td><b>คะแนนรวมทั้งหมด</b></td>
              <td class="col-max mono"><b>${calcFormMax(form)}</b></td>
              <td class="col-got mono"><b data-summary-total>—</b></td>
            </tr>
            <tr class="paper-grade-row">
              <td colspan="2"><b>ผลการประเมิน (Grade)</b></td>
              <td class="text-center"><span data-summary-grade class="grade-tag" style="color:#737373;border-color:#e5e5e5">—</span></td>
            </tr>
            <tr class="paper-avg-row" data-summary-avg-row style="display:none">
              <td colspan="2"><b>คะแนนสรุปของใบประเมิน</b><div class="text-mute text-xs" data-summary-avg-desc></div></td>
              <td class="col-got mono text-center" data-summary-avg>—</td>
            </tr>
          </tbody>
        </table>
      </div>
    `;
  },

  // =================================================================
  // Section 6 — Result Box (5 status boxes by % of total)
  // =================================================================
  // แปลง "ระดับขั้นการประเมิน" (settings.gradeLevels) → กล่องสรุปผลการพิจารณา — ใช้เกณฑ์/ป้าย/สี ชุดเดียวกับป้ายเกรด
  _gradeResultBoxes() {
    return (DB.getSettings().gradeLevels || []).map((g, i) => ({ id: 'gl_' + i, label: g.label, minPct: g.min, color: g.color, bg: (g.color || '#6b7280') + '22' }));
  },
  _activeGradeIdx(score, max) {
    const levels = DB.getSettings().gradeLevels || [];
    const pct = Math.min(100, (max && max > 0) ? (score / max) * 100 : score);
    const idx = levels.findIndex(l => pct >= l.min && pct < l.max);
    return idx < 0 ? Math.max(0, levels.length - 1) : idx;
  },

  // ===================================================================
  // กติกา "แนวทางดำเนินการและแผนพัฒนา" ตามระดับผลประเมิน
  //   • ต้องปรับปรุง / ไม่ผ่านการประเมิน (2 ระดับล่างสุด)
  //       - ห้ามเลือก "ไม่มีประเด็น — รักษามาตรฐาน" และ "พิจารณาเลื่อนตำแหน่ง / Reward"
  //       - บังคับกรอก หมายเหตุ (จะดำเนินการอย่างไร) + ข้อเสนอแนะจากผู้ประเมิน
  //   • "พิจารณาเลื่อนตำแหน่ง / Reward" ติ๊กได้เฉพาะระดับสูงสุด (ดีเยี่ยม) เท่านั้น
  //   • ระดับอื่น (ดี / ปานกลาง) เลือกได้อิสระ • หมายเหตุและข้อเสนอแนะไม่บังคับ
  //   ** ระบุระดับด้วย "ตำแหน่งใน gradeLevels" ไม่ผูกกับข้อความ (ตั้งชื่อเกรดใหม่ก็ยังทำงาน)
  //   ** ไม่แตะรายการตัวเลือกในฟอร์ม (coachingOptions) — ค่าที่บันทึกไว้เป็น "ลำดับ" ข้อมูลเก่าจึงไม่เพี้ยน
  // ===================================================================
  _isNoIssueOpt(label) { return /ไม่มีประเด็น|รักษามาตรฐาน/i.test(String(label || '')); },
  _isRewardOpt(label) { return /เลื่อนตำแหน่ง|reward/i.test(String(label || '')); },

  // คืนกติกาของระดับผลปัจจุบัน จากคะแนนสด
  _coachRule(score, max) {
    const levels = DB.getSettings().gradeLevels || [];
    const n = levels.length;
    const idx = this._activeGradeIdx(score, max);
    const label = (levels[idx] || {}).label || '';
    // 2 ระดับล่างสุด = ต้องปรับปรุง + ไม่ผ่านการประเมิน (ถ้ามีน้อยกว่า 3 ระดับ ใช้เฉพาะระดับล่างสุด)
    const lowIdx = n >= 3 ? [n - 2, n - 1] : (n ? [n - 1] : []);
    return {
      gradeLabel: label,
      isLow: lowIdx.includes(idx),        // ต้องปรับปรุง / ไม่ผ่าน
      isTop: n > 0 && idx === 0,          // ดีเยี่ยม (ระดับสูงสุด)
    };
  },

  // ล็อก/ปลดล็อกตัวเลือกแนวทางฯ ตามระดับผลปัจจุบัน + เอาติ๊กที่ขัดกติกาออก (เรียกทุกครั้งที่คะแนนเปลี่ยน)
  _applyCoachRule(form, score, max) {
    const area = document.getElementById('coachingArea');
    if (!area) return;
    const opts = (form && form.coachingOptions) || [];
    const rule = this._coachRule(score, max);
    let removed = [];
    area.querySelectorAll('[data-coaching]').forEach(lbl => {
      const idx = +lbl.dataset.coaching;
      const label = opts[idx];
      let blockMsg = '';
      if (this._isRewardOpt(label) && !rule.isTop) blockMsg = `เลือกได้เฉพาะผลประเมินระดับสูงสุดเท่านั้น (ตอนนี้: ${rule.gradeLabel || '—'})`;
      else if (this._isNoIssueOpt(label) && rule.isLow) blockMsg = `ผลประเมินอยู่ระดับ "${rule.gradeLabel}" — เลือกข้อนี้ไม่ได้`;
      const cb = lbl.querySelector('input[type=checkbox]');
      lbl.classList.toggle('coach-locked', !!blockMsg);
      lbl.title = blockMsg || '';
      if (cb) cb.disabled = !!blockMsg;
      if (blockMsg) {   // เคยติ๊กไว้แต่ตอนนี้ขัดกติกา → เอาออกให้ (ล้างทั้ง state และ checkbox)
        if (cb) cb.checked = false;
        lbl.classList.remove('selected');
        if ((this.state.coachingChecks || []).includes(idx)) {
          this.state.coachingChecks = this.state.coachingChecks.filter(x => x !== idx);
          removed.push(String(label));
        }
      }
    });
    // แถบเตือนใต้ตัวเลือก — บอกกติกาของระดับปัจจุบัน
    const note = document.getElementById('coachRuleNote');
    if (note) {
      if (rule.isLow) {
        note.style.display = '';
        note.className = 'risk-fail-note warn';
        // ครอบด้วย span เดียว — คลาสนี้เป็น flex ถ้าแยกหลาย element ข้อความจะถูกจัดเป็นคอลัมน์
        note.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><span>ผลประเมินอยู่ระดับ <b>"${escapeHtml(rule.gradeLabel)}"</b> — ต้องระบุ <b>หมายเหตุ (จะดำเนินการอย่างไร)</b> และ <b>ข้อเสนอแนะจากผู้ประเมิน</b> ก่อนส่ง</span>`;
      } else {
        note.style.display = 'none';
        note.innerHTML = '';
      }
    }
    if (removed.length) toast(`ยกเลิกการเลือก "${removed.join('", "')}" — ไม่ตรงกับระดับผลประเมินปัจจุบัน`, 'warn', { duration: 5000 });
  },
  _renderResultBox(form) {
    // summary table → ฝั่งซ้าย (#summaryArea)
    document.getElementById('summaryArea').innerHTML = this._renderSummary(form);

    // result boxes → ฝั่งขวา (#resultBoxArea) เป็นการ์ดติดกับ live panel
    const area = document.getElementById('resultBoxArea');
    const boxes = this._gradeResultBoxes();   // ใช้ระดับขั้นการประเมิน (gradeLevels) ชุดเดียวกับป้ายเกรด
    if (!boxes.length) { area.innerHTML = ''; return; }
    area.innerHTML = `
      <div class="card live-panel">
        <div class="card-title">สรุปผลการพิจารณา</div>
        <div class="text-mute text-xs mb-2">ระบบเลือกอัตโนมัติตาม % คะแนน</div>
        <div class="result-box-col">
          ${boxes.map(b => `
            <div class="result-box" data-resultbox="${b.id}" style="--rb-color:${b.color};--rb-bg:${b.bg}">
              <div class="result-box-label">${escapeHtml(b.label)}</div>
              <div class="result-box-pct">≥ ${b.minPct}%</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  },

  // =================================================================
  // Section 8 — Discipline Decision
  // =================================================================
  // Section 9 — Signature (display only — stores evaluatorId/employeeId via system)
  // =================================================================
  _renderSignature(form) {
    const area = document.getElementById('signatureArea');
    const me = Auth.currentUser();
    const emp = DB.getUserById(this.state.employeeId);
    const thDateSig = (iso) => { if (!iso) return ''; try { return new Date(iso).toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return ''; } };

    // ผู้ลงนามในแต่ละช่อง — ดึงจากเรคคอร์ดจริง (ไม่ใช้ผู้ที่กำลังเปิดดู)
    // • ผู้ประเมิน = หัวหน้างานที่ถูกมอบหมาย • HR = ผู้ตรวจ/ยืนยัน (เฉพาะเมื่อยืนยันแล้ว) • พนักงาน = ผู้รับทราบ
    const _recSig = this.state.assignmentId ? DB.getEvaluations().find(x => x.id === this.state.assignmentId) : null;
    const evaluatorUser = _recSig ? (DB.getUserById(evalCurrentEvaluatorId(_recSig) || _recSig.evaluatorId) || {}) : (me || {});
    const submittedAt = _recSig ? _recSig.submittedAt : null;
    const isConfirmedSig = !!(_recSig && _recSig.status === 'confirmed');
    const reviewerUser = (isConfirmedSig && _recSig.reviewedBy) ? (DB.getUserById(_recSig.reviewedBy) || {}) : null;
    const reviewedAt = _recSig ? _recSig.reviewedAt : null;
    const canEditEmp = !!(me && me.role === 'admin');   // HR แก้ความเห็น/สถานะรับทราบของพนักงานได้ (สิทธิ์อื่นอ่านอย่างเดียว)

    // ความเห็นพนักงาน — HR แก้ไขได้ / สิทธิ์อื่นอ่านอย่างเดียว (ปกติพนักงานกรอก/กดรับทราบเองผ่านระบบ)
    const resp = this.state.empResponse;
    const respLabel = resp === 'acknowledge' ? 'ไม่มีข้อโต้แย้ง — รับทราบผลการประเมิน'
      : (resp === 'dispute' ? 'มีข้อโต้แย้ง' : 'ยังไม่รับทราบ (รอพนักงานยืนยันผ่านระบบ)');
    const respColor = resp === 'acknowledge' ? 'var(--ok)' : (resp === 'dispute' ? 'var(--err)' : 'var(--mute)');
    const acked = resp === 'acknowledge';
    const ackName = this.state.empAckName || '';
    const ackDate = this.state.empAckDate || '';

    area.innerHTML = `
      <div class="paper-section">
        <div class="paper-section-title">ความเห็นพนักงานและลงนามรับทราบ <span class="paper-section-en">Employee Feedback & Acknowledgement</span></div>

        <div class="risk-warning no-print" style="background:#eff6ff;border-color:#bfdbfe;color:#1e40af"><i class="fa-solid fa-circle-info"></i> ${canEditEmp ? 'ปกติพนักงานกรอกความเห็นและกด "รับทราบ" เองผ่านระบบ — <b>HR แก้ไขส่วนนี้ได้</b> (ใช้เมื่อจำเป็น)' : 'พนักงานกรอกความเห็นและกด "รับทราบผลการประเมิน" เองผ่านระบบ — ส่วนนี้แสดงผลอ่านอย่างเดียว'}</div>

        <div class="emp-response">
          <div class="emp-response-title"><i class="fa-regular fa-comment-dots mr-1"></i>ความเห็นของพนักงาน <span class="text-mute" style="font-weight:400">(Employee's Response)</span></div>
          ${canEditEmp ? `
          <div class="mt-1"><b>สถานะ:</b>
            <select id="hrEmpResp" class="input" style="max-width:340px;display:inline-block;margin-left:4px">
              <option value=""${resp === '' ? ' selected' : ''}>ยังไม่รับทราบ</option>
              <option value="acknowledge"${resp === 'acknowledge' ? ' selected' : ''}>ไม่มีข้อโต้แย้ง — รับทราบผลการประเมิน</option>
              <option value="dispute"${resp === 'dispute' ? ' selected' : ''}>มีข้อโต้แย้ง</option>
            </select>
          </div>
          <div class="mt-2"><b>ความเห็น / ข้อโต้แย้ง:</b>
            <textarea id="hrEmpComment" rows="2" class="input expandable" data-label="ความเห็น / ข้อโต้แย้ง" placeholder="ระบุความเห็น/ข้อโต้แย้งของพนักงาน (HR แก้ไขได้)">${escapeHtml(this.state.empComment || '')}</textarea>
          </div>
          ` : `
          <div class="mt-1"><b>สถานะ:</b> <span style="color:${respColor};font-weight:700">${escapeHtml(respLabel)}</span></div>
          <div class="mt-2"><b>ความเห็น / ข้อโต้แย้ง:</b> ${this.state.empComment ? escapeHtml(this.state.empComment) : '<span class="text-mute">— ไม่มี —</span>'}</div>
          `}
        </div>

        ${(() => {
          // กล่องลงนาม "ผู้ประเมินตามลำดับ" — 1 กล่องต่อลำดับตามโครงสร้างผู้ประเมินของพนักงานคนนี้ (สูงสุด 3) แม้มีคนเดียวก็แสดงเป็นลำดับ 1
          const chain = _recSig ? evalChainOf(_recSig) : [];
          const ids = chain.length ? chain : ((evaluatorUser && evaluatorUser.id) ? [evaluatorUser.id] : []);
          const doneAt = {}; (_recSig ? evalChainCurrent(_recSig) : []).forEach(x => { if (x && x.evaluatorId) doneAt[x.evaluatorId] = x.submittedAt; });
          const stepNow = _recSig ? evalStepOf(_recSig) : 0;
          const finished = !!(_recSig && _recSig.status !== 'assigned');
          const boxes = ids.map((id, i) => {
            const u = DB.getUserById(id) || {};
            const at = doneAt[id] || ((finished && i === ids.length - 1) ? submittedAt : null);
            const cur = !finished && i === stepNow;
            return `<div class="signature-box${cur ? ' sig-cur' : ''}">
            <div class="signature-role"><span class="sig-no">${i + 1}</span>ผู้ประเมินลำดับ ${i + 1} · EVALUATOR ${i + 1}</div>
            <div class="signature-line">${escapeHtml(u.fullName || '')}</div>
            <div class="signature-meta text-mute" style="font-size:10px">${escapeHtml(u.position || '')}</div>
            ${at ? `<div class="signature-meta" style="color:var(--ok)"><i class="fa-solid fa-circle-check mr-1"></i>ประเมินและส่งแล้ว</div><div class="signature-meta">วันที่ ${escapeHtml(thDateSig(at))}</div>`
              : (cur ? `<div class="signature-meta" style="color:var(--accent-dark)"><i class="fa-solid fa-pen mr-1"></i>ถึงคิวประเมิน (ลำดับ ${i + 1})</div><div class="signature-meta">วันที่ ........................................</div>`
              : `<div class="signature-meta">ลงชื่อ ........................................</div><div class="signature-meta">วันที่ ........................................</div>`)}
          </div>`;
          }).join('');
          return `<div class="sig-group-title mt-3"><i class="fa-solid fa-list-ol mr-1"></i>ผู้ประเมินตามลำดับ (${ids.length} ลำดับ) <span class="text-mute" style="font-weight:400">— โครงสร้างผู้ประเมินของพนักงานคนนี้ (กำหนดได้สูงสุด ${typeof MAX_EVALUATORS !== 'undefined' ? MAX_EVALUATORS : 3})</span></div>
        <div class="signature-grid sig-evals" style="grid-template-columns:repeat(${Math.max(1, Math.min(ids.length, 3))}, 1fr)">${boxes || '<div class="text-mute text-sm" style="padding:.5rem">— ยังไม่กำหนดผู้ประเมิน —</div>'}</div>`;
        })()}
        <div class="sig-group-title mt-3"><i class="fa-solid fa-user-check mr-1"></i>ฝ่ายบุคคลและพนักงาน</div>
        <div class="signature-grid" style="grid-template-columns:repeat(2, 1fr)">
          <div class="signature-box">
            <div class="signature-role">HR · HUMAN RESOURCES</div>
            <div class="signature-line">${escapeHtml(reviewerUser?.fullName || '')}</div>
            ${isConfirmedSig && reviewedAt
              ? `<div class="signature-meta" style="color:var(--ok)"><i class="fa-solid fa-circle-check mr-1"></i>ตรวจสอบและยืนยันแล้ว</div><div class="signature-meta">วันที่ ${escapeHtml(thDateSig(reviewedAt))}</div>`
              : `<div class="signature-meta">ลงชื่อ ........................................</div><div class="signature-meta">วันที่ ........................................</div>`}
          </div>
          <div class="signature-box">
            <div class="signature-role">พนักงาน · EMPLOYEE</div>
            <div class="signature-line">${escapeHtml(ackName || emp?.fullName || '')}</div>
            ${acked && ackName
              ? `<div class="signature-meta" style="color:var(--ok)"><i class="fa-solid fa-circle-check mr-1"></i>รับทราบผ่านระบบ</div><div class="signature-meta">วันที่ ${escapeHtml(ackDate)}</div>`
              : `<div class="signature-meta">ลงชื่อ ........................................</div><div class="signature-meta">วันที่ ........................................</div>`}
          </div>
        </div>
      </div>
    `;
    // HR แก้ไขความเห็น/สถานะรับทราบของพนักงานได้ (สิทธิ์อื่นอ่านอย่างเดียว) — บันทึกลง state → save เขียนลง ev.empResponse/empComment
    if (canEditEmp) {
      const rs = document.getElementById('hrEmpResp'); if (rs) rs.addEventListener('change', e => { this.state.empResponse = e.target.value; });
      const cm = document.getElementById('hrEmpComment'); if (cm) cm.addEventListener('input', e => { this.state.empComment = e.target.value; });
    }
  },

  // =================================================================
  // Important Note (footnote)
  // =================================================================
  // ---------- Log ผลรายลำดับ (ในฟอร์ม / รายละเอียด / PDF) ----------
  _renderStepLog(form, ex) {
    const host = document.getElementById('stepLogArea'); if (!host) return;
    host.innerHTML = ex ? this.stepLogHtml(ex, form, Auth.currentUser(), { blankStart: this.state.blankStart }) : '';
  },
  // ผูก event ของแผง step log แบบ delegation (ครั้งเดียว) — ใช้ได้ทุกที่ที่แทรก stepLogHtml (ฟอร์ม / รายละเอียด HR / การ์ดพนักงาน)
  _bindStepLogOnce() {
    if (this._slBound) return; this._slBound = true;
    document.addEventListener('click', (e) => {
      const head = e.target.closest('[data-sl-head]');
      if (head) {
        const panel = head.closest('.step-log'); const body = panel && panel.querySelector('[data-sl-list]'); if (!body) return;
        const open = body.style.display !== 'none'; body.style.display = open ? 'none' : ''; panel.classList.toggle('open', !open);
        const ic = head.querySelector('[data-sl-chevron]'); if (ic) ic.className = `fa-solid ${open ? 'fa-chevron-down' : 'fa-chevron-up'}`;
        const hint = head.querySelector('[data-sl-hint]'); if (hint) hint.textContent = open ? 'คลิกเพื่อดู' : 'คลิกเพื่อพับ';
        return;
      }
      const b = e.target.closest('[data-sl-toggle]'); if (!b) return;
      const box = b.closest('.sl-card')?.querySelector(`[data-sl-body="${b.dataset.slToggle}"]`); if (!box) return;
      const open = box.style.display !== 'none'; box.style.display = open ? 'none' : ''; b.innerHTML = open ? '<i class="fa-solid fa-chevron-down"></i> ดูรายละเอียดรายข้อ' : '<i class="fa-solid fa-chevron-up"></i> ซ่อนรายละเอียด';
    });
  },
  _stepEntryTitle(en, ev) {
    const u = DB.getUserById(en.evaluatorId) || {};
    const chain = evalChainOf(ev);
    if ((en.stage || 'evaluator') === 'hr') return { no: 'HR', title: `ฝ่ายบุคคล · ${u.fullName || '-'}`, sub: en.action === 'confirm' ? 'ตรวจสอบและยืนยันผล' : (en.action === 'reject' ? 'ส่งกลับแก้ไข' : 'แก้ไขข้อมูล') };
    const n = (+en.step || 0) + 1;
    return { no: String(n), title: `ผู้ประเมินลำดับ ${n}${chain.length ? `/${chain.length}` : ''} · ${u.fullName || '-'}`, sub: u.position || '' , action: en.action === 'forward' ? 'ส่งต่อลำดับถัดไป' : (en.action === 'hr-submit' ? 'HR กรอกแทนและส่งตรวจ' : 'ส่งให้ HR') };
  },
  _stepEntryDetail(en, form) {
    const sn = en.snapshot || {}; const esc = escapeHtml;
    const fmtV = (it, a) => {
      if (!a) return '<span class="text-mute">—</span>';
      const v = a.value;
      if (it.type === 'kpi' && v && typeof v === 'object') return `<span class="text-xs">เป้า <b>${esc(String(v.target ?? '—'))}</b> · ผลจริง <b>${esc(String(v.actual ?? '—'))}</b></span>`;
      return `<span class="mono">${formatAnswerValue(it, v)}</span>`;
    };
    const secs = (form && form.sections ? form.sections : []).map(sec => {
      const ss = (sn.sectionScores || []).find(x => x.sectionId === sec.id);
      const rows = sec.items.map(it => { const a = (sn.answers || []).find(x => x.itemId === it.id); return `<tr><td>${esc(it.name)}</td><td>${fmtV(it, a)}</td><td class="mono text-right">${a ? (+a.score).toFixed(2) : '—'} / ${it.maxScore}</td><td class="text-xs text-mute">${esc((a && a.comment) || '')}</td></tr>`; }).join('');
      return `<div class="sl-sec"><div class="sl-sec-h"><span>${esc(sec.name)}</span><span class="mono">${ss ? (+ss.score).toFixed(2) : '—'} / ${ss ? ss.maxScore : calcSectionMax(sec)}</span></div><table class="tbl sl-tbl"><thead><tr><th>หัวข้อ</th><th>ค่าที่ให้</th><th class="text-right">คะแนน</th><th>หมายเหตุ</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }).join('');
    let pen = '';
    if (form && form.penaltySection && form.penaltySection.enabled && (form.penaltySection.rules || []).length) {
      const ps = form.penaltySection; const inp = {}; (sn.penaltyInputs || []).forEach(p => inp[p.ruleId] = p.count);
      const rows = ps.rules.map(r => { const c = +inp[r.id] || 0; const amt = calcPenaltyAmount(r, c); return `<tr><td>${esc(r.name)}</td><td class="mono">${c} ${esc(r.unit || '')}</td><td class="mono text-right" style="color:${amt ? 'var(--err)' : 'inherit'}">${amt ? '-' + amt : '0'}</td><td class="text-xs text-mute">${esc((sn.penaltyNotes || {})[r.id] || '')}</td></tr>`; }).join('');
      pen = `<div class="sl-sec"><div class="sl-sec-h"><span>${esc(ps.name)}</span><span class="mono">${sn.penaltySectionScore ? (+sn.penaltySectionScore.score).toFixed(2) : '—'} / ${ps.baseScore}</span></div><table class="tbl sl-tbl"><thead><tr><th>รายการ</th><th>จำนวน</th><th class="text-right">หัก</th><th>หมายเหตุ</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    const coach = (sn.coachingChecks || []).length && form && form.coachingOptions
      ? `<div class="sl-note"><b>แนวทางดำเนินการ:</b> ${sn.coachingChecks.map(i => esc(form.coachingOptions[i] || '-')).join(' · ')}</div>` : '';
    const notes = [
      sn.actionNote ? `<div class="sl-note"><b>หมายเหตุ — จะดำเนินการอย่างไร:</b> ${esc(sn.actionNote)}</div>` : '',
      sn.coachingDetail ? `<div class="sl-note"><b>ข้อเสนอแนะจากผู้ประเมิน:</b> ${esc(sn.coachingDetail)}</div>` : '',
      sn.overallComment ? `<div class="sl-note"><b>ความเห็นภาพรวม:</b> ${esc(sn.overallComment)}</div>` : '',
    ].join('');
    return secs + pen + coach + notes;
  },
  // แผง "ผลการประเมินรายลำดับ" — แสดงเฉพาะรายการที่ผู้ดูมีสิทธิ์เห็น (stepLogVisible)
  stepLogHtml(ev, form, viewer, opts = {}) {
    if (!ev || !viewer) return '';
    const entries = stepLogVisible(ev, viewer);
    const vis = stepVisibility();
    const modeInfo = viewer.role === 'admin' ? 'HR เห็นทุกลำดับ ทุกรอบ' : (viewer.id === ev.employeeId ? '' : ((STEP_VIS_EVALUATOR_MODES.find(m => m.key === vis.evaluators) || {}).label || ''));
    const blank = opts.blankStart ? `<div class="sl-blank"><i class="fa-solid fa-eye-slash mr-1"></i>นโยบายของบริษัท: ผู้ประเมินลำดับถัดไป <b>เริ่มประเมินจากฟอร์มว่าง</b> — คะแนนของลำดับก่อนหน้าไม่ถูกนำมาเป็นค่าตั้งต้น (เป้า KPI และสถิติวินัยที่ HR นำเข้ายังคงอยู่)</div>` : '';
    if (!entries.length) return blank ? `<div class="paper-section step-log">${blank}</div>` : '';
    const curRound = evalRoundOf(ev);
    let lastRound = null; let html = '';
    entries.forEach((en, i) => {
      const r = +en.round || 1;
      if (r !== lastRound) { lastRound = r; if (r !== curRound) html += `<div class="sl-round"><i class="fa-solid fa-rotate-left mr-1"></i>รอบที่ ${r} (ก่อนถูก HR ส่งกลับแก้ไข)</div>`; else if (i > 0) html += `<div class="sl-round cur"><i class="fa-solid fa-circle-dot mr-1"></i>รอบปัจจุบัน (รอบที่ ${r})</div>`; }
      const t = this._stepEntryTitle(en, ev);
      const info = gradeInfoFor(en.totalScore, en.totalMax);
      // ส่วนต่างเทียบกับรายการก่อนหน้าในรอบเดียวกัน (ลำดับก่อน / ก่อน HR แก้)
      const prev = entries.slice(0, i).filter(x => (+x.round || 1) === r).pop();
      const diff = prev ? (+en.totalScore - +prev.totalScore) : null;
      const diffHtml = diff == null || Math.abs(diff) < 0.005 ? (prev ? '<span class="sl-diff same">เท่าเดิม</span>' : '') : `<span class="sl-diff ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(2)}</span>`;
      const secLine = (en.snapshot && en.snapshot.sectionScores || []).map(ss => { const sec = form && form.sections ? form.sections.find(s => s.id === ss.sectionId) : null; return `<span class="sl-chip">${escapeHtml(secName(sec ? sec.name : ss.sectionId))} <b>${(+ss.score).toFixed(2)}</b>/${ss.maxScore}</span>`; }).join('')
        + (en.snapshot && en.snapshot.penaltySectionScore ? `<span class="sl-chip">วินัย <b>${(+en.snapshot.penaltySectionScore.score).toFixed(2)}</b>/${en.snapshot.penaltySectionScore.max}</span>` : '');
      const id = `sl_${ev.id}_${i}`;
      html += `<div class="sl-card${(en.stage || 'evaluator') === 'hr' ? ' hr' : ''}${r !== curRound ? ' old' : ''}">
        <div class="sl-head">
          <span class="sl-no">${t.no}</span>
          <div class="sl-title"><div><b>${escapeHtml(t.title)}</b>${t.action ? ` <span class="sl-act">${escapeHtml(t.action)}</span>` : ''}</div><div class="text-xs text-mute">${escapeHtml(t.sub || '')} · ${fmtDateTime ? fmtDateTime(en.submittedAt) : fmtDate(en.submittedAt)}</div></div>
          <div class="sl-score"><b class="mono" style="color:${info ? info.color : 'inherit'}">${(+en.totalScore).toFixed(2)}</b><span class="text-mute text-xs"> / ${en.totalMax}</span> <span class="grade-tag" style="color:${info ? info.color : '#666'};border-color:${info ? info.color : '#ccc'};background:${info ? info.color : '#ccc'}15">${escapeHtml(info ? info.label : (en.grade || '-'))}</span> ${diffHtml}</div>
        </div>
        <div class="sl-chips">${secLine}</div>
        ${en.comment ? `<div class="text-xs mt-1"><i class="fa-solid fa-comment-dots mr-1 text-mute"></i>${escapeHtml(en.comment)}</div>` : ''}
        <button type="button" class="btn btn-secondary btn-icon sl-btn" data-sl-toggle="${id}"><i class="fa-solid fa-chevron-down"></i> ดูรายละเอียดรายข้อ</button>
        <div class="sl-body" data-sl-body="${id}" style="display:none">${this._stepEntryDetail(en, form)}</div>
      </div>`;
    });
    // พับไว้ก่อนโดยค่าเริ่มต้น — คลิกหัวข้อเพื่อกาง (opts.open = true ให้กางทันที)
    this._bindStepLogOnce();
    const nChain = evalChainOf(ev).length;
    const summary = `${entries.length} รายการ${nChain ? ` · ผู้ประเมิน ${nChain} ลำดับ` : ''}${curRound > 1 ? ` · รอบที่ ${curRound}` : ''}${ev.chainAvg ? ' · สรุปแบบค่าเฉลี่ย' : ''}`;
    const avgNote = ev.chainAvg ? `<div class="sl-avg"><i class="fa-solid fa-scale-balanced mr-1"></i><b>คะแนนสรุปของใบนี้ ${(+ev.totalScore).toFixed(2)} / ${ev.totalMax}</b> = ${escapeHtml(chainAvgText(ev))}</div>` : '';
    return `<div class="paper-section step-log${opts.open ? ' open' : ''}">
      <div class="paper-section-title sl-head-bar" data-sl-head title="คลิกเพื่อกาง/พับ">
        <span><i class="fa-solid fa-layer-group mr-1"></i>ผลการประเมินรายลำดับผู้ประเมิน (Step Log) <span class="sl-summary">${escapeHtml(summary)}</span></span>
        <span class="text-mute text-xs" style="font-weight:400">${escapeHtml(modeInfo)} <span class="sl-hint"><span data-sl-hint>${opts.open ? 'คลิกเพื่อพับ' : 'คลิกเพื่อดู'}</span> <i class="fa-solid ${opts.open ? 'fa-chevron-up' : 'fa-chevron-down'}" data-sl-chevron></i></span></span>
      </div>
      <div data-sl-list${opts.open ? '' : ' style="display:none"'}>${blank}${avgNote}${html}</div>
    </div>`;
  },
  // ตารางย่อสำหรับ PDF / มุมมองพนักงาน — ตามสิทธิ์ของผู้เปิดเอกสาร และเปิดใช้ที่ stepVisibility.pdf
  stepLogPdfHtml(ev, form) {
    const vis = stepVisibility(); if (!vis.pdf) return '';
    const me = Auth.currentUser(); if (!me) return '';
    const entries = stepLogVisible(ev, me).filter(x => (x.stage || 'evaluator') === 'evaluator' && (+x.round || 1) === evalRoundOf(ev));
    if (!entries.length) return '';
    const secs = (form && form.sections) ? form.sections : [];
    const hasPen = !!(form && form.penaltySection && form.penaltySection.enabled);
    const head = `<tr><th style="width:8%">ลำดับ</th><th>ผู้ประเมิน</th><th style="width:14%">วันที่</th>${secs.map(s => `<th class="c">${escapeHtml(secName(s.name))}</th>`).join('')}${hasPen ? '<th class="c">วินัย</th>' : ''}<th class="c" style="width:12%">รวม</th><th class="c" style="width:12%">เกรด</th></tr>`;
    const rows = entries.map(en => { const u = DB.getUserById(en.evaluatorId) || {}; const sn = en.snapshot || {}; const ss = (sid) => { const x = (sn.sectionScores || []).find(y => y.sectionId === sid); return x ? (+x.score).toFixed(2) : '—'; };
      return `<tr><td class="c">${(+en.step || 0) + 1}</td><td>${escapeHtml(u.fullName || '-')}</td><td class="c">${fmtDate(en.submittedAt)}</td>${secs.map(s => `<td class="c">${ss(s.id)}</td>`).join('')}${hasPen ? `<td class="c">${sn.penaltySectionScore ? (+sn.penaltySectionScore.score).toFixed(2) : '—'}</td>` : ''}<td class="c"><b>${(+en.totalScore).toFixed(2)}</b> / ${en.totalMax}</td><td class="c">${escapeHtml(en.totalMax ? gradeFor(en.totalScore, en.totalMax) : (en.grade || '-'))}</td></tr>`; }).join('');
    return `<table class="pd-tbl"><thead><tr><th colspan="${3 + secs.length + (hasPen ? 1 : 0) + 2}" class="pd-sech">ผลการประเมินรายลำดับผู้ประเมิน (Evaluator Step Log)</th></tr>${head}</thead><tbody>${rows}</tbody></table>`;
  },

  _renderImportantNote(form) {
    const area = document.getElementById('importantNoteArea');
    const note = form.importantNote;
    if (!note || (typeof note === 'object' && !note.intro && !(note.purposes || []).length && !note.considerations)) { area.innerHTML = ''; return; }

    let bodyHtml;
    if (typeof note === 'object') {
      bodyHtml = `
        ${note.intro ? `<div class="important-note-intro">${escapeHtml(note.intro)}</div>` : ''}
        ${(note.purposes || []).length ? `<ul class="important-note-list">${note.purposes.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>` : ''}
        ${note.considerations ? `<div class="important-note-body mt-1">${escapeHtml(note.considerations)}</div>` : ''}
      `;
    } else {
      bodyHtml = `<div class="important-note-body">${escapeHtml(note)}</div>`;
    }

    area.innerHTML = `
      <div class="important-note">
        <div class="important-note-title"><i class="fa-solid fa-circle-info"></i> หมายเหตุสำคัญ — Important Notice</div>
        ${bodyHtml}
        <div class="important-note-warn">
          การระบุผลการประเมินด้านพฤติกรรมและวินัยในเอกสารฉบับนี้ เป็นเพียงข้อมูลประกอบการพิจารณาทางวินัยของบริษัทเท่านั้น
          มิใช่หนังสือลงโทษทางวินัยโดยตรง หากบริษัทพิจารณาดำเนินการทางวินัย จะดำเนินการตามขั้นตอน ระเบียบข้อบังคับการทำงาน
          และกฎหมายแรงงานที่เกี่ยวข้องแยกต่างหาก
        </div>
      </div>
    `;
  },

  // เพิ่มปุ่มขยาย + auto-grow ให้ทุกช่องข้อความ .expandable (textarea + input ตาราง)
  _enhanceTextareas() {
    const body = document.getElementById('evalModalBody') || document;
    // textarea — ปุ่มลอยมุมขวาบน + auto-grow
    body.querySelectorAll('textarea.expandable:not([data-enhanced])').forEach(ta => {
      ta.setAttribute('data-enhanced', '1');
      const wrap = document.createElement('div');
      wrap.className = 'ta-wrap';
      ta.parentNode.insertBefore(wrap, ta);
      wrap.appendChild(ta);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ta-expand no-print';
      btn.title = 'ขยาย / ดูเต็มจอ';
      btn.innerHTML = '<i class="fa-solid fa-up-right-and-down-left-from-center"></i>';
      btn.addEventListener('click', () => this._openTextModal(ta));
      wrap.appendChild(btn);
      const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 320) + 'px'; };
      ta.addEventListener('input', grow);
      if (ta.value) grow();
    });
    // input (ช่องในตาราง เช่น รายละเอียดความผิด / หมายเหตุ) — ปุ่มขยายข้าง ๆ
    body.querySelectorAll('input.expandable:not([data-enhanced])').forEach(inp => {
      inp.setAttribute('data-enhanced', '1');
      const wrap = document.createElement('div');
      wrap.className = 'ta-wrap ta-wrap-inline';
      // ย้าย margin utility (เช่น mt-3) จาก input → wrap เพื่อคงระยะห่างเดิม
      ['mt-3', 'mt-2', 'mb-3', 'mb-2'].forEach(m => { if (inp.classList.contains(m)) { wrap.classList.add(m); inp.classList.remove(m); } });
      inp.parentNode.insertBefore(wrap, inp);
      wrap.appendChild(inp);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ta-expand ta-expand-sm no-print';
      btn.title = 'ขยาย / พิมพ์รายละเอียด';
      btn.innerHTML = '<i class="fa-solid fa-up-right-and-down-left-from-center"></i>';
      btn.addEventListener('click', () => this._openTextModal(inp));
      wrap.appendChild(btn);
    });
  },

  // เปิด modal ขยายช่องข้อความ (ผูกค่ากลับเข้า textarea เดิม)
  _openTextModal(ta) {
    const label = ta.getAttribute('data-label') || 'รายละเอียด';
    const ov = document.createElement('div');
    ov.className = 'modal-bg'; ov.style.zIndex = '130';
    ov.innerHTML = `
      <div class="modal" style="max-width:760px;width:95vw">
        <div class="modal-header">
          <div class="modal-title"><i class="fa-solid fa-pen-to-square mr-1" style="color:var(--accent)"></i>${escapeHtml(label)}</div>
          <button class="btn btn-ghost btn-icon" data-txclose><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body"><textarea id="txBig" class="input" rows="14" style="width:100%;font-size:15px;line-height:1.6"></textarea></div>
        <div class="modal-footer"><button class="btn btn-primary" data-txdone><i class="fa-solid fa-check"></i> เสร็จสิ้น</button></div>
      </div>
    `;
    document.body.appendChild(ov);
    const big = ov.querySelector('#txBig');
    big.value = ta.value;
    big.focus();
    const sync = () => { ta.value = big.value; ta.dispatchEvent(new Event('input', { bubbles: true })); };
    big.addEventListener('input', sync);
    const close = () => { sync(); ov.remove(); };
    ov.querySelector('[data-txclose]').addEventListener('click', close);
    ov.querySelector('[data-txdone]').addEventListener('click', close);
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
  },

  // =================================================================
  // Attachments — 2 ช่อง: เอกสารเซ็น (signedDocs, บังคับ) + เอกสารประกอบ (attachments, ไม่บังคับ)
  // =================================================================
  _MAX_FILE_BYTES: 8 * 1024 * 1024,   // ไฟล์แนบเก็บบน Google Drive (โฟลเดอร์ "งาน HR KPI") — ในชีตเก็บเฉพาะ driveId

  // ขั้นตอนเอกสารเซ็น + ส่ง HR — ล็อกจนกว่าจะกด "บันทึกการประเมิน"
  _renderSignFlow(form) {
    const area = document.getElementById('signedArea');
    if (!area) return;

    // ยังไม่บันทึก → แสดงสถานะล็อก
    if (!this.state.savedId) {
      area.innerHTML = `
        <div class="paper-section sign-flow-locked no-print">
          <div class="paper-section-title" style="color:var(--mute)"><i class="fa-solid fa-lock mr-1"></i>ส่งผลประเมินให้ HR</div>
          <div class="sign-locked-msg">
            <i class="fa-solid fa-circle-info" style="color:var(--accent)"></i>
            กรอกคะแนนให้ครบ แล้วกดปุ่ม <b>"บันทึกการประเมิน"</b> ด้านบน จากนั้นจึงกด <b>"ส่งให้ HR"</b> ได้ — พนักงานจะกด <b>"รับทราบผลการประเมิน"</b> ผ่านระบบเองในหน้าผลประเมินของตน
          </div>
        </div>
      `;
      return;
    }

    const ci = this._chainInfo();
    const fwdLabel = ci.forward ? `ส่งต่อให้ผู้ประเมินลำดับ ${ci.step + 2} (${ci.next.fullName || '-'})` : 'ส่งให้ HR';
    // บันทึกแล้ว → ส่งให้ HR ได้เลย (ไม่มีการแนบไฟล์ในใบประเมิน — พนักงานรับทราบผ่านระบบ)
    area.innerHTML = `
      <div class="paper-section no-print" style="border:1px solid var(--accent-line);background:var(--accent-soft)">
        <div class="paper-section-title" style="color:var(--accent-dark)"><i class="fa-solid fa-paper-plane mr-1"></i>${ci.forward ? `ส่งต่อผลประเมิน (คุณคือลำดับ ${ci.step + 1}/${ci.total})` : 'ส่งผลประเมินให้ HR'}
          <span class="paper-section-meta"><span class="badge" style="background:var(--ok);color:#fff"><i class="fa-solid fa-check"></i> บันทึกแล้ว</span></span>
        </div>

        <div class="sign-step" style="align-items:center">
          <div class="sign-step-no"><i class="fa-solid fa-check"></i></div>
          <div style="flex:1;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">
            <div><b>${ci.forward ? `ส่งต่อให้ผู้ประเมินลำดับถัดไป` : 'ส่งผลประเมินให้ HR ตรวจสอบ'}</b><div class="text-mute text-xs">${ci.forward ? `ลำดับ ${ci.step + 2} (${escapeHtml(ci.next.fullName || '-')}) จะเห็นคะแนนของคุณและประเมินต่อ — ลำดับสุดท้ายเป็นผู้ส่งให้ HR` : 'กดเพื่อส่งได้ทันที — พนักงานจะรับทราบผลผ่านระบบหลัง HR ยืนยัน'}</div></div>
            <button id="evalSubmitBtn" class="btn btn-success btn-lg"><i class="fa-solid fa-paper-plane"></i> ${escapeHtml(fwdLabel)}</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('evalSubmitBtn').addEventListener('click', () => this._save('submit'));
    this._refreshSubmitState();
  },

  // เปิด/โหลด PDF จาก record ที่บันทึกไว้แล้ว
  _openPdfFromSaved(mode) {
    const rec = DB.getEvaluations().find(x => x.id === this.state.savedId);
    if (!rec) { toast('กรุณาบันทึกการประเมินก่อน', 'error'); return; }
    this._genEvalPdf(rec, DB.getFormForEval(rec), mode);
  },

  // ปุ่ม "ส่งให้ HR" — ส่งได้ทันที (ไม่บังคับแนบเอกสารแล้ว)
  _refreshSubmitState() {
    const btn = document.getElementById('evalSubmitBtn');
    if (!btn) return;
    btn.disabled = false;
    btn.classList.remove('btn-disabled');
    btn.title = 'ส่งผลประเมินให้ HR';
  },

  // ช่องเอกสารประกอบทั่วไป — ปิดในฟอร์มประเมิน (ตามนโยบายใหม่: ไม่แนบไฟล์ในใบประเมิน
  // พนักงานรับทราบผ่านระบบ)
  _renderAttachments(form) {
    const area = document.getElementById('attachmentArea');
    if (area) area.innerHTML = '';
  },

  _bindDrop(dropId, inputId, stateKey, listId) {
    const input = document.getElementById(inputId);
    const drop = document.getElementById(dropId);
    if (!input || !drop) return;
    drop.addEventListener('click', () => input.click());
    input.addEventListener('change', () => this._handleFiles(input.files, stateKey, listId));
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('dragover'); this._handleFiles(e.dataTransfer.files, stateKey, listId); });
  },

  _handleFiles(fileList, stateKey, listId) {
    Array.from(fileList || []).forEach(file => {
      if (file.size > this._MAX_FILE_BYTES) { toast(`"${file.name}" ใหญ่เกิน ${Math.round(this._MAX_FILE_BYTES / 1048576)}MB`, 'error'); return; }
      this._attachFile(file, stateKey, listId);
    });
    const input = document.querySelector(`#${listId === 'signedList' ? 'signedInput' : 'attachInput'}`);
    if (input) input.value = '';
  },

  // อัปโหลดไฟล์ขึ้น Google Drive ทันทีที่เลือก (โฟลเดอร์ ไฟล์แนบ/<รอบ>/<รหัสพนักงาน>/) — ในใบประเมินเก็บเฉพาะ driveId/ชื่อ/ขนาด
  //   ระหว่างอัปโหลดแสดงสถานะในรายการ • อัปโหลดไม่สำเร็จ = เอาออกจากรายการ (ไม่บันทึกรายการค้าง)
  async _attachFile(file, stateKey, listId) {
    const useDrive = window.SupaDB && SupaDB.enabled && typeof SupaDB.uploadFile === 'function';
    if (!useDrive) {
      // ไม่มีฐานข้อมูล (โหมด offline) → ฝังไฟล์ในใบแบบเดิม
      const reader = new FileReader();
      reader.onload = (e) => { this.state[stateKey].push({ id: DB.uid('att'), name: file.name, type: file.type || 'application/octet-stream', size: file.size, dataUrl: e.target.result }); this._drawFileList(stateKey, listId); };
      reader.readAsDataURL(file);
      return;
    }
    const tmp = { id: DB.uid('att'), name: file.name, type: file.type || 'application/octet-stream', size: file.size, uploading: true };
    this.state[stateKey].push(tmp);
    this._drawFileList(stateKey, listId);
    try {
      const emp = DB.getUserById(this.state.employeeId) || {};
      const up = await SupaDB.uploadFile(file, { kind: stateKey, evalId: this.state.savedId || this.state.assignmentId || '', period: this.state.period || '', employeeCode: emp.employeeCode || '' });
      Object.assign(tmp, up); delete tmp.uploading;
      toast(`แนบ "${file.name}" สำเร็จ — บันทึกไว้บน Google Drive`, 'success');
    } catch (e) {
      this.state[stateKey] = (this.state[stateKey] || []).filter(x => x !== tmp);
      toast(`อัปโหลด "${file.name}" ไม่สำเร็จ: ${e.message}`, 'error');
    }
    this._drawFileList(stateKey, listId);
  },
  // ไฟล์ที่อัปโหลดเสร็จแล้วเท่านั้น (ตัดรายการที่ยังอัปโหลดค้าง)
  _readyFiles(list) { return (list || []).filter(a => a && !a.uploading); },
  // ดึง dataUrl ของไฟล์แนบ — ไฟล์เก่าที่ฝังในใบใช้ได้ทันที • ไฟล์บน Drive ดึงผ่าน API (จำไว้ในหน่วยความจำ)
  async fileUrl(a) {
    if (a && a.dataUrl) return a.dataUrl;
    if (!(window.SupaDB && typeof SupaDB.fileUrl === 'function')) throw new Error('ไม่สามารถเปิดไฟล์นี้ได้');
    return SupaDB.fileUrl(a);
  },
  async downloadFile(a) {
    try {
      const url = await this.fileUrl(a);
      const link = document.createElement('a'); link.href = url; link.download = a.name || 'file'; document.body.appendChild(link); link.click(); link.remove();
    } catch (e) { toast('ดาวน์โหลดไม่สำเร็จ: ' + e.message, 'error'); }
  },

  _drawFileList(stateKey, listId) {
    const list = document.getElementById(listId);
    if (!list) return;
    const atts = this.state[stateKey] || [];
    if (!atts.length) { list.innerHTML = '<div class="text-mute text-xs" style="padding:0.5rem">ยังไม่มีไฟล์</div>'; return; }
    list.innerHTML = atts.map(a => `
      <div class="attach-item">
        <i class="fa-solid ${fileIcon(a.type, a.name)}"></i>
        <div class="attach-item-info">
          <div class="attach-item-name">${escapeHtml(a.name)}</div>
          <div class="attach-item-size">${fmtBytes(a.size)}${a.uploading ? ' • <i class="fa-solid fa-circle-notch fa-spin"></i> กำลังอัปโหลดขึ้น Google Drive...' : (a.driveId ? ' • <i class="fa-brands fa-google-drive"></i> Drive' : '')}</div>
        </div>
        ${a.uploading ? '' : `<button class="btn btn-secondary btn-icon" data-view="${a.id}" title="เปิดดู"><i class="fa-solid fa-eye"></i></button>`}
        <button class="btn btn-danger btn-icon no-print" data-del="${a.id}" title="ลบ"><i class="fa-solid fa-xmark"></i></button>
      </div>
    `).join('');
    list.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
      const a = atts.find(x => x.id === b.dataset.view);
      if (a) Evaluation.viewFile(a);
    }));
    list.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      this.state[stateKey] = this.state[stateKey].filter(x => x.id !== b.dataset.del);
      this._drawFileList(stateKey, listId);
    }));
    if (stateKey === 'signedDocs') this._refreshSubmitState();
  },

  // เปิดดูไฟล์ในระบบ (PDF/รูปภาพ) — overlay แยกซ้อนทับ (ไม่กระทบ modal เดิม)
  async viewFile(a) {
    const t = (a.type || '').toLowerCase();
    let viewer = '';
    let url = '';
    try { url = await this.fileUrl(a); }
    catch (e) { toast('เปิดไฟล์ไม่สำเร็จ: ' + e.message, 'error'); return; }
    if (t.startsWith('image/')) {
      viewer = `<img src="${url}" alt="${escapeHtml(a.name)}" style="max-width:100%;max-height:72vh;display:block;margin:0 auto;border-radius:6px" />`;
    } else if (t.includes('pdf') || (a.name||'').toLowerCase().endsWith('.pdf')) {
      viewer = `<iframe src="${url}" style="width:100%;height:72vh;border:none;border-radius:6px"></iframe>`;
    } else {
      viewer = `<div class="text-center" style="padding:2rem"><i class="fa-solid ${fileIcon(a.type, a.name)} text-4xl text-mute mb-3"></i><div class="text-mute text-sm">ไฟล์ประเภทนี้เปิดดูในระบบไม่ได้ กรุณาดาวน์โหลด</div></div>`;
    }
    const ov = document.createElement('div');
    ov.className = 'modal-bg';
    ov.style.zIndex = '190';   // สูงกว่าทุก overlay — ตัวเปิดดูไฟล์/PDF ต้องอยู่บนสุดเสมอ
    ov.innerHTML = `
      <div class="modal" style="max-width:900px;width:95vw">
        <div class="modal-header">
          <div class="modal-title"><i class="fa-solid ${fileIcon(a.type, a.name)} mr-1" style="color:var(--accent)"></i>${escapeHtml(a.name)}</div>
          <div class="flex gap-2">
            <a href="${url}" download="${escapeHtml(a.name)}" class="btn btn-secondary btn-icon"><i class="fa-solid fa-download"></i> ดาวน์โหลด</a>
            <button class="btn btn-ghost btn-icon" data-vfclose><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>
        <div class="modal-body" style="background:var(--bg-mute)">${viewer}</div>
      </div>
    `;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.querySelector('[data-vfclose]').addEventListener('click', close);
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
  },

  // =================================================================
  // PDF — สร้างไฟล์เอกสารประเมินจากข้อมูลที่บันทึก (ให้พนักงานเซ็น)
  // =================================================================
  async _genEvalPdf(ev, form, mode) {
    if (typeof html2pdf === 'undefined') { toast('ตัวสร้าง PDF ยังโหลดไม่เสร็จ ลองรีเฟรชหน้าอีกครั้ง', 'error'); return; }
    if (!ev || !form) { toast('ไม่พบข้อมูลการประเมิน', 'error'); return; }
    const emp = DB.getUserById(ev.employeeId) || {};
    const holder = document.createElement('div');
    // วางที่ "ต้นเอกสาร" (absolute top:0) ไม่ใช่ fixed — กัน html2canvas บวก offset ตามที่หน้าจอเลื่อนอยู่
    // (ต้นเหตุที่ทำให้เนื้อหาขยับลงเกือบครึ่งหน้าเมื่อกดสร้าง PDF ตอนเลื่อนรายการลงมา)
    holder.style.cssText = 'position:absolute;left:-99999px;top:0;width:794px;background:#fff;padding:0;margin:0;z-index:-1';
    holder.innerHTML = this._buildPrintDoc(ev, form);
    document.body.appendChild(holder);
    // เลื่อนหน้าไปบนสุดชั่วคราวก่อนแคปเจอร์ — html2canvas บวก scroll offset ของหน้าจอ ทำให้หน้าแรกว่าง (เนื้อหาตกไปหน้า 2) เมื่อผู้ใช้เลื่อนรายการลงมาแล้วกดสร้าง PDF
    const _scrollX = window.scrollX, _scrollY = window.scrollY;
    window.scrollTo(0, 0);
    const safe = (emp.fullName || 'employee').replace(/\s+/g, '');
    const filename = `ประเมิน_${safe}_${ev.period}.pdf`;
    const opt = {
      margin: [10, 10, 12, 10], filename,
      image: { type: 'jpeg', quality: 0.96 },
      // กล่องวางแบบ absolute top:0 (ต้นเอกสารจริง) → html2canvas คำนวณตำแหน่งถูกต้องเองโดยไม่ต้อง override scroll/width
      // (อย่าใส่ windowWidth/scrollX เพราะกล่องอยู่ left:-99999 จะทำให้ภาพถูกตัดด้านข้าง)
      html2canvas: { scale: 2, backgroundColor: '#ffffff', useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] },
    };
    toast('กำลังสร้าง PDF...', 'success', { duration: 1500 });
    try {
      const worker = html2pdf().set(opt).from(holder.firstElementChild);
      if (mode === 'view') {
        const url = await worker.output('bloburl');
        this.viewFile({ name: filename, type: 'application/pdf', dataUrl: url });
      } else {
        await worker.save();
        toast('ดาวน์โหลด PDF สำเร็จ', 'success', { title: 'สร้าง PDF แล้ว' });
      }
    } catch (err) {
      console.error(err);
      toast('สร้าง PDF ไม่สำเร็จ', 'error');
    } finally {
      holder.remove();
      window.scrollTo(_scrollX, _scrollY);   // คืนตำแหน่ง scroll เดิมของผู้ใช้
    }
  },

  // แปลงค่าที่ตอบของแต่ละ item เป็นข้อความอ่านง่ายใน PDF
  _pdfAnswerText(item, ans) {
    const v = ans ? ans.value : undefined;
    switch (item.type) {
      case 'rating5': return (v == null || v === '') ? '-' : `${v} / 5`;
      case 'scale10': return (v == null || v === '') ? '-' : `${v} / 10`;
      case 'percent': return (v == null || v === '') ? '-' : `${v}%`;
      case 'kpi': {
        let target, actual;
        if (v && typeof v === 'object') { target = v.target; actual = v.actual; }
        else { target = item.config?.target ?? 100; actual = v; }
        const pct = (target > 0 && actual != null && actual !== '') ? ` · บรรลุ ${kpiAchievePct(item, target, actual).toFixed(0)}%` : '';
        return `เป้า ${target ?? '-'} / จริง ${(actual == null || actual === '') ? '-' : actual}${pct}`;
      }
      case 'choice': { const o = item.config?.options?.[+v]; return o ? escapeHtml(o.label) : '-'; }
      case 'yesno': { const isYes = (v === true || v === 'true' || v === 'yes' || v === 1); return (v == null || v === '') ? '-' : (isYes ? 'ใช่' : 'ไม่ใช่'); }
      default: return (v == null || v === '') ? '-' : escapeHtml(String(v));
    }
  },

  // สร้าง HTML เอกสารประเมินแบบกระดาษ (สำหรับแปลงเป็น PDF)
  _buildPrintDoc(ev, form) {
    const emp = DB.getUserById(ev.employeeId) || {};
    // ผู้ประเมิน = หัวหน้างานที่ถูกมอบหมาย (ไม่ใช่ HR) — HR เป็นผู้ตรวจสอบเท่านั้น
    const _pdChain = evalChainOf(ev);
    const evaluator = { ...(DB.getUserById(evalCurrentEvaluatorId(ev) || ev.evaluatorId) || {}), fullName: evalChainNames(ev) || ((DB.getUserById(ev.supervisorId || ev.evaluatorId) || {}).fullName || '') };
    const reviewer = ev.reviewedBy ? (DB.getUserById(ev.reviewedBy) || {}) : null;   // HR ผู้ตรวจ/ยืนยัน
    const thDate = (iso) => { if (!iso) return ''; try { return new Date(iso).toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return ''; } };
    const ansById = {}; (ev.answers || []).forEach(a => ansById[a.itemId] = a);
    const pct = ev.totalMax ? (ev.totalScore / ev.totalMax * 100) : 0;

    const sectionsHtml = (form.sections || []).map(sec => {
      const rows = sec.items.map((it, i) => {
        const a = ansById[it.id] || {};
        return `<tr>
          <td class="c">${i + 1}</td>
          <td>${escapeHtml(it.name)}</td>
          <td class="c">${this._pdfAnswerText(it, a)}</td>
          <td class="c">${(+it.maxScore || 0)}</td>
          <td class="c"><b>${(a.score != null ? (+a.score).toFixed(2) : '-')}</b></td>
          <td>${escapeHtml(a.comment || '')}</td>
        </tr>`;
      }).join('');
      const ss = (ev.sectionScores || []).find(s => s.sectionId === sec.id) || {};
      // ป้ายกลุ่ม KPI ในเอกสารพิมพ์ (แสดงเมื่อระบุกลุ่มไว้) — เพื่อให้เห็นชัดว่าใช้เวทกลุ่มไหน
      const _grp = sec.kpiGrouped && ev.kpiGroup ? (sec.kpiGroups || []).find(x => x.key === ev.kpiGroup) : null;
      const _grpTxt = _grp ? ` — กลุ่ม: ${escapeHtml(_grp.label)} (${sec.items.length} หัวข้อ)` : '';
      return `<table class="pd-tbl">
        <thead>
          <tr><th colspan="6" class="pd-sech">${escapeHtml(secName(sec.name))}${_grpTxt}</th></tr>
          <tr><th style="width:5%">#</th><th>หัวข้อประเมิน</th><th style="width:20%">ค่าที่ตอบ</th><th style="width:8%">เต็ม</th><th style="width:9%">ได้</th><th style="width:24%">หมายเหตุ</th></tr>
        </thead>
        <tbody>${rows}
          <tr class="pd-total"><td colspan="3" class="r"><b>รวม ${escapeHtml(secName(sec.name))}</b></td><td class="c"><b>${ss.maxScore ?? calcSectionMax(sec)}</b></td><td class="c"><b>${(ss.score != null ? (+ss.score).toFixed(2) : '-')}</b></td><td></td></tr>
        </tbody>
      </table>`;
    }).join('');

    let penHtml = '';
    if (ev.penaltySectionScore && form.penaltySection) {
      const ps = form.penaltySection;
      const notes = ev.penaltyNotes || {};
      const inById = {}; (ev.penaltyInputs || []).forEach(p => inById[p.ruleId] = p.count);
      const rows = (ps.rules || []).map(r => {
        const cnt = inById[r.id] || 0;
        const ded = (typeof calcPenaltyAmount === 'function') ? calcPenaltyAmount(r, cnt) : 0;
        return `<tr><td>${escapeHtml(r.name)}</td><td class="c">${cnt} ${escapeHtml(r.unit || '')}</td><td class="c">${ded > 0 ? ('-' + ded) : 0}</td><td>${escapeHtml(notes[r.id] || '')}</td></tr>`;
      }).join('');
      const psc = ev.penaltySectionScore;
      const bonusRows = (ps.bonusRules || []).map(b => {
        const ids = (b.condition && b.condition.allZero) || [];
        const ok = ids.length > 0 && ids.every(rid => (inById[rid] || 0) === 0);
        return `<tr><td>${escapeHtml(b.name)} <span style="color:#16a34a">(โบนัส)</span></td><td class="c">อัตโนมัติ</td><td class="c">${ok ? ('+' + b.amount) : 0}</td><td>${escapeHtml(notes[b.id] || '')}</td></tr>`;
      }).join('');
      penHtml = `<table class="pd-tbl">
        <thead>

    // ผลการประเมินย้อนหลัง 1 ปี

    const prevHtml = pastList.length ? `<table class="pd-tbl">

      </style>

        <tr><td class="k">ประจำเดือน</td><td>${fmtPeriod(ev.period)}</td><td class="k">วันที่ประเมิน</td><td>${escapeHtml(ev.evalDate || '-')}</td></tr>

          ${summaryRows}${penRow}
          <tr class="pd-total"><td class="r"><b>คะแนนรวม</b></td><td class="c"><b>${ev.totalMax}</b></td><td class="c"><b>${(+ev.totalScore).toFixed(2)}</b></td></tr>
          ${ev.chainAvg ? `<tr><td class="r">วิธีสรุปคะแนน</td><td colspan="2" class="c" style="font-size:11px">${escapeHtml(chainAvgText(ev))}</td></tr>` : ''}
          <tr><td class="r"><b>ระดับผลการประเมิน</b></td><td colspan="2" class="pd-grade">${escapeHtml(ev.totalMax ? gradeFor(ev.totalScore, ev.totalMax) : ev.grade)} (${pct.toFixed(1)}%)</td></tr>
        </tbody>

      ${boxesHtml}
      ${this.stepLogPdfHtml(ev, form)}
      ${planHtml}
      ${overallHtml}

      <div class="pd-sign-wrap">
        <div class="pd-sign-title">ความเห็นพนักงานและลงนามรับทราบ (Employee Feedback & Acknowledgement)</div>
        ${(() => {
          const ids = _pdChain.length ? _pdChain : ((ev.supervisorId || ev.evaluatorId) ? [ev.supervisorId || ev.evaluatorId] : []);
          const boxes = ids.map((id, i) => { const u = DB.getUserById(id) || {}; const ce = evalChainCurrent(ev).find(x => x && x.evaluatorId === id && x.step === i); const at = ce ? ce.submittedAt : ((ev.status !== 'assigned' && i === ids.length - 1) ? ev.submittedAt : null); return `<div class="pd-sign-box"><div class="pd-sign-role">ผู้ประเมินลำดับ ${i + 1} · EVALUATOR ${i + 1}</div><div class="pd-sign-name">${escapeHtml(u.fullName || '')}</div><div style="font-size:9px;color:#666">${escapeHtml(u.position || '')}</div><div class="pd-sign-line"></div>${at ? `<span style="color:#16a34a;font-weight:600">✓ ประเมินและส่งแล้ว</span><br>วันที่ ${escapeHtml(thDate(at) || '')}` : 'ลงชื่อ ........................<br>วันที่ ......./......./.......'}</div>`; }).join('');
          return `<div class="pd-sign-sub">ผู้ประเมินตามลำดับ (${ids.length} ลำดับ)</div><div class="pd-sign">${boxes}</div><div class="pd-sign-sub">ฝ่ายบุคคลและพนักงาน</div>`;
        })()}
        <div class="pd-sign">
          <div class="pd-sign-box"><div class="pd-sign-role">HR · HUMAN RESOURCES</div><div class="pd-sign-name">${escapeHtml(((ev.status === 'confirmed' && reviewer) ? reviewer.fullName : '') || '')}</div><div class="pd-sign-line"></div>${(ev.status === 'confirmed' && ev.reviewedAt) ? `<span style="color:#16a34a;font-weight:600">✓ ตรวจสอบและยืนยันแล้ว</span><br>วันที่ ${escapeHtml(thDate(ev.reviewedAt))}` : 'ลงชื่อ ........................<br>วันที่ ......./......./.......'}</div>
          <div class="pd-sign-box"><div class="pd-sign-role">พนักงาน · EMPLOYEE</div><div class="pd-sign-name">${escapeHtml(ev.empAckName || emp.fullName || '')}</div><div class="pd-sign-line"></div>${ev.acknowledgedAt ? `<span style="color:#16a34a;font-weight:600">✓ รับทราบผ่านระบบ</span><br>วันที่ ${escapeHtml(ev.empAckDate || '-')}` : 'ลงชื่อ ........................<br>วันที่ ......./......./.......'}</div>
        </div>
        <div class="pd-ack"><i>ข้าพเจ้าได้รับทราบผลการประเมินตามเอกสารฉบับนี้แล้ว และเอกสารฉบับนี้ใช้ประกอบการพิจารณาตามระเบียบข้อบังคับบริษัทเท่านั้น</i></div>
      </div>

  },

  // =================================================================
  // Live calculation panel
  // =================================================================
  _updateLive() {
    const form = this._formOf();
    if (!form) return;
    const me = Auth.currentUser();
    const visibleSections = form.sections.filter(sec => canScoreSection(sec, me.role));
    const answers = [];
    visibleSections.forEach(sec => sec.items.forEach(it => {
      if (this.state.values[it.id] !== undefined) {
        answers.push({ sectionId: sec.id, itemId: it.id, value: this.state.values[it.id] });
      }
    }));
    const penaltyInputs = this._currentPenaltyInputs(form);

    // Section scores — เฉพาะ visible + update in-paper section totals
    const secEl = document.getElementById('liveSections');
    secEl.innerHTML = visibleSections.map(sec => {
      const sc = calcSectionScore(sec, answers, penaltyInputs, form.penaltyRules);
      const max = calcSectionMax(sec);
      // Update section total in paper table
      const totalEl = document.querySelector(`[data-section-total="${sec.id}"]`);
      if (totalEl) totalEl.innerHTML = `<b>${sc.toFixed(2)}</b>`;
      return `
        <div class="live-section-row">
          <span class="label-l">${escapeHtml(secName(sec.name))}</span>
          <span class="val-r">${sc.toFixed(2)} <span class="text-mute" style="font-size:10px">/ ${max}</span></span>
        </div>
      `;
    }).join('');

    // Penalty section (ส่วนวินัย)
    const penSec = calcPenaltySectionScore(form, penaltyInputs); // { score, max, deduct } | null
    if (penSec) {
      const ps = form.penaltySection;
      // live panel row
      secEl.innerHTML += `
        <div class="live-section-row">
          <span class="label-l">${escapeHtml(secName(ps.name))}</span>
          <span class="val-r">${penSec.score.toFixed(2)} <span class="text-mute" style="font-size:10px">/ ${penSec.max}</span></span>
        </div>`;
      // update in-paper penalty section total
      const psEl = document.querySelector('[data-pensection-score]');
      if (psEl) psEl.innerHTML = `${penSec.score.toFixed(0)} / ${penSec.max}`;
      // update bonus rows (อัตโนมัติ)
      (ps.bonusRules || []).forEach(b => {
        const el = document.querySelector(`[data-penbonus="${b.id}"]`);
        if (!el) return;
        const ids = (b.condition && b.condition.allZero) || [];
        const ok = ids.length > 0 && ids.every(rid => (penaltyInputs.find(p => p.ruleId === rid)?.count || 0) === 0);
        el.textContent = ok ? `+${b.amount}` : '+0';
      });
    }

    // คะแนนรวม (ใช้ calcTotalScore เพื่อความสอดคล้อง)
    const raw = calcRawSubtotal(form, answers, penaltyInputs);
    const totalScore = calcTotalScore(form, answers, penaltyInputs);
    const totalMax = calcFormMax(form);

    // หมายเหตุ: ไม่ตั้งค่าเริ่มต้น "แนวทางดำเนินการและแผนพัฒนา" อัตโนมัติแล้ว (ไม่ผูกเงื่อนไขคะแนน)
    // — หัวหน้างานเป็นผู้เลือกติ๊กเองทุกกรณี

    const bd = document.getElementById('liveBreakdown');
    let bdHtml = `<div class="live-section-row"><span class="label-l">รวมหัวข้อประเมิน</span><span class="val-r">${raw.toFixed(2)}</span></div>`;
    if (penSec) {
      bdHtml += `<div class="live-section-row"><span class="label-l">คะแนนวินัย (${penSec.max}−${penSec.deduct})</span><span class="val-r">${penSec.score.toFixed(2)}</span></div>`;
    }
    bd.innerHTML = bdHtml;

    // สรุปแบบค่าเฉลี่ยทุกลำดับ: แสดงพรีวิว "คะแนนสรุปเมื่อเฉลี่ย" (ผู้ประเมินลำดับหลัง / HR) — คะแนนของฉัน + log ของลำดับอื่นในรอบนี้
    const avgInfo = this._liveAverage(form, totalScore, totalMax);
    const avgBox = document.getElementById('liveAvg');
    if (avgBox) {
      if (avgInfo) {
        const gi = gradeInfoFor(avgInfo.total, totalMax);
        avgBox.style.display = '';
        avgBox.innerHTML = `<div class="live-avg-t"><i class="fa-solid fa-scale-balanced mr-1"></i>คะแนนสรุป = ค่าเฉลี่ย ${avgInfo.n} ลำดับ</div>
          <div class="live-avg-v mono" style="color:${gi ? gi.color : 'inherit'}">${avgInfo.total.toFixed(2)} <span class="text-mute" style="font-size:11px">/ ${totalMax}</span> <span class="grade-tag" style="color:${gi ? gi.color : '#737373'};border-color:${gi ? gi.color : '#e5e5e5'};background:${gi ? gi.color + '15' : '#fafafa'}">${escapeHtml(gi ? gi.label : '—')}</span></div>
          <div class="live-avg-s">${avgInfo.parts.map(p => escapeHtml(p)).join(' · ')}</div>`;
      } else { avgBox.style.display = 'none'; avgBox.innerHTML = ''; }
    }
    const avgRow = document.querySelector('[data-summary-avg-row]');
    if (avgRow) { avgRow.style.display = avgInfo ? '' : 'none'; const c = avgRow.querySelector('[data-summary-avg]'); if (c && avgInfo) { const gi = gradeInfoFor(avgInfo.total, totalMax); c.innerHTML = `<b>${avgInfo.total.toFixed(2)}</b> <span class="grade-tag ml-1" style="color:${gi ? gi.color : '#737373'};border-color:${gi ? gi.color : '#e5e5e5'};background:${gi ? gi.color + '15' : '#fafafa'}">${escapeHtml(gi ? gi.label : '—')}</span>`; const d = avgRow.querySelector('[data-summary-avg-desc]'); if (d) d.textContent = `ค่าเฉลี่ยจากผู้ประเมิน ${avgInfo.n} ลำดับ (${avgInfo.parts.join(' · ')})`; } }
    document.getElementById('liveScore').textContent = totalScore.toFixed(2);
    document.getElementById('liveMax').textContent = totalMax;
    const sMini = document.getElementById('liveScoreMini'); if (sMini) sMini.textContent = totalScore.toFixed(2);
    const mMini = document.getElementById('liveMaxMini'); if (mMini) mMini.textContent = totalMax;
    const info = gradeInfoFor(totalScore, totalMax);
    const tag = document.getElementById('liveGrade');
    tag.textContent = info ? info.label : '—';
    if (info) {
      tag.style.color = info.color;
      tag.style.borderColor = info.color;
      tag.style.background = info.color + '15';
    }

    // Update paper-form summary section
    visibleSections.forEach(sec => {
      const sc = calcSectionScore(sec, answers, penaltyInputs, form.penaltyRules);
      const el = document.querySelector(`[data-summary-sec="${sec.id}"]`);
      if (el) el.innerHTML = `<b>${sc.toFixed(2)}</b>`;
    });
    const penSumEl = document.querySelector('[data-summary-pensec]');
    if (penSumEl && penSec) penSumEl.innerHTML = `<b>${penSec.score.toFixed(2)}</b>`;
    const totalEl = document.querySelector('[data-summary-total]');
    if (totalEl) totalEl.textContent = totalScore.toFixed(2);
    const gradeEl = document.querySelector('[data-summary-grade]');
    if (gradeEl && info) {
      gradeEl.textContent = info.label;
      gradeEl.style.color = info.color;
      gradeEl.style.borderColor = info.color;
      gradeEl.style.background = info.color + '15';
    }

    // Highlight selected result box (Section 6) — ใช้เกณฑ์เดียวกับป้ายเกรด (gradeLevels)
    const activeId = 'gl_' + this._activeGradeIdx(totalScore, totalMax);
    document.querySelectorAll('[data-resultbox]').forEach(el => {
      el.classList.toggle('active', el.dataset.resultbox === activeId);
    });
    this._applyCoachRule(form, avgInfo ? avgInfo.total : totalScore, totalMax);   // ล็อกตัวเลือกแนวทางฯ ตามระดับผล "สรุป" (ค่าเฉลี่ยถ้ามี)
  },

  // พรีวิวคะแนนสรุปแบบค่าเฉลี่ย: log ของลำดับอื่นในรอบนี้ (ไม่รวมลำดับของฉัน) + คะแนนสดของฉัน — คืน null ถ้าไม่เข้าเงื่อนไข
  _liveAverage(form, liveTotal, totalMax) {
    if (finalScoreMode() !== 'average') return null;
    const rec = this.state.assignmentId ? DB.getEvaluations().find(x => x.id === this.state.assignmentId) : null;
    if (!rec || evalChainOf(rec).length < 2) return null;
    const me = Auth.currentUser(); if (!me) return null;
    const entries = evalChainCurrent(rec).filter(x => x.snapshot);
    if (me.role === 'admin') {
      // HR: คะแนนสรุปของใบ = ค่าเฉลี่ยของ log ทั้งหมด (ค่าที่ HR แก้ในฟอร์มไม่ถูกนำมาเฉลี่ย)
      const agg = chainAverage(form, entries); if (!agg) return null;
      return { n: agg.n, total: agg.totalScore, parts: agg.steps.map(s => `ลำดับ ${s.step + 1}: ${s.totalScore.toFixed(2)}`) };
    }
    const myStep = evalChainOf(rec).indexOf(me.id); if (myStep < 0) return null;
    const others = entries.filter(x => x.step !== myStep);
    if (!others.length) return null;
    const parts = [...others.map(x => ({ step: x.step, t: +x.totalScore || 0 })), { step: myStep, t: liveTotal }].sort((a, b) => a.step - b.step);
    const total = +(parts.reduce((s, p) => s + p.t, 0) / parts.length).toFixed(2);
    return { n: parts.length, total, parts: parts.map(p => `ลำดับ ${p.step + 1}: ${p.t.toFixed(2)}${p.step === myStep ? ' (ของคุณ)' : ''}`) };
  },

  // ตรวจความครบถ้วนก่อนเด้งยืนยัน (ใช้ก่อนกด "บันทึกการประเมิน" → ส่ง HR)
  _validateBeforeSubmit() {
    const form = this._formOf();
    if (!form) { toast('กรุณาเลือกแบบฟอร์ม', 'error'); return false; }
    if (!this.state.employeeId) { toast('กรุณาเลือกพนักงาน', 'error'); return false; }
    if (!this.state.period) { toast('กรุณาเลือกรอบประเมิน', 'error'); return false; }
    const me = Auth.currentUser();
    const visibleSections = form.sections.filter(sec => canScoreSection(sec, me.role));
    if (!visibleSections.length) { toast('คุณไม่มีสิทธิ์ให้คะแนนในฟอร์มนี้', 'error'); return false; }
    // HR (admin) บันทึก/ส่งได้แม้กรอกไม่ครบ — บทบาทอื่น (หัวหน้างาน) ยังต้องกรอกให้ครบ
    const missing = [];
    if (me.role !== 'admin') {
      visibleSections.forEach(sec => sec.items.forEach(it => {
        const v = this.state.values[it.id];
        if (!it.optional && (v === undefined || v === null || v === '')) missing.push(it.name);
      }));
    }
    if (missing.length) { toast(`กรุณากรอกคะแนนให้ครบทุกข้อ (เหลือ ${missing.length})`, 'error'); return false; }
    // บังคับเลือก "แนวทางดำเนินการและแผนพัฒนา" อย่างน้อย 1 รายการทุกกรณี (ส่วนรายละเอียด Action Plan ไม่บังคับ)
    if ((form.coachingOptions || []).length && !(this.state.coachingChecks || []).length) {
      toast('กรุณาเลือกแนวทางดำเนินการและแผนพัฒนาอย่างน้อย 1 รายการ', 'error');
      const area = document.getElementById('coachingArea');
      if (area) area.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return false;
    }
    // ผลประเมินระดับ "ต้องปรับปรุง" / "ไม่ผ่านการประเมิน" → บังคับ หมายเหตุ (จะดำเนินการอย่างไร) + ข้อเสนอแนะ
    //   (ระดับอื่นไม่บังคับ • ตัวเลือกที่ขัดกติกาถูกล็อกไว้ที่ UI แล้ว — ตรงนี้กันอีกชั้นเผื่อค่าเก่าติดมา)
    {
      const _vm = {};
      visibleSections.forEach(sec => sec.items.forEach(it => _vm[it.id] = this.state.values[it.id]));
      const _tmp = buildEvaluation(form, this.state.employeeId, me.id, this.state.period, _vm, this.state.penalties, this.state.coachingChecks, this.state.coachingDetail, this.state.overall);
      const rule = this._coachRule(_tmp.totalScore, _tmp.totalMax);
      const opts = form.coachingOptions || [];
      const focusCoach = () => { const a = document.getElementById('coachingArea'); if (a) a.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
      // กันตัวเลือกที่ขัดกติกาหลุดไปกับการบันทึก
      const badPick = (this.state.coachingChecks || []).map(i => opts[i]).filter(l =>
        (this._isRewardOpt(l) && !rule.isTop) || (this._isNoIssueOpt(l) && rule.isLow));
      if (badPick.length) {
        toast(`"${badPick.join('", "')}" เลือกไม่ได้กับผลประเมินระดับ "${rule.gradeLabel}" — กรุณาเลือกแนวทางอื่น`, 'error', { title: 'แนวทางฯ ไม่ตรงกับระดับผล' });
        focusCoach(); return false;
      }
      if (rule.isLow) {
        if (!String(this.state.actionNote || '').trim()) {
          toast(`ผลประเมินระดับ "${rule.gradeLabel}" — ต้องระบุ "หมายเหตุ — จะดำเนินการอย่างไร" ก่อนส่ง`, 'error', { title: 'ต้องระบุหมายเหตุ' });
          const el = document.getElementById('actionNote'); if (el) { el.focus(); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } else focusCoach();
          return false;
        }
        if (!String(this.state.coachingDetail || '').trim()) {
          toast(`ผลประเมินระดับ "${rule.gradeLabel}" — ต้องกรอก "ข้อเสนอแนะจากผู้ประเมิน" ก่อนส่ง`, 'error', { title: 'ต้องกรอกข้อเสนอแนะ' });
          const el = document.getElementById('coachDetail'); if (el) { el.focus(); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } else focusCoach();
          return false;
        }
      }
    }
    return true;
  },

  // กล่องยืนยัน + สรุปผลคะแนน ในกล่องเดียว (กดยืนยันครั้งเดียว → ส่งให้ HR)
  // ข้อมูลลำดับผู้ประเมินของใบที่กำลังเปิด — ใช้ตัดสินใจว่าปุ่มส่ง = "ส่งต่อลำดับถัดไป" หรือ "ส่งให้ HR"
  _chainInfo() {
    const rec = this.state.assignmentId ? DB.getEvaluations().find(x => x.id === this.state.assignmentId) : null;
    const me = Auth.currentUser() || {};
    const chain = rec ? evalChainOf(rec) : [];
    const step = rec ? evalStepOf(rec) : 0;
    const forward = !!rec && me.role !== 'admin' && chain.length > 1 && step < chain.length - 1 && chain[step] === me.id;
    const next = forward ? (DB.getUserById(chain[step + 1]) || {}) : null;
    return { rec, chain, step, total: chain.length, forward, next };
  },

  _confirmSubmitDialog() {
    return new Promise(resolve => {
      const ci = this._chainInfo();
      const form = this._formOf();
      const me = Auth.currentUser();
      const emp = DB.getUserById(this.state.employeeId) || {};
      // คำนวณสรุปคะแนนแบบเดียวกับตอนบันทึก (พรีวิว — ไม่บันทึกลงฐานข้อมูล)
      const visibleSections = form.sections.filter(sec => canScoreSection(sec, me.role));
      const valueMap = {};
      visibleSections.forEach(sec => sec.items.forEach(it => valueMap[it.id] = this.state.values[it.id]));
      const ev = buildEvaluation(form, this.state.employeeId, me.id, this.state.period, valueMap, this.state.penalties, this.state.coachingChecks, this.state.coachingDetail, this.state.overall);
      const info = gradeInfoFor(ev.totalScore, ev.totalMax);
      const avgP = this._liveAverage(form, ev.totalScore, ev.totalMax);
      const avgLine = avgP ? `<div class="flex justify-between gap-3" style="border-top:1px dashed var(--line);margin-top:3px;padding-top:4px;color:var(--accent-dark);font-weight:700"><span><i class="fa-solid fa-scale-balanced mr-1"></i>คะแนนสรุป (เฉลี่ย ${avgP.n} ลำดับ)</span><span class="mono">${avgP.total.toFixed(2)} / ${ev.totalMax} · ${escapeHtml((gradeInfoFor(avgP.total, ev.totalMax) || {}).label || '—')}</span></div><div class="text-mute" style="font-size:11px">${avgP.parts.map(p => escapeHtml(p)).join(' · ')}</div>` : '';
      const secRows = (ev.sectionScores || []).map(ss => {
        const sec = (form.sections || []).find(s => s.id === ss.sectionId);
        return `<div class="flex justify-between gap-3"><span>${escapeHtml(secName(sec?.name || ''))}</span><span class="mono">${(+ss.score).toFixed(2)} / ${ss.maxScore}</span></div>`;
      }).join('');
      const penRow = ev.penaltySectionScore ? `<div class="flex justify-between gap-3"><span>${escapeHtml(secName((form.penaltySection && form.penaltySection.name) || 'วินัย'))}</span><span class="mono">${(+ev.penaltySectionScore.score).toFixed(2)} / ${ev.penaltySectionScore.max}</span></div>` : '';

      const host = document.createElement('div');
      host.innerHTML = `
        <div class="modal-bg" style="z-index:200">
          <div class="modal confirm-modal" style="max-width:460px">
            <div class="confirm-body">
              <div class="confirm-icon warn"><i class="fa-solid fa-paper-plane"></i></div>
              <div class="confirm-title">${ci.forward ? `ยืนยันการประเมินและส่งต่อลำดับ ${ci.step + 2}` : 'ยืนยันการประเมินและส่งให้ HR'}</div>
              <div class="confirm-msg">
                <b>${escapeHtml(emp.fullName || '-')}</b> <span class="text-mute">${escapeHtml(emp.employeeCode || '')}</span> • ${fmtPeriod(this.state.period)}<br>
                <span class="mono font-bold" style="font-size:1.6rem;color:${info ? info.color : 'var(--ink)'}">${ev.totalScore.toFixed(2)}</span> <span class="text-mute">/ ${ev.totalMax}</span>
                <span class="grade-tag ml-1" style="color:${info ? info.color : '#737373'};border-color:${info ? info.color : '#e5e5e5'};background:${info ? info.color + '15' : '#fafafa'}">${escapeHtml(info ? info.label : (ev.grade || '-'))}</span>
              </div>
              <div class="muted-bg rounded text-xs text-left" style="padding:10px 12px;margin:4px 4px 0;display:flex;flex-direction:column;gap:3px">
                ${secRows}${penRow}
                ${avgLine}
                <div class="flex justify-between gap-3" style="border-top:1px solid var(--line);margin-top:3px;padding-top:4px;font-weight:700"><span>${avgP ? 'คะแนนของคุณ (ลำดับนี้)' : 'คะแนนรวม'}</span><span class="mono">${ev.totalScore.toFixed(2)} / ${ev.totalMax}</span></div>
              </div>
              <div class="text-mute text-xs" style="margin-top:8px">${ci.forward ? `ส่งต่อแล้ว <b>${escapeHtml(ci.next.fullName || '-')}</b> (ผู้ประเมินลำดับ ${ci.step + 2}/${ci.total}) จะเห็นคะแนนของคุณและประเมินต่อ • ลำดับสุดท้ายเป็นผู้ส่งให้ HR` : 'ส่งแล้ว HR จะตรวจสอบและยืนยัน • พนักงานจะกด "รับทราบผลการประเมิน" ผ่านระบบ'}</div>
            </div>
            <div class="modal-footer">
              <button data-cancel class="btn btn-secondary">ยกเลิก</button>
              <button data-ok class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> ${ci.forward ? `ยืนยันและส่งต่อลำดับ ${ci.step + 2}` : 'ยืนยันและส่งให้ HR'}</button>
            </div>
          </div>
        </div>`;
      document.body.appendChild(host);
      const bg = host.querySelector('.modal-bg');
      const cleanup = (ans) => { document.removeEventListener('keydown', onKey); host.remove(); resolve(ans); };
      host.querySelector('[data-ok]').addEventListener('click', () => cleanup(true));
      host.querySelector('[data-cancel]').addEventListener('click', () => cleanup(false));
      bg.addEventListener('click', e => { if (e.target === bg) cleanup(false); });
      const onKey = (e) => { if (e.key === 'Escape') cleanup(false); if (e.key === 'Enter') cleanup(true); };
      document.addEventListener('keydown', onKey);
    });
  },

  // =================================================================
  // Save
  // =================================================================
  // mode = 'draft' (status evaluated, รอส่ง HR) | 'submit' (status pending_review) | 'update' (HR แก้ไข คงสถานะ)
  async _save(mode) {
    const form = this._formOf();
    if (!form) { toast('กรุณาเลือกแบบฟอร์ม', 'error'); return; }
    if (!this.state.employeeId) { toast('กรุณาเลือกพนักงาน', 'error'); return; }
    if (!this.state.period) { toast('กรุณาเลือกรอบประเมิน', 'error'); return; }

    const me = Auth.currentUser();
    const visibleSections = form.sections.filter(sec => canScoreSection(sec, me.role));
    if (!visibleSections.length) { toast('คุณไม่มีสิทธิ์ให้คะแนนในฟอร์มนี้', 'error'); return; }

    // HR (admin) แก้ไข/บันทึกได้แม้กรอกไม่ครบ — บทบาทอื่น (หัวหน้างาน) ยังต้องกรอกให้ครบ
    const missing = [];
    if (me.role !== 'admin') {
      visibleSections.forEach(sec => sec.items.forEach(it => {
        const v = this.state.values[it.id];
        if (!it.optional && (v === undefined || v === null || v === '')) missing.push(it.name);
      }));
    }
    if (missing.length) {
      toast(`กรุณากรอกครบทุกข้อ (เหลือ ${missing.length})`, 'error');
      return;
    }

    const area = document.getElementById('formArea');
    const valueMap = {};
    visibleSections.forEach(sec => sec.items.forEach(it => valueMap[it.id] = this.state.values[it.id]));

    const ev = buildEvaluation(
      form, this.state.employeeId, me.id, this.state.period,
      valueMap, this.state.penalties, this.state.coachingChecks, this.state.coachingDetail, this.state.overall,
    );

    const existing = this.state.assignmentId ? DB.getEvaluations().find(x => x.id === this.state.assignmentId) : null;
    if (existing) {
      ev.id = existing.id;
      // HR เลือกผู้ประเมินไว้ในฟอร์ม → ใช้ค่านั้น • สิทธิ์อื่น (state.supervisorId = undefined) คงพฤติกรรมเดิม
      ev.supervisorId = (this.state.supervisorId !== undefined)
        ? (this.state.supervisorId || null)
        : (existing.supervisorId || me.id);
      ev.evaluatorId = existing.evaluatorId || ev.evaluatorId;   // คงผู้ประเมินเดิม (กรณี HR แก้ไข)
      // ลำดับผู้ประเมิน (snapshot) + ความคืบหน้า — คงจากใบเดิม • HR เปลี่ยนผู้ประเมินในฟอร์ม = เปลี่ยน "ลำดับปัจจุบัน"
      ev.evaluatorIds = evalChainOf(existing);
      ev.evalStep = evalStepOf(existing);
      ev.evalChain = Array.isArray(existing.evalChain) ? [...existing.evalChain] : [];
      ev.evalRound = evalRoundOf(existing);
      if (this.state.supervisorId !== undefined && (existing.supervisorId || '') !== (ev.supervisorId || '')) {
        if (ev.supervisorId) {
          if (ev.evaluatorIds.length) ev.evaluatorIds[ev.evalStep] = ev.supervisorId; else { ev.evaluatorIds = [ev.supervisorId]; ev.evalStep = 0; }
          ev.evaluatorIds = normalizeEvaluatorIds(ev.evaluatorIds, ev.employeeId);
          ev.evalStep = Math.min(ev.evalStep, Math.max(0, ev.evaluatorIds.length - 1));
        } else { ev.evaluatorIds = []; ev.evalStep = 0; ev.evalChain = []; }
      }
      ev.assignedBy = existing.assignedBy;
      ev.assignedAt = existing.assignedAt;
      ev.createdAt = existing.createdAt;
      ev.history = Array.isArray(existing.history) ? [...existing.history] : [];
    } else {
      ev.supervisorId = me.id;
      ev.evaluatorIds = [me.id]; ev.evalStep = 0; ev.evalChain = [];
      ev.history = [];
    }
    // ผู้ประเมินที่ "ไม่ใช่ลำดับสุดท้าย" กดส่ง = ส่งต่อให้ลำดับถัดไป (ใบยังรอประเมิน) • ลำดับสุดท้าย/HR = ส่งให้ HR ตรวจ
    const forwardNext = mode === 'submit' && me.role !== 'admin' && !evalIsLastStep(ev) && evalCurrentEvaluatorId(ev) === me.id;
    if (mode === 'update') {
      // HR แก้ไข — คงสถานะเดิมไว้ทั้งหมด
      ev.status = existing ? existing.status : 'evaluated';
      ev.submittedAt = existing ? existing.submittedAt : null;
      ev.reviewedBy = existing ? existing.reviewedBy : null;
      ev.reviewedAt = existing ? existing.reviewedAt : null;
      ev.reviewNote = existing ? existing.reviewNote : '';
    } else if (mode === 'submit') {
      if (!forwardNext) { ev.status = 'pending_review'; ev.submittedAt = new Date().toISOString(); }
    } else if (mode === 'confirm') {
      // HR ตรวจสอบจากฟอร์มแล้วยืนยันผล — บันทึกการแก้ไข + เปลี่ยนสถานะเป็น "ยืนยันแล้ว"
      ev.status = 'confirmed';
      ev.submittedAt = (existing && existing.submittedAt) ? existing.submittedAt : new Date().toISOString();
      ev.reviewedBy = me.id;
      ev.reviewedAt = new Date().toISOString();
      ev.reviewNote = 'ตรวจสอบและยืนยันผลจากฟอร์มประเมิน';
    } else {
      ev.status = 'evaluated';
      ev.submittedAt = null;
    }

    ev.answers.forEach(a => {
      const c = area.querySelector(`[data-comment="${a.itemId}"]`);
      if (c) a.comment = c.value.trim();
    });

    ev.penaltyNotes = this.state.penaltyNotes || {};
    ev.hireDate = this.state.hireDate || '';
    ev.evalDate = this.state.evalDate || '';
    ev.prevActionStatus = this.state.prevActionStatus || '';
    ev.actionNote = this.state.actionNote || '';
    ev.empResponse = this.state.empResponse || '';
    ev.empComment = this.state.empComment || '';
    ev.attachments = this._readyFiles(this.state.attachments);
    ev.signedDocs = this._readyFiles(this.state.signedDocs);

    // HR เปลี่ยนผู้ประเมินจากในฟอร์ม → บันทึกประวัติไว้ (รูปแบบเดียวกับปุ่ม "กำหนดผู้ประเมิน")
    if (existing && this.state.supervisorId !== undefined && (existing.supervisorId || '') !== (ev.supervisorId || '')) {
      const _newSup = ev.supervisorId ? (DB.getUserById(ev.supervisorId) || {}) : null;
      const _oldSup = existing.supervisorId ? (DB.getUserById(existing.supervisorId) || {}) : null;
      DB.pushHistory(ev, 'assigned', me.id,
        `เปลี่ยนผู้ประเมิน: ${_oldSup ? (_oldSup.fullName || existing.supervisorId) : 'ยังไม่กำหนด'} → ${_newSup ? (_newSup.fullName || ev.supervisorId) : 'ยังไม่กำหนด'}`);
    }

    // บันทึก log การดำเนินการ
    if (mode === 'update') DB.logEvalStep(ev, me.id, { stage: 'hr', action: 'edit' });
    if (mode === 'confirm') DB.logEvalStep(ev, me.id, { stage: 'hr', action: 'confirm' });
    if (mode === 'update' || mode === 'confirm') applyFinalScore(ev, form);   // คะแนนสรุปยังเป็นค่าเฉลี่ยของผู้ประเมิน (HR แก้ค่าในฟอร์มไม่เปลี่ยนคะแนนสรุปเมื่อมี ≥2 ลำดับ)
    if (mode === 'update') {
      DB.pushHistory(ev, 'edited', me.id, `แก้ไขข้อมูลโดย ${me.fullName} • คะแนน ${ev.totalScore.toFixed(2)}/${ev.totalMax}`);
    } else if (mode === 'submit') {
      if (forwardNext) DB.forwardEvalChain(ev, me.id);
      else { DB.logEvalStep(ev, me.id, { action: me.role === 'admin' ? 'hr-submit' : 'submit' }); applyFinalScore(ev, form); }   // ลำดับสุดท้าย → log แล้วสรุปคะแนน (ค่าเฉลี่ยทุกลำดับ)
      if (!forwardNext) DB.pushHistory(ev, 'submitted', me.id, `ส่งให้ HR ตรวจสอบ • คะแนน ${ev.totalScore.toFixed(2)}/${ev.totalMax}${ev.signedDocs.length ? ` • แนบ ${ev.signedDocs.length} ไฟล์` : ''}`);
    } else if (mode === 'confirm') {
      DB.pushHistory(ev, 'confirmed', me.id, `ตรวจสอบและยืนยันผล • คะแนน ${ev.totalScore.toFixed(2)}/${ev.totalMax}`);
    } else {
      DB.pushHistory(ev, 'evaluated', me.id, `คะแนน ${ev.totalScore.toFixed(2)}/${ev.totalMax}`);
    }

    try {
      await DB.upsertEvaluation(ev);
    } catch (err) {
      toast('บันทึกไม่สำเร็จ — โปรดลองใหม่ หรือไฟล์แนบอาจใหญ่เกินไป', 'error', { title: 'บันทึกไม่สำเร็จ' });

    if (mode === 'confirm') {

      App.go('hr-list');
      return;
    }

    if (mode === 'draft') {
