<script>
// ===================================================================
// Storage Layer — v11 (HR + Sup, 3-step assign→review→confirm flow)
// ===================================================================
const DB_VERSION = 41;
// โทเคนรีเฟรชข้อมูลจำลองแบบ "ครั้งเดียว" — เปลี่ยนค่านี้เมื่อต้องการล้าง+โหลดข้อมูลจำลองใหม่รอบเดียว
// (ไม่กระทบการแก้ไขข้อมูลในอนาคต — เปลี่ยนเฉพาะตอนตั้งใจรีเซ็ตข้อมูลตัวอย่างเท่านั้น)

// สถานะการประเมิน (flow ใหม่)
//   assigned        = HR โหลดรายชื่อเข้าระบบ รอหัวหน้าประเมิน
//   evaluated       = หัวหน้าประเมิน+พิมพ์แล้ว รอแนบเอกสารที่พนักงานเซ็น
//   pending_review  = หัวหน้าแนบเอกสารเซ็น+ส่งแล้ว รอ HR ตรวจสอบ
//   confirmed       = HR ตรวจสอบและยืนยันแล้ว
const EVAL_STATUS = { ASSIGNED: 'assigned', EVALUATED: 'evaluated', PENDING_REVIEW: 'pending_review', CONFIRMED: 'confirmed' };

// ป้ายสถานะ (ใช้ร่วมทุกหน้า)
const STATUS_META = {
  assigned:       { label: 'รอประเมิน',           badge: 'warn', icon: 'fa-clock' },
  evaluated:      { label: 'รอส่งให้ HR',          badge: 'info', icon: 'fa-paper-plane' },
  pending_review: { label: 'รอ HR ตรวจสอบ',        badge: 'info', icon: 'fa-hourglass-half' },
  confirmed:      { label: 'ยืนยันแล้ว',           badge: 'ok',   icon: 'fa-circle-check' },
};
function statusBadgeHTML(status) {
  const m = STATUS_META[status] || { label: status, badge: '', icon: 'fa-circle' };
  return `<span class="badge ${m.badge}"><i class="fa-solid ${m.icon} mr-1"></i>${m.label}</span>`;
}
// ป้ายสถานะ "การรับทราบของพนักงาน" (ใช้ในรายการประเมินของหัวหน้า/HR)
function ackBadgeHTML(ev) {
  if (!ev || ev.status === 'assigned' || ev.totalScore == null) return '<span class="text-mute">—</span>';
  if (ev.empResponse === 'acknowledge') {
    return `<span class="badge ok"><i class="fa-solid fa-circle-check mr-1"></i>รับทราบแล้ว</span>${ev.empAckDate ? `<div class="text-mute" style="font-size:10px;margin-top:2px">${escapeHtml(ev.empAckDate)}</div>` : ''}`;
  }
  if (ev.empResponse === 'dispute') {
    return '<span class="badge err"><i class="fa-solid fa-triangle-exclamation mr-1"></i>มีข้อโต้แย้ง</span>';
  }
  return '<span class="badge warn"><i class="fa-solid fa-clock mr-1"></i>รอรับทราบ</span>';
}

// ===== Activity log (ประวัติการดำเนินการของแต่ละการประเมิน) =====
const HISTORY_META = {
  assigned:  { label: 'HR มอบหมายการประเมิน',        icon: 'fa-clipboard-list',  color: '#2563eb' },
  evaluated: { label: 'หัวหน้าบันทึกผลประเมิน',       icon: 'fa-floppy-disk',     color: '#ca8a04' },
  submitted: { label: 'ส่งให้ HR ตรวจสอบ',            icon: 'fa-paper-plane',     color: '#0891b2' },
  attached:  { label: 'แนบเอกสารที่พนักงานเซ็น',      icon: 'fa-file-signature',  color: '#dc2626' },
  confirmed: { label: 'HR ยืนยันผลการประเมิน',        icon: 'fa-circle-check',    color: '#16a34a' },
  rejected:  { label: 'HR ส่งกลับให้แก้ไข',           icon: 'fa-rotate-left',     color: '#dc2626' },
  edited:    { label: 'แก้ไขข้อมูลการประเมิน',         icon: 'fa-pen-to-square',   color: '#7c3aed' },
  acknowledged: { label: 'พนักงานรับทราบผลการประเมิน', icon: 'fa-user-check',     color: '#16a34a' },
  forwarded: { label: 'ส่งต่อให้ผู้ประเมินลำดับถัดไป',  icon: 'fa-forward',         color: '#0891b2' },
};
function historyMeta(action) {
  return HISTORY_META[action] || { label: action, icon: 'fa-circle', color: '#737373' };
}
// รวมรายการประวัติ: ใช้ ev.history เป็นหลัก + เติม baseline จาก timestamp เดิมสำหรับ event ที่ยังไม่ถูกบันทึก (รองรับ record เก่า)
function buildHistoryEntries(ev) {
  const nameOf = (id) => (id ? (DB.getUserById(id)?.fullName || id) : 'ระบบ');
  const items = [];
  const seen = new Set();
  (ev.history || []).forEach(h => {
    items.push({ ts: h.ts, by: h.byName || nameOf(h.by), note: h.note || '', action: h.action, ...historyMeta(h.action) });
    seen.add(h.action);
  });
  if (ev.assignedAt && !seen.has('assigned'))   items.push({ ts: ev.assignedAt,  by: nameOf(ev.assignedBy),   note: '', action: 'assigned',  ...historyMeta('assigned') });
  if (ev.submittedAt && !seen.has('submitted')) items.push({ ts: ev.submittedAt, by: nameOf(ev.supervisorId), note: '', action: 'submitted', ...historyMeta('submitted') });
  if (ev.reviewedAt) {
    const a = ev.status === 'confirmed' ? 'confirmed' : 'rejected';
    if (!seen.has(a)) items.push({ ts: ev.reviewedAt, by: nameOf(ev.reviewedBy), note: ev.reviewNote || '', action: a, ...historyMeta(a) });
  }
  return items.sort((a, b) => String(a.ts).localeCompare(String(b.ts)));
}
// ===================================================================
// ผู้ประเมินหลายลำดับ — กำหนดได้สูงสุด MAX_EVALUATORS คน และ "วิ่งตามลำดับ" 1 → 2 → 3
//   users.evaluatorIds  = [id1, id2, id3]  (ลำดับการประเมิน) • users.supervisorId = ลำดับ 1 (mirror เพื่อความเข้ากันได้)
//   evaluations.evaluatorIds = snapshot ตอนมอบหมาย • evalStep = ลำดับที่กำลังประเมิน (0-based)
//   evaluations.supervisorId = ผู้ประเมิน "ปัจจุบัน" (ลำดับที่ถึงคิว) • evalChain = ผลของลำดับที่ส่งต่อมาแล้ว
// ===================================================================
const MAX_EVALUATORS = 3;
function normalizeEvaluatorIds(ids, selfId) {
  const out = [];
  (Array.isArray(ids) ? ids : []).forEach(id => {
    const v = id == null ? '' : String(id);
    if (v && v !== selfId && !out.includes(v)) out.push(v);
  });
  return out.slice(0, MAX_EVALUATORS);
}
// ลำดับผู้ประเมินของ "พนักงาน" (จากหน้าจัดการพนักงาน)
function evaluatorChainOf(u) {
  if (!u) return [];
  const ids = (Array.isArray(u.evaluatorIds) && u.evaluatorIds.length) ? u.evaluatorIds : (u.supervisorId ? [u.supervisorId] : []);
  return normalizeEvaluatorIds(ids, u.id);
}
// ลำดับผู้ประเมินของ "ใบประเมิน" (snapshot) — ใบเก่าที่ไม่มี evaluatorIds ใช้ supervisorId
function evalChainOf(ev) {
  if (!ev) return [];
  const ids = (Array.isArray(ev.evaluatorIds) && ev.evaluatorIds.length) ? ev.evaluatorIds : (ev.supervisorId ? [ev.supervisorId] : []);
  return normalizeEvaluatorIds(ids, ev.employeeId);
}
function evalStepOf(ev) {
  const n = evalChainOf(ev).length;
  const st = parseInt(ev && ev.evalStep) || 0;
  return Math.min(Math.max(0, st), Math.max(0, n - 1));
}
function evalCurrentEvaluatorId(ev) { const c = evalChainOf(ev); return c.length ? c[evalStepOf(ev)] : ((ev && ev.supervisorId) || null); }
function evalIsLastStep(ev) { const c = evalChainOf(ev); return c.length <= 1 || evalStepOf(ev) >= c.length - 1; }
function evaluatorNameOf(id) { const u = id ? DB.getUserById(id) : null; return (u && u.fullName) || ''; }
// ชื่อผู้ประเมินทุกลำดับ "A → B → C" (ใช้ในตาราง/Excel/PDF)
function evalChainNames(ev, sep = ' → ') { return evalChainOf(ev).map(id => evaluatorNameOf(id) || id).join(sep); }
function userChainNames(u, sep = ' → ') { return evaluatorChainOf(u).map(id => evaluatorNameOf(id) || id).join(sep); }
// HTML แสดงลำดับผู้ประเมิน — ใบที่มีผู้ประเมินคนเดียวแสดงชื่อเฉย ๆ • หลายคนแสดงเป็นขั้น (ทำแล้ว / ถึงคิว / รอ)
function evalChainHtml(ev, opts = {}) {
  const chain = evalChainOf(ev);
  if (!chain.length) return '';
  const step = evalStepOf(ev);
  const inProgress = !ev.status || ev.status === 'assigned';
  if (chain.length === 1 && !opts.always) return escapeHtml(evaluatorNameOf(chain[0]) || '-');
  return `<div class="ev-chain" title="ลำดับผู้ประเมิน (ประเมินตามลำดับ)">${chain.map((id, i) => {
    const st = !inProgress ? 'done' : (i < step ? 'done' : (i === step ? 'cur' : 'wait'));
    const ic = st === 'done' ? 'fa-check' : (st === 'cur' ? 'fa-pen' : 'fa-clock');
    return `<span class="ev-chain-step ${st}"><span class="ev-chain-no">${i + 1}</span><span class="ev-chain-name">${escapeHtml(evaluatorNameOf(id) || id)}</span><i class="fa-solid ${ic} ev-chain-ic"></i></span>`;
  }).join('<i class="fa-solid fa-angle-right ev-chain-arrow"></i>')}</div>`;
}
// HTML ลำดับผู้ประเมินของ "พนักงาน" (หน้าจัดการพนักงาน/รายชื่อทีม) — แบบกลาง ไม่มีสถานะ
function userChainHtml(u) {
  const chain = evaluatorChainOf(u);
  if (!chain.length) return '<span class="text-mute">—</span>';
  if (chain.length === 1) return escapeHtml(evaluatorNameOf(chain[0]) || '-');
  return `<div class="ev-chain" title="ผู้ประเมิน ${chain.length} ลำดับ (ประเมินตามลำดับ)">${chain.map((id, i) => `<span class="ev-chain-step plain"><span class="ev-chain-no">${i + 1}</span><span class="ev-chain-name">${escapeHtml(evaluatorNameOf(id) || id)}</span></span>`).join('<i class="fa-solid fa-angle-right ev-chain-arrow"></i>')}</div>`;
}
// ข้อความสั้น ๆ บอกสถานะลำดับ เช่น "ลำดับ 2/3 · รอ วิภาดา" (ใช้ใต้ป้ายสถานะ)
// ---------- Log ผลรายลำดับ (step log) + นโยบายการมองเห็น ----------
//   ev.evalChain = [{ stage:'evaluator'|'hr', step, round, evaluatorId, submittedAt, totalScore, totalMax, grade, comment, action, snapshot }]
//   • ทุกครั้งที่ผู้ประเมินลำดับใดกดส่ง (ส่งต่อ/ส่ง HR) และทุกครั้งที่ HR ยืนยัน/แก้ไข → เก็บ snapshot คะแนนทั้งใบไว้ 1 รายการ
//   • HR ส่งกลับแก้ไข = เริ่ม "รอบ" ใหม่ (evalRound+1) — log รอบเก่ายังอยู่ให้ย้อนดู
//   • ใครเห็น log ของใครกำหนดที่ settings.stepVisibility (HR ตั้งได้ที่ จัดการแบบฟอร์ม → การมองเห็นผลรายลำดับ)
const STEP_VIS_DEFAULT = { evaluators: 'all', employee: 'final', carryScores: true, pdf: true };
// วิธีสรุปคะแนนเมื่อมีผู้ประเมินหลายลำดับ: 'average' = ค่าเฉลี่ยของทุกลำดับ (ค่าเริ่มต้น) · 'last' = ใช้คะแนนของลำดับสุดท้าย
function finalScoreMode() {
  try { const s = (typeof DB !== 'undefined' && DB.getSettings) ? DB.getSettings() : null; return (s && s.finalScoreMode) === 'last' ? 'last' : 'average'; } catch (e) { return 'average'; }
}
// ค่าเฉลี่ยของ log ผู้ประเมิน (รอบปัจจุบัน) — คืน null ถ้ามีน้อยกว่า 2 รายการ
function chainAverage(form, entries) {
  const list = (entries || []).filter(x => x && x.snapshot && (x.stage || 'evaluator') === 'evaluator');
  if (list.length < 2) return null;
  const n = list.length;
  const r2 = (v) => +(+v).toFixed(2);
  const avg = (arr) => arr.length ? arr.reduce((s, v) => s + (+v || 0), 0) / arr.length : 0;
  const answers = [];
  (form.sections || []).forEach(sec => sec.items.forEach(it => {
    const got = list.map(e => (e.snapshot.answers || []).find(a => a.itemId === it.id)).filter(a => a && a.score != null && a.score !== '');
    if (!got.length) return;
    const score = avg(got.map(a => a.score));
    answers.push({ sectionId: sec.id, itemId: it.id, score: r2(score), fraction: +(it.maxScore ? score / it.maxScore : 0).toFixed(4), n: got.length });
  }));
  const sectionScores = (form.sections || []).map(sec => {
    const got = list.map(e => (e.snapshot.sectionScores || []).find(s => s.sectionId === sec.id)).filter(Boolean);

function evalRoundOf(ev) { return Math.max(1, +(ev && ev.evalRound) || 1); }

// รายการของ "รอบปัจจุบัน" เท่านั้น (ใช้กับกล่องลงนาม / สถานะกลางลำดับ)

// รายการ log ที่ "ผู้ดู" คนนี้มีสิทธิ์เห็น (เรียง รอบล่าสุดก่อน → ลำดับ 1..N → HR)
function stepLogVisible(ev, viewer) {
  if (!ev || !viewer) return [];
  const all = ((Array.isArray(ev.evalChain)) ? ev.evalChain : []).filter(x => x && x.snapshot);
  const vis = stepVisibility();
  let list;
  if (viewer.role === 'admin') list = all;
  else if (viewer.id === ev.employeeId) list = vis.employee === 'all' ? all.filter(x => (x.stage || 'evaluator') === 'evaluator') : [];
  else {
    const chain = evalChainOf(ev); const my = chain.indexOf(viewer.id);
    if (my < 0) list = [];
    else {
      const evs = all.filter(x => (x.stage || 'evaluator') === 'evaluator');
      const mode = vis.evaluators;
      if (mode === 'all') list = evs;
      else if (mode === 'previous') list = evs.filter(x => x.step <= my);

}

function evalStepText(ev) {
  const chain = evalChainOf(ev);
  if (chain.length <= 1) return '';
  if (!ev.status || ev.status === 'assigned') { const s = evalStepOf(ev); return `ลำดับ ${s + 1}/${chain.length} · ${evaluatorNameOf(chain[s]) || '-'}`; }
  return `ครบ ${chain.length} ลำดับแล้ว`;
}

// อายุงานโดยประมาณจากวันเริ่มงาน เช่น "5 ปี 2 เดือน"
function tenureText(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  const now = new Date();
  let months = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
  if (now.getDate() < d.getDate()) months--;
  if (months < 0) months = 0;
  const y = Math.floor(months / 12), m = months % 12;
  return `${y} ปี ${m} เดือน`;
}
// format วันเวลา (ไทย) เช่น 30/05/2026 14:56
function fmtDateTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

    const CHUNK = 150;   // แบ่งก้อน กัน URL (record_id=in.(...)) ยาวเกินตอนตั้งทีละมาก ๆ
    for (let i = 0; i < list.length; i += CHUNK) await SupaDB.setPaused(list.slice(i, i + CHUNK), paused);
    const s = new Set(list);
    (this._evalCache || []).forEach(e => { if (s.has(e.id)) e.paused = !!paused; });
    return list.length;
  },

  // ----- บันทึกการเปลี่ยนแปลงข้อมูลพนักงาน (Change log) — เก็บฝังในเรคคอร์ดพนักงาน (u.changeLog) -----
  // ประวัติการแก้ไขข้อมูลพนักงานโดย HR (type 'edited' · changes = [{ label, from, to }]) — ไม่มีคำขอจากหัวหน้างานแล้ว
  getChangeLog(empId) { const u = this.getUserById(empId); return (u && u.changeLog) ? u.changeLog : null; },
  getChanges() { return this.getUsers().map(u => u.changeLog).filter(Boolean); },
  async logEmployeeChange(emp, type, byId, changes, note = '') {
    this._requireDB();
    const now = new Date().toISOString();
    const by = byId ? this.getUserById(byId) : null;
    const user = { ...(this.getUserById(emp.id) || emp) };   // อิงเรคคอร์ดล่าสุด (กันทับฟิลด์อื่น)
    const c = user.changeLog
      ? { ...user.changeLog, timeline: [...(user.changeLog.timeline || [])] }
      : { timeline: [], createdAt: now };
    c.timeline.push({ ts: now, type, by: byId || null, byName: by ? by.fullName : '', changes: Array.isArray(changes) ? changes : [], note: note || '' });
    c.updatedAt = now;
    user.changeLog = c;
    await this.upsertUser(user);
    return c;
  },

  async upsertEvaluation(e) {
    this._requireDB();
    await SupaDB.upsertOne('evaluations', e);
    this._cacheUpsertEval(e);
    return e;
  },
  // เพิ่ม/อัพเดทหลายใบในครั้งเดียว (HR สร้างมอบหมายทั้งรอบ) — แบ่งก้อน ไม่ลบแถวอื่น • onProgress(done,total)
  async bulkUpsertEvaluations(list, onProgress) {
    const arr = Array.isArray(list) ? list : [];
    if (!arr.length) return 0;
    this._requireDB();
    await SupaDB.upsertMany('evaluations', arr, onProgress);
    arr.forEach(e => this._cacheUpsertEval(e));
    return arr.length;
  },
  async deleteEvaluation(id) {
    this._requireDB();
    await SupaDB.deleteOne('evaluations', id);
    this._cacheRemoveEval(id);
  },
  // ลบหลายใบพร้อมกัน (แบ่งก้อนใน SupaDB.deleteMany) • onProgress(done,total)
  async deleteEvaluations(ids, onProgress) {
    this._requireDB();
    const list = (ids || []).filter(Boolean);
    if (!list.length) return { deleted: 0 };
    await SupaDB.deleteMany('evaluations', list, onProgress);
    list.forEach(id => this._cacheRemoveEval(id));
    return { deleted: list.length };
  },
  // เพิ่ม log การดำเนินการลงใน ev.history (mutate object)
  pushHistory(ev, action, byId, note = '') {
    if (!ev) return ev;
    if (!Array.isArray(ev.history)) ev.history = [];
    const u = byId ? this.getUserById(byId) : null;
    ev.history.push({ ts: new Date().toISOString(), action, by: byId || null, byName: u?.fullName || (byId || 'ระบบ'), note });
    return ev;
  },
  // ดึงประวัติของพนักงาน 1 คนจาก DB (bounded — ไม่กี่รอบต่อคน) แล้ว cache ไว้ให้ view ใช้
  //   ใช้ในหน้าของ "พนักงาน" เท่านั้น → ตัดใบที่ถูกปิด (paused) ออก
  async loadEvaluationsByEmployee(id) {

  initVersion() {

    if (cur < DB_VERSION) {
      // *** ปิดการล้างข้อมูลอัตโนมัติเมื่อเวอร์ชันเปลี่ยน — เพื่อ "คงข้อมูลที่ผู้ใช้บันทึก/แก้ไขไว้" ไม่ให้ถูกรีเซ็ต ***
      // (ถ้าต้องการโหลดข้อมูลจำลองใหม่ทั้งหมด ให้เรียก DB.resetAll() เอง หรือล้าง localStorage ด้วยตนเอง)
      localStorage.setItem(this.KEYS.version, String(DB_VERSION));

  seedIfEmpty() {

    if (!supa && this.getForms().length === 0) this._seedForms();   // ไม่มีฐานข้อมูล → ใช้ฟอร์มมาตรฐานในเครื่อง
    if (!localStorage.getItem(this.KEYS.settings)) this.saveSettings(this._defaultSettings());
  },


  // ----- Hierarchy helpers -----
  // ลูกทีม = ทุกคนที่มี supervisorId นี้อยู่ในลำดับผู้ประเมิน (ไม่ว่าลำดับใด)
  getSubordinates(supervisorId) {
    return this.getUsers().filter(u => evaluatorChainOf(u).includes(supervisorId));
  },
  getSupervisors() {
    return this.getUsers().filter(u => u.role === 'supervisor');
  },
  getEmployees() {
    return this.getUsers().filter(u => u.role === 'employee');
  },
  getPotentialSupervisors() {
    return this.getUsers().filter(u => u.role === 'supervisor');
  },

  // ===================================================================
  // Flow helpers — assign → review → confirm
  // ===================================================================
  // สร้างรายการมอบหมาย (HR โหลดรายชื่อ): 1 record/พนักงาน/รอบ status=assigned
  async createAssignment(employeeId, supervisorId, period, formId, hrId) {
    this._requireDB();
    // กันซ้ำระดับ "รอบ" (ทุกฟอร์ม) — พนักงาน 1 คนมีใบประเมินได้ 1 ใบต่อรอบ
    const dup = await SupaDB.query('evaluations', { filters: { employeeId, period }, select: 'record_id', pageSize: 1, count: false });
    if (dup.rows.length) return null;
    const rec = {
      id: this.uid('e'),
      employeeId,
      supervisorId,           // หัวหน้าที่ต้องประเมิน (snapshot)
      evaluatorId: null,
      period, formId,
      status: EVAL_STATUS.ASSIGNED,
      assignedBy: hrId,
      assignedAt: new Date().toISOString(),
      // ข้อมูลประเมิน (เติมโดยหัวหน้าภายหลัง)
      answers: [], sectionScores: [], penaltyInputs: [], penaltySectionScore: null,
      rawSubtotal: 0, penaltyTotal: 0, totalScore: 0, totalMax: 0, grade: '', resultBox: null,
      coachingChecks: [], coachingDetail: '', attachments: [], signedDocs: [], overallComment: '',
      submittedAt: null, reviewedBy: null, reviewedAt: null, reviewNote: '',
      history: [],
      createdAt: new Date().toISOString(),
    };
    // ลำดับผู้ประเมิน (snapshot จากหน้าจัดการพนักงาน) — ผู้ประเมินปัจจุบัน = ลำดับ 1
    const chain = evaluatorChainOf(this.getUserById(employeeId));
    rec.evaluatorIds = chain.length ? chain : normalizeEvaluatorIds(supervisorId ? [supervisorId] : [], employeeId);
    rec.supervisorId = rec.evaluatorIds[0] || null;
    rec.evalStep = 0;
    rec.evalChain = [];
    this.pushHistory(rec, 'assigned', hrId);
    await this.upsertEvaluation(rec);
    return rec;
  },
  // ส่งต่อไปยังผู้ประเมินลำดับถัดไป (เรียกเมื่อผู้ประเมินปัจจุบันไม่ใช่ลำดับสุดท้าย) — คืน true ถ้าส่งต่อได้
  //   บันทึกผลของลำดับปัจจุบันลง evalChain • ใบยังคงสถานะ "รอประเมิน" แต่ย้ายคิวไปลำดับถัดไป
  // บันทึก log ผลของ "ลำดับ/ขั้น" ปัจจุบันลง evalChain (1 รายการต่อ รอบ+ขั้น — ส่งซ้ำในรอบเดียวกันจะแทนที่)
  //   stage 'evaluator' = ผู้ประเมินตามลำดับ (step = ลำดับที่กดส่ง) • stage 'hr' = HR ยืนยัน/แก้ไข
  logEvalStep(ev, byId, opts = {}) {
    const stage = opts.stage || 'evaluator';
    const step = stage === 'evaluator' ? (opts.step != null ? opts.step : evalStepOf(ev)) : null;
    const round = evalRoundOf(ev);
    const entry = {
      stage, step, round, evaluatorId: byId, submittedAt: new Date().toISOString(),
      totalScore: +ev.totalScore || 0, totalMax: +ev.totalMax || 0, grade: ev.grade || '',
      comment: ev.overallComment || '', action: opts.action || '', snapshot: stepSnapshotOf(ev),
    };
    ev.evalChain = (Array.isArray(ev.evalChain) ? ev.evalChain : []).filter(x => !(x && (x.stage || 'evaluator') === stage && (+x.round || 1) === round && (stage !== 'evaluator' || x.step === step)));
    ev.evalChain.push(entry);
    return entry;
  },
  forwardEvalChain(ev, byId) {
    const chain = evalChainOf(ev);
    const step = evalStepOf(ev);
    if (step >= chain.length - 1) return false;
    const entry = this.logEvalStep(ev, chain[step], { step, action: 'forward' });
    try { const f = this.getFormForEval(ev); if (f) applyFinalScore(ev, f); } catch (e) { }
    ev.evalStep = step + 1;
    ev.supervisorId = chain[ev.evalStep];
    ev.status = EVAL_STATUS.ASSIGNED;
    ev.submittedAt = null;
    const next = this.getUserById(ev.supervisorId) || {};
    this.pushHistory(ev, 'forwarded', byId, `ลำดับ ${step + 1}/${chain.length} ประเมินแล้ว • คะแนน ${entry.totalScore.toFixed(2)}/${entry.totalMax} → ส่งต่อให้ ${next.fullName || '-'} (ลำดับ ${step + 2})`);
    return true;
  },

  // หัวหน้า: รายการที่ตนอยู่ในลำดับผู้ประเมิน (ทุกลำดับ — ถึงคิวหรือไม่ดูจาก supervisorId) (filter status ได้)
  getAssignmentsForSupervisor(supId, status) {
    return this.getEvaluations()
      .filter(e => evalChainOf(e).includes(supId) && (!status || e.status === status))
      .sort((a, b) => b.period.localeCompare(a.period));
  },
  // HR: ทุกรายการ (filter status ได้)
  getAssignmentsForHR(status) {
    return this.getEvaluations()
      .filter(e => !status || e.status === status)
      .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  },
  // หัวหน้าส่งผลประเมิน → pending_review
  async submitEvaluation(evalId) {
    const ev = await this.getEvaluationFull(evalId);
    if (!ev) return null;
    ev.status = EVAL_STATUS.PENDING_REVIEW;
    ev.submittedAt = new Date().toISOString();
    await this.upsertEvaluation(ev);
    return ev;
  },
  // หัวหน้าแนบเอกสารเซ็น (signedDocs) แล้วส่ง → pending_review
  async attachAndSubmit(evalId, newSignedDocs) {
    const ev = await this.getEvaluationFull(evalId);
    if (!ev) return null;
    ev.signedDocs = [...(ev.signedDocs || []), ...(newSignedDocs || [])];
    ev.status = EVAL_STATUS.PENDING_REVIEW;
    ev.submittedAt = new Date().toISOString();
    await this.upsertEvaluation(ev);
    return ev;
  },
  // HR ยืนยัน → confirmed
  async confirmEvaluation(evalId, hrId, note = '') {
    const ev = await this.getEvaluationFull(evalId);
    if (!ev) return null;
    ev.status = EVAL_STATUS.CONFIRMED;
    ev.reviewedBy = hrId;
    ev.reviewedAt = new Date().toISOString();
    ev.reviewNote = note;
    this.pushHistory(ev, 'confirmed', hrId, note);
    await this.upsertEvaluation(ev);
    return ev;
  },
  // HR ส่งกลับให้แก้ → assigned อีกครั้ง
  async rejectEvaluation(evalId, hrId, note = '') {
    const ev = await this.getEvaluationFull(evalId);
    if (!ev) return null;
    ev.status = EVAL_STATUS.ASSIGNED;
    // ส่งกลับ = เริ่มลำดับผู้ประเมินใหม่ตั้งแต่ลำดับ 1 (คะแนนเดิมยังอยู่ให้แก้ต่อ)
    //   log รายลำดับของรอบเดิมเก็บไว้ (ย้อนดูได้) — เริ่มนับ "รอบ" ใหม่
    { const chain = evalChainOf(ev); ev.evalStep = 0; ev.evalRound = evalRoundOf(ev) + 1; if (chain.length) ev.supervisorId = chain[0]; }
    ev.reviewedBy = hrId;
    ev.reviewedAt = new Date().toISOString();
    ev.reviewNote = note;
    this.pushHistory(ev, 'rejected', hrId, note);
    await this.upsertEvaluation(ev);
    return ev;
  },
  // พนักงาน (หรือผู้ถูกประเมิน) กดรับทราบผลการประเมินผ่านระบบ — บันทึกชื่อ + วันที่ลงในช่องลงนาม
  async acknowledgeEvaluation(evalId, comment = '', ackUserId = null) {
    const ev = await this.getEvaluationFull(evalId);
    if (!ev) return null;
    const acker = this.getUserById(ackUserId) || this.getUserById(ev.employeeId);
    const now = new Date();
    ev.empResponse = 'acknowledge';
    if (comment != null && String(comment).trim() !== '') ev.empComment = String(comment).trim();
    ev.empAckName = (acker && acker.fullName) || '';
    ev.empAckDate = now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
    ev.acknowledgedAt = now.toISOString();
    this.pushHistory(ev, 'acknowledged', acker ? acker.id : ev.employeeId, comment ? `รับทราบผ่านระบบ • ${String(comment).trim()}` : 'รับทราบผ่านระบบ');
    await this.upsertEvaluation(ev);
    return ev;
  },

// ===================================================================
// Scoring helpers
// ===================================================================

// fraction 0-1 จาก value
// %บรรลุของ KPI ตามการตั้งค่าหัวข้อ (ตั้งได้ในตัวสร้างแบบฟอร์ม)
//   config.direction = 'higher' (ค่าจริงยิ่งสูงยิ่งดี — ค่าเริ่มต้น) | 'lower' (ยิ่งต่ำยิ่งดี เช่น อัตราข้อผิดพลาด → %บรรลุ = เป้า/จริง)
//   config.capPct    = เพดาน %บรรลุที่นำไปคิดคะแนน (ค่าเริ่มต้น 100 = ได้ไม่เกินคะแนนเต็ม • ตั้ง 120 = ทำเกินเป้าได้คะแนนเพิ่ม)
//   config.minPct    = ขั้นต่ำ %บรรลุที่เริ่มนับคะแนน (ต่ำกว่านี้ = 0 • ค่าเริ่มต้น 0)
function kpiAchievePct(item, target, actual) {
  const cfg = (item && item.config) || {};
  target = +target; actual = +actual;
  if (!(target > 0) || isNaN(actual)) return 0;
  let pct;
  if (cfg.direction === 'lower') pct = actual <= 0 ? Infinity : (target / actual) * 100;
  else pct = (actual / target) * 100;
  const cap = (+cfg.capPct > 0) ? +cfg.capPct : 100;
  const min = (+cfg.minPct > 0) ? +cfg.minPct : 0;
  if (pct < min) return 0;
  return Math.max(0, Math.min(cap, pct));
}

function calcItemFraction(item, value) {
  if (value === null || value === undefined || value === '') return 0;
  switch (item.type) {
    case 'rating5': return Math.max(0, Math.min(1, (+value) / 5));
    case 'scale10': return Math.max(0, Math.min(1, (+value) / 10));
    case 'percent': {
      const target = (item.config && +item.config.target) || 100;
      return Math.max(0, Math.min(1, (+value) / target));
    }
    case 'kpi': {
      let target, actual;
      if (typeof value === 'object' && value !== null) {
        target = +value.target || +(item.config?.target || 100);
        actual = +value.actual;
      } else {
        target = +(item.config?.target || 100);
        actual = +value;
      }
      return kpiAchievePct(item, target, actual) / 100;
    }
    case 'choice': {
      const opt = (item.config && item.config.options) ? item.config.options[+value] : null;
      return opt ? Math.max(0, Math.min(1, +opt.fraction)) : 0;
    }
    case 'yesno': {
      const cfg = item.config || {};
      const isYes = (value === true || value === 'true' || value === 'yes' || value === 1);
      const f = isYes ? cfg.yesFraction : cfg.noFraction;
      return Math.max(0, Math.min(1, f ?? (isYes ? 1 : 0)));
    }
    default: return 0;
  }
}

// คะแนนดิบของ item (ก่อน item-level penalty)
function calcItemScore(item, value) {
  return +(calcItemFraction(item, value) * (+item.maxScore || 0)).toFixed(2);
}

// คะแนน penalty ของ rule หนึ่ง ๆ จาก count
function calcPenaltyAmount(rule, count) {
  const c = +count || 0;
  const free = +rule.freeCount || 0;
  const per = +rule.perOccurrence || 0;
  return Math.max(0, (c - free)) * per;
}

// คำนวณ Section score: sum ของ item scores ภายใน section หลังหัก item-level penalty
function calcSectionScore(section, answers, penaltyInputs, penaltyRules) {
  let sum = 0;
  for (const item of section.items) {
    const a = answers.find(x => x.itemId === item.id);
    let score = a ? calcItemScore(item, a.value) : 0;
    score -= sumItemPenalties(item.id, penaltyInputs, penaltyRules);
    if (score < 0) score = 0;
    sum += score;
  }
  return +sum.toFixed(2);
}

function calcSectionMax(section) {
  return section.items.reduce((s, i) => s + (+i.maxScore || 0), 0);
}

// ----- KPI grouping: แบ่งกลุ่มการให้น้ำหนัก KPI ตามประเภทพนักงาน -----
// section ที่ sec.kpiGrouped=true จะมี sec.kpiGroups=[{key,label}] และแต่ละ item มี it.groupWeights={key:น้ำหนัก}
// คืนสำเนาฟอร์มที่ปรับตามกลุ่ม: ตั้ง maxScore ของ KPI = น้ำหนักกลุ่มนั้น + ตัดหัวข้อที่น้ำหนัก 0 (ไม่อยู่ในกลุ่ม) ออก
// → ฟังก์ชันคิดคะแนน/เรนเดอร์เดิมใช้ต่อได้ทันที (อ่าน item.maxScore + วน section.items)
function resolveFormForGroup(form, group) {
  if (!form || !Array.isArray(form.sections)) return form;
  if (!group || !form.sections.some(s => s.kpiGrouped)) return form;   // ไม่มีกลุ่ม → คงเดิม
  const f = JSON.parse(JSON.stringify(form));
  f.sections.forEach(sec => {
    if (!sec.kpiGrouped) return;
    sec.items = (sec.items || [])
      .map(it => {
        if (!it.groupWeights) return it;   // หัวข้อที่ไม่ได้แบ่งน้ำหนักตามกลุ่ม → คงเดิม (ใช้ทุกกลุ่ม)
        const w = it.groupWeights[group];
        // ไม่มีน้ำหนักสำหรับกลุ่มนี้ = ไม่อยู่ในกลุ่มนี้ → maxScore 0 (เดี๋ยวถูกตัดออกในขั้น filter)
        return { ...it, maxScore: (w == null || w === '') ? 0 : +w };
      })
      .filter(it => !it.groupWeights || (+it.maxScore || 0) > 0);   // ตัดหัวข้อน้ำหนัก 0 = ไม่อยู่ในกลุ่มนี้
  });
  return f;
}
// รายชื่อกลุ่มทั้งหมดของฟอร์ม (รวมจากทุก section ที่แบ่งกลุ่ม) — ใช้ทำ dropdown/นำเข้า
function formKpiGroups(form) {
  const out = []; const seen = new Set();
  (form && form.sections || []).forEach(sec => {
    if (!sec.kpiGrouped) return;
    (sec.kpiGroups || []).forEach(g => { if (g && g.key && !seen.has(g.key)) { seen.add(g.key); out.push(g); } });
  });
  return out;
}

function sumItemPenalties(itemId, penaltyInputs, penaltyRules) {
  if (!penaltyRules) return 0;
  let total = 0;
  for (const rule of penaltyRules) {
    if (rule.appliesTo === `item:${itemId}`) {
      const inp = penaltyInputs?.find(p => p.ruleId === rule.id);
      total += calcPenaltyAmount(rule, inp?.count || 0);
    }
  }
  return total;
}

function sumTotalPenalties(penaltyInputs, penaltyRules) {
  if (!penaltyRules) return 0;
  let total = 0;
  for (const rule of penaltyRules) {
    if (rule.appliesTo === 'total') {
      const inp = penaltyInputs?.find(p => p.ruleId === rule.id);
      total += calcPenaltyAmount(rule, inp?.count || 0);
    }
  }
  return total;
}

function calcRawSubtotal(form, answers, penaltyInputs) {
  let sum = 0;
  for (const sec of form.sections) {
    sum += calcSectionScore(sec, answers, penaltyInputs, form.penaltyRules);
  }
  return +sum.toFixed(2);
}

// ส่วนวินัย (penalty section): score = clamp(baseScore - หักรวม + โบนัส, 0, baseScore)
function calcPenaltySectionScore(form, penaltyInputs) {
  const ps = form && form.penaltySection;
  if (!ps || !ps.enabled) return null;
  const base = +ps.baseScore || 0;
  let deduct = 0;
  for (const rule of (ps.rules || [])) {
    const inp = penaltyInputs?.find(p => p.ruleId === rule.id);
    deduct += calcPenaltyAmount(rule, inp?.count || 0);
  }
  // โบนัส (เช่น ไม่ขาด ไม่สาย ครบเดือน → +2 เมื่อ rule ที่กำหนดมีค่าเป็น 0 ทั้งหมด)
  const bonus = calcBonusAmount(ps, penaltyInputs);
  const score = Math.max(0, Math.min(base, +(base - deduct + bonus).toFixed(2)));
  return { score, max: base, deduct: +deduct.toFixed(2), bonus: +bonus.toFixed(2) };
}
// คำนวณคะแนนโบนัสของส่วนวินัย จาก bonusRules (เงื่อนไข allZero = rule ที่ระบุต้องมีค่า 0 ทั้งหมด)
function calcBonusAmount(ps, penaltyInputs) {
  let bonus = 0;
  for (const b of (ps.bonusRules || [])) {
    const ids = (b.condition && b.condition.allZero) || [];
    const ok = ids.length > 0 && ids.every(rid => {
      const inp = penaltyInputs?.find(p => p.ruleId === rid);
      return (+(inp && inp.count) || 0) === 0;
    });
    if (ok) bonus += (+b.amount || 0);
  }
  return +bonus.toFixed(2);
}

function calcTotalScore(form, answers, penaltyInputs) {
  let sum = calcRawSubtotal(form, answers, penaltyInputs);
  // หัก penalty รายข้อ/รวม แบบเก่า (ถ้ามี)
  sum -= sumTotalPenalties(penaltyInputs, form.penaltyRules);
  // บวกคะแนนส่วนวินัย (penalty section)
  const ps = calcPenaltySectionScore(form, penaltyInputs);
  if (ps) sum += ps.score;
  return Math.max(0, +sum.toFixed(2));
}

function calcFormMax(form) {
  let m = form.sections.reduce((s, sec) => s + calcSectionMax(sec), 0);
  if (form.penaltySection && form.penaltySection.enabled) m += (+form.penaltySection.baseScore || 0);
  return m;
}

// score+max → percent if max given; else treat score as already a percent (backward compat)
function gradeFor(score, max) {
  // คะแนนรวมอาจเกินเต็มได้ถ้า KPI ตั้งเพดาน %บรรลุ > 100 → ใช้ 100% ในการเทียบระดับเกรด
  const pct = Math.min(100, (max && max > 0) ? (score / max) * 100 : score);
  const levels = DB.getSettings().gradeLevels;
  const f = levels.find(l => pct >= l.min && pct < l.max);
  return f ? f.label : (levels[levels.length - 1]?.label || '-');
}
function gradeInfoFor(score, max) {
  // คะแนนรวมอาจเกินเต็มได้ถ้า KPI ตั้งเพดาน %บรรลุ > 100 → ใช้ 100% ในการเทียบระดับเกรด
  const pct = Math.min(100, (max && max > 0) ? (score / max) * 100 : score);
  const levels = DB.getSettings().gradeLevels;
  return levels.find(l => pct >= l.min && pct < l.max) || levels[levels.length - 1];
}

// ===================================================================
// build evaluation object
// ===================================================================
function buildEvaluation(form, employeeId, evaluatorId, period, valueMap, penaltyMap, coachingChecks, coachingDetail, overallComment) {
  const answers = [];
  form.sections.forEach(sec => {
    sec.items.forEach(item => {
      const v = valueMap[item.id];
      const fraction = calcItemFraction(item, v);
      answers.push({
        sectionId: sec.id,
        itemId: item.id,
        value: v,
        fraction: +fraction.toFixed(4),
        score: +(fraction * (+item.maxScore || 0)).toFixed(2),
        comment: '',
      });
    });
  });

  // penaltyInputs รวม rules จากทั้ง penaltyRules เดิม และ penaltySection ใหม่
  const allRuleIds = [
    ...(form.penaltyRules || []).map(r => r.id),
    ...((form.penaltySection && form.penaltySection.rules) || []).map(r => r.id),
  ];
  const penaltyInputs = allRuleIds.map(id => ({ ruleId: id, count: +(penaltyMap?.[id] || 0) }));

  const sectionScores = form.sections.map(sec => ({
    sectionId: sec.id,
    score: calcSectionScore(sec, answers, penaltyInputs, form.penaltyRules),
    maxScore: calcSectionMax(sec),
  }));

  const rawSubtotal = calcRawSubtotal(form, answers, penaltyInputs);
  const penaltyTotal = sumTotalPenalties(penaltyInputs, form.penaltyRules);
  const penSec = calcPenaltySectionScore(form, penaltyInputs); // { score, max, deduct } | null
  const totalScore = calcTotalScore(form, answers, penaltyInputs);

  const totalMax = calcFormMax(form);
  return {
    id: DB.uid('e'),
    employeeId, evaluatorId,
    supervisorId: null,            // หัวหน้าที่รับผิดชอบ (เติมตอน assign/save)
    period,
    formId: form.id,
    answers,
    sectionScores,
    penaltyInputs,
    penaltySectionScore: penSec,   // { score, max, deduct } | null
    rawSubtotal,
    penaltyTotal,
    totalScore,
    totalMax,
    grade: gradeFor(totalScore, totalMax),
    resultBox: getResultBox(form, totalScore, totalMax),
    coachingChecks: coachingChecks || [],
    coachingDetail: coachingDetail || '',
    // NEW fields (initialize empty — populated by save flow)
    attachments: [],  // เอกสารประกอบทั่วไป
    signedDocs: [],   // เอกสารที่พนักงานเซ็นรับทราบ (บังคับก่อนส่ง HR)
    overallComment: overallComment || '',
    // flow ใหม่: assigned → pending_review → confirmed
    status: 'pending_review',
    assignedBy: null,
    assignedAt: null,
    submittedAt: new Date().toISOString(),
    reviewedBy: null,
    reviewedAt: null,
    reviewNote: '',
    createdAt: new Date().toISOString(),
  };
}

// ===================================================================
// Result Box helper (selects status box from 5 by % of total)
// ===================================================================
function getResultBox(form, score, max) {
  const boxes = form?.resultBoxes || [];
  if (!boxes.length) return null;
  const pct = max > 0 ? (score / max) * 100 : 0;
  // boxes sorted by minPct desc, find first match
  const sorted = [...boxes].sort((a, b) => b.minPct - a.minPct);
  return sorted.find(b => pct >= b.minPct) || sorted[sorted.length - 1];
}

// ===================================================================
// Section permission helper
// ===================================================================
function canScoreSection(section, role) {
  if (!section.allowedRoles || !section.allowedRoles.length) return true; // ไม่กำหนด = ทุก role
  return section.allowedRoles.includes(role);
}

      <h3>5.3 จัดการพนักงาน</h3>
      <div class="mn-tip new"><i class="fa-solid fa-list-ol"></i><div><b>ผู้ประเมินหลายลำดับ (สูงสุด 3 คน · ประเมินตามลำดับ):</b> ในฟอร์มพนักงาน (ปุ่มดินสอ) กำหนด "ผู้ประเมินลำดับ 1 / 2 / 3" และใช้ปุ่มลูกศรขึ้น-ลงสลับลำดับได้ • ลำดับ 1 ประเมินก่อน แล้วกด "ส่งต่อ" ให้ลำดับถัดไป (ลำดับถัดไปเห็นคะแนนเดิมและปรับได้) • <b>ลำดับสุดท้าย</b> เป็นผู้ส่งให้ HR ตรวจสอบ • ส่งกลับแก้ไข = เริ่มใหม่ตั้งแต่ลำดับ 1 • นำเข้า Excel ใช้คอลัมน์ "รหัสผู้ประเมิน 1 / 2 / 3" (เว้นว่าง = คงเดิม · "ไม่มี" = ล้าง)</div></div>
      <ul>
        <li>เพิ่ม/แก้ไข/นำเข้าพนักงาน (Excel/CSV) — รหัสพนักงาน (ใช้เข้าระบบ) · ชื่อ · แผนก · ตำแหน่ง · บทบาท · รหัสผู้ประเมิน 1/2/3 · วันเริ่มงาน · สถานะ · <b>รหัสผ่าน</b> (เว้นว่าง = คงเดิม / ยังไม่ตั้ง = ใช้รหัสพนักงาน)</li>
        <li>สลับสถานะ ทำงาน ⇄ ลาออก (ลาออกเข้าระบบไม่ได้ + ต้องลาออกก่อนจึงลบได้) · กรองได้ทุกหัวข้อ รวม <b>"— ยังไม่มีผู้ประเมิน —"</b></li>
        <li><b>Timeline:</b> ปุ่มนาฬิกาในแถวพนักงาน = ประวัติการแก้ไขข้อมูลโดย HR (แผนก/ตำแหน่ง/บทบาท/ผู้ประเมิน) — <b>ลำดับผู้ประเมินกำหนดโดย HR เท่านั้น</b> หัวหน้างานไม่มีหน้ารายชื่อพนักงาน/แจ้งเปลี่ยนแปลงแล้ว</li>
      </ul>

      <h3>5.4 จัดการแบบฟอร์ม</h3>
      <ul>
        <li>สร้าง/แก้ไขแบบฟอร์ม — จัดหัวข้อ (KPI / ดาว 1–5 / อื่น ๆ) สลับลำดับ · ตั้งน้ำหนัก · ส่วนวินัย · แนวทางพัฒนา</li>
        <li><b>แบ่งกลุ่มน้ำหนัก KPI:</b> ติ๊ก "แบ่งกลุ่มน้ำหนัก KPI" → ตั้งชื่อกลุ่ม + ใส่น้ำหนักแต่ละหัวข้อต่อกลุ่ม (ดู "รวม" ต่อกลุ่มให้ครบ)</li>
        <li><b>แผนกที่ใช้ฟอร์มนี้:</b> ปุ่ม "กำหนด" บนการ์ดฟอร์ม เลือกชื่อแผนกจากตารางพนักงานโดยตรง (ไม่เลือก = ทุกแผนก) — Template รวมจะเติมเฉพาะพนักงานของแผนกเหล่านั้น</li>
        <li><b>ระดับขั้นการประเมิน:</b> แท็บที่ 2 ตั้งเกรด A–F (ชื่อ / ช่วง % / สี) — ค่าเริ่มต้น A ≥ 90 · B ≥ 80 · C ≥ 70 · D ≥ 60 · F ต่ำกว่า 60</li>
        <li><b>วิธีสรุปคะแนน:</b> แท็บที่ 3 เลือก "ค่าเฉลี่ยของผู้ประเมินทุกลำดับ" (ค่าเริ่มต้น) หรือ "ใช้คะแนนของลำดับสุดท้าย" · แบบค่าเฉลี่ย HR แก้คะแนนในฟอร์มโดยตรงไม่ได้ ต้องส่งกลับให้ผู้ประเมินแก้</li>
        <li><b>การมองเห็นผลรายลำดับ:</b> แท็บที่ 3 — ระบบเก็บ log ผลของผู้ประเมิน "ทุกลำดับ" (คะแนนรายข้อ วินัย แนวทางดำเนินการ หมายเหตุ) ทุกครั้งที่กดส่ง และทุกครั้งที่ HR ยืนยัน/แก้ไข · HR เลือกได้ว่าหัวหน้างานเห็น log ของใคร (ทุกลำดับ / ลำดับสูงกว่าเห็นลำดับต่ำกว่า / เฉพาะของตนเอง / ไม่เห็น) พนักงานเห็นเฉพาะผลสุดท้ายหรือเห็นรายลำดับด้วย ลำดับถัดไปเริ่มจากคะแนนเดิมหรือฟอร์มว่าง และจะแสดงตารางรายลำดับใน PDF หรือไม่ · HR เห็นทั้งหมดเสมอ รวมรอบก่อนถูกส่งกลับ</li>
      </ul>`;
  },

  _supDuties() {

      <p>เปิดเมนู "รายการประเมิน" → กดปุ่ม <b>ประเมิน</b> ที่ใบของพนักงาน แล้วกรอกให้ครบ:</p>

  open(viewerRole, page) {
    this._injectStyle();
    // คู่มือรายหน้า — แสดงเฉพาะเนื้อหาของหน้านั้น ไม่มีแท็บ (สิทธิ์หัวหน้างาน + ฝ่ายบุคคล)
    const pageSet = viewerRole === 'admin' ? this._hrPages : viewerRole === 'supervisor' ? this._supPages : null;
    const pg = (page && pageSet) ? pageSet[page] : null;
    if (pg) {
      const roleLabel = this._titleOf[viewerRole === 'admin' ? 'hr' : viewerRole] || '';
      const overlay = document.createElement('div');
      overlay.className = 'mn-overlay';
      overlay.innerHTML = `
        <div class="mn-modal" role="dialog" aria-modal="true">
          <div class="mn-head">
            <div><div class="mn-t"><i class="fa-solid ${pg.icon}"></i> คู่มือ — ${pg.title}</div><div class="mn-s">คู่มือเฉพาะหน้านี้ · สิทธิ์${roleLabel}</div></div>
            <button class="mn-x" data-mn-close title="ปิด"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="mn-body">${pg.body(this)}</div>
        </div>`;
      overlay.querySelector('[data-mn-close]').addEventListener('click', () => this.close(overlay));
      overlay.addEventListener('click', (e) => { if (e.target === overlay) this.close(overlay); });
      this._esc = (e) => { if (e.key === 'Escape') this.close(overlay); };
      document.addEventListener('keydown', this._esc);
      document.body.appendChild(overlay);
      return;
    }
    const tabs = viewerRole === 'admin' ? ['hr', 'supervisor', 'employee']
      : viewerRole === 'supervisor' ? ['supervisor'] : ['employee'];
    let active = tabs[0];
    const overlay = document.createElement('div');
    overlay.className = 'mn-overlay';
    const render = () => {
      overlay.innerHTML = `
        <div class="mn-modal" role="dialog" aria-modal="true">
          <div class="mn-head">
            <div><div class="mn-t"><i class="fa-solid fa-book-open"></i> คู่มือการใช้งานระบบประเมิน</div><div class="mn-s">${tabs.length > 1 ? 'ฝ่ายบุคคลเห็นคู่มือครบทุกสิทธิ์' : 'คู่มือเฉพาะสิทธิ์ ' + this._titleOf[active]}</div></div>
            <button class="mn-x" data-mn-close title="ปิด"><i class="fa-solid fa-xmark"></i></button>
          </div>
          ${tabs.length > 1 ? `<div class="mn-tabs">${tabs.map(t => `<button class="mn-tab ${t === active ? 'on' : ''}" data-mn-tab="${t}"><i class="fa-solid ${t === 'hr' ? 'fa-user-tie' : t === 'supervisor' ? 'fa-user-gear' : 'fa-user'} mr-1"></i>${this._titleOf[t]}</button>`).join('')}</div>` : ''}
          <div class="mn-body">${this[active]()}</div>
        </div>`;
      overlay.querySelector('[data-mn-close]').addEventListener('click', () => this.close(overlay));
      overlay.querySelectorAll('[data-mn-tab]').forEach(b => b.addEventListener('click', () => { active = b.dataset.mnTab; render(); overlay.querySelector('.mn-body').scrollTop = 0; }));
    };
    render();
    overlay.addEventListener('click', (e) => { if (e.target === overlay) this.close(overlay); });
    this._esc = (e) => { if (e.key === 'Escape') this.close(overlay); };
    document.addEventListener('keydown', this._esc);
    document.body.appendChild(overlay);
  },
  close(overlay) {
    if (this._esc) { document.removeEventListener('keydown', this._esc); this._esc = null; }
    (overlay || document.querySelector('.mn-overlay'))?.remove();
  },
};
window.Manual = Manual;

<script>
// ===================================================================
// gsheet-sync.js — ชั้นข้อมูลของหน้าบ้าน (SupaDB) เชื่อมกับ Google Apps Script Web App
//   • ฐานข้อมูล = Google Sheets (ดู gas/Code.gs) • หน้าบ้านเป็นไฟล์ static (GitHub Pages)
//   • ตั้ง URL ของ Web App ที่ window.__GSHEET_API__ (docs/config.js)
//   • interface เดียวกับชั้นข้อมูลเดิม (init / query / upsertOne / upsertMany / deleteOne / deleteMany / setPaused / push)
//     + login / logout / setPassword สำหรับยืนยันตัวตนกับชีต users
//     + uploadFile / fileUrl สำหรับไฟล์แนบ (เก็บบน Google Drive — ในชีตเก็บเฉพาะ driveId)
//   • ส่งคำขอเป็น POST body JSON ชนิด text/plain → ไม่ติด CORS preflight ของ Apps Script
//
//   ความเร็ว (v4) — Apps Script คิดเวลาเป็น "ต่อคำขอ" (~1 วินาทีขึ้นไปแม้ไม่มีข้อมูล) จึงลดจำนวนคำขอเป็นหลัก:
//     1) login ได้ users/forms/settings กลับมาพร้อมกัน (ไม่ต้อง boot ซ้ำ)
//     2) รีเฟรชหน้า: ใช้ users/forms/settings ที่จำไว้ใน localStorage ทันที แล้วค่อยดึงชุดใหม่เบื้องหลัง
//     3) query หลายรายการที่ยิงพร้อมกัน (เช่น นับสถิติ 4 ช่อง) ถูกรวมเป็น 1 คำขอ (op batch) อัตโนมัติ
//     4) ผลลัพธ์ query จำไว้พร้อม "เวอร์ชันตาราง" — ถ้าข้อมูลบนชีตไม่เปลี่ยน เซิร์ฟเวอร์ตอบ notModified (ไม่ส่งข้อมูลซ้ำ)
// ===================================================================
(function () {
  'use strict';

  const TOKEN_KEY = 'eval_token';
  const BOOT_KEYS = { users: 'eval_users', forms: 'eval_forms', settings: 'eval_settings', meta: 'eval_boot_meta' };
  const apiUrl = () => String(window.__GSHEET_API__ || '').trim();
  const clone = (v) => (typeof structuredClone === 'function') ? structuredClone(v) : JSON.parse(JSON.stringify(v));

  const SupaDB = {
    enabled: !!apiUrl(),
    _ready: false,
    remoteEmpty: false,
    // localStorage key ของแอป → ชื่อตารางในชีต (ใช้ตอน DB._write() mirror ตารางเล็กขึ้นฐานข้อมูล)
    MAP: { eval_forms: 'forms', eval_settings: 'settings' },
    // สถิติเวลาเรียก API (ดูได้จาก console: SupaDB.stats)
    stats: { calls: 0, batched: 0, notModified: 0, ms: 0 },

    token() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } },
    _setToken(t) { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { } },

    // ---------- เรียก API ----------
    async _call(payload, opts = {}) {
      const url = apiUrl();
      if (!url) throw new Error('ยังไม่ได้ตั้งค่า URL ของฐานข้อมูล (docs/config.js → window.__GSHEET_API__)');
      const body = JSON.stringify(Object.assign({}, payload, { token: this.token() }));
      let res, data;
      const t0 = Date.now();
      try {
        res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, redirect: 'follow' });
        data = await res.json();
      } catch (e) {
        throw new Error('เชื่อมต่อฐานข้อมูล (Google Sheets) ไม่ได้ — ตรวจสอบอินเทอร์เน็ต/URL ของ Web App');
      } finally { this.stats.calls++; this.stats.ms += Date.now() - t0; }
      if (!data || data.ok === false) {
        const code = data && data.code;
        if (code === 401 && !opts.noAuthRedirect) this._sessionExpired();
        throw new Error((data && data.error) || 'คำขอไม่สำเร็จ');
      }
      return data;
    },
    _sessionExpired() {
      if (this._expiring) return;
      this._expiring = true;
      this._setToken('');
      try { if (typeof DB !== 'undefined') DB.clearSession(); } catch (e) { }
      if (typeof toast === 'function') toast('หมดเวลาการเข้าระบบ กรุณาเข้าสู่ระบบใหม่', 'error', { title: 'เข้าระบบใหม่' });
      setTimeout(() => location.reload(), 1200);
    },

    // ---------- เข้าระบบ ----------
    async login(username, password) {
      const data = await this._call({ op: 'login', username, password }, { noAuthRedirect: true });
      this._setToken(data.token);
      this._rc.clear();
      // เซิร์ฟเวอร์ v4 ส่ง users/forms/settings มาพร้อม login — เวอร์ชันเก่าต้อง boot แยก
      if (Array.isArray(data.users)) this._applyBoot(data); else await this._loadBoot();
      return data;   // { ok, user, token, mustChangePassword }
    },
    logout() { this._setToken(''); this._rc.clear(); try { localStorage.removeItem(BOOT_KEYS.meta); } catch (e) { } },
    async setPassword(password, userId) { return this._call({ op: 'setPassword', password, userId }); },

    // ---------- บูต: โหลด users / forms / settings จากชีต ----------
    async init() {
      if (this._initP) return this._initP;
      this._initP = this._doInit();
      return this._initP;
    },
    async _doInit() {
      if (!this.enabled) { console.warn('[gsheet] ยังไม่ได้ตั้งค่า __GSHEET_API__'); return false; }
      if (!this.token()) { this._ready = true; return false; }   // ยังไม่เข้าระบบ — รอ login แล้วค่อยโหลด
      if (this._hydrateFromLocal()) {
        // มีชุดข้อมูลที่จำไว้ → เปิดแอปได้ทันที แล้วดึงชุดล่าสุดเบื้องหลัง (ถ้า token หมดอายุจะเด้งไปเข้าระบบใหม่เอง)
        this._ready = true;
        this._loadBoot().catch(e => console.warn('[gsheet] boot เบื้องหลังไม่สำเร็จ', e));
        return true;
      }
      try { await this._loadBoot(); } catch (e) { console.warn('[gsheet] boot ไม่สำเร็จ', e); if (typeof toast === 'function') toast(e.message, 'error'); }
      this._ready = true;
      return true;
    },
    _hydrateFromLocal() {
      try {
        const meta = JSON.parse(localStorage.getItem(BOOT_KEYS.meta) || 'null');
        if (!meta || meta.api !== apiUrl()) return false;
        const users = JSON.parse(localStorage.getItem(BOOT_KEYS.users) || 'null');
        if (!Array.isArray(users) || !users.length || !localStorage.getItem(BOOT_KEYS.forms)) return false;
        if (typeof DB !== 'undefined') { DB.clearCache(); DB._cachePutUsers(users); }
        return true;
      } catch (e) { return false; }
    },
    _applyBoot(d) {
      const users = Array.isArray(d.users) ? d.users : [];
      // ตารางเล็กลง localStorage ตรง ๆ (ไม่ผ่าน DB._write → ไม่ push ย้อนกลับ) แล้วล้าง cache ให้แอปอ่านใหม่
      try {
        localStorage.setItem(BOOT_KEYS.forms, JSON.stringify(Array.isArray(d.forms) ? d.forms : []));
        if (d.settings) localStorage.setItem(BOOT_KEYS.settings, JSON.stringify(d.settings));
        localStorage.setItem(BOOT_KEYS.meta, JSON.stringify({ api: apiUrl(), at: Date.now(), versions: d.versions || null }));
      } catch (e) { }
      try { localStorage.setItem(BOOT_KEYS.users, JSON.stringify(users)); } catch (e) { try { localStorage.removeItem(BOOT_KEYS.users); } catch (e2) { } }
      // DB ประกาศด้วย const ใน storage.js (ไม่ใช่ window.DB) — อ้างผ่าน typeof
      if (typeof DB !== 'undefined') { DB.clearCache(); DB._cachePutUsers(users); }
      this._ready = true;
    },
    async _loadBoot() {
      const d = await this._call({ op: 'boot' });
      this._applyBoot(d);
      return d;
    },
    async pull() { this._initP = null; return this.init(); },

    // ---------- query: รวมคำขอที่ยิงพร้อมกัน (batch) + จำผลตามเวอร์ชันตาราง ----------
    _rc: new Map(),      // response cache: key = คำขอ → { version, result }
    _RC_MAX: 80,
    _batchQ: null,
    _enqueueQuery(req) {
      return new Promise((resolve, reject) => {
        if (!this._batchQ) { this._batchQ = []; setTimeout(() => this._flushBatch(), 12); }
        this._batchQ.push({ req, resolve, reject });
      });
    },
    async _flushBatch() {
      const q = this._batchQ; this._batchQ = null;
      if (!q || !q.length) return;
      if (q.length === 1) { try { q[0].resolve(await this._call(q[0].req)); } catch (e) { q[0].reject(e); } return; }
      const CH = 20;
      for (let i = 0; i < q.length; i += CH) {
        const part = q.slice(i, i + CH);
        try {
          const d = await this._call({ op: 'batch', ops: part.map(x => x.req) });
          this.stats.batched += part.length;
          part.forEach((x, j) => {
            const r = (d.results || [])[j];
            if (!r || r.ok === false) {
              if (r && r.code === 401) this._sessionExpired();
              x.reject(new Error((r && r.error) || 'คำขอไม่สำเร็จ'));
            } else x.resolve(r);
          });
        } catch (e) { part.forEach(x => x.reject(e)); }
      }
    },
    async query(key, opts = {}) {
      const { filters = {}, page = 0, pageSize = 50, count = true, order } = opts;
      const req = { op: 'query', key, filters, page, pageSize, count, order };
      const ck = JSON.stringify(req);
      const hit = this._rc.get(ck);
      if (hit) req.ifVersion = hit.version;
      const d = await this._enqueueQuery(req);
      let out;
      if (d.notModified && hit) { this.stats.notModified++; out = hit.result; }
      else {
        out = { rows: d.rows || [], total: d.total, page: d.page, pageSize: d.pageSize };
        if (d.version) {
          this._rc.delete(ck); this._rc.set(ck, { version: d.version, result: out });
          if (this._rc.size > this._RC_MAX) this._rc.delete(this._rc.keys().next().value);
        }
      }
      return clone(out);   // คืนสำเนา — โค้ดหน้าบ้านแก้ object ได้โดยไม่กระทบชุดที่จำไว้
    },
    async upsertOne(key, record) { return this._call({ op: 'upsertOne', key, record }); },
    async upsertMany(key, records, onProgress) {
      const list = Array.isArray(records) ? records : [];
      const CHUNK = 100;
      for (let i = 0; i < list.length; i += CHUNK) {
        await this._call({ op: 'upsertMany', key, records: list.slice(i, i + CHUNK) });
        if (onProgress) { try { onProgress(Math.min(i + CHUNK, list.length), list.length); } catch (e) { } }
      }
      return { ok: true, n: list.length };
    },
    async deleteOne(key, id) { return this._call({ op: 'deleteOne', key, id }); },
    async deleteMany(key, ids, onProgress) {
      const list = Array.isArray(ids) ? ids : [];
      const CHUNK = 100;
      for (let i = 0; i < list.length; i += CHUNK) {
        await this._call({ op: 'deleteMany', key, ids: list.slice(i, i + CHUNK) });
        if (onProgress) { try { onProgress(Math.min(i + CHUNK, list.length), list.length); } catch (e) { } }
      }
      return { ok: true, deleted: list.length };
    },
    async setPaused(ids, paused) { return this._call({ op: 'setPaused', ids, paused: !!paused }); },

    // ---------- ไฟล์แนบ → Google Drive (โฟลเดอร์ "งาน HR KPI/ไฟล์แนบ/<รอบ>/<รหัสพนักงาน>/") ----------
    MAX_UPLOAD_BYTES: 8 * 1024 * 1024,
    _fileCache: new Map(),   // driveId → dataUrl (จำไว้ในหน่วยความจำระหว่างเปิดหน้า)
    async uploadFile(file, meta = {}) {
      if (!file) throw new Error('ไม่พบไฟล์');
      if (file.size > this.MAX_UPLOAD_BYTES) throw new Error(`"${file.name}" ใหญ่เกิน ${Math.round(this.MAX_UPLOAD_BYTES / 1048576)}MB`);
      const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้')); r.readAsDataURL(file); });
      const data = String(dataUrl).split(',')[1] || '';
      const d = await this._call({ op: 'upload', name: file.name, type: file.type || 'application/octet-stream', data, kind: meta.kind || 'attachments', evalId: meta.evalId || '', period: meta.period || '', employeeCode: meta.employeeCode || '' });
      this._fileCache.set(d.driveId, dataUrl);
      return { driveId: d.driveId, url: d.url, name: d.name || file.name, type: d.type || file.type, size: d.size || file.size };
    },
    // คืน dataUrl ของไฟล์แนบ: ไฟล์แบบเก่า (ฝังในใบ) ใช้ได้ทันที • ไฟล์บน Drive ดึงผ่าน API ครั้งแรกแล้วจำไว้
    async fileUrl(a) {
      if (!a) throw new Error('ไม่พบไฟล์');
      if (a.dataUrl) return a.dataUrl;
      if (!a.driveId) throw new Error('ไฟล์นี้ไม่มีข้อมูลให้เปิด');
      const hit = this._fileCache.get(a.driveId);
      if (hit) return hit;
      const d = await this._call({ op: 'getFile', driveId: a.driveId });
      const url = 'data:' + (d.type || a.type || 'application/octet-stream') + ';base64,' + d.data;
      this._fileCache.set(a.driveId, url);
      return url;
    },

    // ---------- ตารางเล็ก (forms/settings): แทนที่ทั้งชุด — ต่อคิวและรวมคำขอซ้ำ ----------
    _queue: Promise.resolve(),
    _pending: {},
    push(key, str) {
      const table = this.MAP[key];
      if (!table || !this.token()) return;
      let value; try { value = JSON.parse(str); } catch (e) { return; }
      this._pending[table] = value;   // เก็บค่าล่าสุด — ถ้าถูกเรียกรัว ๆ จะส่งครั้งเดียว
      this._enqueue(async () => {
        if (!(table in this._pending)) return;
        const v = this._pending[table]; delete this._pending[table];
        try { await this._call({ op: 'push', key: table, value: v }); }
        catch (e) { if (typeof toast === 'function') toast('บันทึกขึ้น Google Sheets ไม่สำเร็จ: ' + e.message, 'error'); }
      });
    },
    pushAll() { try { this.push('eval_forms', localStorage.getItem('eval_forms') || '[]'); this.push('eval_settings', localStorage.getItem('eval_settings') || '{}'); } catch (e) { } },
    _enqueue(fn) { this._queue = this._queue.then(fn, fn); return this._queue; },
  };
  window.SupaDB = SupaDB;
})();

</script>
<script>
// ===== Auth Layer =====
const Auth = {
  // เข้าระบบด้วย "รหัสพนักงาน + รหัสผ่าน" — ตรวจกับตาราง users ในฐานข้อมูล (คอลัมน์ employeeCode / password) ผ่าน Apps Script
  //   ไม่มีการเรียก API ของระบบ HR กลางอีกต่อไป
  async login(idf, password) {
    const id = String(idf || '').trim();
    if (!id) return { ok: false, error: 'กรุณากรอกรหัสพนักงาน' };
    if (!password) return { ok: false, error: 'กรุณากรอกรหัสผ่าน' };
    if (!(window.SupaDB && typeof SupaDB.login === 'function')) return { ok: false, error: 'ยังไม่ได้เชื่อมต่อฐานข้อมูล (ตั้งค่า URL ใน docs/config.js)' };
    let res;
    try { res = await SupaDB.login(id, password); }
    catch (e) { return { ok: false, error: e.message || 'เข้าสู่ระบบไม่สำเร็จ' }; }
    if (!res || !res.user) return { ok: false, error: 'รหัสพนักงานหรือรหัสผ่านไม่ถูกต้อง' };
    DB.upsertUserCache(res.user);
    DB.setSession(res.user.id);
    if (res.mustChangePassword && typeof toast === 'function') toast('คุณยังใช้รหัสผ่านเริ่มต้น (รหัสพนักงาน) — แนะนำให้เปลี่ยนรหัสผ่านที่หน้าโปรไฟล์', 'warn', { duration: 7000 });
    return { ok: true, user: res.user };
  },

  logout() {
    DB.clearSession();
    if (window.SupaDB && typeof SupaDB.logout === 'function') SupaDB.logout();
  },

  currentUser() {
    const session = DB.getSession();
    if (!session) return null;
    return DB.getUserById(session.userId);
  },

  isAdmin() {
    const u = this.currentUser();
    return u && u.role === 'admin';
  },

  // ใช้สำหรับ "เด้ง" บัญชีหลังหัวหน้าประเมิน (admin/supervisor → employee เพื่อรับทราบ)
  loginAs(userId) {
    const u = DB.getUserById(userId);
    if (!u) return false;
    DB.setSession(u.id);
    return u;
  },
};


</script>
<script>
// ===================================================================
// Evaluation Form — Dynamic rendering, 100-point + Penalty + Coaching
// ===================================================================

const Evaluation = {
  state: { values: {}, penalties: {}, coachingChecks: [], coachingDetail: '', overall: '', formId: null, employeeId: '', period: '' },
  _isModal: false,

  // เปิดฟอร์มประเมินจาก "รายการมอบหมาย" (assignment record) ที่ HR สร้างไว้
  // opts.editMode = true → HR แก้ไขข้อมูล (โหลดค่าเดิม + คงสถานะเมื่อบันทึก)
  async openModal(assignmentId, opts = {}) {
    // ดึงใบเต็มตาม id + โหลดประวัติของพนักงานคนนี้เข้ามาใน cache (ให้ header/past-list/ฟอร์มมีข้อมูลครบ)
    let rec = DB.getEvaluations().find(e => e.id === assignmentId) || (await DB.getEvaluationFull(assignmentId));
    if (!rec) { toast('ไม่พบรายการมอบหมาย', 'error'); return; }
    // เก็บชุดข้อมูลเต็มของหน้ารายการไว้ก่อน — เพราะบรรทัดถัดไปจะ scope cache เป็นใบของพนักงานคนเดียว
    // (ให้ฟอร์มโชว์ประวัติย้อนหลังได้) เมื่อปิดฟอร์มจะคืน cache เดิม กันหน้ารายการค้นหา/กรองเพี้ยน
    this._listCacheBackup = DB.getEvaluations();
    await DB.loadEvaluations({ employeeId: rec.employeeId }, { pageSize: 300, count: false });
    rec = DB.getEvaluations().find(e => e.id === assignmentId) || rec;
    const emp = DB.getUserById(rec.employeeId);
    if (!emp) { toast('ไม่พบข้อมูลพนักงาน', 'error'); return; }
    const form = DB.getFormForEval(rec);
    const wrap = document.getElementById('modalContainer');
    wrap.innerHTML = `
      <div class="modal-bg" id="evalModalBg">
        <div class="modal eval-modal">
          <div class="modal-header" style="background:linear-gradient(135deg, var(--accent-soft), #fff);">
            <div>
              <div class="modal-title"><i class="fa-solid fa-clipboard-check mr-1" style="color:var(--accent)"></i>${opts.editMode ? 'แก้ไขผลการประเมิน' : 'ทำการประเมิน'} — ${escapeHtml(emp.fullName)} ${empStatusBadge(emp.status)}</div>

    document.getElementById('evalModalClose').addEventListener('click', () => this._closeModal());

  _closeModal() {
    document.getElementById('modalContainer').innerHTML = '';
    this._isModal = false;
    // คืนชุดข้อมูลเต็มของหน้ารายการที่ถูก scope ตอนเปิดฟอร์ม (ปิดด้วย X = ไม่บันทึก → หน้ารายการยังใช้ค้นหา/กรองได้)
    // path ที่บันทึกแล้ว App.go(list) จะโหลดใหม่ทับให้เองอยู่แล้ว การคืนตรงนี้จึงปลอดภัยทุกทาง
    if (this._listCacheBackup) { DB.saveEvaluations(this._listCacheBackup); this._listCacheBackup = null; }
  },

  // ฟอร์มปัจจุบันของ state — resolve ตามกลุ่ม KPI (ถ้าใบนี้มีกลุ่ม) เพื่อให้เวทคะแนน/การแสดงผลตรงกลุ่ม
  _formOf() {
    return DB.getFormForEval({ formId: this.state && this.state.formId, kpiGroup: this.state && this.state.kpiGroup });
  },

  renderForm(container, opts = {}) {

    const recStatus = (opts.assignmentId ? (DB.getEvaluations().find(x => x.id === opts.assignmentId) || {}).status : '') || '';
    // กลุ่ม KPI ของใบประเมินนี้ (ถ้ามอบหมายมาพร้อมกลุ่ม) — ใช้เวทคะแนน KPI ตามกลุ่ม
    const evKpiGroup = opts.assignmentId ? ((DB.getEvaluations().find(x => x.id === opts.assignmentId) || {}).kpiGroup || null) : null;

    const canReject = !!opts.editMode && me.role === 'admin' && (recStatus === 'pending_review' || recStatus === 'confirmed');
    // รายการที่ "ยืนยันแล้ว" = ล็อก ห้ามบันทึกแก้ไข (ต้องกดส่งกลับก่อน) → ซ่อนปุ่มบันทึก
    // HR แก้ไขได้ทุกสถานะ (รวมใบที่ยืนยันแล้ว) โดยไม่ต้องปลดล็อกก่อน — ปุ่มบันทึกใช้ mode 'update' คงสถานะเดิมทั้งหมด
    const showSave = true;

    container.innerHTML = `
      <div class="grid lg:grid-cols-3 gap-6" id="evalGrid">
        <div class="lg:col-span-2 space-y-4 eval-main-col" id="evalPaperCol">

              <div><div class="label">แบบฟอร์ม</div><div class="font-semibold">${escapeHtml(lockedForm?.name || '-')}</div></div>

          <div class="flex gap-2 no-print flex-wrap justify-end" id="evalMainBtns">

                  <div id="liveGrade" class="grade-tag mt-2" style="color:#737373;border-color:#e5e5e5">—</div>

              </div>
